<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img" aria-label="The request path: input check, model call, output check">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="380" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The request path: input check, model call, output check</text>
<rect x="30" y="110" width="270" height="140" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="165.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Input evaluation</text>
<text x="165.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">policies run before the model sees anything</text>
<line x1="300" y1="180" x2="330" y2="180" stroke="#ececec" stroke-width="2"/>
<polygon points="330,180 320.9,184.1 320.9,175.9" fill="#ececec"/>
<rect x="330" y="110" width="270" height="140" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="465.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Model generation</text>
<text x="465.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">model answers, unaware of the guardrail</text>
<line x1="600" y1="180" x2="630" y2="180" stroke="#ececec" stroke-width="2"/>
<polygon points="630,180 620.9,184.1 620.9,175.9" fill="#ececec"/>
<rect x="630" y="110" width="270" height="140" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="765.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Output evaluation</text>
<text x="765.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">same policies run on the completion</text>
<text x="60" y="300" font-size="13" text-anchor="start" fill="#a8a8a8">A violation anywhere returns your blocked message, not model text. Input and output checks are</text>
<text x="60" y="319" font-size="13" text-anchor="start" fill="#a8a8a8">independent switches: inputs only, outputs only, or both.</text>
</svg>