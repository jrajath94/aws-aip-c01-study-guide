<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Human in the loop: approve before it takes effect">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Human in the loop: approve before it takes effect</text>
<rect x="30" y="110" width="200" height="150" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="130.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Agent drafts</text>
<text x="130.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">proposed action +</text>
<text x="130.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">reasoning trace</text>
<line x1="230" y1="185" x2="250" y2="185" stroke="#ececec" stroke-width="2"/>
<polygon points="250,185 240.9,189.1 240.9,180.9" fill="#ececec"/>
<rect x="250" y="110" width="200" height="150" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="350.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Step Functions</text>
<text x="350.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">issues task token,</text>
<text x="350.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">workflow WAITS</text>
<line x1="450" y1="185" x2="470" y2="185" stroke="#ececec" stroke-width="2"/>
<polygon points="470,185 460.9,189.1 460.9,180.9" fill="#ececec"/>
<rect x="470" y="110" width="200" height="150" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="570.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Human reviews</text>
<text x="570.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">full context in hand,</text>
<text x="570.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">approves or rejects</text>
<line x1="670" y1="185" x2="690" y2="185" stroke="#ececec" stroke-width="2"/>
<polygon points="690,185 680.9,189.1 680.9,180.9" fill="#ececec"/>
<rect x="690" y="110" width="200" height="150" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="790.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Resume</text>
<text x="790.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">workflow continues</text>
<text x="790.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">or stops</text>
<text x="60" y="310" font-size="13" text-anchor="start" fill="#a8a8a8">For errors that cost more than waiting: sending money, deleting data, publishing in the company's name.</text>
<text x="60" y="329" font-size="13" text-anchor="start" fill="#a8a8a8">The backstop for every uncertain filter.</text>
</svg>