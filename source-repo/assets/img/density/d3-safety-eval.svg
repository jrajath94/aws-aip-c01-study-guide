<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Model evaluation for safety: three methods, three jobs">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Model evaluation for safety: three methods, three jobs</text>
<rect x="30" y="90" width="277" height="240" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="44" y="114" font-size="15" font-weight="bold" fill="#ececec">Programmatic</text>
<text x="44" y="136" font-size="13" fill="#ececec">fixed metrics, built-in sets:</text>
<text x="44" y="154" font-size="13" fill="#ececec">toxicity, accuracy, stability</text>
<text x="44" y="172" font-size="13" fill="#ececec">Cheap, repeatable, objective</text>
<rect x="327" y="90" width="277" height="240" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="341" y="114" font-size="15" font-weight="bold" fill="#ececec">LLM-as-a-judge</text>
<text x="341" y="136" font-size="13" fill="#ececec">a separate model scores rubrics:</text>
<text x="341" y="154" font-size="13" fill="#ececec">harmfulness, faithfulness,</text>
<text x="341" y="172" font-size="13" fill="#ececec">refusal behavior, style</text>
<rect x="624" y="90" width="277" height="240" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="638" y="114" font-size="15" font-weight="bold" fill="#ececec">Human</text>
<text x="638" y="136" font-size="13" fill="#ececec">your reviewers or AWS team:</text>
<text x="638" y="154" font-size="13" fill="#ececec">brand voice, culture,</text>
<text x="638" y="172" font-size="13" fill="#ececec">edge cases rubrics miss</text>
<text x="60" y="375" font-size="13" text-anchor="start" fill="#a8a8a8">You cannot govern what you do not measure. Baseline before launch, rerun on a schedule.</text>
</svg>