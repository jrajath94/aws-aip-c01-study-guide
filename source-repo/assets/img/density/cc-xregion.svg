<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 376" role="img" aria-label="Cross-region inference profiles">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="376" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Cross-region inference profiles</text>
<rect x="60" y="88" width="380" height="120" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="76" y="118" font-size="15" font-weight="bold">Global profile</text>
<text x="76" y="140" font-size="12" fill="#a8a8a8">Bedrock picks the best</text>
<text x="76" y="184" font-size="12" fill="#a8a8a8">commercial region. Max throughput.</text>
<text x="76" y="202" font-size="12" fill="#a8a8a8">Up to 10% cheaper.</text>
<rect x="480" y="88" width="380" height="120" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="496" y="118" font-size="15" font-weight="bold">Geographic profile</text>
<text x="496" y="140" font-size="12" fill="#a8a8a8">best region inside your</text>
<text x="496" y="184" font-size="12" fill="#a8a8a8">geography (US, EU). Standard price.</text>
<rect x="240" y="248" width="440" height="64" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="256" y="278" font-size="15" font-weight="bold">Neither works with Provisioned Throughput</text>
<text x="256" y="300" font-size="12" fill="#a8a8a8">SCPs can block regions too</text>
<text x="60" y="352" font-size="13" fill="#a8a8a8">Data residency picks geographic. Cost and throughput pick global.</text>
</svg>
