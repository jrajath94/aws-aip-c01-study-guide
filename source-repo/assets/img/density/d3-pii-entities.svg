<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="PII by entity type: block or mask">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">PII by entity type: block or mask</text>
<rect x="60" y="100" width="380" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="74" y="124" font-size="15" font-weight="bold" fill="#ececec">Detect the TYPE</text>
<text x="74" y="146" font-size="13" fill="#ececec">Names, SSNs, account numbers,</text>
<text x="74" y="164" font-size="13" fill="#ececec">30+ Comprehend entity types</text>
<text x="74" y="182" font-size="13" fill="#ececec"></text>
<text x="74" y="200" font-size="13" fill="#ececec">Your own regex patterns</text>
<text x="74" y="218" font-size="13" fill="#ececec">for custom formats</text>
<rect x="480" y="100" width="380" height="180" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="494" y="124" font-size="15" font-weight="bold" fill="#ececec">Choose the ACTION</text>
<text x="494" y="146" font-size="13" fill="#ececec">BLOCK: stop the request</text>
<text x="494" y="164" font-size="13" fill="#ececec"></text>
<text x="494" y="182" font-size="13" fill="#ececec">MASK: redact the value,</text>
<text x="494" y="200" font-size="13" fill="#ececec">let the request through</text>
<text x="494" y="218" font-size="13" fill="#ececec"></text>
<text x="494" y="236" font-size="13" fill="#ececec">Per entity type</text>
<text x="60" y="330" font-size="13" text-anchor="start" fill="#a8a8a8">Not string matching: the filter knows what an SSN looks like, not just one literal number.</text>
</svg>