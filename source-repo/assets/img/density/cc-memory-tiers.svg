<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 284" role="img" aria-label="Agentic memory: two tiers">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="284" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Agentic memory: two tiers</text>
<rect x="60" y="80" width="380" height="140" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="76" y="110" font-size="15" font-weight="bold">Short-term memory</text>
<text x="76" y="132" font-size="12" fill="#a8a8a8">this session: chat history,</text>
<text x="76" y="168" font-size="12" fill="#a8a8a8">events. Optimize LATENCY.</text>
<text x="76" y="192" font-size="12" fill="#a8a8a8">ElastiCache, MemoryDB, DDB.</text>
<rect x="480" y="80" width="380" height="140" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="496" y="110" font-size="15" font-weight="bold">Long-term memory</text>
<text x="496" y="132" font-size="12" fill="#a8a8a8">across sessions: prefs,</text>
<text x="496" y="168" font-size="12" fill="#a8a8a8">facts, summaries. Optimize</text>
<text x="496" y="192" font-size="12" fill="#a8a8a8">PERSISTENCE. RDS, Aurora,</text>
<text x="496" y="210" font-size="12" fill="#a8a8a8">DynamoDB, AgentCore Memory.</text>
<text x="60" y="260" font-size="13" fill="#a8a8a8">Latency for now. Persistence for later. The exam asks which goal the store serves.</text>
</svg>
