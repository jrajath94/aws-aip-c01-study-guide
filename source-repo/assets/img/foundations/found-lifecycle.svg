<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 330" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="S3 lifecycle rules, versioning, replication">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Lifecycle rules: your janitor, on a schedule</text>
<rect x="90" y="60" width="180" height="64" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="180" y="86" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">day 0</text>
<text x="180" y="110" text-anchor="middle" font-size="14" fill="#555555">S3 Standard</text>
<path d="M270,92 L304,92" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="304" y="60" width="180" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="394" y="86" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">day 30</text>
<text x="394" y="110" text-anchor="middle" font-size="14" fill="#555555">Standard-IA</text>
<path d="M484,92 L518,92" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="518" y="60" width="180" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="608" y="86" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">day 90</text>
<text x="608" y="110" text-anchor="middle" font-size="14" fill="#555555">Glacier Flexible</text>
<path d="M698,92 L732,92" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="732" y="60" width="180" height="64" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="822" y="86" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">year 7</text>
<text x="822" y="110" text-anchor="middle" font-size="14" fill="#555555">expire</text>
<rect x="60" y="160" width="420" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="270" y="188" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Versioning: the undo button</text>
<text x="270" y="214" text-anchor="middle" font-size="14" fill="#555555">keeps every version of an object</text>
<text x="270" y="238" text-anchor="middle" font-size="14" fill="#555555">MFA Delete can guard permanent removal</text>
<rect x="520" y="160" width="420" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="730" y="188" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Replication: the automatic copy</text>
<text x="730" y="214" text-anchor="middle" font-size="14" fill="#555555">CRR across Regions, SRR within one</text>
<text x="730" y="238" text-anchor="middle" font-size="14" fill="#555555">needs versioning on in both buckets</text>
<text x="500" y="312" text-anchor="middle" font-size="14" fill="#555555">"low-latency access on two continents" or "regulatory copy in a second Region" = replication</text>
</svg>
