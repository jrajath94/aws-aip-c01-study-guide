<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="S3 encryption flavors and sharing without opening the bucket">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Encryption at rest: three server-side flavors</text>
<rect x="60" y="52" width="280" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="82" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">SSE-S3</text>
<text x="200" y="110" text-anchor="middle" font-size="14" fill="#555555">AWS manages the keys</text>
<text x="200" y="134" text-anchor="middle" font-size="14" fill="#555555">AES-256</text>
<text x="200" y="158" text-anchor="middle" font-size="14" fill="#555555">free, the default</text>
<rect x="360" y="52" width="280" height="150" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="500" y="82" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">SSE-KMS</text>
<text x="500" y="110" text-anchor="middle" font-size="14" fill="#555555">YOUR KMS keys</text>
<text x="500" y="134" text-anchor="middle" font-size="14" fill="#555555">every use logged in CloudTrail</text>
<text x="500" y="158" text-anchor="middle" font-size="14" fill="#555555">disable the key = instant revoke</text>
<rect x="660" y="52" width="280" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="82" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">SSE-C</text>
<text x="800" y="110" text-anchor="middle" font-size="14" fill="#555555">YOU bring the key</text>
<text x="800" y="134" text-anchor="middle" font-size="14" fill="#555555">with each request</text>
<text x="800" y="158" text-anchor="middle" font-size="14" fill="#555555">no AWS-side key storage</text>
<text x="500" y="232" text-anchor="middle" font-size="14" fill="#555555">Data in flight is always TLS. Auditors asking for a per-decryption log = SSE-KMS.</text>
<rect x="60" y="252" width="880" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="282" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Sharing one private file: presigned URL</text>
<text x="500" y="308" text-anchor="middle" font-size="14" fill="#555555">a signed link that works until it expires (minutes to 7 days)</text>
<text x="500" y="332" text-anchor="middle" font-size="14" fill="#555555">the bucket stays private the whole time</text>
</svg>
