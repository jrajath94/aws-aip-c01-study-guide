<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 400" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="SQS vs SNS vs EventBridge">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Services talk through messages so none waits on another</text>
<rect x="30" y="60" width="350" height="300" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="205" y="90" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">SQS: the queue (pull)</text>
<text x="205" y="118" text-anchor="middle" font-size="14" fill="#555555">senders drop in, receivers pull out</text>
<rect x="60" y="150" width="100" height="50" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="110" y="180" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">sender</text>
<rect x="190" y="140" width="70" height="70" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="225" y="178" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">queue</text>
<rect x="290" y="150" width="60" height="50" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="320" y="180" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">worker</text>
<path d="M160,175 L190,175" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M260,175 L290,175" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="205" y="240" text-anchor="middle" font-size="14" fill="#555555">Standard: huge scale, at-least-once</text>
<text x="205" y="264" text-anchor="middle" font-size="14" fill="#555555">FIFO: strict order, exactly-once</text>
<text x="205" y="288" text-anchor="middle" font-size="14" fill="#555555">failures -> visibility timeout -> DLQ</text>
<rect x="400" y="60" width="350" height="300" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="90" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">SNS: broadcast (push)</text>
<text x="575" y="118" text-anchor="middle" font-size="14" fill="#555555">publish once to a topic, everyone gets it</text>
<rect x="525" y="140" width="100" height="50" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="170" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">publisher</text>
<rect x="430" y="230" width="84" height="50" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="472" y="260" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">email</text>
<path d="M575,190 L472,230" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="522" y="230" width="84" height="50" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="564" y="260" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">SMS</text>
<path d="M575,190 L564,230" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="614" y="230" width="84" height="50" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="656" y="260" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Lambda</text>
<path d="M575,190 L656,230" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="706" y="230" width="84" height="50" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="748" y="260" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">SQS</text>
<path d="M575,190 L748,230" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="575" y="312" text-anchor="middle" font-size="14" fill="#555555">fan-out: one event, many consumers</text>
<rect x="770" y="60" width="350" height="300" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="945" y="90" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">EventBridge: the event bus</text>
<text x="945" y="118" text-anchor="middle" font-size="14" fill="#555555">rules match events, route to targets</text>
<rect x="800" y="140" width="290" height="60" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="945" y="166" text-anchor="middle" font-size="12.5" fill="#111111">AWS events / app events / SaaS / cron</text>
<path d="M945,200 L945,224" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="830" y="224" width="230" height="50" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="945" y="254" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">targets: Lambda, SQS, ...</text>
<text x="945" y="312" text-anchor="middle" font-size="14" fill="#555555">"when X happens, do Y" + schedules</text>
<text x="575" y="386" text-anchor="middle" font-size="14" fill="#555555">SQS = queue, pull, buffer. SNS = broadcast, push, fan-out. EventBridge = rules over events, plus cron.</text>
</svg>
