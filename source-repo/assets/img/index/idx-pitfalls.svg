<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-label="The exam-day funnel: read for shape, find the constraint, kill two, decide">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="760" height="290" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">HOW TO SURVIVE THE REAL EXAM</text>
<rect x="100.0" y="60" width="560" height="40" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="380" y="85" font-size="13" fill="#222222" text-anchor="middle">4 options</text>
<line x1="380" y1="100" x2="380" y2="112" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="190.0" y="112" width="380" height="40" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="380" y="137" font-size="13" fill="#222222" text-anchor="middle">kill 2 fast</text>
<line x1="380" y1="152" x2="380" y2="164" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="260.0" y="164" width="240" height="40" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="380" y="189" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">decide last 2</text>
<line x1="380" y1="204" x2="380" y2="216" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="310.0" y="216" width="140" height="40" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="380" y="241" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">1 answer</text>
<text x="630" y="124" font-size="11" fill="#555555" text-anchor="middle">read the last</text>
<text x="630" y="138" font-size="11" fill="#555555" text-anchor="middle">sentence first</text>
<text x="630" y="182" font-size="11" fill="#555555" text-anchor="middle">flag at 2.5 min,</text>
<text x="630" y="196" font-size="11" fill="#555555" text-anchor="middle">move on</text>
<text x="380" y="278" font-size="12" fill="#555555" text-anchor="middle">'Least operational overhead' means: fewest services you manage yourself</text>
</svg>