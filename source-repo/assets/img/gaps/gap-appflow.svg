<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 1.1. APPFLOW MOVES SAAS DATA INTO THE LAKE</text>
<rect x="24" y="56" width="130" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="89.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">SaaS source</text>
<text x="89.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">Salesforce,</text>
<text x="89.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">Zendesk, Slack</text>
<rect x="204" y="56" width="170" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="289.0" y="72.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">AppFlow flow</text>
<text x="289.0" y="89.0" font-size="12" fill="#222222" text-anchor="middle">validate, prepare,</text>
<text x="289.0" y="105.0" font-size="12" fill="#222222" text-anchor="middle">filter, aggregate,</text>
<text x="289.0" y="121.0" font-size="12" fill="#222222" text-anchor="middle">deduplicate</text>
<rect x="424" y="56" width="120" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="484.0" y="88.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">S3</text>
<text x="484.0" y="105.0" font-size="12" fill="#222222" text-anchor="middle"></text>
<rect x="594" y="56" width="142" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="665.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Consume</text>
<text x="665.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">Glue crawler +</text>
<text x="665.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">Bedrock KB</text>
<line x1="154" y1="96" x2="204" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="374" y1="96" x2="424" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="544" y1="96" x2="594" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="289" y="160" font-size="11.5" fill="#555555" text-anchor="middle">A flow is the recipe: source, destination, schedule, preparation steps</text>
<text x="380" y="200" font-size="12" fill="#555555" text-anchor="middle">Credentials for the SaaS connection live in Secrets Manager, not in the flow.</text>
<text x="380" y="224" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'Salesforce data into S3 for a Knowledge Base, no code' -&gt; AppFlow.</text>
<text x="380" y="248" font-size="12" fill="#555555" text-anchor="middle">Trap: it is not streaming (that is Kinesis) and not file transfer (that is Transfer Family).</text>
<text x="380" y="280" font-size="12" fill="#555555" text-anchor="middle">Why here: the main volumes mention it once; exam scenarios name the SaaS source.</text>
</svg>