<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="QuickSight: sources to SPICE to dashboards, with ML extras">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 2.1. QUICKSIGHT SERVES DASHBOARDS FROM SPICE</text>
<rect x="24" y="56" width="140" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="94.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Sources</text>
<text x="94.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">RDS, Redshift,</text>
<text x="94.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">S3, Athena</text>
<rect x="214" y="56" width="170" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="299.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">SPICE</text>
<text x="299.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">in-memory engine,</text>
<text x="299.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">fast dashboards</text>
<rect x="434" y="56" width="140" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="504.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Dashboards</text>
<text x="504.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">shared with</text>
<text x="504.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">readers</text>
<line x1="164" y1="96" x2="214" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="384" y1="96" x2="434" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="604" y="56" width="132" height="80" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="670" y="82" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">ML extras</text>
<text x="670" y="102" font-size="11" fill="#222222" text-anchor="middle">anomaly detect</text>
<text x="670" y="120" font-size="11" fill="#222222" text-anchor="middle">RLS, paginated</text>
<text x="380" y="176" font-size="12" fill="#555555" text-anchor="middle">SPICE is the in-memory cache: dashboards read SPICE, not the source database.</text>
<text x="380" y="206" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'executives need dashboards over the data lake' -&gt; QuickSight + SPICE.</text>
<text x="380" y="230" font-size="12" fill="#555555" text-anchor="middle">Trap: anomaly detection is built-in ML, not a SageMaker project you build.</text>
<text x="380" y="254" font-size="12" fill="#555555" text-anchor="middle">RLS (row-level security) limits which rows each reader sees.</text>
<text x="380" y="286" font-size="12" fill="#555555" text-anchor="middle">Why here: BI-adjacent; the main volumes cover analytics storage, not the dashboard layer.</text>
</svg>