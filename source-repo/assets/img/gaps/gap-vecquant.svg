<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-label="Quantization: two-stage retrieval, 30x less memory">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 4.3. VECTOR QUANTIZATION IN TWO STAGES</text>
<rect x="24" y="60" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="104.0" y="89.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Stage 1: recall</text>
<text x="104.0" y="106.0" font-size="12" fill="#222222" text-anchor="middle">scan the small</text>
<text x="104.0" y="122.0" font-size="12" fill="#222222" text-anchor="middle">quantized index</text>
<rect x="310" y="60" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="390.0" y="89.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Stage 2: precision</text>
<text x="390.0" y="106.0" font-size="12" fill="#222222" text-anchor="middle">rerank the shortlist</text>
<text x="390.0" y="122.0" font-size="12" fill="#222222" text-anchor="middle">with full vectors</text>
<rect x="596" y="60" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="676.0" y="89.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Result</text>
<text x="676.0" y="106.0" font-size="12" fill="#222222" text-anchor="middle">best chunks</text>
<text x="676.0" y="122.0" font-size="12" fill="#222222" text-anchor="middle">go to the prompt</text>
<line x1="184" y1="105" x2="310" y2="105" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="470" y1="105" x2="596" y2="105" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="180" width="732" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="206" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Worked example: the memory math</text>
<text x="60" y="236" font-size="12" fill="#222222" text-anchor="start" font-weight="700">Full vectors: 60 GB</text>
<rect x="60" y="244" width="300" height="18" rx="4" fill="#ffffff" stroke="#c98a1b" stroke-width="1.5"/>
<text x="60" y="276" font-size="12" fill="#222222" text-anchor="start">Quantized: about 2 GB (30x smaller). Slight recall loss, recovered by stage-2 rerank.</text>
<text x="390" y="320" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'fit the index in memory on a budget' -&gt; quantization + rerank.</text>
<text x="390" y="344" font-size="12" fill="#555555" text-anchor="middle">Trap: quantization trades a little recall for a lot of memory; it is not free.</text>
<text x="390" y="368" font-size="12" fill="#555555" text-anchor="middle">Why here: hard gap. The main volumes cover vector search, not the compression.</text>
</svg>