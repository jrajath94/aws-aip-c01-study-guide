<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 330" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Guardrail input check, model call, then guardrail output check">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">A request passes two guardrail gates: input, then output</text>
<rect x="30" y="120" width="150" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="105" y="157" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Your</text><text x="105" y="183" text-anchor="middle" font-size="14" fill="#111111">app</text><line x1="180" y1="165" x2="230" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="230" y="70" width="260" height="190" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="360" y="92" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">GUARDRAIL</text><text x="360" y="118" text-anchor="middle" font-size="12" fill="#111111">input check</text><text x="360" y="144" text-anchor="middle" font-size="12" fill="#111111">content filters</text><text x="360" y="170" text-anchor="middle" font-size="12" fill="#111111">denied topics</text><text x="360" y="196" text-anchor="middle" font-size="12" fill="#111111">word filters</text><text x="360" y="222" text-anchor="middle" font-size="12" fill="#111111">PII filter</text><text x="360" y="248" text-anchor="middle" font-size="12" fill="#111111">prompt attack</text><line x1="490" y1="165" x2="540" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="120" width="180" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="630" y="157" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bedrock</text><text x="630" y="183" text-anchor="middle" font-size="14" fill="#111111">model</text><line x1="720" y1="165" x2="770" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="770" y="70" width="200" height="190" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="870" y="118" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">GUARDRAIL</text><text x="870" y="144" text-anchor="middle" font-size="12" fill="#111111">output check</text><text x="870" y="170" text-anchor="middle" font-size="12" fill="#111111">same filters</text><text x="870" y="196" text-anchor="middle" font-size="12" fill="#111111">run again</text><text x="870" y="222" text-anchor="middle" font-size="12" fill="#111111">on the answer</text><line x1="970" y1="165" x2="990" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="300" text-anchor="middle" font-size="13" fill="#555555">Input and output checks are independent switches. Turn on only output checks, and bad input still reaches the model.</text></svg>
