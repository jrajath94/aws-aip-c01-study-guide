<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 470" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Evaluation matrix: quality, safety, groundedness times automatic, judge, human">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The evaluation matrix</text>
<rect x="260" y="60" width="480" height="50" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="500" y="90" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Metric family</text><rect x="60" y="130" width="420" height="80" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="270" y="162" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Quality</text><text x="270" y="188" text-anchor="middle" font-size="13" fill="#111111">accuracy, F1, ROUGE</text><rect x="60" y="226" width="420" height="80" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="270" y="258" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Safety</text><text x="270" y="284" text-anchor="middle" font-size="13" fill="#111111">toxicity, bias</text><rect x="60" y="322" width="420" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="270" y="354" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Groundedness</text><text x="270" y="380" text-anchor="middle" font-size="13" fill="#111111">faithfulness to source</text><rect x="560" y="130" width="380" height="272" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="750" y="232" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">How AWS tests</text><text x="750" y="258" text-anchor="middle" font-size="13" fill="#111111">automatic metrics</text><text x="750" y="284" text-anchor="middle" font-size="13" fill="#111111">LLM-as-judge</text><text x="750" y="310" text-anchor="middle" font-size="13" fill="#111111">human review</text><line x1="480" y1="200" x2="560" y2="200" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><line x1="480" y1="296" x2="560" y2="296" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="440" text-anchor="middle" font-size="13" fill="#555555">Every metric family, tested three ways: machine, model-judge, human.</text></svg>
