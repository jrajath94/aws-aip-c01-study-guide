<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 390" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Distractor anatomy: a real service, a real current reason it fails, and the master trap number">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Every distractor is real: wrong for a real, current reason</text>
<rect x="60" y="70" width="330" height="140" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="225" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Real service</text>
<text x="225" y="118" text-anchor="middle" font-size="13" fill="#555555">no fictional service names</text>
<text x="225" y="140" text-anchor="middle" font-size="13" fill="#555555">in this bank</text>
<text x="225" y="162" text-anchor="middle" font-size="13" fill="#555555">fact-checked 2026-09-28</text>
<rect x="410" y="70" width="330" height="140" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Real reason it fails</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">fine-tuning: no citations</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">Lambda polling: 15-min timeout</text>
<text x="575" y="162" text-anchor="middle" font-size="13" fill="#555555">Knowledge Base: never calls APIs</text>
<rect x="760" y="70" width="330" height="140" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="925" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Real trap name</text>
<text x="925" y="118" text-anchor="middle" font-size="13" fill="#555555">each explanation names</text>
<text x="925" y="140" text-anchor="middle" font-size="13" fill="#555555">the master trap by number</text>
<text x="925" y="162" text-anchor="middle" font-size="13" fill="#555555">so you spot it next time</text>
<path d="M390,140 L408,140" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M740,140 L758,140" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="255" y="250" width="640" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="276" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">How to read a distractor note</text>
<text x="575" y="298" text-anchor="middle" font-size="13" fill="#555555">1. it names the tempting wrong option</text>
<text x="575" y="320" text-anchor="middle" font-size="13" fill="#555555">2. it states the exact mechanism that kills it</text>
<text x="575" y="342" text-anchor="middle" font-size="13" fill="#555555">3. it links the master trap number</text>
<path d="M575,210 L575,248" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
