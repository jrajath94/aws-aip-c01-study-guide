<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img" aria-label="Custom model decision flowchart: labeled examples lead to fine-tuning, unlabeled domain text to continued pre-training, narrow cost pain to distillation, outside weights to import">
<rect x="0" y="0" width="760" height="600" fill="#000000" rx="10"/>
<text x="24" y="36" font-size="20" font-weight="600" fill="#ececec">Which customization method?</text>
<text x="24" y="60" font-size="13" fill="#7d8590">One claim: the data you hold names the method.</text>
<rect x="248" y="80" width="264" height="64" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="380" y="106" text-anchor="middle" font-size="13" fill="#9ecfff">Labeled prompt-response</text>
<text x="380" y="126" text-anchor="middle" font-size="13" fill="#9ecfff">pairs for the new task?</text>
<line x1="512" y1="112" x2="600" y2="112" stroke="#7d8590" stroke-width="1.5"/>
<text x="520" y="106" font-size="12" fill="#7d8590">yes</text>
<rect x="600" y="80" width="136" height="64" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="668" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#7ee2b0">Fine-tune</text>
<text x="668" y="126" text-anchor="middle" font-size="12" fill="#7d8590">(SFT)</text>
<line x1="380" y1="144" x2="380" y2="176" stroke="#7d8590" stroke-width="1.5"/>
<text x="392" y="166" font-size="12" fill="#7d8590">no</text>
<rect x="248" y="176" width="264" height="64" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="380" y="202" text-anchor="middle" font-size="13" fill="#9ecfff">Large unlabeled corpus</text>
<text x="380" y="222" text-anchor="middle" font-size="13" fill="#9ecfff">in the domain?</text>
<line x1="512" y1="208" x2="600" y2="208" stroke="#7d8590" stroke-width="1.5"/>
<text x="520" y="202" font-size="12" fill="#7d8590">yes</text>
<rect x="600" y="176" width="136" height="64" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="668" y="202" text-anchor="middle" font-size="13" font-weight="600" fill="#7ee2b0">Continued</text>
<text x="668" y="222" text-anchor="middle" font-size="12" fill="#7d8590">pre-training</text>
<line x1="380" y1="240" x2="380" y2="272" stroke="#7d8590" stroke-width="1.5"/>
<text x="392" y="262" font-size="12" fill="#7d8590">no</text>
<rect x="248" y="272" width="264" height="64" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="380" y="298" text-anchor="middle" font-size="13" fill="#9ecfff">One narrow task, and</text>
<text x="380" y="318" text-anchor="middle" font-size="13" fill="#9ecfff">cost is the pain?</text>
<line x1="512" y1="304" x2="600" y2="304" stroke="#7d8590" stroke-width="1.5"/>
<text x="520" y="298" font-size="12" fill="#7d8590">yes</text>
<rect x="600" y="272" width="136" height="64" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="668" y="298" text-anchor="middle" font-size="13" font-weight="600" fill="#7ee2b0">Distill</text>
<text x="668" y="318" text-anchor="middle" font-size="12" fill="#7d8590">small copies big</text>
<line x1="380" y1="336" x2="380" y2="368" stroke="#7d8590" stroke-width="1.5"/>
<text x="392" y="358" font-size="12" fill="#7d8590">no</text>
<rect x="248" y="368" width="264" height="64" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="380" y="394" text-anchor="middle" font-size="13" fill="#9ecfff">Weights already trained</text>
<text x="380" y="414" text-anchor="middle" font-size="13" fill="#9ecfff">outside Bedrock?</text>
<line x1="512" y1="400" x2="600" y2="400" stroke="#7d8590" stroke-width="1.5"/>
<text x="520" y="394" font-size="12" fill="#7d8590">yes</text>
<rect x="600" y="368" width="136" height="64" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="668" y="394" text-anchor="middle" font-size="13" font-weight="600" fill="#7ee2b0">Import</text>
<text x="668" y="414" text-anchor="middle" font-size="12" fill="#7d8590">the model</text>
<line x1="380" y1="432" x2="380" y2="464" stroke="#7d8590" stroke-width="1.5"/>
<text x="392" y="454" font-size="12" fill="#7d8590">no</text>
<rect x="248" y="464" width="264" height="64" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="380" y="490" text-anchor="middle" font-size="13" fill="#ececec">Feedback or reward signals?</text>
<text x="380" y="510" text-anchor="middle" font-size="12" fill="#7d8590">Reinforcement fine-tuning</text>
<text x="24" y="562" font-size="13" fill="#ececec">Read the stem for the data it gives you. The data names the method.</text>
<text x="24" y="584" font-size="12" fill="#7d8590">Shell: decision flowchart. Source: original figure for the AWS AIP-C01 Study Guide.</text>
</svg>
