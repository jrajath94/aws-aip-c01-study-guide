<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 540" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Managed-first ladder as rising cost and effort: prompt engineering, RAG, agents, fine-tuning, train from scratch">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 5: stop at the cheapest rung that works</text>
<rect x="400" y="70" width="200" height="56" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="105" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Prompt engineering</text>
<rect x="400" y="148" width="300" height="56" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="550" y="183" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">RAG</text>
<rect x="400" y="226" width="400" height="56" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="600" y="261" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Agents</text>
<rect x="400" y="304" width="520" height="56" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="660" y="339" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Fine-tuning</text>
<rect x="400" y="382" width="640" height="56" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="720" y="417" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Train from scratch</text>
<text x="1050" y="300" text-anchor="middle" font-size="14" fill="#555555" transform="rotate(-90 1050 300)">cost and effort</text>
<path d="M1050,440 L1050,120" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="520" y="510" text-anchor="middle" font-size="13" fill="#555555">Jumping straight to training fails the overhead filter. Climb one rung at a time.</text>
</svg>
