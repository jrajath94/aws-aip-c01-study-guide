<svg xmlns="http://www.w3.org/2000/svg" width="720" height="445" viewBox="0 0 720 445" role="img" aria-label="IAM policy evaluation order: explicit deny first, then an allow must exist, then boundaries and service control policies can still block">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="445" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">IAM: HOW A REQUEST IS JUDGED</text>

<rect x="255" y="55" width="210" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="79.0" font-size="13" text-anchor="middle" font-weight="700">Request arrives</text>
<text x="360.0" y="97.0" font-size="11" fill="#555555" text-anchor="middle">e.g. ListBucket</text>

<line x1="360" y1="107" x2="360" y2="132" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="255" y="132" width="210" height="52" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/>
<text x="360.0" y="156.0" font-size="13" text-anchor="middle" font-weight="700">Explicit deny anywhere?</text>
<text x="360.0" y="174.0" font-size="11" fill="#555555" text-anchor="middle">yes = DENY</text>

<line x1="360" y1="184" x2="360" y2="209" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="368" y="200" font-size="11" fill="#555555">no</text>
<rect x="255" y="209" width="210" height="52" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="360.0" y="233.0" font-size="13" text-anchor="middle" font-weight="700">Allow in identity OR</text>
<text x="360.0" y="251.0" font-size="11" fill="#555555" text-anchor="middle">resource policy?</text>

<line x1="360" y1="261" x2="360" y2="286" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="368" y="277" font-size="11" fill="#555555">yes</text>
<rect x="255" y="286" width="210" height="52" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="360.0" y="310.0" font-size="13" text-anchor="middle" font-weight="700">Boundary or SCP blocks?</text>
<text x="360.0" y="328.0" font-size="11" fill="#555555" text-anchor="middle">yes = DENY</text>

<line x1="360" y1="338" x2="360" y2="363" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="368" y="354" font-size="11" fill="#555555">no</text>
<rect x="255" y="363" width="210" height="52" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="360.0" y="387.0" font-size="13" text-anchor="middle" font-weight="700">ALLOW</text>
<text x="360.0" y="405.0" font-size="11" fill="#555555" text-anchor="middle">request proceeds</text>

<text x="490" y="160" font-size="11.5" fill="#555555">Deny always wins</text>
<text x="490" y="238" font-size="11.5" fill="#b00020">no = implicit deny</text>
</svg>