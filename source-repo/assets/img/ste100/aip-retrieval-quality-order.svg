<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 600" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Retrieval fixes in exam order: four levers, top to bottom">
<title>Retrieval fixes in exam order: four levers, top to bottom</title>
<desc>Four boxes top to bottom with arrows, numbered. 1. Hybrid search: combine vector meaning search with keyword lexical search so exact codes and names are not lost; BM25 is the classic keyword scorer. 2. Rerank: take the top 50 candidates and run a dedicated rerank model over them with the query to produce a better top 5. 3. Query handling: rewrite the question first, with query expansion adding synonyms and decomposition splitting complex questions. 4. Debug the pipeline itself: check chunks, embeddings, and source data. A footer says to try them in this order, not at random.</desc>
<defs><marker id="aip-retorder-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">RETRIEVAL IS WRONG? TRY THE LEVERS IN THIS ORDER</text>
<rect x="60" y="70" width="820" height="95" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. hybrid search</text>
<text x="470.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">vector (meaning) + keyword (exact terms)</text>
<text x="470.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">stops losing product codes and names</text>
<line x1="470" y1="165" x2="470" y2="188" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-retorder-ah)"/>
<rect x="60" y="188" width="820" height="95" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="470.0" y="220" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. rerank</text>
<text x="470.0" y="242" text-anchor="middle" font-size="12.5" fill="#555555">rerank model reorders the top 50 -&gt; top 5</text>
<text x="470.0" y="261" text-anchor="middle" font-size="12.5" fill="#555555">fixes plausible-but-wrong ranking first</text>
<line x1="470" y1="283" x2="470" y2="306" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-retorder-ah)"/>
<rect x="60" y="306" width="820" height="95" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="470.0" y="338" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. query handling</text>
<text x="470.0" y="360" text-anchor="middle" font-size="12.5" fill="#555555">expand with synonyms, decompose complex Qs</text>
<text x="470.0" y="379" text-anchor="middle" font-size="12.5" fill="#555555">fixes vague questions before retrieval</text>
<line x1="470" y1="401" x2="470" y2="424" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-retorder-ah)"/>
<rect x="60" y="424" width="820" height="95" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="470.0" y="456" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. debug the pipeline</text>
<text x="470.0" y="478" text-anchor="middle" font-size="12.5" fill="#555555">check chunks, embeddings, source data</text>
<text x="470.0" y="497" text-anchor="middle" font-size="12.5" fill="#555555">the data itself may be the bug</text>
<text x="30" y="586" font-size="13" fill="#111111">Rule: hybrid first, rerank second, query handling third, pipeline debugging last. The exam expects this order.</text>
</svg>