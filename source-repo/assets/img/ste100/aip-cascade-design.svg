<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 620" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Cascade design: cheap model first, escalate on doubt">
<title>Cascade design: cheap model first, escalate on doubt</title>
<desc>Three stages top to bottom. Stage 1: a small fast model answers every request and reports its confidence. A diamond asks: confident? Yes goes right to the answer. No goes down to stage 2, a mid-size model. Confident now? Yes to the answer, no down to stage 3, the flagship model. A footer shows the payoff: most requests end cheap at stage 1, only the hard ones pay flagship prices.</desc>
<defs><marker id="aip-cascade-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="620" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">CASCADE: PAY FLAGSHIP PRICES ONLY FOR HARD REQUESTS</text>
<rect x="60" y="70" width="380" height="110" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="250.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Stage 1: small fast model</text>
<text x="250.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">answers everything first</text>
<text x="250.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">e.g. Haiku / Nova Lite class</text>
<polygon points="640,80.0 770.0,125 640,170.0 510.0,125" fill="#ffffff" stroke="#1e7e34" stroke-width="1.5"/>
<text x="640" y="130" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">confident?</text>
<line x1="440" y1="125" x2="510" y2="125" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-cascade-ah)"/>
<line x1="770" y1="170" x2="770" y2="220" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-cascade-ah)"/>
<text x="786" y="202" font-size="12" fill="#555555">no</text>
<rect x="60" y="220" width="380" height="110" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="250.0" y="252" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Stage 2: mid model</text>
<text x="250.0" y="274" text-anchor="middle" font-size="12.5" fill="#555555">handles what stage 1 doubted</text>
<text x="250.0" y="293" text-anchor="middle" font-size="12.5" fill="#555555">e.g. Sonnet class</text>
<polygon points="640,230.0 770.0,275 640,320.0 510.0,275" fill="#ffffff" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="640" y="280" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">confident?</text>
<line x1="440" y1="275" x2="510" y2="275" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-cascade-ah)"/>
<line x1="770" y1="320" x2="770" y2="370" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-cascade-ah)"/>
<text x="786" y="352" font-size="12" fill="#555555">no</text>
<rect x="60" y="370" width="380" height="110" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="250.0" y="402" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Stage 3: flagship model</text>
<text x="250.0" y="424" text-anchor="middle" font-size="12.5" fill="#555555">handles the hardest few</text>
<text x="250.0" y="443" text-anchor="middle" font-size="12.5" fill="#555555">e.g. Opus class</text>
<polygon points="640,380.0 770.0,425 640,470.0 510.0,425" fill="#ffffff" stroke="#b3261e" stroke-width="1.5"/>
<text x="640" y="430" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">confident?</text>
<line x1="440" y1="425" x2="510" y2="425" stroke="#b3261e" stroke-width="1.8" marker-end="url(#aip-cascade-ah)"/>
<rect x="640" y="520" width="260" height="80" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="770.0" y="552" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">answer</text>
<text x="770.0" y="574" text-anchor="middle" font-size="12.5" fill="#555555">most requests stop at stage 1</text>
<line x1="770" y1="125" x2="770" y2="520" stroke="#555555" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#aip-cascade-ah)"/>
<text x="786" y="340" font-size="12" fill="#555555">yes</text>
<text x="30" y="606" font-size="13" fill="#111111">Design rule: the router escalates on low confidence, never on round-robin. Eval the cascade, not just the model.</text>
</svg>