<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 412" role="img" aria-label="Prompt caching: needs a repeated long prefix marked with cachePoint; proof is cache read hit rate; useless on unique traffic"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="412" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Prompt caching: one precondition, one proof</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Repeated prefixes bill at a reduced input-token rate.</text><rect x="60" y="100" width="800" height="110" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="460" y="136" text-anchor="middle" font-size="15.5" fill="#ececec" font-weight="bold">Precondition: a repeated long prefix</text><text x="460" y="164" text-anchor="middle" font-size="13" fill="#a8a8a8">Usually a long system prompt or document block shared across many calls. Minimum on the order of 1,000 tokens.</text><text x="460" y="190" text-anchor="middle" font-size="13" fill="#a8a8a8">Mark the boundary with cachePoint. TTL: 5 minutes by default, up to 1 hour on supported models.</text><path d="M460,210 L460,244" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="250" width="390" height="130" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="255" y="288" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Proof it works</text><text x="255" y="318" text-anchor="middle" font-size="14" fill="#a8a8a8">Cache read hit rate.</text><text x="255" y="344" text-anchor="middle" font-size="13" fill="#a8a8a8">Not total token spend.</text><rect x="470" y="250" width="390" height="130" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="665" y="288" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Dead weight when</text><text x="665" y="318" text-anchor="middle" font-size="14" fill="#a8a8a8">Unique traffic: no repeated</text><text x="665" y="344" text-anchor="middle" font-size="13" fill="#a8a8a8">prefix, no savings.</text></svg>