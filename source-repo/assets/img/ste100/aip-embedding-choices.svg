<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 466" role="img" aria-label="Embedding choices: Titan Text Embeddings v2 with configurable dimensions versus Cohere Embed multilingual; same model and dimensions at ingest and query time"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="466" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Two embedding choices, one iron rule</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Embeddings go through InvokeModel. Converse is text generation only.</text><rect x="60" y="100" width="390" height="210" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="255" y="138" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Titan Text Embeddings v2</text><text x="255" y="168" text-anchor="middle" font-size="13.5" fill="#a8a8a8">The cheap default.</text><text x="255" y="200" text-anchor="middle" font-size="13.5" fill="#a8a8a8">Dimensions: 1024, 512, or 256.</text><text x="255" y="228" text-anchor="middle" font-size="13" fill="#a8a8a8">256 cuts storage to a quarter</text><text x="255" y="250" text-anchor="middle" font-size="13" fill="#a8a8a8">and speeds search.</text><text x="255" y="282" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Measure the accuracy trade-off</text><text x="255" y="302" text-anchor="middle" font-size="12.5" fill="#a8a8a8">on a golden dataset.</text><rect x="470" y="100" width="390" height="210" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="665" y="138" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Cohere Embed</text><text x="665" y="168" text-anchor="middle" font-size="13.5" fill="#a8a8a8">The multilingual pick: 100+ languages.</text><text x="665" y="200" text-anchor="middle" font-size="13.5" fill="#a8a8a8">input_type: search_query</text><text x="665" y="219" text-anchor="middle" font-size="13.5" fill="#a8a8a8">vs search_document.</text><text x="665" y="252" text-anchor="middle" font-size="13" fill="#a8a8a8">Different prefixes for queries</text><text x="665" y="271" text-anchor="middle" font-size="13" fill="#a8a8a8">and documents.</text><rect x="60" y="338" width="800" height="96" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="460" y="372" text-anchor="middle" font-size="15" fill="#c0554d" font-weight="bold">THE IRON RULE</text><text x="460" y="400" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Same embedding model and dimensions at ingestion and query time.</text><text x="460" y="424" text-anchor="middle" font-size="13" fill="#a8a8a8">Mismatch breaks retrieval silently: the vector spaces do not align.</text></svg>