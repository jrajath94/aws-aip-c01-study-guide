<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 290" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Denied topics block a subject in any wording; word filters block exact words">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Denied topics vs word filters: the paraphrase test</text>
<rect x="60" y="90" width="400" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="260" y="121" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">DENIED TOPIC</text><text x="260" y="147" text-anchor="middle" font-size="13" fill="#111111">whole subject blocked</text><text x="260" y="173" text-anchor="middle" font-size="13" fill="#111111">e.g. "weapons", "finance"</text><text x="260" y="199" text-anchor="middle" font-size="13" fill="#111111">any wording of it fails</text><rect x="540" y="90" width="400" height="130" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="740" y="121" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">WORD FILTER</text><text x="740" y="147" text-anchor="middle" font-size="13" fill="#111111">exact words blocked</text><text x="740" y="173" text-anchor="middle" font-size="13" fill="#111111">list: "word1", "word2"</text><text x="740" y="199" text-anchor="middle" font-size="13" fill="#111111">only those spellings fail</text><text x="500" y="260" text-anchor="middle" font-size="13" fill="#555555">Exam tip: a paraphrase of a denied topic still fails; a paraphrase of a filtered word passes.</text></svg>
