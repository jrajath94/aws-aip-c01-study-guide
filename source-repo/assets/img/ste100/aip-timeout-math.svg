<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 480" role="img" aria-label="Timeout math: a 3000 token answer at 100 tokens per second takes 30 seconds, exceeding the 29 second API Gateway timeout"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="480" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Timeout math: 30 seconds beats 29 seconds</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Do this math in your head. The ceiling sits at API Gateway, not Lambda.</text><rect x="60" y="100" width="800" height="70" rx="8" fill="#141414" stroke="#8a8a8a" stroke-width="1.5"/><text x="460" y="128" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">3,000 tokens at 100 tokens per second = 30 seconds of streaming</text><text x="460" y="154" text-anchor="middle" font-size="13.5" fill="#a8a8a8">The REST integration timeout at API Gateway is 29 seconds.</text><rect x="60" y="200" width="800" height="120" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="460" y="236" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">30 seconds is longer than 29 seconds.</text><text x="460" y="264" text-anchor="middle" font-size="13.5" fill="#a8a8a8">The call dies at the gateway, even though Lambda could run 900 seconds.</text><text x="460" y="290" text-anchor="middle" font-size="13.5" fill="#a8a8a8">Raising the Lambda timeout cannot fix a gateway timeout.</text><rect x="60" y="348" width="390" height="100" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="255" y="382" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Fix 1: WebSocket API</text><text x="255" y="408" text-anchor="middle" font-size="13" fill="#a8a8a8">stream tokens off the</text><text x="255" y="428" text-anchor="middle" font-size="13" fill="#a8a8a8">request-response path</text><rect x="470" y="348" width="390" height="100" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="665" y="382" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Fix 2: async with polling</text><text x="665" y="408" text-anchor="middle" font-size="13" fill="#a8a8a8">return a job ID, deliver</text><text x="665" y="428" text-anchor="middle" font-size="13" fill="#a8a8a8">the result later</text></svg>