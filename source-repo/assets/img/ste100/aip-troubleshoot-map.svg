<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 500" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Troubleshooting map from symptom to checklist">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Troubleshooting map</text>
<rect x="350" y="60" width="300" height="70" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="500" y="100" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Symptom?</text><line x1="500" y1="130" x2="190" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="165" width="260" height="120" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="190" y="204" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Wrong answer</text><text x="190" y="230" text-anchor="middle" font-size="12" fill="#111111">check retrieval +</text><text x="190" y="256" text-anchor="middle" font-size="12" fill="#111111">grounding</text><line x1="500" y1="130" x2="510" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="380" y="165" width="260" height="120" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="510" y="204" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Throttled (429)</text><text x="510" y="230" text-anchor="middle" font-size="12" fill="#111111">backoff, quota</text><text x="510" y="256" text-anchor="middle" font-size="12" fill="#111111">smaller batch</text><line x1="500" y1="130" x2="830" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="700" y="165" width="260" height="120" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="830" y="204" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Too slow</text><text x="830" y="230" text-anchor="middle" font-size="12" fill="#111111">stream, region,</text><text x="830" y="256" text-anchor="middle" font-size="12" fill="#111111">smaller model</text><rect x="60" y="330" width="260" height="100" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="190" y="359" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Unsafe output</text><text x="190" y="385" text-anchor="middle" font-size="12" fill="#111111">guardrail config</text><text x="190" y="411" text-anchor="middle" font-size="12" fill="#111111">red-team again</text><line x1="500" y1="130" x2="190" y2="330" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="470" text-anchor="middle" font-size="13" fill="#555555">Name the symptom first. Each symptom has its own checklist.</text></svg>
