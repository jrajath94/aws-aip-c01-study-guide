<rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">SHARED RESPONSIBILITY</text><rect x="24" y="56" width="330" height="170" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="189" y="86" font-size="14" fill="#222222" text-anchor="middle" font-weight="700">AWS</text><text x="189" y="110" font-size="11.5" fill="#555555" text-anchor="middle">secures the building</text><text x="189" y="140" font-size="11.5" fill="#222222" text-anchor="middle">data centers, network,</text><text x="189" y="160" font-size="11.5" fill="#222222" text-anchor="middle">hardware, managed</text><text x="189" y="180" font-size="11.5" fill="#222222" text-anchor="middle">infrastructure</text><rect x="366" y="56" width="330" height="170" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="531" y="86" font-size="14" fill="#222222" text-anchor="middle" font-weight="700">YOU</text><text x="531" y="110" font-size="11.5" fill="#555555" text-anchor="middle">secure your rooms</text><text x="531" y="140" font-size="11.5" fill="#222222" text-anchor="middle">IAM, KMS, VPC,</text><text x="531" y="160" font-size="11.5" fill="#222222" text-anchor="middle">prompts, documents,</text><text x="531" y="180" font-size="11.5" fill="#222222" text-anchor="middle">model choice</text><rect x="24" y="246" width="672" height="52" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="360" y="268" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Bedrock never trains on your prompts. Your fine-tunes stay private to your account.</text></svg>