<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Shared responsibility for AI: AWS secures the building and managed infrastructure; you secure IAM, KMS, network, prompts, documents, and model choice">
