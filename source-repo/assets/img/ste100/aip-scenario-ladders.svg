<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img" aria-label="Decision ladders composed: one support scenario run through the grounding ladder, the inference pricing ladder, and the safety control ladder"><rect x="0" y="0" width="760" height="452" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">One scenario, all three ladders</text><text x="24" y="58" font-size="13" fill="#7d8590">Grounding picks the knowledge strategy. Pricing picks the cost shape. Safety picks the controls.</text><rect x="24" y="86" width="712" height="84" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="116" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Scenario: "Support answers from 10,000 product docs, cheap, safe, auditable."</text><text x="380" y="142" text-anchor="middle" font-size="12.5" fill="#7d8590">Run it through all three ladders. Each ladder answers one question.</text><rect x="24" y="196" width="224" height="180" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="136" y="230" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Grounding ladder</text><text x="136" y="260" text-anchor="middle" font-size="12" fill="#7d8590">Docs change: RAG with</text><text x="136" y="279" text-anchor="middle" font-size="12" fill="#7d8590">Knowledge Bases. Not</text><text x="136" y="298" text-anchor="middle" font-size="12" fill="#7d8590">fine-tuning.</text><rect x="268" y="196" width="224" height="180" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="380" y="230" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Inference pricing ladder</text><text x="380" y="260" text-anchor="middle" font-size="12" fill="#7d8590">Simple FAQ traffic: prompt</text><text x="380" y="279" text-anchor="middle" font-size="12" fill="#7d8590">router to cheap models.</text><rect x="512" y="196" width="224" height="180" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="624" y="230" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Safety control ladder</text><text x="624" y="260" text-anchor="middle" font-size="12" fill="#7d8590">Customer-facing:</text><text x="624" y="279" text-anchor="middle" font-size="12" fill="#7d8590">guardrails plus invocation</text><text x="624" y="298" text-anchor="middle" font-size="12" fill="#7d8590">logging.</text><text x="380" y="418" text-anchor="middle" font-size="13" fill="#7d8590">One scenario, three independent decisions. The exam composes them like this.</text></svg>