<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-label="Sampling parameters: set temperature or topP, not both; temperature zero is deterministic"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="470" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Sampling: pick one knob, not two</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Temperature reshapes the curve. topP trims the tail. Together they fight.</text><rect x="60" y="100" width="390" height="220" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="255" y="140" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">temperature</text><text x="255" y="172" text-anchor="middle" font-size="14" fill="#a8a8a8">0 = deterministic</text><text x="255" y="198" text-anchor="middle" font-size="14" fill="#a8a8a8">higher = more random</text><text x="255" y="240" text-anchor="middle" font-size="13" fill="#a8a8a8">Shapes the whole</text><text x="255" y="262" text-anchor="middle" font-size="13" fill="#a8a8a8">probability curve.</text><rect x="470" y="100" width="390" height="220" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="665" y="140" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">topP (nucleus)</text><text x="665" y="172" text-anchor="middle" font-size="14" fill="#a8a8a8">0.9 = top 90% of</text><text x="665" y="198" text-anchor="middle" font-size="14" fill="#a8a8a8">probability mass</text><text x="665" y="240" text-anchor="middle" font-size="13" fill="#a8a8a8">Cuts the long tail of</text><text x="665" y="262" text-anchor="middle" font-size="13" fill="#a8a8a8">unlikely tokens.</text><rect x="60" y="348" width="800" height="90" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="460" y="382" text-anchor="middle" font-size="15.5" fill="#ececec" font-weight="bold">Set temperature or topP. Never both.</text><text x="460" y="410" text-anchor="middle" font-size="13.5" fill="#a8a8a8">They interact, and the sampling behavior turns unpredictable.</text></svg>