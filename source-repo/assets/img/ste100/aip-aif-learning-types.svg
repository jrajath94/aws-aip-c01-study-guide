<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Decide the learning type: labeled data means supervised, unlabeled groups mean unsupervised, agent with rewards means reinforcement learning">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">LEARNING TYPES</text><rect x="270" y="50" width="180" height="54" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="360" y="72" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Labeled data?</text><text x="360" y="94" font-size="11.5" fill="#555555" text-anchor="middle">a target to predict?</text><line x1="270" y1="77" x2="170" y2="140" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><line x1="450" y1="77" x2="550" y2="140" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><text x="215" y="120" font-size="12" fill="#1f7a6d" text-anchor="middle" font-weight="700">yes</text><text x="505" y="120" font-size="12" fill="#b00020" text-anchor="middle" font-weight="700">no</text><rect x="60" y="140" width="220" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="170" y="172" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">SUPERVISED</text><text x="170" y="196" font-size="11.5" fill="#555555" text-anchor="middle">learns with an</text><text x="170" y="216" font-size="11.5" fill="#555555" text-anchor="middle">answer key</text><rect x="440" y="140" width="220" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="550" y="164" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">UNSUPERVISED</text><text x="550" y="188" font-size="11.5" fill="#555555" text-anchor="middle">find groups,</text><text x="550" y="208" font-size="11.5" fill="#555555" text-anchor="middle">or RL: agent,</text><text x="550" y="228" font-size="11.5" fill="#555555" text-anchor="middle">actions, rewards</text><text x="360" y="290" font-size="12" fill="#555555" text-anchor="middle">Match the stem: labels -> supervised; groups -> unsupervised; agent and rewards -> RL.</text></svg>