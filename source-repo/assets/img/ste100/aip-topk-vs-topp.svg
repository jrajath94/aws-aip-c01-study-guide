<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 474" role="img" aria-label="top_k versus top_p: top_k keeps the k most likely tokens, top_p keeps tokens covering probability mass p"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="474" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">TOP_K VERSUS TOP_P: TWO DIFFERENT KNOBS</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">top_k counts tokens. top_p sums probability mass.</text><rect x="24" y="80" width="340" height="260" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="194" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">top_k: shortlist size</text><text x="194" y="146" text-anchor="middle" font-size="12" fill="#555555">Keep only the k most likely next</text><text x="194" y="164" text-anchor="middle" font-size="12" fill="#555555">tokens, then sample among them.</text><text x="194" y="210" text-anchor="middle" font-size="12" fill="#555555">top_k = 50: the model chooses</text><text x="194" y="228" text-anchor="middle" font-size="12" fill="#555555">among its 50 best guesses.</text><text x="194" y="262" text-anchor="middle" font-size="12" fill="#555555">Small k: safe and dull. Large k:</text><text x="194" y="280" text-anchor="middle" font-size="12" fill="#555555">creative and risky.</text><rect x="384" y="80" width="340" height="260" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="554" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">top_p: probability mass</text><text x="554" y="146" text-anchor="middle" font-size="12" fill="#555555">Keep the smallest set of tokens</text><text x="554" y="164" text-anchor="middle" font-size="12" fill="#555555">whose probabilities sum to p,</text><text x="554" y="182" text-anchor="middle" font-size="12" fill="#555555">then sample.</text><text x="554" y="210" text-anchor="middle" font-size="12" fill="#555555">top_p = 0.9: the model chooses</text><text x="554" y="228" text-anchor="middle" font-size="12" fill="#555555">among tokens covering 90 percent</text><text x="554" y="246" text-anchor="middle" font-size="12" fill="#555555">of the mass.</text><text x="554" y="262" text-anchor="middle" font-size="12" fill="#555555">Adapts to the curve: few tokens</text><text x="554" y="280" text-anchor="middle" font-size="12" fill="#555555">when sure, many when unsure.</text><rect x="24" y="360" width="700" height="80" rx="8" fill="#fdf3d8" stroke="#b07d10" stroke-width="1.5"/><text x="374" y="390" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">The exam names both.</text><text x="374" y="414" text-anchor="middle" font-size="12" fill="#555555">top_k counts tokens. top_p sums probabilities. They are different</text><text x="374" y="432" text-anchor="middle" font-size="12" fill="#555555">knobs.</text></svg>