<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 370" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Worked example: token counts times price equals call cost">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Token economics: the one equation</text>
<rect x="60" y="80" width="880" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="500" y="115" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">One chat call: 2,000 input tokens + 500 output tokens</text><text x="500" y="150" text-anchor="middle" font-size="14" fill="#555555">price: $3.00 per 1M input tokens, $15.00 per 1M output tokens (example)</text><text x="500" y="195" text-anchor="middle" font-size="14" fill="#111111">input cost  = 2,000 / 1,000,000 x $3.00  = $0.0060</text><text x="500" y="230" text-anchor="middle" font-size="14" fill="#111111">output cost = 500 / 1,000,000 x $15.00 = $0.0075</text><text x="500" y="272" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">total per call = $0.0135  x  1M calls = $13,500 / month</text><text x="500" y="340" text-anchor="middle" font-size="13" fill="#555555">Two levers only: fewer tokens per call, or fewer calls. Everything in this chapter pulls one of them.</text></svg>
