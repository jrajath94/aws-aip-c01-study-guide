<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="The three drifts and the response ladder: detect the violation, alert, retrain through the pipeline, gate through the registry, deploy as a new variant">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="390" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">DRIFT: THE THREE KINDS AND THE RESPONSE</text>

<rect x="60" y="60" width="190" height="100" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.0" y="108.0" font-size="14" text-anchor="middle" font-weight="700">DATA DRIFT</text>
<text x="155.0" y="126.0" font-size="11" fill="#555555" text-anchor="middle">inputs changed</text>

<rect x="265" y="60" width="190" height="100" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="360.0" y="108.0" font-size="14" text-anchor="middle" font-weight="700">CONCEPT DRIFT</text>
<text x="360.0" y="126.0" font-size="11" fill="#555555" text-anchor="middle">meaning changed</text>

<rect x="470" y="60" width="190" height="100" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/>
<text x="565.0" y="108.0" font-size="14" text-anchor="middle" font-weight="700">BIAS DRIFT</text>
<text x="565.0" y="126.0" font-size="11" fill="#555555" text-anchor="middle">fairness changed</text>

<text x="360" y="200" font-size="12" text-anchor="middle" font-weight="700">Model Monitor: baseline, capture, compare, alarm</text>
<line x1="360" y1="212" x2="360" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="60" y="240" width="600" height="90" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="360.0" y="283.0" font-size="14" text-anchor="middle" font-weight="700">RESPONSE LADDER</text>
<text x="360.0" y="301.0" font-size="12" fill="#555555" text-anchor="middle">detect, alert, retrain, gate, deploy as new variant</text>

<text x="360" y="365" font-size="11.5" fill="#555555" text-anchor="middle">Model-quality monitoring needs ground truth merged with predictions; bias monitoring reuses Clarify.</text>
</svg>