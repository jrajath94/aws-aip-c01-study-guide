<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 464" role="img" aria-label="Neptune Database versus Neptune Analytics: the database serves transactional graph queries, Analytics serves bulk graph computation and vector search"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="464" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">NEPTUNE DATABASE VERSUS NEPTUNE ANALYTICS</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Same family, different jobs: transactions versus analytics.</text><rect x="24" y="80" width="340" height="250" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="194" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Neptune Database</text><text x="194" y="138" text-anchor="middle" font-size="12" fill="#555555">Transactional graph database</text><text x="194" y="170" text-anchor="middle" font-size="12" fill="#555555">Fast single-record reads and</text><text x="194" y="188" text-anchor="middle" font-size="12" fill="#555555">writes. The GraphRAG home from</text><text x="194" y="206" text-anchor="middle" font-size="12" fill="#555555">D1.</text><text x="194" y="234" text-anchor="middle" font-size="12" fill="#555555">Ask: "fetch this entity and its</text><text x="194" y="252" text-anchor="middle" font-size="12" fill="#555555">neighbors."</text><rect x="384" y="80" width="340" height="250" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="554" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Neptune Analytics</text><text x="554" y="138" text-anchor="middle" font-size="12" fill="#555555">Serverless graph-analytics engine</text><text x="554" y="170" text-anchor="middle" font-size="12" fill="#555555">Loads the graph into memory for</text><text x="554" y="188" text-anchor="middle" font-size="12" fill="#555555">bulk computation and vector</text><text x="554" y="206" text-anchor="middle" font-size="12" fill="#555555">similarity search.</text><text x="554" y="246" text-anchor="middle" font-size="12" fill="#555555">Ask: "find the 50 most similar</text><text x="554" y="264" text-anchor="middle" font-size="12" fill="#555555">incident reports."</text><rect x="24" y="350" width="700" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="374" y="380" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">Do not confuse them.</text><text x="374" y="404" text-anchor="middle" font-size="12" fill="#555555">Transactional questions go to the database. Analytical and</text><text x="374" y="422" text-anchor="middle" font-size="12" fill="#555555">similarity questions go to Analytics.</text></svg>