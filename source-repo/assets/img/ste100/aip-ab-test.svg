<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 430" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="A/B test: split traffic between current and new prompt, compare one metric">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">A/B testing prompts</text>
<rect x="120" y="90" width="300" height="120" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="270" y="142" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">A: current prompt</text><text x="270" y="168" text-anchor="middle" font-size="13" fill="#111111">50% of traffic</text><rect x="580" y="90" width="300" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="730" y="142" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">B: new prompt</text><text x="730" y="168" text-anchor="middle" font-size="13" fill="#111111">50% of traffic</text><line x1="270" y1="210" x2="270" y2="250" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><line x1="730" y1="210" x2="730" y2="250" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="300" y="250" width="400" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="500" y="284" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Compare metric</text><text x="500" y="310" text-anchor="middle" font-size="12" fill="#111111">same metric,</text><text x="500" y="336" text-anchor="middle" font-size="12" fill="#111111">same time window</text><text x="500" y="400" text-anchor="middle" font-size="13" fill="#555555">Change ONE thing per test. Two changes and you will never know which one worked.</text></svg>
