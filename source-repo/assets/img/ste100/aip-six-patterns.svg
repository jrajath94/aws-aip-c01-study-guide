<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 380" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="The six question patterns: constraint extraction, most correct, ordering, vocabulary precision, managed-first ladder, wrong-plane distractors">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The 6 question patterns AWS reuses</text>
<rect x="40" y="70" width="340" height="130" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="210" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">1. Constraint extraction</text>
<text x="210" y="118" text-anchor="middle" font-size="13" fill="#555555">find 2-4 hard constraints</text>
<text x="210" y="140" text-anchor="middle" font-size="13" fill="#555555">eliminate violators</text>
<rect x="410" y="70" width="340" height="130" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="580" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">2. Most correct</text>
<text x="580" y="118" text-anchor="middle" font-size="13" fill="#555555">two options work:</text>
<text x="580" y="140" text-anchor="middle" font-size="13" fill="#555555">tiebreakers decide</text>
<rect x="780" y="70" width="340" height="130" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="950" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">3. Ordering</text>
<text x="950" y="118" text-anchor="middle" font-size="13" fill="#555555">anchor first and last</text>
<text x="950" y="140" text-anchor="middle" font-size="13" fill="#555555">lifecycle dependencies</text>
<rect x="40" y="220" width="340" height="130" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="210" y="246" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">4. Vocabulary precision</text>
<text x="210" y="268" text-anchor="middle" font-size="13" fill="#555555">one precise term decides</text>
<text x="210" y="290" text-anchor="middle" font-size="13" fill="#555555">5 terms to know cold</text>
<rect x="410" y="220" width="340" height="130" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="580" y="246" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">5. Managed-first ladder</text>
<text x="580" y="268" text-anchor="middle" font-size="13" fill="#555555">climb until the need is met</text>
<text x="580" y="290" text-anchor="middle" font-size="13" fill="#555555">stop at the cheapest rung</text>
<rect x="780" y="220" width="340" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="950" y="246" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">6. Wrong-plane distractors</text>
<text x="950" y="268" text-anchor="middle" font-size="13" fill="#555555">right service, wrong job</text>
<text x="950" y="290" text-anchor="middle" font-size="13" fill="#555555">ask what the job really is</text>
</svg>
