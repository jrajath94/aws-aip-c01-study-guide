<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Guardrails: input filter, model, output filter">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="480" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Guardrails layers</text><rect x="64" y="120" width="208" height="104" rx="12" fill="#F3D4D8" stroke="#1E4D8C" stroke-width="1.5"/><text x="168" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Input filter</text><text x="168" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">block bad prompts</text><rect x="336" y="120" width="208" height="104" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="440" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Model</text><text x="440" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">generates</text><rect x="608" y="120" width="208" height="104" rx="12" fill="#F3D4D8" stroke="#C46B2C" stroke-width="1.5"/><text x="712" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Output filter</text><text x="712" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">block bad answers</text><line x1="272" y1="172" x2="328" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="300" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">check</text><line x1="544" y1="172" x2="600" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="572" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">check</text><text x="480" y="300" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Denied topics, word filters, PII filters, grounding checks.</text><text x="480" y="328" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Instructions are not access control. Use IAM for isolation.</text></svg>