<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img" aria-label="Retrieval upgrades: hybrid search combines keyword and vector matching, a reranker re-scores the top chunks with a stronger model"><rect x="0" y="0" width="760" height="460" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The two retrieval upgrades: hybrid search plus reranker</text><text x="24" y="58" font-size="13" fill="#7d8590">Both are managed Bedrock features. The "least custom effort" answer.</text><rect x="24" y="90" width="712" height="90" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="122" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Basic RAG works, but retrieval quality is too low.</text><text x="380" y="148" text-anchor="middle" font-size="12.5" fill="#7d8590">Before exotic fixes, use the two managed upgrades.</text><line x1="280" y1="180" x2="220" y2="214" stroke="#7d8590" stroke-width="2.2"/><polygon points="220,214 211.7,219.6 211.7,208.4" fill="#7d8590"/><line x1="480" y1="180" x2="540" y2="214" stroke="#7d8590" stroke-width="2.2"/><polygon points="540,214 531.7,219.6 531.7,208.4" fill="#7d8590"/><rect x="40" y="214" width="320" height="170" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="200" y="248" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Hybrid search</text><text x="200" y="278" text-anchor="middle" font-size="12.5" fill="#7d8590">Keyword (BM25) plus vector</text><text x="200" y="297" text-anchor="middle" font-size="12.5" fill="#7d8590">similarity. Exact terms and</text><text x="200" y="316" text-anchor="middle" font-size="12.5" fill="#7d8590">meaning both count.</text><text x="200" y="336" text-anchor="middle" font-size="12" fill="#7d8590">Catches the exact part numbers</text><text x="200" y="355" text-anchor="middle" font-size="12" fill="#7d8590">pure vectors miss.</text><rect x="400" y="214" width="320" height="170" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="560" y="248" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Reranker</text><text x="560" y="278" text-anchor="middle" font-size="12.5" fill="#7d8590">Cohere Rerank re-scores the top</text><text x="560" y="297" text-anchor="middle" font-size="12.5" fill="#7d8590">chunks with a stronger model and</text><text x="560" y="316" text-anchor="middle" font-size="12.5" fill="#7d8590">keeps the best.</text><text x="560" y="336" text-anchor="middle" font-size="12" fill="#7d8590">Precision on the shortlist,</text><text x="560" y="355" text-anchor="middle" font-size="12" fill="#7d8590">cheap because the list is short.</text><text x="380" y="426" text-anchor="middle" font-size="13" fill="#7d8590">Together: the exam's answer to "retrieval quality is too low and we did the basics."</text></svg>