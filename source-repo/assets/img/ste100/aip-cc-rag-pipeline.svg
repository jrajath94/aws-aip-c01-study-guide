<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="RAG pipeline: chunk and embed offline, retrieve and generate at query time">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="480" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">RAG pipeline</text><rect x="32" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="1.5"/><text x="128" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Documents</text><text x="128" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">in S3</text><rect x="264" y="120" width="192" height="104" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="360" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Chunk and embed</text><text x="360" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">offline</text><rect x="496" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="592" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Vector store</text><text x="592" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">indexed</text><rect x="728" y="120" width="192" height="104" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="824" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Retrieve</text><text x="824" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">then generate</text><line x1="224" y1="172" x2="256" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="240" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">split</text><line x1="456" y1="172" x2="488" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="472" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">index</text><line x1="688" y1="172" x2="720" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="704" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">query</text><text x="480" y="300" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Use RAG for private or fresh knowledge.</text><text x="480" y="328" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Fine-tuning cannot cite sources. Never use it for knowledge.</text></svg>