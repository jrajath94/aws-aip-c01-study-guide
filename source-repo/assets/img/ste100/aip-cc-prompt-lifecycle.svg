<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Prompt lifecycle: draft, version, test variant, deploy by version ARN">
