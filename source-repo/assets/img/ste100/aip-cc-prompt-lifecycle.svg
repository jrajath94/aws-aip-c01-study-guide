<text x="480" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Prompt lifecycle</text><rect x="32" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="1.5"/><text x="128" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Draft</text><text x="128" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">write it</text><rect x="264" y="120" width="192" height="104" rx="12" fill="#E7F1F8" stroke="#C46B2C" stroke-width="1.5"/><text x="360" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Version</text><text x="360" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">immutable</text><rect x="496" y="120" width="192" height="104" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="592" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Test variant</text><text x="592" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">A/B test</text><rect x="728" y="120" width="192" height="104" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="824" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Deploy</text><text x="824" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">by version ARN</text><line x1="224" y1="172" x2="256" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="240" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">save</text><line x1="456" y1="172" x2="488" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="472" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">compare</text><line x1="688" y1="172" x2="720" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="704" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">point</text><text x="480" y="300" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Versions are immutable. Rollback is a pointer change.</text><text x="480" y="328" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">No code deploy needed for a prompt change.</text></svg>