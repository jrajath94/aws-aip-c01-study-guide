<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 470" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="PoC-first lifecycle: three questions, then the lens, then reuse">
<title>PoC-first lifecycle: three questions, then the lens, then reuse</title>
<desc>Four boxes left to right. Box 1: build a small proof of concept on Bedrock, on-demand, no infrastructure. Box 2: the PoC answers three questions: does it work, is it fast enough, is it worth it? Box 3: review the design against the GenAI Lens, the Well-Architected checklist for GenAI. Box 4: extract reusable components, such as prompt templates, routing layers, guardrail policies, and eval harnesses. A footer warns that committing to Provisioned Throughput or custom models before the PoC passes burns money.</desc>
<defs><marker id="aip-poc-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">POc-FIRST: PROVE IT SMALL BEFORE YOU COMMIT</text>
<rect x="30" y="70" width="200" height="140" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="130.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. build a PoC</text>
<text x="130.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">throwaway build on Bedrock</text>
<text x="130.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">on-demand, no infra</text>
<line x1="230" y1="140" x2="245" y2="140" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-poc-ah)"/>
<rect x="245" y="70" width="200" height="140" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="345.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. answer three</text>
<text x="345.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">does it work?</text>
<text x="345.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">fast enough? worth it?</text>
<line x1="445" y1="140" x2="460" y2="140" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-poc-ah)"/>
<rect x="460" y="70" width="200" height="140" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="560.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. GenAI Lens review</text>
<text x="560.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">Well-Architected checklist</text>
<text x="560.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">shared, not opinion</text>
<line x1="660" y1="140" x2="675" y2="140" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-poc-ah)"/>
<rect x="675" y="70" width="200" height="140" rx="8" fill="#efeafd" stroke="#6a4fd6" stroke-width="1.5"/>
<text x="775.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. extract reuse</text>
<text x="775.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">prompt templates, routing</text>
<text x="775.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">guardrails, eval harness</text>
<rect x="30" y="260" width="830" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="445.0" y="292" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Then go to production</text>
<text x="445.0" y="314" text-anchor="middle" font-size="12.5" fill="#555555">the second project reuses the parts, so it costs less than the first</text>
<text x="30" y="392" font-size="13" fill="#111111">Failure mode: committing to Provisioned Throughput or custom models before the PoC answers the three questions.</text>
<text x="30" y="414" font-size="12" fill="#555555">The GenAI Lens exists so design reviews follow a checklist across responsible AI, data, cost, and security.</text>
</svg>