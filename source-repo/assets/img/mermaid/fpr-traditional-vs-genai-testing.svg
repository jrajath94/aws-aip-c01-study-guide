<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Traditional testing versus generative AI testing">
  <style>
    .t { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif}
    .title { font-size: 20px; font-weight: 700; fill: #1a1a1a}
    .lbl { font-size: 15px; fill: #1a1a1a}
    .sub { font-size: 13px; fill: #555555}
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2}
    .boxAmber { fill: #fdf6e3; stroke: #b8860b; stroke-width: 2}
    .boxGreen { fill: #eef7ee; stroke: #2e7d32; stroke-width: 2}
    .arrow { stroke: #1a1a1a; stroke-width: 2; fill: none; marker-end: url(#ah)}
    .big { font-size: 44px}
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- Left panel: traditional test -->
  <text x="30" y="40" class="t title">Traditional test: one right answer</text>
  <rect x="30" y="70" width="150" height="64" rx="10" class="box"/>
  <text x="105" y="98" text-anchor="middle" class="t lbl">input</text>
  <text x="105" y="118" text-anchor="middle" class="t sub">cart items</text>
  <rect x="230" y="70" width="150" height="64" rx="10" class="boxAmber"/>
  <text x="305" y="98" text-anchor="middle" class="t lbl">function</text>
  <text x="305" y="118" text-anchor="middle" class="t sub">deterministic</text>
  <rect x="430" y="70" width="150" height="64" rx="10" class="box"/>
  <text x="505" y="98" text-anchor="middle" class="t lbl">output</text>
  <text x="505" y="118" text-anchor="middle" class="t sub">$42.50</text>
  <rect x="630" y="70" width="150" height="64" rx="10" class="boxGreen"/>
  <text x="705" y="98" text-anchor="middle" class="t lbl">assert</text>
  <text x="705" y="118" text-anchor="middle" class="t sub">output == 42.50</text>
  <line x1="180" y1="102" x2="226" y2="102" class="arrow"/>
  <line x1="380" y1="102" x2="426" y2="102" class="arrow"/>
  <line x1="580" y1="102" x2="626" y2="102" class="arrow"/>
  <text x="30" y="175" class="t sub">Same input always gives the same output, so the test can demand</text>
  <text x="30" y="195" class="t sub">an exact match. Any difference is a bug. Pass or fail.</text>
  <path d="M640,160 l12,12 l22,-24" stroke="#2e7d32" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="690" y="172" class="t lbl" fill="#2e7d32">PASS</text>

  <line x1="30" y1="225" x2="930" y2="225" stroke="#cccccc" stroke-width="1"/>

  <!-- Right panel: generative test -->
  <text x="30" y="262" class="t title">Generative test: many valid answers</text>
  <rect x="30" y="292" width="120" height="64" rx="10" class="box"/>
  <text x="90" y="320" text-anchor="middle" class="t lbl">prompt</text>
  <text x="90" y="340" text-anchor="middle" class="t sub">summarize this</text>
  <rect x="190" y="292" width="130" height="64" rx="10" class="boxAmber"/>
  <text x="255" y="320" text-anchor="middle" class="t lbl">model</text>
  <text x="255" y="340" text-anchor="middle" class="t sub">samples wording</text>
  <line x1="150" y1="324" x2="186" y2="324" class="arrow"/>
  <line x1="320" y1="308" x2="366" y2="308" class="arrow"/>
  <line x1="320" y1="324" x2="366" y2="324" class="arrow"/>
  <line x1="320" y1="340" x2="366" y2="340" class="arrow"/>
  <rect x="370" y="288" width="170" height="26" rx="8" class="box"/>
  <text x="455" y="306" text-anchor="middle" class="t sub">valid summary, wording A</text>
  <rect x="370" y="318" width="170" height="26" rx="8" class="box"/>
  <text x="455" y="336" text-anchor="middle" class="t sub">valid summary, wording B</text>
  <rect x="370" y="348" width="170" height="26" rx="8" class="box"/>
  <text x="455" y="366" text-anchor="middle" class="t sub">valid summary, wording C</text>
  <line x1="540" y1="331" x2="586" y2="331" class="arrow"/>
  <rect x="590" y="292" width="170" height="64" rx="10" class="boxGreen"/>
  <text x="675" y="320" text-anchor="middle" class="t lbl">score, not assert</text>
  <text x="675" y="340" text-anchor="middle" class="t sub">vs rubric / reference</text>
  <line x1="760" y1="331" x2="806" y2="331" class="arrow"/>
  <rect x="810" y="292" width="120" height="64" rx="10" class="box"/>
  <text x="870" y="320" text-anchor="middle" class="t lbl">0.87</text>
  <text x="870" y="340" text-anchor="middle" class="t sub">quality score</text>
  <text x="30" y="402" class="t sub">Exact-match assertions fail good answers. Testing becomes measurement:</text>
  <text x="30" y="422" class="t sub">run many prompts, score each output, ship when the pattern is good enough.</text>
</svg>
