<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 470" role="img" aria-label="The six question patterns checklist">
<style>
.pbg{fill:#0b0e14}
.pb{fill:#151b26;stroke:#2b3a4d;stroke-width:1.5}
.pn{fill:#6aa6ff;font:700 19px sans-serif}
.pt{fill:#e6edf3;font:700 16px sans-serif}
.ps{fill:#9fb3cc;font:400 13px sans-serif}
.ph{fill:#e6edf3;font:700 22px sans-serif}
</style>
<rect class="pbg" width="680" height="470" rx="8"/>
<text class="ph" x="32" y="44">Six patterns, one checklist</text>
<text class="ps" x="32" y="68">Run every stem through all six before you pick an option.</text>
<g>
<rect class="pb" x="32" y="92" width="308" height="100" rx="8"/><text class="pn" x="52" y="122">1</text><text class="pt" x="52" y="146">Constraint extraction</text><text class="ps" x="52" y="168">Underline every constraint. One</text><text class="ps" x="52" y="186">violation kills the option.</text>
<rect class="pb" x="360" y="92" width="288" height="100" rx="8"/><text class="pn" x="380" y="122">2</text><text class="pt" x="380" y="146">MOST correct</text><text class="ps" x="380" y="168">Managed, cheaper, simpler,</text><text class="ps" x="380" y="186">AWS-native wins ties.</text>
<rect class="pb" x="32" y="208" width="308" height="100" rx="8"/><text class="pn" x="52" y="238">3</text><text class="pt" x="52" y="262">Ordering and lifecycle</text><text class="ps" x="52" y="284">Configure, prepare, test. Never</text><text class="ps" x="52" y="302">invert a dependency.</text>
<rect class="pb" x="360" y="208" width="288" height="100" rx="8"/><text class="pn" x="380" y="238">4</text><text class="pt" x="380" y="262">Vocabulary precision</text><text class="ps" x="380" y="284">One precise term decides:</text><text class="ps" x="380" y="302">profiles, routers, PT, gates.</text>
<rect class="pb" x="32" y="324" width="308" height="100" rx="8"/><text class="pn" x="52" y="354">5</text><text class="pt" x="52" y="378">Managed-first ladder</text><text class="ps" x="52" y="400">Prompt, RAG, agents, fine-tuning.</text><text class="ps" x="52" y="418">Stop at the cheapest rung.</text>
<rect class="pb" x="360" y="324" width="288" height="100" rx="8"/><text class="pn" x="380" y="354">6</text><text class="pt" x="380" y="378">Wrong-plane distractors</text><text class="ps" x="380" y="400">Ask: is this service's job</text><text class="ps" x="380" y="418">the stem's job?</text>
</g>
<text class="ps" x="32" y="452">Patterns 1 and 6 catch the most traps; pattern 4 decides the close calls.</text>
</svg>
