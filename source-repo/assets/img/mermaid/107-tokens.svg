<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Tokenization: the sentence The refund window is 30 days split into seven token chips">
  <style>
    .chip { fill: #eef4f1; stroke: #2a9d8f; stroke-width: 1.5; rx: 8}
    .t { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif; font-size: 19px; fill: #2b2b2b}
    .n { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif; font-size: 13px; fill: #6b6558}
    .note { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif; font-size: 16px; fill: #4a453a}
  </style>
  <text class="note" x="30" y="38">The sentence your user typed:</text>
  <text class="t" x="30" y="66" font-style="italic">The refund window is 30 days.</text>
  <text class="note" x="30" y="112">What the model actually sees: 7 tokens</text>
  <g>
    <rect class="chip" x="30"  y="128" width="58"  height="44" rx="8"/><text class="t" x="59"  y="157" text-anchor="middle">The</text>
    <rect class="chip" x="96"  y="128" width="96"  height="44" rx="8"/><text class="t" x="144" y="157" text-anchor="middle">&#9251;refund</text>
    <rect class="chip" x="200" y="128" width="102" height="44" rx="8"/><text class="t" x="251" y="157" text-anchor="middle">&#9251;window</text>
    <rect class="chip" x="310" y="128" width="52"  height="44" rx="8"/><text class="t" x="336" y="157" text-anchor="middle">&#9251;is</text>
    <rect class="chip" x="370" y="128" width="56"  height="44" rx="8"/><text class="t" x="398" y="157" text-anchor="middle">&#9251;30</text>
    <rect class="chip" x="434" y="128" width="76"  height="44" rx="8"/><text class="t" x="472" y="157" text-anchor="middle">&#9251;days</text>
    <rect class="chip" x="518" y="128" width="40"  height="44" rx="8"/><text class="t" x="538" y="157" text-anchor="middle">.</text>
  </g>
  <text class="n" x="30" y="196">&#9251; marks a leading space: tokens are character chunks, not words. Roughly 1 token &#8776; &#190; of an English word.</text>
  <text class="n" x="30" y="220">Tokens are the billing unit: you pay per thousand tokens in and per thousand tokens out.</text>
</svg>
