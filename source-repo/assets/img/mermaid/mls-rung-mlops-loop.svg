<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 420" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="MLOps: automated retraining with a human gate">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The conveyor belt: retrain, re-evaluate, redeploy, with a human gate</text>
<rect x="30" y="70" width="190" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="125" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">new data lands in S3</text>
<path d="M220,130 L256,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="256" y="70" width="190" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="351" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">EventBridge / S3 event</text>
<text x="351" y="132" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">triggers pipeline</text>
<path d="M446,130 L482,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="482" y="70" width="190" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="577" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Pipeline: process, train,</text>
<text x="577" y="132" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">evaluate, register</text>
<text x="577" y="168" text-anchor="middle" font-size="14" fill="#555555">challenger = PendingManualApproval</text>
<path d="M672,130 L708,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="708" y="70" width="190" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="803" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">human approves</text>
<text x="803" y="168" text-anchor="middle" font-size="14" fill="#555555">Model Registry gate</text>
<path d="M898,130 L934,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="934" y="70" width="190" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1029" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">deploy as new variant</text>
<text x="1029" y="168" text-anchor="middle" font-size="14" fill="#555555">shift traffic weights</text>
<rect x="30" y="240" width="1090" height="130" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="270" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Model Monitor watches the deployed endpoint</text>
<text x="575" y="296" text-anchor="middle" font-size="14" fill="#555555">drift violation -> CloudWatch alarm -> Lambda starts the pipeline -> the loop runs again</text>
<text x="575" y="322" text-anchor="middle" font-size="14" fill="#555555">lineage tracking records every link: which data, which code, which run, which approval built the model now serving</text>
<text x="575" y="350" text-anchor="middle" font-size="14" fill="#555555">PendingManualApproval means exactly that: nothing deploys itself</text>
</svg>
