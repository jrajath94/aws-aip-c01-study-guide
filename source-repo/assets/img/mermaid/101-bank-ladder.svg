<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 300" role="img" aria-label="Study path through the question bank">
<style>
.bbg{fill:#0b0e14}
.bb{fill:#151b26;stroke:#2b3a4d;stroke-width:1.5}
.bn{fill:#6aa6ff;font:700 18px sans-serif}
.bt{fill:#e6edf3;font:700 15px sans-serif}
.bs{fill:#9fb3cc;font:400 12.5px sans-serif}
.bh{fill:#e6edf3;font:700 20px sans-serif}
.bar{stroke:#2b3a4d;stroke-width:2}
.barr{stroke:#6aa6ff;stroke-width:2;fill:none}
</style>
<rect class="bbg" width="680" height="300" rx="8"/>
<text class="bh" x="32" y="40">How to climb this bank</text>
<g>
<rect class="bb" x="32" y="60" width="140" height="150" rx="8"/><text class="bn" x="52" y="92">1</text><text class="bt" x="52" y="114">Main bank</text><text class="bs" x="52" y="136">Q1 to Q140</text><text class="bs" x="52" y="154">Easy to hard</text><text class="bs" x="52" y="172">inside each domain.</text>
<rect class="bb" x="188" y="60" width="140" height="150" rx="8"/><text class="bn" x="208" y="92">2</text><text class="bt" x="208" y="114">Bonus set</text><text class="bs" x="208" y="136">52 questions at</text><text class="bs" x="208" y="154">professional bar,</text><text class="bs" x="208" y="172">per domain.</text>
<rect class="bb" x="344" y="60" width="140" height="150" rx="8"/><text class="bn" x="364" y="92">3</text><text class="bt" x="364" y="114">Field research</text><text class="bs" x="364" y="136">8 adversarial</text><text class="bs" x="364" y="154">questions from</text><text class="bs" x="364" y="172">real exam reports.</text>
<rect class="bb" x="500" y="60" width="148" height="150" rx="8"/><text class="bn" x="520" y="92">4</text><text class="bt" x="520" y="114">Mock exam</text><text class="bs" x="520" y="136">65 questions,</text><text class="bs" x="520" y="154">120 minutes,</text><text class="bs" x="520" y="172">one sitting.</text>
</g>
<line class="barr" x1="172" y1="135" x2="188" y2="135"/><polygon points="188,135 180,130 180,140" fill="#6aa6ff"/>
<line class="barr" x1="328" y1="135" x2="344" y2="135"/><polygon points="344,135 336,130 336,140" fill="#6aa6ff"/>
<line class="barr" x1="484" y1="135" x2="500" y2="135"/><polygon points="500,135 492,130 492,140" fill="#6aa6ff"/>
<text class="bs" x="32" y="245">Rule: do each knowledge check before moving on. A wrong answer means</text>
<text class="bs" x="32" y="265">re-read the section it points to, not just the explanation.</text>
</svg>
