<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.3 Prompt engineering techniques</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Named techniques the exam expects you to recognize on sight.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Few-shot</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Show the model 2-5 input-</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">output examples in the</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">prompt. Format compliance</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">without training.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Chain-of-thought</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Ask for step-by-step</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">reasoning before the</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">answer. Bigger accuracy</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">lift than a bigger model,</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">for free.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">System prompt</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">The persistent instruction</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">prefix: role, rules,</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">output format. Cached when</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">it repeats.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Pattern: when a stem asks for better answers with no training and no new infrastructure, the</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">answer is a prompting technique, not a new model.</text>
</svg>