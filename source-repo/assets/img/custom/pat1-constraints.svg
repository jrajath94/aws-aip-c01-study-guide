<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="640" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Pattern 1: Constraint extraction</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The correct answer is the only option that satisfies ALL constraints.</text>
<rect x="140.0" y="84" width="480" height="88" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="144.0" cy="86" r="15" fill="#22d3ee"/>
<text x="144.0" y="91.5" font-size="14" fill="#0b0e12" text-anchor="middle" font-weight="bold">1</text>
<text x="380" y="110" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Read the stem</text>
<text x="380" y="130" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Do not look at the options yet.</text>
<line x1="380" y1="172" x2="380" y2="194" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,194.0 374.4,185.7 385.6,185.7" fill="#7d8590"/>
<rect x="140.0" y="198" width="480" height="88" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<circle cx="144.0" cy="200" r="15" fill="#f0b429"/>
<text x="144.0" y="205.5" font-size="14" fill="#0b0e12" text-anchor="middle" font-weight="bold">2</text>
<text x="380" y="224" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Underline 2-4 hard constraints</text>
<text x="380" y="244" font-size="12.5" fill="#a8a8a8" text-anchor="middle">cost, latency, no ML team, no redeploy, region lock</text>
<line x1="380" y1="286" x2="380" y2="308" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,308.0 374.4,299.7 385.6,299.7" fill="#7d8590"/>
<rect x="140.0" y="312" width="480" height="88" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/>
<circle cx="144.0" cy="314" r="15" fill="#60a5fa"/>
<text x="144.0" y="319.5" font-size="14" fill="#0b0e12" text-anchor="middle" font-weight="bold">3</text>
<text x="380" y="338" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Read the options</text>
<text x="380" y="358" font-size="12.5" fill="#a8a8a8" text-anchor="middle">One at a time, against the constraint list.</text>
<line x1="380" y1="400" x2="380" y2="422" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,422.0 374.4,413.7 385.6,413.7" fill="#7d8590"/>
<rect x="140.0" y="426" width="480" height="88" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<circle cx="144.0" cy="428" r="15" fill="#f87171"/>
<text x="144.0" y="433.5" font-size="14" fill="#0b0e12" text-anchor="middle" font-weight="bold">4</text>
<text x="380" y="452" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Eliminate violators</text>
<text x="380" y="472" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Any option that violates even ONE constraint is out, no</text>
<text x="380" y="489" font-size="12.5" fill="#a8a8a8" text-anchor="middle">matter how sophisticated it sounds.</text>
<line x1="380" y1="514" x2="380" y2="536" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,536.0 374.4,527.7 385.6,527.7" fill="#7d8590"/>
<rect x="140.0" y="540" width="480" height="88" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<circle cx="144.0" cy="542" r="15" fill="#4ade80"/>
<text x="144.0" y="547.5" font-size="14" fill="#0b0e12" text-anchor="middle" font-weight="bold">5</text>
<text x="380" y="566" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Pick the survivor</text>
<text x="380" y="586" font-size="12.5" fill="#a8a8a8" text-anchor="middle">What remains is the answer. If two survive, Pattern 2</text>
<text x="380" y="603" font-size="12.5" fill="#a8a8a8" text-anchor="middle">decides.</text>
</svg>