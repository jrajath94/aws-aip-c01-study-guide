<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The timeout chain: who gives up first</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The innermost timeout must expire first. Outer layers only observe the failure.</text>
<rect x="24" y="84" width="712" height="74" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="116" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Client</text>
<text x="44" y="138" font-size="12" fill="#7d8590" text-anchor="start">shortest</text>
<rect x="84" y="170" width="592" height="74" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="104" y="202" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">API Gateway (29s)</text>
<text x="104" y="224" font-size="12" fill="#7d8590" text-anchor="start">29s cap</text>
<rect x="144" y="256" width="472" height="74" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="164" y="288" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Lambda (up to 15 min)</text>
<text x="164" y="310" font-size="12" fill="#7d8590" text-anchor="start">the workhorse window</text>
<rect x="204" y="342" width="352" height="74" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="224" y="374" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Model call</text>
<text x="224" y="396" font-size="12" fill="#7d8590" text-anchor="start">longest: give it room</text>
<rect x="24" y="438" width="712" height="76" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="468" font-size="13" fill="#ececec" text-anchor="start">Retry rule: only retry idempotent calls, and back off with jitter so retries do not stampede the service.</text>
</svg>