<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Auth plus model switching: the runtime trio</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Identity at the door, config for the model, no redeploys anywhere.</text>
<rect x="24" y="84" width="712" height="100" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="118" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Cognito</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Authenticates users; hands the app short-lived tokens. The front door.</text>
<rect x="24" y="198" width="712" height="100" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="232" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">API Gateway authorizer</text>
<text x="44" y="256" font-size="12.5" fill="#a8a8a8" text-anchor="start">Checks the token on every request before the Lambda runs. No token, no invocation.</text>
<rect x="24" y="312" width="712" height="100" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="346" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">AppConfig</text>
<text x="44" y="370" font-size="12.5" fill="#a8a8a8" text-anchor="start">Holds the model id as runtime config. Ops flips a flag; the Lambda reads it; no deployment</text>
<text x="44" y="387" font-size="12.5" fill="#a8a8a8" text-anchor="start">happens.</text>
<rect x="24" y="432" width="712" height="64" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="464" font-size="13" fill="#f87171" text-anchor="start">The exam's favorite wrong answer here is CloudFormation: its changes ARE deployments.</text>
</svg>