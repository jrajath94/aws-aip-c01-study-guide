<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Three caches, three different jobs</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Cache questions are really 'which layer holds this?' questions.</text>
<rect x="24" y="84" width="712" height="100" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="118" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Prompt caching</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">The model provider caches the static prefix of your prompt: system prompt, long documents.</text>
<text x="44" y="159" font-size="12.5" fill="#a8a8a8" text-anchor="start">You pay less for repeated context.</text>
<rect x="24" y="198" width="712" height="100" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="232" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Semantic caching</text>
<text x="44" y="256" font-size="12.5" fill="#a8a8a8" text-anchor="start">Your app caches answers to similar questions: 'what are your hours?' asked ten ways returns</text>
<text x="44" y="273" font-size="12.5" fill="#a8a8a8" text-anchor="start">one stored answer. Vector similarity decides the hit.</text>
<rect x="24" y="312" width="712" height="100" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="346" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Response caching</text>
<text x="44" y="370" font-size="12.5" fill="#a8a8a8" text-anchor="start">Exact request in, exact response out. API Gateway or CloudFront: the fastest layer, but only</text>
<text x="44" y="387" font-size="12.5" fill="#a8a8a8" text-anchor="start">for identical repeats.</text>
<rect x="24" y="432" width="712" height="64" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380" y="472" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">Trap: caching personalized or PII answers leaks one user's data to another. Never cache those.</text>
</svg>