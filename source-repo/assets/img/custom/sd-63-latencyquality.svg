<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Latency vs quality: which lever moves which</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Every performance question is this tradeoff wearing a costume.</text>
<rect x="24" y="84" width="348" height="240" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Faster responses</text>
<path d="M50.0,138 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="150" font-size="13" fill="#a8a8a8" text-anchor="start">smaller model</text>
<path d="M50.0,168 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="180" font-size="13" fill="#a8a8a8" text-anchor="start">streaming (perceived)</text>
<path d="M50.0,198 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="210" font-size="13" fill="#a8a8a8" text-anchor="start">prompt caching</text>
<path d="M50.0,228 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="240" font-size="13" fill="#a8a8a8" text-anchor="start">shorter max tokens</text>
<path d="M50.0,258 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="270" font-size="13" fill="#a8a8a8" text-anchor="start">Provisioned Throughput</text>
<rect x="388" y="84" width="348" height="240" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Better answers</text>
<path d="M414.0,138 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="150" font-size="13" fill="#a8a8a8" text-anchor="start">bigger model</text>
<path d="M414.0,168 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="180" font-size="13" fill="#a8a8a8" text-anchor="start">RAG grounding</text>
<path d="M414.0,198 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="210" font-size="13" fill="#a8a8a8" text-anchor="start">reranking</text>
<path d="M414.0,228 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="240" font-size="13" fill="#a8a8a8" text-anchor="start">longer reasoning</text>
<path d="M414.0,258 l4.8,5.2 l9.2,-10.4" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="440" y="270" font-size="13" fill="#a8a8a8" text-anchor="start">better chunking</text>
<rect x="24" y="348" width="712" height="96" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="376" font-size="12.5" fill="#a8a8a8" text-anchor="start">The exam move: name the constraint first (latency SLA? quality bar? budget?), then pick the</text>
<text x="44" y="394" font-size="12.5" fill="#a8a8a8" text-anchor="start">lever that moves that needle without breaking the other.</text>
</svg>