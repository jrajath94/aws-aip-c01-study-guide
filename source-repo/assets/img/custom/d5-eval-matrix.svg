<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="700" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The evaluation matrix: four methods, four jobs</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Task 5.1 backbone. Exam scenarios are this table in costume.</text>
<rect x="24" y="76" width="712" height="118" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="40" y="106" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Automatic (programmatic)</text>
<circle cx="706" cy="104" r="4" fill="#f0b429"/>
<text x="40" y="132" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: Accuracy, stability, toxicity against ground truth labels</text>
<text x="40" y="150" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: objective, repeatable benchmarks; the cheapest first layer</text>
<rect x="24" y="208" width="712" height="130" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="40" y="238" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">LLM-as-a-judge</text>
<circle cx="706" cy="236" r="4" fill="#22d3ee"/>
<text x="40" y="264" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: Correctness, completeness, faithfulness, harmfulness, refusal, style</text>
<text x="40" y="282" font-size="12.5" fill="#a8a8a8" text-anchor="start">and tone; custom metrics definable</text>
<text x="40" y="300" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: human-like quality judgment at scale; RAG eval and agent eval</text>
<rect x="24" y="352" width="712" height="130" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="40" y="382" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Human evaluation</text>
<circle cx="706" cy="380" r="4" fill="#4ade80"/>
<text x="40" y="408" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: Relevance, style, brand voice, anything custom</text>
<text x="40" y="426" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: subjective judgment; your team or an AWS-managed team; spot</text>
<text x="40" y="444" font-size="12.5" fill="#a8a8a8" text-anchor="start">checks and sign-off</text>
<rect x="24" y="496" width="712" height="118" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="40" y="526" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Bring-your-own-inference (BYOI)</text>
<circle cx="706" cy="524" r="4" fill="#a78bfa"/>
<text x="40" y="552" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: Same metrics, applied to responses you generated yourself</text>
<text x="40" y="570" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: evaluating a non-Bedrock model or a full app pipeline</text>
<text x="24" y="648" font-size="12.5" fill="#7d8590" text-anchor="start">Carry forward: a golden dataset is a fixed set of trusted prompts you re-run on every change; a</text>
<text x="24" y="666" font-size="12.5" fill="#7d8590" text-anchor="start">canary releases to a small slice of traffic first.</text>
</svg>