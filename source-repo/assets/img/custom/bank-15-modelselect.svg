<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.5 Selecting the right foundation model</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Match the model to the job. The exam punishes brand loyalty.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Small + cheap</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Nova Micro, Haiku:</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">classification, routing,</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">extraction. Fractions of a</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">cent per call.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Flagship</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Sonnet-class: reasoning,</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">agents, hard generation.</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Pay only where quality</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">decides.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Specialist</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Embeddings, rerank, image:</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">the right tool for one job</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">beats a generalist at it.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">The most-correct filter: the cheapest model that meets the quality bar wins. A flagship where a</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">small model suffices is the sophisticated-sounding wrong answer.</text>
</svg>