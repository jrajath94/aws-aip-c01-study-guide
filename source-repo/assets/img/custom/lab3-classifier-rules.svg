<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="500" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The classifier reads descriptions, not code</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Descriptions are routing rules. Overlapping rules make routing a coin flip.</text>
<rect x="24" y="76" width="712" height="90" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/>
<text x="44" y="108" font-size="14" fill="#ececec" text-anchor="start">BedrockClassifier sees per agent: name + description + conversation history. Nothing else.</text>
<rect x="24" y="190" width="348" height="150" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="220" font-size="14.5" fill="#4ade80" text-anchor="start" font-weight="bold">Mutually exclusive rules</text>
<text x="44" y="244" font-size="12.5" fill="#a8a8a8" text-anchor="start">"Handles billing questions: invoices,</text>
<text x="44" y="262" font-size="12.5" fill="#a8a8a8" text-anchor="start">refunds, charges. Never general chat." vs</text>
<text x="44" y="280" font-size="12.5" fill="#a8a8a8" text-anchor="start">"Handles general questions that do NOT need</text>
<text x="44" y="298" font-size="12.5" fill="#a8a8a8" text-anchor="start">billing tools."</text>
<path d="M321.75,312 l6.6,7.15 l12.649999999999999,-14.3" stroke="#4ade80" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="318" font-size="12.5" fill="#4ade80" text-anchor="end">routes cleanly</text>
<rect x="388" y="190" width="348" height="150" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="408" y="220" font-size="14.5" fill="#f87171" text-anchor="start" font-weight="bold">Overlapping rules</text>
<text x="408" y="244" font-size="12.5" fill="#a8a8a8" text-anchor="start">"Helps with accounts and questions." vs</text>
<text x="408" y="262" font-size="12.5" fill="#a8a8a8" text-anchor="start">"Answers user questions including accounts."</text>
<text x="408" y="280" font-size="12.5" fill="#a8a8a8" text-anchor="start">The classifier cannot tell them apart.</text>
<line x1="686.08" y1="304.08" x2="701.92" y2="319.92" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<line x1="701.92" y1="304.08" x2="686.08" y2="319.92" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<text x="664" y="318" font-size="12.5" fill="#f87171" text-anchor="end">coin flip</text>
<rect x="24" y="372" width="712" height="100" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="402" font-size="14" fill="#f0b429" text-anchor="start" font-weight="bold">Cost note</text>
<text x="44" y="424" font-size="12.5" fill="#a8a8a8" text-anchor="start">Classification adds one model call per turn. A tiny model (Nova Micro) with temperature 0 keeps</text>
<text x="44" y="442" font-size="12.5" fill="#a8a8a8" text-anchor="start">it to fractions of a cent and makes routing reproducible for debugging.</text>
</svg>