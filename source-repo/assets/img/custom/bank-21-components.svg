<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="600" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">2.1 Agent components: what each part does</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Five pieces. The exam removes one and asks what breaks.</text>
<rect x="24" y="84" width="712" height="84" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="118" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Foundation model</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">The reasoning engine: decides what to do next.</text>
<rect x="24" y="182" width="712" height="84" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="216" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Instructions</text>
<text x="44" y="240" font-size="12.5" fill="#a8a8a8" text-anchor="start">The system prompt: role, rules, and how to behave.</text>
<rect x="24" y="280" width="712" height="84" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="314" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Action groups</text>
<text x="44" y="338" font-size="12.5" fill="#a8a8a8" text-anchor="start">Tools: Lambda functions or OpenAPI schemas the agent can call.</text>
<rect x="24" y="378" width="712" height="84" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="412" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Knowledge bases</text>
<text x="44" y="436" font-size="12.5" fill="#a8a8a8" text-anchor="start">Grounding: private documents retrieved at decision time.</text>
<rect x="24" y="476" width="712" height="84" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="510" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Guardrails</text>
<text x="44" y="534" font-size="12.5" fill="#a8a8a8" text-anchor="start">Safety: content filtered on the way in and the way out.</text>
</svg>