<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Knowledge bases sync on a schedule, not on every read</text>
<text x="24" y="58" font-size="13" fill="#7d8590">A question hits the vector store. The store only knows the last sync.</text>
<rect x="24" y="84" width="712" height="96" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="116" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Near-real-time (minutes)</text>
<text x="44" y="140" font-size="12.5" fill="#a8a8a8" text-anchor="start">S3 event triggers a sync: edits searchable within minutes. Costs a sync per change.</text>
<rect x="24" y="194" width="712" height="96" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="226" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Hourly</text>
<text x="44" y="250" font-size="12.5" fill="#a8a8a8" text-anchor="start">Batch window: changes visible after the next run. The middle ground.</text>
<rect x="24" y="304" width="712" height="96" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="336" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Daily or weekly</text>
<text x="44" y="360" font-size="12.5" fill="#a8a8a8" text-anchor="start">Cheap and simple. Changes sit invisible until the next run.</text>
<rect x="24" y="422" width="712" height="96" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="452" font-size="13.5" fill="#ececec" text-anchor="start">Exam scenario: 'users complain new documents never appear'. The KB is healthy;</text>
<text x="44" y="476" font-size="13.5" fill="#f87171" text-anchor="start">the sync is stale, the filter excludes them, or the S3 event never fired.</text>
</svg>