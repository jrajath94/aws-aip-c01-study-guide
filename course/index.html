<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content=""><title></title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="home" href="#core/core-001">AIP-C01</a><span class="subtitle">Generative AI Developer Professional</span><button id="menu" aria-expanded="false" aria-controls="sidebar">Contents</button><button id="print">Print slide</button></header>
<div class="layout">
<aside id="sidebar">
<label for="search">Find a topic or question</label><input id="search" type="search" placeholder="Try hybrid search or 1.5.4" autocomplete="off">
<label for="mode">Study mode</label><select id="mode"><option value="core">Core course</option><option value="references">Repository reference</option><option value="quizzes">Practice questions</option><option value="mock">75-question mock</option><option value="recalls">Recall cards</option><option value="services">Service boundaries</option><option value="skills">98-skill map</option><option value="weak">Review list</option><option value="audit">Sources and limits</option></select>
<label for="domain">Domain</label><select id="domain"><option value="all">All domains</option><option value="1">1. Models and data. 31%</option><option value="2">2. Implementation. 26%</option><option value="3">3. Security. 20%</option><option value="4">4. Operations. 12%</option><option value="5">5. Evaluation. 11%</option><option value="0">Foundations and reference</option></select>
<p id="list-count" class="small"></p><nav id="list" aria-label="Course contents"></nav><p id="progress" class="small"></p><button id="export-progress">Save progress</button><button id="clear-progress">Reset progress</button>
</aside>
<main id="main"><div class="toolbar"><span id="position"></span><span id="timer"></span><button id="weak">Review later</button><button id="mastered">Mark learned</button></div><article id="slide" tabindex="-1"></article><footer><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></footer></main>
</div>
<script src="course-data.js"></script><script src="app.js"></script>
</body></html>
