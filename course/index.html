<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AWS AIP-C01: Generative AI Developer Professional — Visual Masterclass & Exam Treatise</title>
  <meta name="description" content="Exhaustive 2-day visual preparation masterclass and slide treatise for AWS Certified Generative AI Developer - Professional (AIP-C01).">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark mode-slides">
  <!-- Top Global Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <a class="brand-badge" href="#slides/core-001">
        <span class="brand-code">AIP-C01</span>
        <span class="brand-name">AWS GenAI Dev Pro</span>
      </a>
      <span class="exam-status-tag">75 Questions · 180 Min · 750/1000 Pass</span>
    </div>

    <!-- Mode Selector Tabs -->
    <nav class="mode-nav" aria-label="Study modes">
      <button class="mode-tab active" data-mode="slides" title="16:9 Interactive Slide Deck (Shortcut: 1)">
        <span class="tab-icon">📽️</span> <span class="tab-label">Slide Deck</span>
      </button>
      <button class="mode-tab" data-mode="treatise" title="Continuous Scrollable Visual Treatise (Shortcut: 2)">
        <span class="tab-icon">📖</span> <span class="tab-label">Visual Treatise</span>
      </button>
      <button class="mode-tab" data-mode="mock" title="75-Question Timed Official Simulation (Shortcut: 3)">
        <span class="tab-icon">⏱️</span> <span class="tab-label">Mock Exam</span>
      </button>
      <button class="mode-tab" data-mode="quizzes" title="250-Question Practice Bank with Rationales (Shortcut: 4)">
        <span class="tab-icon">❓</span> <span class="tab-label">Question Bank</span>
      </button>
      <button class="mode-tab" data-mode="recalls" title="541 Flashcards for Active Recall (Shortcut: 5)">
        <span class="tab-icon">🗂️</span> <span class="tab-label">Recall Cards</span>
      </button>
      <button class="mode-tab" data-mode="skills" title="Official 98-Skill AWS Blueprint Map">
        <span class="tab-icon">🗺️</span> <span class="tab-label">98-Skill Map</span>
      </button>
      <button class="mode-tab" data-mode="references" title="Complete Repository Reference Library">
        <span class="tab-icon">📑</span> <span class="tab-label">Library</span>
      </button>
    </nav>

    <div class="header-right">
      <button id="btn-theme" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Theme">🌓</button>
      <button id="btn-fullscreen" class="icon-btn" title="Fullscreen Slide Mode (F)" aria-label="Toggle Fullscreen">⛶</button>
      <button id="btn-sidebar-toggle" class="icon-btn" title="Toggle Navigation Drawer (M)" aria-label="Toggle Drawer">☰</button>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <!-- Sidebar Navigation Drawer -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-search">
        <input id="search-input" type="search" placeholder="Search topics, APIs, skills (e.g. pgvector, 1.4.1)..." autocomplete="off">
      </div>

      <div class="sidebar-filters">
        <label for="domain-select" class="filter-label">Domain Filter</label>
        <select id="domain-select" class="filter-select">
          <option value="all">All Domains (100%)</option>
          <option value="1">Domain 1: Models & Data (31%)</option>
          <option value="2">Domain 2: Implementation (26%)</option>
          <option value="3">Domain 3: Security & Governance (20%)</option>
          <option value="4">Domain 4: Optimization (12%)</option>
          <option value="5">Domain 5: Testing & Evaluation (11%)</option>
          <option value="0">Foundations & Strategy (Prereq)</option>
        </select>
      </div>

      <div class="sidebar-meta">
        <span id="item-count-badge" class="count-badge">0 items</span>
        <div class="progress-container">
          <div class="progress-bar-bg"><div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%"></div></div>
          <span id="progress-text" class="progress-text">0 / 95 slides learned</span>
        </div>
      </div>

      <!-- Navigation List -->
      <nav id="nav-item-list" class="nav-item-list" aria-label="Course navigation"></nav>

      <div class="sidebar-footer">
        <button id="btn-export-progress" class="action-btn small">Save Progress</button>
        <button id="btn-reset-progress" class="action-btn small danger">Reset Progress</button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main id="main-content" class="main-content">
      <!-- Top Action Toolbar -->
      <div class="content-toolbar">
        <div class="toolbar-left">
          <span id="breadcrumb-domain" class="domain-tag">Domain 1</span>
          <span id="breadcrumb-title" class="slide-position-text">Slide 1 of 95</span>
          <span id="timer-display" class="timer-display"></span>
        </div>
        <div class="toolbar-right">
          <button id="btn-layer-intuition" class="layer-pill active" data-layer="intuition" title="Layer 1: First Principle Intuition (1)">1. Intuition</button>
          <button id="btn-layer-architecture" class="layer-pill" data-layer="architecture" title="Layer 2: Architecture & Diagram (2)">2. Architecture</button>
          <button id="btn-layer-api" class="layer-pill" data-layer="api" title="Layer 3: Exact APIs & Code (3)">3. APIs & Code</button>
          <button id="btn-layer-traps" class="layer-pill" data-layer="traps" title="Layer 4: Amazon Traps & Limits (4)">4. Traps & Limits</button>
          <button id="btn-layer-rule" class="layer-pill" data-layer="rule" title="Layer 5: 2-Day Exam Rule (5)">5. Exam Rule</button>
          <div class="toolbar-divider"></div>
          <button id="btn-mark-learned" class="action-pill" title="Toggle Learned Status (L)">Mark Learned</button>
          <button id="btn-mark-review" class="action-pill" title="Add to Review List (R)">Review Later</button>
        </div>
      </div>

      <!-- Dynamic View Container (Slides / Treatise / Mock / Quizzes) -->
      <div id="view-viewport" class="view-viewport">
        <!-- Rendered dynamically by app.js -->
        <div id="slide-stage" class="slide-stage"></div>
      </div>

      <!-- Bottom Slide Navigation Deck Controls -->
      <footer id="slide-footer" class="slide-footer">
        <button id="btn-prev-slide" class="nav-control-btn prev" title="Previous Slide (Arrow Left)">
          <span class="btn-arrow">←</span> <span class="btn-text">Previous</span>
        </button>
        <div class="slide-counter-wrapper">
          <span id="slide-number-display" class="slide-number">1 / 95</span>
          <div class="keyboard-hint">Use <kbd>Space</kbd> or <kbd>→</kbd> next, <kbd>F</kbd> fullscreen, <kbd>Q</kbd> quiz, <kbd>1-5</kbd> layers</div>
        </div>
        <button id="btn-next-slide" class="nav-control-btn next" title="Next Slide (Space or Arrow Right)">
          <span class="btn-text">Next</span> <span class="btn-arrow">→</span>
        </button>
      </footer>
    </main>
  </div>

  <!-- Diagram Lightbox Modal for Deep Zoom & Inspection -->
  <div id="diagram-lightbox" class="diagram-lightbox" role="dialog" aria-modal="true" aria-label="Architecture Diagram Lightbox" hidden>
    <div class="lightbox-chrome">
      <span id="lightbox-title" class="lightbox-title">Architecture Diagram</span>
      <div class="lightbox-controls">
        <button id="lightbox-zoom-out" title="Zoom Out">-</button>
        <span id="lightbox-zoom-level">100%</span>
        <button id="lightbox-zoom-in" title="Zoom In">+</button>
        <button id="lightbox-zoom-reset" title="Reset Zoom">Fit</button>
        <button id="lightbox-close" class="lightbox-close" title="Close Lightbox (Esc)">✕</button>
      </div>
    </div>
    <div class="lightbox-stage">
      <img id="lightbox-image" src="" alt="Architecture Diagram Enlarged">
    </div>
  </div>

  <!-- Practice Question Drawer Modal (Q) -->
  <div id="quiz-drawer" class="quiz-drawer" role="dialog" aria-modal="true" aria-label="Linked Exam Practice Question" hidden>
    <div class="quiz-drawer-header">
      <div class="quiz-drawer-title-group">
        <span class="quiz-drawer-badge">⚡ Linked AIP-C01 Question</span>
        <h3 id="quiz-drawer-title">Test Your Understanding</h3>
      </div>
      <button id="quiz-drawer-close" class="quiz-drawer-close" title="Close Quiz (Esc)">✕</button>
    </div>
    <div id="quiz-drawer-body" class="quiz-drawer-body"></div>
  </div>

  <!-- Load Compiled Course Data and Main Application Engine -->
  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
