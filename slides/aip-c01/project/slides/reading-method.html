<section id="reading-method" data-transition="fade" style="background:#F6F6F2;color:#1B1F24;font-family:'IBM Plex Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:48px">
<h2 style="font-size:60px;font-weight:600;line-height:1.15">Reading method for each question</h2>
<div style="display:flex;flex-direction:column;gap:28px">
<p style="font-size:34px;line-height:1.4"><b>1.</b> Read the last sentence. Note what it asks for.</p>
<p style="font-size:34px;line-height:1.4"><b>2.</b> List every constraint in the stem.</p>
<p style="font-size:34px;line-height:1.4"><b>3.</b> Match each constraint to one service or pattern.</p>
<p style="font-size:34px;line-height:1.4"><b>4.</b> Eliminate options that break one constraint.</p>
<p style="font-size:34px;line-height:1.4"><b>5.</b> For multiple response, count the answers the stem requires.</p>
</div>
</section>
