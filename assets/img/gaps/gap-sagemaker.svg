<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-label="SageMaker hosting: two timeouts, and which instance family">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 4.4. SAGEMAKER HOSTING TIMEOUTS</text>
<line x1="60" y1="100" x2="720" y2="100" stroke="#999" stroke-width="3"/>
<circle cx="60" cy="100" r="6" fill="#3f3f3f" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="60" y="125" font-size="11.5" fill="#222222" text-anchor="middle">request</text>
<circle cx="200" cy="100" r="6" fill="#a93226" stroke="#a93226" stroke-width="1.5"/>
<text x="200" y="125" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">60 s</text>
<text x="200" y="143" font-size="11" fill="#555555" text-anchor="middle">real-time limit</text>
<circle cx="560" cy="100" r="6" fill="#c98a1b" stroke="#c98a1b" stroke-width="1.5"/>
<text x="560" y="125" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">up to 1 hour</text>
<text x="560" y="143" font-size="11" fill="#555555" text-anchor="middle">async limit</text>
<rect x="24" y="170" width="360" height="110" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="204" y="196" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Real-time endpoint</text>
<text x="204" y="218" font-size="12" fill="#222222" text-anchor="middle">answers in seconds;</text>
<text x="204" y="238" font-size="12" fill="#222222" text-anchor="middle">60-second timeout kills slow LLMs</text>
<text x="204" y="258" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; batch or async for long generations</text>
<rect x="396" y="170" width="360" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="576" y="196" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Instance families</text>
<text x="576" y="218" font-size="12" fill="#222222" text-anchor="middle">p / g: GPUs for LLMs</text>
<text x="576" y="238" font-size="12" fill="#222222" text-anchor="middle">inf / trn: cost-efficient inference</text>
<text x="576" y="258" font-size="12" fill="#222222" text-anchor="middle">c / m: cheap, CPU-only</text>
<text x="390" y="316" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'LLM takes 90 seconds per request' -&gt; not a real-time endpoint; use async.</text>
<text x="390" y="340" font-size="12" fill="#555555" text-anchor="middle">Trap: the timeout is on the endpoint, not the model. Same model, different endpoint, different limit.</text>
<text x="390" y="364" font-size="12" fill="#555555" text-anchor="middle">Why here: hard gap. The main volumes cover endpoints, not the timeout table.</text>
</svg>