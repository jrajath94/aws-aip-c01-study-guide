<text x="104.0" y="84.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Prose</text>
<text x="104.0" y="101.0" font-size="12" fill="#222222" text-anchor="middle">what, why,</text>
<text x="104.0" y="117.0" font-size="12" fill="#222222" text-anchor="middle">exam angle</text>
<rect x="294" y="60" width="170" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="379.0" y="84.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Diagram</text>
<text x="379.0" y="101.0" font-size="12" fill="#222222" text-anchor="middle">figure number</text>
<text x="379.0" y="117.0" font-size="12" fill="#222222" text-anchor="middle">matches caption</text>
<rect x="574" y="60" width="162" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="655.0" y="84.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">AWS docs</text>
