<line x1="184" y1="100" x2="294" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="464" y1="100" x2="574" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="170" width="712" height="60" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="380" y="195" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">All three must agree: the diagram shows what the prose teaches,</text>
