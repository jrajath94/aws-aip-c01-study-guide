<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="CloudFront: edge cache hit or miss, OAC to the S3 origin">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.3. CLOUDFRONT SERVES FROM THE EDGE</text>
<rect x="24" y="100" width="120" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="84.0" y="127.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">User</text>
<text x="84.0" y="144.0" font-size="12" fill="#222222" text-anchor="middle"></text>
<rect x="204" y="60" width="220" height="150" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="314" y="86" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Edge location</text>
<rect x="224" y="104" width="180" height="44" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="314" y="124" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Cache HIT</text>
<text x="314" y="142" font-size="11" fill="#555555" text-anchor="middle">serve instantly</text>
<rect x="224" y="152" width="180" height="44" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="314" y="172" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Cache MISS</text>
<text x="314" y="190" font-size="11" fill="#555555" text-anchor="middle">forward to origin</text>
<line x1="144" y1="135" x2="204" y2="135" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="424" y1="135" x2="500" y2="135" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="462" y="120" font-size="10.5" fill="#555555" text-anchor="middle">OAC</text>
<rect x="500" y="100" width="150" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="575" y="128" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">S3 origin</text>
<text x="575" y="150" font-size="11" fill="#555555" text-anchor="middle">private bucket</text>
<rect x="500" y="190" width="236" height="60" rx="8" fill="#efefef" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="618" y="214" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">WAF sits at the edge</text>
<text x="618" y="234" font-size="11.5" fill="#555555" text-anchor="middle">signed URLs for private content</text>
<text x="380" y="290" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'global users, low latency, private S3 content' -&gt; CloudFront + OAC + signed URLs.</text>
<text x="380" y="314" font-size="12" fill="#555555" text-anchor="middle">Trap: OAC replaced OAI; the bucket stays private, CloudFront proves its identity.</text>
</svg>