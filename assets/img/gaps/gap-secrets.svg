<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="Secret rotation in four steps: AWSPENDING, update, AWSCURRENT, cleanup">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.1. ROTATION WITHOUT DOWNTIME</text>
<rect x="24" y="56" width="178" height="96" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="113.0" y="88.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">1. Create</text>
<text x="113.0" y="105.5" font-size="11.5" fill="#222222" text-anchor="middle">new secret version,</text>
<text x="113.0" y="121.0" font-size="11.5" fill="#222222" text-anchor="middle">labelled AWSPENDING</text>
<line x1="202" y1="104" x2="214" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="214" y="56" width="178" height="96" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="303.0" y="88.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">2. Update</text>
<text x="303.0" y="105.5" font-size="11.5" fill="#222222" text-anchor="middle">write it into the</text>
<text x="303.0" y="121.0" font-size="11.5" fill="#222222" text-anchor="middle">external system</text>
<line x1="392" y1="104" x2="404" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="404" y="56" width="178" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="493.0" y="88.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">3. Promote</text>
<text x="493.0" y="105.5" font-size="11.5" fill="#222222" text-anchor="middle">move AWSCURRENT</text>
<text x="493.0" y="121.0" font-size="11.5" fill="#222222" text-anchor="middle">to the new version</text>
<line x1="582" y1="104" x2="594" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="594" y="56" width="178" height="96" rx="8" fill="#efefef" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="683.0" y="88.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">4. Clean up</text>
<text x="683.0" y="105.5" font-size="11.5" fill="#222222" text-anchor="middle">delete the old</text>
<text x="683.0" y="121.0" font-size="11.5" fill="#222222" text-anchor="middle">version</text>
<rect x="24" y="180" width="732" height="90" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="206" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Why no downtime: the app always reads the version labelled AWSCURRENT</text>
<text x="390" y="230" font-size="12" fill="#222222" text-anchor="middle">During step 2, readers still get the old secret. At step 3, everyone flips at once.</text>
<text x="390" y="252" font-size="12" fill="#222222" text-anchor="middle">A failed rotation never corrupts the live secret: AWSPENDING just never gets promoted.</text>
<text x="390" y="306" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'rotate database credentials automatically' -&gt; Secrets Manager rotation.</text>
<text x="390" y="330" font-size="12" fill="#555555" text-anchor="middle">Trap: rotation needs a Lambda function that knows the external system; it is not magic.</text>
<text x="390" y="354" font-size="12" fill="#555555" text-anchor="middle">Why here: the guardrails volume covers KMS; rotation mechanics live here.</text>
</svg>