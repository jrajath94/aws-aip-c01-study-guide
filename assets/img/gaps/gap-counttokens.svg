<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="CountTokens: the free gate before every billed call">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.4. COUNTTOKENS: THE FREE GATE</text>
<rect x="24" y="56" width="140" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="94.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Prompt</text>
<text x="94.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">your prompt</text>
<text x="94.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">draft</text>
<rect x="224" y="56" width="170" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="309.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">CountTokens</text>
<text x="309.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">free, no tokens</text>
<text x="309.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">billed for it</text>
<rect x="454" y="56" width="140" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="524.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">InvokeModel</text>
<text x="524.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">only if it</text>
<text x="524.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">fits budget</text>
<rect x="640" y="56" width="116" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="698.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Output</text>
<text x="698.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">the</text>
<text x="698.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">answer</text>
<line x1="164" y1="96" x2="224" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="394" y1="96" x2="454" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="594" y1="96" x2="640" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="309" y="160" font-size="11.5" fill="#555555" text-anchor="middle">decide before you pay</text>
<rect x="24" y="190" width="732" height="130" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="216" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Worked example: the batch that cost $102</text>
<text x="60" y="246" font-size="12" fill="#222222" text-anchor="start" font-weight="700">34M input tokens</text>
<rect x="60" y="254" width="340" height="18" rx="4" fill="#ffffff" stroke="#c98a1b" stroke-width="1.5"/>
<text x="60" y="292" font-size="12" fill="#222222" text-anchor="start">x $3 per million = $102. CountTokens would have told you first, for free.</text>
<text x="390" y="340" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'estimate cost before running' -&gt; CountTokens, not a calculator guess.</text>
<text x="390" y="364" font-size="12" fill="#555555" text-anchor="middle">Trap: CountTokens is free and exact for the model you name; tokenizers differ per model.</text>
<text x="390" y="388" font-size="12" fill="#555555" text-anchor="middle">Why here: cost control is a D4 topic; the API itself is a gap.</text>
</svg>