<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" role="img" aria-label="top_k: the Converse allowlist vs the model-specific escape hatch">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="780" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.5. WHERE TOP_K LIVES</text>
<rect x="24" y="56" width="732" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="390" y="80" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">converse(modelId, messages, inferenceConfig)</text>
<text x="390" y="102" font-size="11.5" fill="#555555" text-anchor="middle">the single chat API for Bedrock</text>
<rect x="24" y="140" width="360" height="130" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="204" y="166" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">inferenceConfig (allowlist)</text>
<text x="60" y="196" font-size="12" fill="#222222" text-anchor="start">temperature, top_p, top_k,</text>
<text x="60" y="218" font-size="12" fill="#222222" text-anchor="start">maxTokens, stopSequences</text>
<text x="60" y="244" font-size="11.5" fill="#555555" text-anchor="start">works the same on every model</text>
<rect x="396" y="140" width="360" height="130" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="576" y="166" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">additionalModelRequestFields</text>
<text x="432" y="196" font-size="12" fill="#222222" text-anchor="start">model-specific knobs</text>
<text x="432" y="218" font-size="12" fill="#222222" text-anchor="start">(e.g. Anthropic-only params)</text>
<text x="432" y="244" font-size="11.5" fill="#555555" text-anchor="start">breaks portability across models</text>
<rect x="24" y="290" width="732" height="50" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="390" y="312" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Agents API: orchestrationConfig only, no inferenceConfig at all</text>
<text x="390" y="334" font-size="12" fill="#222222" text-anchor="middle">top_k set on an agent call is silently ignored: the classic trap</text>
</svg>