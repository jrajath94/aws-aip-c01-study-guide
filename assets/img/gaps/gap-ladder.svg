<rect x="150" y="52" width="118" height="128" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="209" y="76" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">Ingestion</text>
<text x="209" y="104" font-size="10.5" fill="#222222" text-anchor="middle">AppFlow</text>
<text x="209" y="138" font-size="10.5" fill="#222222" text-anchor="middle">(SaaS sync)</text>
<line x1="268" y1="116.0" x2="276" y2="116.0" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
