<text x="713" y="76" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">Ops</text>
<text x="713" y="104" font-size="10.5" fill="#222222" text-anchor="middle">QuickSight</text>
<text x="713" y="138" font-size="10.5" fill="#222222" text-anchor="middle">(dashboards)</text>
<text x="713" y="172" font-size="10.5" fill="#222222" text-anchor="middle">Evidently</text>
<text x="713" y="206" font-size="10.5" fill="#222222" text-anchor="middle">WAF/CloudFront</text>
<text x="713" y="240" font-size="10.5" fill="#222222" text-anchor="middle">Secrets Mgr</text>
<text x="390" y="330" font-size="12" fill="#555555" text-anchor="middle">Read left to right: raw data becomes model input becomes answers becomes monitored products.</text>
<text x="390" y="356" font-size="12" fill="#555555" text-anchor="middle">Each topic sits in exactly one column. That column is the exam's favorite framing:</text>
<text x="390" y="378" font-size="12" fill="#555555" text-anchor="middle">'your data arrives as file drops' points at the Data in column: Transfer Family.</text>
<text x="390" y="404" font-size="12" fill="#555555" text-anchor="middle">If an entry breaks, data stops one column to the left of where you notice the symptom.</text>
<text x="390" y="430" font-size="12" fill="#555555" text-anchor="middle">A bad Textract stage shows up as bad answers, two columns to the right.</text>
</svg>