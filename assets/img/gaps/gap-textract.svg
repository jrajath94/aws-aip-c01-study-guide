<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" role="img" aria-label="Which Textract API: sync, async, or specialized">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="780" height="440" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 4.1. THE TEXTRACT API DECISION TREE</text>
<rect x="290" y="48" width="200" height="48" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">What are you reading?</text>
<text x="390" y="90" font-size="1" fill="#222222" text-anchor="start"></text>
<rect x="24" y="120" width="178" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="113.0" y="156.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Simple page,</text>
<text x="113.0" y="173.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">text only</text>
<text x="113.0" y="190.0" font-size="11.5" fill="#222222" text-anchor="middle">DetectDocumentText</text>
<text x="113.0" y="205.5" font-size="11.5" fill="#222222" text-anchor="middle">(sync)</text>
<line x1="390" y1="96" x2="113" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="214" y="120" width="178" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="303.0" y="156.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Multi-page PDF,</text>
<text x="303.0" y="173.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">async OK</text>
<text x="303.0" y="190.0" font-size="11.5" fill="#222222" text-anchor="middle">StartDocumentText</text>
<text x="303.0" y="205.5" font-size="11.5" fill="#222222" text-anchor="middle">Detection (async)</text>
<line x1="390" y1="96" x2="303" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="404" y="120" width="178" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="493.0" y="164.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Forms + tables</text>
<text x="493.0" y="181.5" font-size="11.5" fill="#222222" text-anchor="middle">AnalyzeDocument</text>
<text x="493.0" y="197.0" font-size="11.5" fill="#222222" text-anchor="middle">(sync or async)</text>
<line x1="390" y1="96" x2="493" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="594" y="120" width="178" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="683.0" y="148.25" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">IDs, invoices,</text>
<text x="683.0" y="165.25" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">lending docs</text>
<text x="683.0" y="182.25" font-size="11.5" fill="#222222" text-anchor="middle">AnalyzeID /</text>
<text x="683.0" y="197.75" font-size="11.5" fill="#222222" text-anchor="middle">AnalyzeExpense /</text>
<text x="683.0" y="213.25" font-size="11.5" fill="#222222" text-anchor="middle">AnalyzeLending</text>
<line x1="390" y1="96" x2="683" y2="120" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="270" width="732" height="70" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="390" y="296" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Human review on low-confidence fields: A2I (Augmented AI)</text>
<text x="390" y="318" font-size="12" fill="#222222" text-anchor="middle">Textract flags the uncertain; humans confirm. Common in lending and ID workflows.</text>
<text x="390" y="372" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'extract tables from a 50-page PDF' -&gt; async AnalyzeDocument.</text>
<text x="390" y="396" font-size="12" fill="#555555" text-anchor="middle">Trap: DetectDocumentText is text-only and synchronous; forms need AnalyzeDocument.</text>
<text x="390" y="420" font-size="12" fill="#555555" text-anchor="middle">Why here: document AI adjacent to the D1 ingestion story.</text>
</svg>