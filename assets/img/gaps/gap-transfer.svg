<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-label="Transfer Family: partner file drops land in S3, then a pipeline wakes up">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 1.2. TRANSFER FAMILY CATCHES PARTNER FILE DROPS</text>
<rect x="24" y="56" width="130" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="89.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Outside world</text>
<text x="89.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">partner</text>
<text x="89.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">servers</text>
<rect x="204" y="56" width="170" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="289.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Transfer Family</text>
<text x="289.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">SFTP, SCP, FTPS, AS2</text>
<text x="289.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">managed, no servers</text>
<rect x="424" y="56" width="120" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="484.0" y="88.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">S3 bucket</text>
<text x="484.0" y="105.0" font-size="12" fill="#222222" text-anchor="middle"></text>
<rect x="594" y="56" width="142" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="665.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Pipeline</text>
<text x="665.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">Glue, Athena,</text>
<text x="665.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">Bedrock KB</text>
<line x1="154" y1="96" x2="204" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="374" y1="96" x2="424" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="544" y1="96" x2="594" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="484" y="160" font-size="11.5" fill="#555555" text-anchor="middle">S3 event wakes the pipeline</text>
<path d="M 640 136 C 560.0 136, 560.0 150, 480 150" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<rect x="24" y="190" width="712" height="130" rx="8" fill="#efefef" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="380" y="216" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">One landing zone, four protocols:</text>
<text x="120" y="244" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">SFTP</text>
<text x="120" y="262" font-size="11" fill="#555555" text-anchor="middle">SSH file transfer</text>
<text x="300" y="244" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">FTPS</text>
<text x="300" y="262" font-size="11" fill="#555555" text-anchor="middle">FTP over TLS</text>
<text x="480" y="244" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">SCP</text>
<text x="480" y="262" font-size="11" fill="#555555" text-anchor="middle">simple SSH copy</text>
<text x="640" y="244" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">AS2</text>
<text x="640" y="262" font-size="11" fill="#555555" text-anchor="middle">EDI partner exchange</text>
<text x="380" y="300" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'partner uploads files via SFTP' -&gt; Transfer Family, not DataSync.</text>
</svg>