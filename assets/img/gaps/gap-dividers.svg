<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="Blind splitting vs divider-first splitting">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 4.2. SPLIT ON DIVIDERS, NOT BLINDLY</text>
<rect x="24" y="56" width="340" height="130" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="194" y="82" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Blind split</text>
<text x="60" y="112" font-size="11.5" fill="#222222" text-anchor="start">chunk 1: '...the model was</text>
<text x="60" y="132" font-size="11.5" fill="#222222" text-anchor="start">chunk 2: 'trained on data from'</text>
<text x="60" y="152" font-size="11.5" fill="#222222" text-anchor="start">chunk 3: '2023. It performs...'</text>
<text x="194" y="176" font-size="11" fill="#555555" text-anchor="middle">sentences cut mid-thought</text>
<rect x="396" y="56" width="340" height="130" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="566" y="82" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Divider-first split</text>
<text x="432" y="112" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">## Section heading</text>
<text x="432" y="132" font-size="11.5" fill="#222222" text-anchor="start">whole paragraphs stay</text>
<text x="432" y="152" font-size="11.5" fill="#222222" text-anchor="start">together as one chunk</text>
<text x="566" y="176" font-size="11" fill="#555555" text-anchor="middle">each chunk is a complete unit</text>
<text x="380" y="226" font-size="12" fill="#555555" text-anchor="middle">Dividers: headings, blank lines, paragraph breaks. The splitter respects them.</text>
<text x="380" y="252" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'retrieval returns fragments that make no sense' -&gt; fix the chunking, add dividers.</text>
<text x="380" y="278" font-size="12" fill="#555555" text-anchor="middle">Trap: smaller chunks are not automatically better; complete thoughts beat tiny fragments.</text>
</svg>