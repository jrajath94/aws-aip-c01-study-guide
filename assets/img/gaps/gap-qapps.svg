<text x="110.0" y="85.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Describe</text>
<text x="110.0" y="102.5" font-size="11.5" fill="#222222" text-anchor="middle">upload docs,</text>
<text x="110.0" y="118.0" font-size="11.5" fill="#222222" text-anchor="middle">say what you want</text>
<line x1="196" y1="101" x2="208" y2="101" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="208" y="56" width="172" height="90" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="294.0" y="85.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Generate</text>
<text x="294.0" y="102.5" font-size="11.5" fill="#222222" text-anchor="middle">Q builds the</text>
<text x="294.0" y="118.0" font-size="11.5" fill="#222222" text-anchor="middle">app + cards</text>
<line x1="380" y1="101" x2="392" y2="101" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="392" y="56" width="172" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="478.0" y="85.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Wire</text>
<text x="478.0" y="102.5" font-size="11.5" fill="#222222" text-anchor="middle">@ mention cards</text>
<text x="478.0" y="118.0" font-size="11.5" fill="#222222" text-anchor="middle">to connect them</text>
<line x1="564" y1="101" x2="576" y2="101" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="576" y="56" width="172" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="662.0" y="85.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Share</text>
<text x="662.0" y="102.5" font-size="11.5" fill="#222222" text-anchor="middle">teammates use</text>
<text x="662.0" y="118.0" font-size="11.5" fill="#222222" text-anchor="middle">it in Q Business</text>
<text x="380" y="186" font-size="12" fill="#555555" text-anchor="middle">Cards are the building blocks: each card does one small job (summarize, extract, answer).</text>
<text x="380" y="212" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'business users build their own GenAI apps, no code' -&gt; Q Apps.</text>
<text x="380" y="236" font-size="12" fill="#555555" text-anchor="middle">Trap: it lives inside Q Business; it is not Bedrock Agents and not a custom build.</text>
<text x="380" y="268" font-size="12" fill="#555555" text-anchor="middle">Why here: end-user GenAI tooling; the main volumes cover the builder's path.</text>
