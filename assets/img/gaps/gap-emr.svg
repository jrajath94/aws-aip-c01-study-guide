<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-label="EMR cluster topology and the EMR vs Glue vs Serverless decision">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 4.5. EMR TOPOLOGY AND WHEN TO SKIP IT</text>
<rect x="280" y="52" width="200" height="52" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="380" y="74" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">EMR cluster</text>
<text x="380" y="94" font-size="11.5" fill="#555555" text-anchor="middle">primary + core + task</text>
<line x1="330" y1="104" x2="150" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="380" y1="104" x2="380" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="104" x2="610" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="60" y="130" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="140.0" y="159.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Primary</text>
<text x="140.0" y="176.5" font-size="11.5" fill="#222222" text-anchor="middle">coordinates,</text>
<text x="140.0" y="192.0" font-size="11.5" fill="#222222" text-anchor="middle">runs the apps</text>
<rect x="300" y="130" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="380.0" y="159.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Core</text>
<text x="380.0" y="176.5" font-size="11.5" fill="#222222" text-anchor="middle">stores HDFS data,</text>
<text x="380.0" y="192.0" font-size="11.5" fill="#222222" text-anchor="middle">runs tasks</text>
<rect x="540" y="130" width="160" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="620.0" y="159.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Task</text>
<text x="620.0" y="176.5" font-size="11.5" fill="#222222" text-anchor="middle">compute only,</text>
<text x="620.0" y="192.0" font-size="11.5" fill="#222222" text-anchor="middle">spot-friendly</text>
<rect x="24" y="250" width="712" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="380" y="276" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">When to skip the cluster:</text>
<text x="120" y="306" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">EMR Serverless</text>
<text x="120" y="324" font-size="11" fill="#555555" text-anchor="middle">no nodes to manage</text>
<text x="380" y="306" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Glue</text>
<text x="380" y="324" font-size="11" fill="#555555" text-anchor="middle">serverless Spark ETL</text>
<text x="620" y="306" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Athena</text>
<text x="620" y="324" font-size="11" fill="#555555" text-anchor="middle">SQL, no cluster at all</text>
<text x="380" y="366" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'Spark ETL, no cluster to manage' -&gt; Glue. 'Full Hadoop control' -&gt; EMR.</text>
</svg>