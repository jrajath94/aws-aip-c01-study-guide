<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" role="img" aria-label="TTFT and TPOT on one request timeline">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.7. TTFT VS TPOT VS END-TO-END</text>
<line x1="60" y1="120" x2="720" y2="120" stroke="#999" stroke-width="3"/>
<circle cx="60" cy="120" r="6" fill="#3f3f3f" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="60" y="145" font-size="11.5" fill="#222222" text-anchor="middle">request</text>
<circle cx="260" cy="120" r="6" fill="#c98a1b" stroke="#c98a1b" stroke-width="1.5"/>
<text x="260" y="145" font-size="11.5" fill="#222222" text-anchor="middle">first token</text>
<circle cx="720" cy="120" r="6" fill="#1f7a6d" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="720" y="145" font-size="11.5" fill="#222222" text-anchor="middle">last token</text>
<line x1="60" y1="180" x2="260" y2="180" stroke="#c98a1b" stroke-width="4"/>
<text x="160" y="172" font-size="12" fill="#c98a1b" text-anchor="middle" font-weight="700">TTFT</text>
<text x="160" y="205" font-size="11.5" fill="#222222" text-anchor="middle">time to first token:</text>
<text x="160" y="223" font-size="11.5" fill="#555555" text-anchor="middle">the wait feels long</text>
<line x1="260" y1="250" x2="720" y2="250" stroke="#1f7a6d" stroke-width="4"/>
<text x="490" y="242" font-size="12" fill="#1f7a6d" text-anchor="middle" font-weight="700">TPOT x tokens</text>
<text x="490" y="275" font-size="11.5" fill="#222222" text-anchor="middle">time per output token: the streaming speed</text>
<text x="490" y="293" font-size="11.5" fill="#555555" text-anchor="middle">end-to-end = TTFT + TPOT x token count</text>
<text x="390" y="330" font-size="12" fill="#555555" text-anchor="middle">Streaming does not make the model faster; it makes the first token arrive sooner.</text>
</svg>