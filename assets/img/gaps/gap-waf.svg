<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-label="WAF: rules run in priority order, first match wins the action">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 3.2. WAF RULES IN PRIORITY ORDER</text>
<rect x="24" y="56" width="200" height="190" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="124" y="82" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Request arrives</text>
<rect x="36" y="100" width="176" height="30" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="124" y="120" font-size="11" fill="#222222" text-anchor="middle">1. IP block list: block</text>
<rect x="36" y="136" width="176" height="30" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="124" y="156" font-size="11" fill="#222222" text-anchor="middle">2. Rate limit: block</text>
<rect x="36" y="172" width="176" height="30" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="124" y="192" font-size="11" fill="#222222" text-anchor="middle">3. Managed SQLi/XSS: block</text>
<rect x="36" y="208" width="176" height="30" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="124" y="228" font-size="11" fill="#222222" text-anchor="middle">4. Geo allow: allow</text>
<line x1="224" y1="150" x2="300" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="100" width="180" height="100" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="128" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Lowest number</text>
<text x="390" y="148" font-size="12" fill="#222222" text-anchor="middle">runs first.</text>
<text x="390" y="168" font-size="12" fill="#222222" text-anchor="middle">First match sets</text>
<text x="390" y="188" font-size="12" fill="#222222" text-anchor="middle">the action.</text>
<line x1="480" y1="150" x2="556" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="556" y="100" width="180" height="100" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="646" y="128" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Protects</text>
<text x="646" y="150" font-size="11.5" fill="#222222" text-anchor="middle">ALB, API Gateway,</text>
<text x="646" y="170" font-size="11.5" fill="#222222" text-anchor="middle">CloudFront</text>
<text x="380" y="280" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'block SQL injection at the edge' -&gt; WAF managed rule, not a Guardrail.</text>
<text x="380" y="304" font-size="12" fill="#555555" text-anchor="middle">Trap: Guardrails filter model inputs/outputs; WAF filters HTTP requests. Different layer.</text>
<text x="380" y="328" font-size="12" fill="#555555" text-anchor="middle">Actions: allow, block, count (log only), CAPTCHA / challenge.</text>
</svg>