<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-label="Neptune database vs Neptune Analytics: OLTP graph queries vs in-memory analytics">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">FIGURE 2.2. TWO GRAPH ENGINES FOR TWO JOBS</text>
<rect x="280" y="48" width="200" height="52" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="380" y="70" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">A graph question</text>
<text x="380" y="90" font-size="11.5" fill="#555555" text-anchor="middle">over your data</text>
<line x1="330" y1="100" x2="180" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="240" y="118" font-size="11" fill="#555555" text-anchor="middle">live queries</text>
<line x1="430" y1="100" x2="580" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="520" y="118" font-size="11" fill="#555555" text-anchor="middle">one-off analysis</text>
<rect x="24" y="130" width="300" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="174" y="156" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Neptune Database</text>
<text x="174" y="178" font-size="11.5" fill="#222222" text-anchor="middle">OLTP graph queries:</text>
<text x="174" y="198" font-size="11.5" fill="#555555" text-anchor="middle">Gremlin, openCypher, SPARQL</text>
<text x="174" y="218" font-size="11.5" fill="#555555" text-anchor="middle">indexed, always on</text>
<rect x="436" y="130" width="300" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="586" y="156" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Neptune Analytics</text>
<text x="586" y="178" font-size="11.5" fill="#222222" text-anchor="middle">in-memory analytics</text>
<text x="586" y="198" font-size="11.5" fill="#555555" text-anchor="middle">over S3 snapshots</text>
<text x="586" y="218" font-size="11.5" fill="#555555" text-anchor="middle">no indexes to manage</text>
<text x="380" y="276" font-size="12" fill="#555555" text-anchor="middle">Exam angle: 'ad-hoc graph analytics over data in S3' -&gt; Neptune Analytics, not the database.</text>
<text x="380" y="300" font-size="12" fill="#555555" text-anchor="middle">Trap: 'Analytics' in the name does not mean dashboards; it means in-memory graph compute.</text>
</svg>