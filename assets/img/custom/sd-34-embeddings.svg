<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Which embedding model? Match the job, not the brand</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Retrieval quality lives or dies here. Two specialists, different jobs.</text>
<rect x="24" y="84" width="348" height="200" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="116" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Titan Text Embeddings v2</text>
<text x="44" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="start">8k context window</text>
<text x="44" y="166" font-size="12.5" fill="#a8a8a8" text-anchor="start">dimension choice: 256 / 512 / 1024</text>
<text x="44" y="188" font-size="12.5" fill="#a8a8a8" text-anchor="start">multilingual</text>
<text x="44" y="210" font-size="12.5" fill="#a8a8a8" text-anchor="start">unit-normed output</text>
<rect x="388" y="84" width="348" height="200" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="408" y="116" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Cohere Embed</text>
<text x="408" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="start">multilingual search specialist</text>
<text x="408" y="166" font-size="12.5" fill="#a8a8a8" text-anchor="start">strong on cross-language queries</text>
<text x="408" y="188" font-size="12.5" fill="#a8a8a8" text-anchor="start">image + text search available</text>
<text x="408" y="210" font-size="12.5" fill="#a8a8a8" text-anchor="start">different dimension tradeoffs</text>
<rect x="24" y="308" width="712" height="120" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="338" font-size="14.5" fill="#f87171" text-anchor="start" font-weight="bold">The trap</text>
<text x="44" y="362" font-size="12.5" fill="#a8a8a8" text-anchor="start">Titan v2 embeddings are NOT interchangeable with Titan image embeddings or v1 dimensions. Mixing</text>
<text x="44" y="380" font-size="12.5" fill="#a8a8a8" text-anchor="start">embedding models across index and query time silently breaks retrieval: same model at both ends,</text>
<text x="44" y="398" font-size="12.5" fill="#a8a8a8" text-anchor="start">always.</text>
</svg>