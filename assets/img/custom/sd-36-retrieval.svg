<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Retrieval knobs: what to tune, and in what order</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Bad answers are usually bad retrieval, not a bad model.</text>
<rect x="24" y="84" width="712" height="96" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="58" cy="114" r="13" fill="#22d3ee"/>
<text x="58" y="119" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">1</text>
<text x="84" y="119" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Chunking</text>
<text x="84" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Chunk size and overlap decide what a vector represents. Wrong granularity and no</text>
<text x="84" y="159" font-size="12.5" fill="#a8a8a8" text-anchor="start">reranker saves you.</text>
<rect x="24" y="194" width="712" height="96" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<circle cx="58" cy="224" r="13" fill="#f0b429"/>
<text x="58" y="229" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">2</text>
<text x="84" y="229" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Hybrid search + rerank</text>
<text x="84" y="252" font-size="12.5" fill="#a8a8a8" text-anchor="start">Keyword plus semantic, then rerank the top candidates. The highest-leverage</text>
<text x="84" y="269" font-size="12.5" fill="#a8a8a8" text-anchor="start">single change.</text>
<rect x="24" y="304" width="712" height="96" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<circle cx="58" cy="334" r="13" fill="#4ade80"/>
<text x="58" y="339" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">3</text>
<text x="84" y="339" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Filters</text>
<text x="84" y="362" font-size="12.5" fill="#a8a8a8" text-anchor="start">Metadata filters shrink the candidate set before similarity runs. Cheap and</text>
<text x="84" y="379" font-size="12.5" fill="#a8a8a8" text-anchor="start">precise.</text>
<rect x="24" y="414" width="712" height="96" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<circle cx="58" cy="444" r="13" fill="#a78bfa"/>
<text x="58" y="449" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">4</text>
<text x="84" y="449" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Top-K and score cutoff</text>
<text x="84" y="472" font-size="12.5" fill="#a8a8a8" text-anchor="start">How many chunks return, and the minimum score you trust. Cutoffs kill</text>
<text x="84" y="489" font-size="12.5" fill="#a8a8a8" text-anchor="start">hallucinations.</text>
<rect x="24" y="530" width="712" height="64" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="380" y="570" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">Debug order: chunking first, then hybrid plus rerank, then filters, then K and cutoff.</text>
</svg>