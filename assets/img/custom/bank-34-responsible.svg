<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">3.4 Responsible AI practices</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The posture questions: what a careful team does by default.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Human in the loop</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">High-stakes outputs get</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">human review before they</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">act. returnControl and</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">task tokens are the</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">mechanisms.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Transparency</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Citations, disclaimers,</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">and clear labeling of AI-</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">generated content. Users</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">know what they are</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">reading.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Data minimization</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Collect and retain only</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">what the task needs.</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Erasure covers derived</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">data too, not just the</text>
<text x="622.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">original.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">The exam's responsible-AI answers are never the clever technical fix: they are the human,</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">transparent, minimal one.</text>
</svg>