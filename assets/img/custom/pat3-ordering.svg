<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="600" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Pattern 3: Ordering and lifecycle</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Any option that inverts a lifecycle dependency is wrong on sight.</text>
<rect x="24" y="84" width="180" height="64" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="114" y="123" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Configure</text>
<line x1="204" y1="116" x2="244" y2="116" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="244.0,116.0 235.7,121.6 235.7,110.4" fill="#7d8590"/>
<rect x="244" y="84" width="180" height="64" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="334" y="123" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Prepare</text>
<line x1="424" y1="116" x2="464" y2="116" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="464.0,116.0 455.7,121.6 455.7,110.4" fill="#7d8590"/>
<rect x="464" y="84" width="180" height="64" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="554" y="123" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Test</text>
<text x="24" y="176" font-size="12.5" fill="#7d8590" text-anchor="start">Agent and flow lifecycle: configure, then prepare, then test.</text>
<rect x="24" y="206" width="180" height="64" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="114" y="245" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Select a model</text>
<line x1="204" y1="238" x2="244" y2="238" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="244.0,238.0 235.7,243.6 235.7,232.4" fill="#7d8590"/>
<rect x="244" y="206" width="180" height="64" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="334" y="245" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Customize it</text>
<text x="24" y="298" font-size="12.5" fill="#7d8590" text-anchor="start">Select the model before fine-tuning or customizing it.</text>
<rect x="24" y="328" width="180" height="64" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="114" y="367" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Scope the problem</text>
<line x1="204" y1="360" x2="244" y2="360" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="244.0,360.0 235.7,365.6 235.7,354.4" fill="#7d8590"/>
<rect x="244" y="328" width="180" height="64" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="334" y="367" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Build</text>
<text x="24" y="420" font-size="12.5" fill="#7d8590" text-anchor="start">Scope before building: requirements first, architecture second.</text>
<rect x="24" y="456" width="712" height="84" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="486" font-size="13.5" fill="#ececec" text-anchor="start">Attack plan: anchor the first step and the last step, then fill the middle. Lifecycle dependencies decide ties.</text>
<text x="44" y="508" font-size="1" fill="#7d8590" text-anchor="start"></text>
</svg>