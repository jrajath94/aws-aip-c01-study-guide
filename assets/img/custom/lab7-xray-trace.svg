<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="780" height="470" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">X-Ray trace: "where did the 8 seconds go?"</text>
<text x="24" y="58" font-size="13" fill="#7d8590">One multi-step agent run, broken into segments across service boundaries.</text>
<text x="24" y="110" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">Classifier call</text>
<rect x="220" y="90" width="31" height="26" rx="5" fill="#22d3ee" opacity="0.85"/>
<text x="259.0" y="109" font-size="12.5" fill="#7d8590" text-anchor="start">0.4s</text>
<text x="24" y="150" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">Specialist model call</text>
<rect x="220" y="130" width="326" height="26" rx="5" fill="#f0b429" opacity="0.85"/>
<text x="553.5" y="149" font-size="12.5" fill="#7d8590" text-anchor="start">4.2s</text>
<text x="24" y="190" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">Lambda tool</text>
<rect x="220" y="170" width="85" height="26" rx="5" fill="#4ade80" opacity="0.85"/>
<text x="313.25" y="189" font-size="12.5" fill="#7d8590" text-anchor="start">1.1s</text>
<text x="24" y="230" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">DynamoDB read</text>
<rect x="220" y="210" width="23" height="26" rx="5" fill="#a78bfa" opacity="0.85"/>
<text x="251.25" y="229" font-size="12.5" fill="#7d8590" text-anchor="start">0.3s</text>
<text x="24" y="270" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">Response assembly</text>
<rect x="220" y="250" width="39" height="26" rx="5" fill="#60a5fa" opacity="0.85"/>
<text x="266.75" y="269" font-size="12.5" fill="#7d8590" text-anchor="start">0.5s</text>
<text x="24" y="310" font-size="13.5" fill="#ececec" text-anchor="start" font-weight="bold">Idle / network gaps</text>
<rect x="220" y="290" width="116" height="26" rx="5" fill="#7d8590" opacity="0.85"/>
<text x="344.25" y="309" font-size="12.5" fill="#7d8590" text-anchor="start">1.5s</text>
<rect x="24" y="346" width="732" height="92" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="376" font-size="13" fill="#ececec" text-anchor="start">X-Ray = the trace across calls (latency). CloudWatch Logs Insights = prompt and response forensics.</text>
<text x="44" y="400" font-size="13" fill="#f87171" text-anchor="start">CloudTrail = audit logging, NOT performance tracing. That swap is the distractor.</text>
</svg>