<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">3.1 Guardrail controls: the full set</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Each control catches a different failure. Know them by name.</text>
<rect x="24" y="84" width="712" height="84" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="118" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Denied topics</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Whole subject areas the model must refuse.</text>
<rect x="24" y="182" width="712" height="84" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="44" y="216" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Word filters</text>
<text x="44" y="240" font-size="12.5" fill="#a8a8a8" text-anchor="start">Exact terms and phrases blocked, including profanity lists.</text>
<rect x="24" y="280" width="712" height="84" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="314" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">PII filters</text>
<text x="44" y="338" font-size="12.5" fill="#a8a8a8" text-anchor="start">Personal data detected and masked or blocked.</text>
<rect x="24" y="378" width="712" height="84" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="412" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Content filters</text>
<text x="44" y="436" font-size="12.5" fill="#a8a8a8" text-anchor="start">Hate, violence, sexual, misconduct: thresholded categories.</text>
<rect x="24" y="476" width="712" height="84" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="510" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Contextual grounding</text>
<text x="44" y="534" font-size="12.5" fill="#a8a8a8" text-anchor="start">Response checked against retrieved chunks for faithfulness.</text>
</svg>