<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="640" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Five cost levers for GenAI workloads</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Cost questions pick the lever that matches the bill's shape.</text>
<rect x="24" y="84" width="712" height="92" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<circle cx="58" cy="114" r="13" fill="#f0b429"/>
<text x="58" y="119" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">1</text>
<text x="84" y="119" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Right-size the model</text>
<text x="84" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Nova Micro or Haiku for classification and routing; reserve the flagship for</text>
<text x="84" y="159" font-size="12.5" fill="#a8a8a8" text-anchor="start">reasoning. Biggest lever.</text>
<rect x="24" y="190" width="712" height="92" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="58" cy="220" r="13" fill="#22d3ee"/>
<text x="58" y="225" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">2</text>
<text x="84" y="225" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Prompt caching</text>
<text x="84" y="248" font-size="12.5" fill="#a8a8a8" text-anchor="start">Repeated system prompts and documents billed once, not per call.</text>
<rect x="24" y="296" width="712" height="92" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<circle cx="58" cy="326" r="13" fill="#4ade80"/>
<text x="58" y="331" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">3</text>
<text x="84" y="331" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Batch inference</text>
<text x="84" y="354" font-size="12.5" fill="#a8a8a8" text-anchor="start">Offline jobs in S3: half the price of real-time, no endpoint to feed.</text>
<rect x="24" y="402" width="712" height="92" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<circle cx="58" cy="432" r="13" fill="#a78bfa"/>
<text x="58" y="437" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">4</text>
<text x="84" y="437" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Trim context</text>
<text x="84" y="460" font-size="12.5" fill="#a8a8a8" text-anchor="start">Shorter histories, tighter chunks, score cutoffs: every token has a price.</text>
<rect x="24" y="508" width="712" height="92" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<circle cx="58" cy="538" r="13" fill="#f87171"/>
<text x="58" y="543" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">5</text>
<text x="84" y="543" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Kill idle capacity</text>
<text x="84" y="566" font-size="12.5" fill="#a8a8a8" text-anchor="start">Provisioned Throughput and endpoints you no longer need still bill by the hour.</text>
</svg>