<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Which invocation path? Three doors into Bedrock</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Pick by who is talking to whom, and on what schedule.</text>
<rect x="180" y="76" width="400" height="64" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/>
<text x="380" y="115" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Something needs a model response</text>
<rect x="24" y="164" width="712" height="110" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="196" font-size="14" fill="#22d3ee" text-anchor="start" font-weight="bold">IF one request in, one response out</text>
<text x="44" y="222" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">InvokeModel / Converse: synchronous, real-time</text>
<text x="44" y="246" font-size="12.5" fill="#7d8590" text-anchor="start">The chat, classify, or generate call. Most exam scenarios live here.</text>
<rect x="24" y="288" width="712" height="110" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="320" font-size="14" fill="#4ade80" text-anchor="start" font-weight="bold">ELSE IF many jobs, no endpoint to babysit</text>
<text x="44" y="346" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Batch inference: input and output both in S3</text>
<text x="44" y="370" font-size="12.5" fill="#7d8590" text-anchor="start">Async bulk scoring on a schedule. Half the price of real-time.</text>
<rect x="24" y="412" width="712" height="110" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="444" font-size="14" fill="#a78bfa" text-anchor="start" font-weight="bold">ELSE IF latency guarantees matter</text>
<text x="44" y="470" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Provisioned Throughput: reserved capacity by the hour</text>
<text x="44" y="494" font-size="12.5" fill="#7d8590" text-anchor="start">Capacity you pay for whether you use it or not. Not a cost saver.</text>
<rect x="24" y="542" width="712" height="64" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="380" y="582" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">Read the stem for the schedule words: 'real-time' vs 'nightly batch' vs 'guaranteed latency'.</text>
</svg>