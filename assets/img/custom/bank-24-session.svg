<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">2.4 Session state: the agent's short-term memory</text>
<text x="24" y="58" font-size="13" fill="#7d8590">What persists between turns, and what you must manage.</text>
<rect x="24" y="84" width="348" height="200" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Kept</text>
<text x="198" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Conversation history, tool results,</text>
<text x="198" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">the rolling summary. This is how the</text>
<text x="198" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">agent stays coherent across turns.</text>
<rect x="388" y="84" width="348" height="200" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Trimmed</text>
<text x="562" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Old tool payloads first, then older</text>
<text x="562" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">turns into summary. Unbounded history</text>
<text x="562" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">is an unbounded bill.</text>
<rect x="24" y="308" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="336" font-size="12.5" fill="#a8a8a8" text-anchor="start">Multi-agent note: collaborators share session state to hand work off; a supervisor keeps its own</text>
<text x="44" y="354" font-size="12.5" fill="#a8a8a8" text-anchor="start">and delegates.</text>
</svg>