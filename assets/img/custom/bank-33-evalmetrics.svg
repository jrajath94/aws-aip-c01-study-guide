<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">3.3 Evaluation metrics for safety and quality</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The metrics the exam pairs with each task type.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Faithfulness</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Every claim traceable to</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">the retrieved chunks. The</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">RAG metric that matters</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">most.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Harmfulness / toxicity</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Automatic or judge-scored:</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">does the output stay</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">inside policy?</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Refusal accuracy</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Denied topics refused;</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">legitimate requests</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">answered. Both directions</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">count.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Judge bias: LLM judges favor their own model family and longer answers. Calibrate with human</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">spot checks.</text>
</svg>