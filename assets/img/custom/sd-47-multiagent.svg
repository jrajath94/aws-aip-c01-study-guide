<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Supervisor vs collaborator: who talks to whom</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Two multi-agent shapes. The exam tests which one the scenario needs.</text>
<rect x="24" y="84" width="348" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Supervisor</text>
<text x="198" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="middle">One router agent breaks the task up and</text>
<text x="198" y="160" font-size="12.5" fill="#a8a8a8" text-anchor="middle">calls specialists. Specialists never</text>
<text x="198" y="178" font-size="12.5" fill="#a8a8a8" text-anchor="middle">talk to each other.</text>
<circle cx="198" cy="234" r="22" fill="#22d3ee"/>
<text x="198" y="240" font-size="14" fill="#0d0d0d" text-anchor="middle" font-weight="bold">S</text>
<circle cx="108" cy="324" r="18" fill="#7d8590"/>
<line x1="198" y1="256" x2="108" y2="306" stroke="#7d8590" stroke-width="1.8"/>
<polygon points="108.0,306.0 112.5,297.1 118.0,306.8" fill="#7d8590"/>
<circle cx="198" cy="324" r="18" fill="#7d8590"/>
<line x1="198" y1="256" x2="198" y2="306" stroke="#7d8590" stroke-width="1.8"/>
<polygon points="198.0,306.0 192.4,297.7 203.6,297.7" fill="#7d8590"/>
<circle cx="288" cy="324" r="18" fill="#7d8590"/>
<line x1="198" y1="256" x2="288" y2="306" stroke="#7d8590" stroke-width="1.8"/>
<polygon points="288.0,306.0 278.0,306.8 283.5,297.1" fill="#7d8590"/>
<text x="198" y="370" font-size="12" fill="#7d8590" text-anchor="middle">star: S delegates</text>
<rect x="388" y="84" width="348" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Collaborator</text>
<text x="562" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Agents share session state and hand work</text>
<text x="562" y="160" font-size="12.5" fill="#a8a8a8" text-anchor="middle">to each other directly. No central</text>
<text x="562" y="178" font-size="12.5" fill="#a8a8a8" text-anchor="middle">router.</text>
<circle cx="492" cy="274" r="20" fill="#7d8590"/>
<circle cx="562" cy="274" r="20" fill="#7d8590"/>
<circle cx="632" cy="274" r="20" fill="#7d8590"/>
<line x1="512" y1="274" x2="542" y2="274" stroke="#7d8590" stroke-width="1.8"/>
<polygon points="542.0,274.0 533.7,279.6 533.7,268.4" fill="#7d8590"/>
<line x1="582" y1="274" x2="612" y2="274" stroke="#7d8590" stroke-width="1.8"/>
<polygon points="612.0,274.0 603.7,279.6 603.7,268.4" fill="#7d8590"/>
<line x1="622" y1="292" x2="502" y2="292" stroke="#7d8590" stroke-width="1.8" stroke-dasharray="4,4"/>
<polygon points="502.0,292.0 510.3,286.4 510.3,297.6" fill="#7d8590"/>
<text x="562" y="370" font-size="12" fill="#7d8590" text-anchor="middle">mesh: agents hand off</text>
<rect x="24" y="408" width="712" height="80" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="380" y="456" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">Rule of thumb: needs a single decider: supervisor. Needs shared context and handoffs: collaborator.</text>
</svg>