<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">4.2 LoRA vs full fine-tuning</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Two ways to change weights. Different bills, different risks.</text>
<rect x="24" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">LoRA / PEFT</text>
<text x="198" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Trains small adapter matrices; the</text>
<text x="198" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">base model stays frozen. Cheap, fast,</text>
<text x="198" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">and the base knowledge is preserved.</text>
<rect x="388" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">Full fine-tuning</text>
<text x="562" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Updates all weights. Most expressive,</text>
<text x="562" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">most expensive, and risks catastrophic</text>
<text x="562" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">forgetting of base abilities.</text>
<rect x="24" y="328" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="356" font-size="12.5" fill="#a8a8a8" text-anchor="start">Catastrophic forgetting: the model learns the new task and degrades on old ones. LoRA's frozen</text>
<text x="44" y="374" font-size="12.5" fill="#a8a8a8" text-anchor="start">base is the standard defense.</text>
</svg>