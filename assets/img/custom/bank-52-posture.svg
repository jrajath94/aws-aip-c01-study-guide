<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">5.2 Security and governance posture</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The non-negotiables the D5 questions test.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">No training on customer data</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Bedrock does not train on</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">your prompts or data. The</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">posture behind half the D5</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">questions.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Least privilege</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">One role per component;</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">each role holds only the</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">actions it needs. Shared</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">admin roles are the smell.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Audit everything</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">CloudTrail for who-did-</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">what; VPC endpoints to</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">keep traffic private; KMS</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">for data at rest.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">When a D5 stem describes a scary practice, the answer is the posture statement: the safe,</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">minimal, auditable option.</text>
</svg>