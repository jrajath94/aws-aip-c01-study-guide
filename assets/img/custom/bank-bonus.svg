<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Bonus: the professional bar ramps up</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The last stretch of the bank is deliberately harder. That is the point.</text>
<rect x="120.0" y="84" width="520" height="96" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380" y="110" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Core bank</text>
<text x="380" y="130" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Breadth: every task statement represented, each answerable from</text>
<text x="380" y="147" font-size="12.5" fill="#a8a8a8" text-anchor="middle">the chapter.</text>
<line x1="380" y1="180" x2="380" y2="200" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,200.0 374.4,191.7 385.6,191.7" fill="#7d8590"/>
<rect x="120.0" y="204" width="520" height="96" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="380" y="230" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Harder variants</text>
<text x="380" y="250" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Depth: the same concepts asked with tighter distractors and</text>
<text x="380" y="267" font-size="12.5" fill="#a8a8a8" text-anchor="middle">combined constraints.</text>
<line x1="380" y1="300" x2="380" y2="320" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,320.0 374.4,311.7 385.6,311.7" fill="#7d8590"/>
<rect x="120.0" y="324" width="520" height="96" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="380" y="350" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Exam day</text>
<text x="380" y="370" font-size="12.5" fill="#a8a8a8" text-anchor="middle">You have seen the concept three ways: chapter, bank, and bonus.</text>
<text x="380" y="387" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Nothing arrives cold.</text>
<rect x="24" y="444" width="712" height="70" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="380" y="484" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">If a bonus question stings, it worked: go re-read the chapter section it points to.</text>
</svg>