<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="640" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Guardrails: layer the controls, name the verbs</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Each control type catches a different failure. Defense in depth, both directions.</text>
<rect x="24" y="84" width="712" height="88" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="118" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Denied topics</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Blocks whole subject areas: the model refuses before generating.</text>
<rect x="24" y="186" width="712" height="88" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="44" y="220" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Word filters</text>
<text x="44" y="244" font-size="12.5" fill="#a8a8a8" text-anchor="start">Blocks exact terms and phrases, including PII patterns.</text>
<rect x="24" y="288" width="712" height="88" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="322" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">PII redaction</text>
<text x="44" y="346" font-size="12.5" fill="#a8a8a8" text-anchor="start">Detects and masks personal data in inputs and outputs.</text>
<rect x="24" y="390" width="712" height="88" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="424" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Contextual grounding</text>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Checks the response against the retrieved chunks: faithfulness enforced.</text>
<rect x="24" y="500" width="712" height="120" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="530" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">The verb drill</text>
<text x="44" y="554" font-size="12.5" fill="#a8a8a8" text-anchor="start">block, filter, redact, check: when a stem says 'prevent the model from revealing X', match the</text>
<text x="44" y="572" font-size="12.5" fill="#a8a8a8" text-anchor="start">verb to the control. Denied topics refuse subjects; filters catch terms; redaction masks PII;</text>
<text x="44" y="590" font-size="12.5" fill="#a8a8a8" text-anchor="start">grounding checks claims.</text>
</svg>