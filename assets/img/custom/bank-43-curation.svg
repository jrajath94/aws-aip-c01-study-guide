<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">4.3 Data curation for fine-tuning</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The dataset decides the outcome more than the hyperparameters.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Quality over quantity</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">A few thousand clean,</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">diverse, correctly</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">formatted pairs beat a</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">mountain of noisy ones.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Format match</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Train in the exact prompt</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">format the model will see</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">at inference. Format</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">mismatch silently wastes</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">the run.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Decontaminate</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Keep eval data out of</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">training data. Leakage</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">makes metrics lie and the</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">exam loves asking about</text>
<text x="622.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">it.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Order of operations: curate first, then train. No hyperparameter rescues a bad dataset.</text>
</svg>