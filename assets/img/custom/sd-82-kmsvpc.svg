<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Data protection: encryption and network isolation</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Two different jobs. The exam swaps them to make distractors.</text>
<rect x="24" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">KMS</text>
<text x="198" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Encrypts data at rest: S3 buckets,</text>
<text x="198" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">vector stores, model artifacts.</text>
<text x="198" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Customer-managed keys for the</text>
<text x="198" y="198" font-size="12.5" fill="#a8a8a8" text-anchor="middle">strictest tenants.</text>
<rect x="388" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">VPC endpoints</text>
<text x="562" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Keeps traffic off the public internet:</text>
<text x="562" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Bedrock, S3, and KMS calls stay inside</text>
<text x="562" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">your VPC. Network isolation, not</text>
<text x="562" y="198" font-size="12.5" fill="#a8a8a8" text-anchor="middle">encryption.</text>
<rect x="24" y="328" width="712" height="96" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="358" font-size="14.5" fill="#f87171" text-anchor="start" font-weight="bold">The swap</text>
<text x="44" y="382" font-size="12.5" fill="#a8a8a8" text-anchor="start">'Use KMS to keep traffic off the internet' is wrong. 'Use VPC endpoints to encrypt stored</text>
<text x="44" y="400" font-size="12.5" fill="#a8a8a8" text-anchor="start">vectors' is wrong. Name the job, then the tool.</text>
</svg>