<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="480" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Streaming: perceived latency vs real latency</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Total generation time is the same. Time-to-first-token is what the user feels.</text>
<rect x="24" y="120" width="200" height="90" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="124" y="160" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">No streaming</text>
<text x="124" y="184" font-size="12.5" fill="#7d8590" text-anchor="middle">user waits, waits...</text>
<rect x="250" y="130" width="460" height="20" rx="6" fill="#f87171" opacity="0.8"/>
<text x="250" y="182" font-size="12.5" fill="#7d8590" text-anchor="start">full answer appears at once after 12s</text>
<rect x="24" y="240" width="200" height="90" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="124" y="280" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Streaming</text>
<text x="124" y="304" font-size="12.5" fill="#7d8590" text-anchor="middle">words appear at 0.8s</text>
<rect x="250" y="250" width="60" height="20" rx="6" fill="#4ade80" opacity="0.9"/>
<rect x="250" y="276" width="460" height="20" rx="6" fill="#4ade80" opacity="0.35"/>
<text x="250" y="322" font-size="12.5" fill="#7d8590" text-anchor="start">first token in under a second; full answer still takes 12s</text>
<rect x="24" y="370" width="712" height="80" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="400" font-size="13" fill="#ececec" text-anchor="start">InvokeModelWithResponseStream. Same bill, happier users. The exam pairs it with any UX latency complaint.</text>
</svg>