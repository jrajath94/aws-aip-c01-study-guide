<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">CloudTrail vs CloudWatch Logs: who answers what</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Audit trail and application logs are different evidence.</text>
<rect x="24" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="198" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">CloudTrail</text>
<text x="198" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">WHO did WHAT, WHEN: API calls, console</text>
<text x="198" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">actions, policy changes. The audit</text>
<text x="198" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">trail for compliance and forensics.</text>
<rect x="388" y="84" width="348" height="220" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/>
<text x="562" y="116" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">CloudWatch Logs</text>
<text x="562" y="144" font-size="12.5" fill="#a8a8a8" text-anchor="middle">WHAT the app said: prompts, responses,</text>
<text x="562" y="162" font-size="12.5" fill="#a8a8a8" text-anchor="middle">errors, traces. Logs Insights queries</text>
<text x="562" y="180" font-size="12.5" fill="#a8a8a8" text-anchor="middle">them. The debugging evidence.</text>
<rect x="24" y="328" width="712" height="96" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="356" font-size="12.5" fill="#a8a8a8" text-anchor="start">'Check CloudTrail to see why the model answered badly' is the distractor. Prompts live in Logs;</text>
<text x="44" y="374" font-size="12.5" fill="#a8a8a8" text-anchor="start">identity actions live in Trail.</text>
</svg>