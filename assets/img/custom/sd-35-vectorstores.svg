<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Where do vectors live? Four managed answers</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Each store answers a different scale and budget story.</text>
<rect x="24.0" y="84" width="167.5" height="250" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="107.75" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">OpenSearch Serverless</text>
<text x="107.75" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Full search +</text>
<text x="107.75" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">vectors in one</text>
<text x="107.75" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">engine; familiar</text>
<text x="107.75" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">ops; pay for what</text>
<text x="107.75" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">you use.</text>
<rect x="205.5" y="84" width="167.5" height="250" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="289.25" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Aurora PostgreSQL + pgvector</text>
<text x="289.25" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Vectors beside your</text>
<text x="289.25" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">relational data;</text>
<text x="289.25" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">one database to</text>
<text x="289.25" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">govern; strong</text>
<text x="289.25" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">consistency story.</text>
<rect x="387.0" y="84" width="167.5" height="250" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="470.75" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Neptune Analytics</text>
<text x="470.75" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Graph-shaped</text>
<text x="470.75" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">retrieval; vectors</text>
<text x="470.75" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">plus graph</text>
<text x="470.75" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">traversal in one</text>
<text x="470.75" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">place.</text>
<rect x="568.5" y="84" width="167.5" height="250" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="652.25" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">S3 Vectors</text>
<text x="652.25" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Cheapest at very</text>
<text x="652.25" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">large scale; native</text>
<text x="652.25" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">S3 durability;</text>
<text x="652.25" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">simplest story for</text>
<text x="652.25" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">bulk similarity.</text>
<rect x="24" y="358" width="712" height="90" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="388" font-size="14" fill="#f87171" text-anchor="start" font-weight="bold">Trap answers</text>
<text x="44" y="412" font-size="12.5" fill="#a8a8a8" text-anchor="start">ElastiCache: a cache, not a vector store. DynamoDB alone: no native vector search story. Pick</text>
<text x="44" y="430" font-size="12.5" fill="#a8a8a8" text-anchor="start">the store that does similarity natively.</text>
</svg>