<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.6 Cost and latency tradeoffs</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Every optimization question moves one of these needles.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Cut tokens</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Trim context, tighten</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">chunks, cap max tokens.</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Every token has a price</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">and a latency cost.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Cache repeats</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Prompt caching for static</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">prefixes; semantic caching</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">for similar questions</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">asked ten ways.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Right-size + batch</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Small models for easy</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">calls; batch inference for</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">offline work at half</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">price.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Read the bill's shape first: is it input tokens, output tokens, idle capacity, or latency SLA?</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">The shape picks the lever.</text>
</svg>