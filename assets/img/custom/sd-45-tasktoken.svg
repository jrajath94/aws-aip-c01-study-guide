<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="600" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Approvals without polling: Step Functions task tokens</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The workflow pauses for a human. No loop, no timer, no wasted compute.</text>
<rect x="120.0" y="84" width="520" height="88" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380" y="110" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">InvokeModel</text>
<text x="380" y="130" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Bedrock runs the agent step.</text>
<line x1="380" y1="172" x2="380" y2="192" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,192.0 374.4,183.7 385.6,183.7" fill="#7d8590"/>
<rect x="120.0" y="196" width="520" height="88" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="380" y="222" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Send task token</text>
<text x="380" y="242" font-size="12.5" fill="#a8a8a8" text-anchor="middle">The token plus a callback URL go to the reviewer: email, Slack,</text>
<text x="380" y="259" font-size="12.5" fill="#a8a8a8" text-anchor="middle">ticket.</text>
<line x1="380" y1="284" x2="380" y2="304" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,304.0 374.4,295.7 385.6,295.7" fill="#7d8590"/>
<rect x="120.0" y="308" width="520" height="88" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="380" y="334" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Human decides</text>
<text x="380" y="354" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Approve or reject. Hours or days can pass; the execution just</text>
<text x="380" y="371" font-size="12.5" fill="#a8a8a8" text-anchor="middle">waits.</text>
<line x1="380" y1="396" x2="380" y2="416" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,416.0 374.4,407.7 385.6,407.7" fill="#7d8590"/>
<rect x="120.0" y="420" width="520" height="88" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="380" y="446" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Callback with token</text>
<text x="380" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="middle">SendTaskSuccess or SendTaskFailure resumes the workflow exactly</text>
<text x="380" y="483" font-size="12.5" fill="#a8a8a8" text-anchor="middle">where it paused.</text>
<rect x="24" y="532" width="712" height="64" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="380" y="570" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">returnControl is the agent-side twin of this pattern: pause the agent, ask a human, resume.</text>
</svg>