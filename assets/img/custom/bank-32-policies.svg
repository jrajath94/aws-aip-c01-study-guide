<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">3.2 Safety policies and configuration</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Guardrails are configured, versioned, and applied in two directions.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Configure</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Set thresholds and denied</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">topics per control. One</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">guardrail, many policies</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">across use cases.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Version</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Version the guardrail like</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">any config: test changes</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">in DRAFT before production</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">traffic sees them.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Apply both ways</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Filter the input prompt</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">AND the model output.</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Attacks arrive as inputs;</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">leaks leave as outputs.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">ApplyGuardrail lets you run the same policy as a standalone check on any text, outside a model</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">call.</text>
</svg>