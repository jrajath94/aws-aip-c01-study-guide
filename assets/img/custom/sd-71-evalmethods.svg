<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Evaluation: the four methods again, with their exam jobs</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Same matrix as D5, now wearing system-design clothes.</text>
<rect x="24" y="76" width="712" height="112" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="40" y="106" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Automatic</text>
<circle cx="706" cy="104" r="4" fill="#f0b429"/>
<text x="40" y="132" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: accuracy, stability, toxicity vs labels</text>
<text x="40" y="150" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: regression suites you run on every deploy</text>
<rect x="24" y="202" width="712" height="112" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="40" y="232" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">LLM-as-a-judge</text>
<circle cx="706" cy="230" r="4" fill="#22d3ee"/>
<text x="40" y="258" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: faithfulness, completeness, harmfulness, refusal</text>
<text x="40" y="276" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: RAG answer quality and agent behavior at scale</text>
<rect x="24" y="328" width="712" height="112" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="40" y="358" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">Human</text>
<circle cx="706" cy="356" r="4" fill="#4ade80"/>
<text x="40" y="384" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: relevance, tone, brand voice</text>
<text x="40" y="402" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: sign-off on subjective quality; spot checks</text>
<rect x="24" y="454" width="712" height="112" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="40" y="484" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">BYOI</text>
<circle cx="706" cy="482" r="4" fill="#a78bfa"/>
<text x="40" y="510" font-size="12.5" fill="#a8a8a8" text-anchor="start">Measures: same metrics on your own inference</text>
<text x="40" y="528" font-size="12.5" fill="#a8a8a8" text-anchor="start">When to use: comparing a non-Bedrock model or full pipeline</text>
<text x="24" y="600" font-size="12.5" fill="#7d8590" text-anchor="start">Judge bias note: an LLM judge favors its own model family and long answers. Calibrate with human</text>
<text x="24" y="618" font-size="12.5" fill="#7d8590" text-anchor="start">spot checks before trusting it.</text>
</svg>