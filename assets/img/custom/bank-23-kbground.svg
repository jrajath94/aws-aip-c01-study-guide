<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">2.3 Knowledge base grounding</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The agent's private library card. Retrieval quality is answer quality.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Retrieve</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Semantic search over your</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">documents at decision</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">time. Chunking and</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">embeddings decide what</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">comes back.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Generate</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">The model answers using</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">the retrieved chunks as</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">context, with citations it</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">can point to.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Stale sync</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">New documents invisible</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">until the next sync. The</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">top 'the KB is broken'</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">false alarm.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Hallucination questions in 2.3 are retrieval questions: the agent answered from weights because</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">the chunks never arrived.</text>
</svg>