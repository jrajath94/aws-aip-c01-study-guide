<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.2 Preparing data for RAG</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The pipeline every ingestion question is secretly about.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Chunk</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Split documents into</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">pieces sized to the</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">embedding model's window.</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">Too big dilutes meaning;</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">too small loses context.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Embed</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Same model at index time</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">and query time. Mixing</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">models silently breaks</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">retrieval.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Index + sync</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Vectors go to the store on</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">a schedule. New documents</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">are invisible until the</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">next sync.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Most 1.2 questions reduce to one broken stage: bad chunking, a swapped embedding model, or a</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">stale sync. Find the stage, find the answer.</text>
</svg>