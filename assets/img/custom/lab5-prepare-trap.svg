<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">'The agent never calls my new action': the diagnostic</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The single most common agent bug, and the exam loves it.</text>
<rect x="150" y="76" width="460" height="70" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380" y="104" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Symptom: agent ignores the new action group</text>
<line x1="380" y1="146" x2="380" y2="176" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,176.0 374.4,167.7 385.6,167.7" fill="#7d8590"/>
<polygon points="380,176.0 590.0,226 380,276.0 170.0,226" fill="#101318" stroke="#f0b429" stroke-width="1.8"/>
<text x="380" y="212" font-size="13" fill="#ececec" text-anchor="middle">Did you run PrepareAgent after</text>
<text x="380" y="230" font-size="13" fill="#ececec" text-anchor="middle">the change?</text>
<text x="620" y="200" font-size="12.5" fill="#f87171" text-anchor="start" font-weight="bold">no: run it;</text>
<text x="620" y="220" font-size="11.5" fill="#7d8590" text-anchor="start">DRAFT never picked</text>
<text x="620" y="238" font-size="11.5" fill="#7d8590" text-anchor="start">up the change</text>
<line x1="380" y1="276" x2="380" y2="306" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,306.0 374.4,297.7 385.6,297.7" fill="#7d8590"/>
<text x="396" y="296" font-size="12.5" fill="#4ade80" text-anchor="start">yes</text>
<polygon points="380,306.0 600.0,366 380,426.0 160.0,366" fill="#101318" stroke="#f0b429" stroke-width="1.8"/>
<text x="380" y="348" font-size="13" fill="#ececec" text-anchor="middle">Is prod traffic on an alias</text>
<text x="380" y="366" font-size="13" fill="#ececec" text-anchor="middle">pinned to the prepared version?</text>
<text x="636" y="340" font-size="12.5" fill="#f87171" text-anchor="start" font-weight="bold">no: point the alias;</text>
<text x="636" y="360" font-size="11.5" fill="#7d8590" text-anchor="start">traffic still hits</text>
<text x="636" y="378" font-size="11.5" fill="#7d8590" text-anchor="start">the old version</text>
<line x1="380" y1="426" x2="380" y2="456" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,456.0 374.4,447.7 385.6,447.7" fill="#7d8590"/>
<text x="396" y="446" font-size="12.5" fill="#4ade80" text-anchor="start">yes</text>
<rect x="150" y="456" width="460" height="48" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="380" y="486" font-size="13.5" fill="#ececec" text-anchor="middle" font-weight="bold">Then check IAM and the action schema.</text>
</svg>