<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Session memory: keep the signal, drop the bulk</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The context window is a budget. Spend it on what the next turn needs.</text>
<rect x="24" y="84" width="712" height="96" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="118" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Keep: summary of older turns</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">Compress history into a rolling summary. The agent remembers decisions, not every word.</text>
<rect x="24" y="194" width="712" height="96" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="228" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Keep: recent turns verbatim</text>
<text x="44" y="252" font-size="12.5" fill="#a8a8a8" text-anchor="start">The last few exchanges stay exact: pronouns and references resolve correctly.</text>
<rect x="24" y="304" width="712" height="96" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="338" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Drop: tool result bulk</text>
<text x="44" y="362" font-size="12.5" fill="#a8a8a8" text-anchor="start">Old tool outputs are the first to go. Keep the extracted answer, drop the raw payload.</text>
<rect x="24" y="422" width="712" height="84" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="450" font-size="12.5" fill="#a8a8a8" text-anchor="start">Why it matters: unbounded history grows every token of every call (Lab 1). Trimming is how long</text>
<text x="44" y="468" font-size="12.5" fill="#a8a8a8" text-anchor="start">sessions stay affordable and coherent.</text>
</svg>