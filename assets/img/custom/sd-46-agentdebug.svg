<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The agent misbehaves: the debug order</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Work this order and you find it in minutes, not hours.</text>
<rect x="100.0" y="84" width="560" height="86" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380" y="110" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">1. Trace</text>
<text x="380" y="130" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Turn on the trace. Read what the agent actually decided: which</text>
<text x="380" y="147" font-size="12.5" fill="#a8a8a8" text-anchor="middle">action, what input, what came back.</text>
<line x1="380" y1="170" x2="380" y2="184" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,184.0 374.4,175.7 385.6,175.7" fill="#7d8590"/>
<rect x="100.0" y="188" width="560" height="86" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="380" y="214" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">2. Prompt</text>
<text x="380" y="234" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Is the instruction clear, ordered, and free of contradictions? Most</text>
<text x="380" y="251" font-size="12.5" fill="#a8a8a8" text-anchor="middle">reasoning failures live here.</text>
<line x1="380" y1="274" x2="380" y2="288" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,288.0 374.4,279.7 385.6,279.7" fill="#7d8590"/>
<rect x="100.0" y="292" width="560" height="86" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="380" y="318" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">3. Schema</text>
<text x="380" y="338" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Does the action schema describe inputs the model can actually fill?</text>
<text x="380" y="355" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Vague schemas get vague calls.</text>
<line x1="380" y1="378" x2="380" y2="392" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,392.0 374.4,383.7 385.6,383.7" fill="#7d8590"/>
<rect x="100.0" y="396" width="560" height="86" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="380" y="422" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">4. Data</text>
<text x="380" y="442" font-size="12.5" fill="#a8a8a8" text-anchor="middle">Is the tool returning what the agent expects? A changed API response</text>
<text x="380" y="459" font-size="12.5" fill="#a8a8a8" text-anchor="middle">breaks everything downstream.</text>
<line x1="380" y1="482" x2="380" y2="496" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="380.0,496.0 374.4,487.7 385.6,487.7" fill="#7d8590"/>
<rect x="100.0" y="500" width="560" height="86" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380" y="526" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">5. Permissions</text>
<text x="380" y="546" font-size="12.5" fill="#a8a8a8" text-anchor="middle">IAM last: the agent's role needs each action it tries. Denials hide</text>
<text x="380" y="563" font-size="12.5" fill="#a8a8a8" text-anchor="middle">as empty results.</text>
</svg>