<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">2.2 Action groups: how agents touch the world</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Two ways to give an agent hands. The schema is the contract.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Lambda action group</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Your function runs the</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">logic: database writes,</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">API calls, calculations.</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">The agent passes</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">parameters; the function</text>
<text x="138.0" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">returns results.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">OpenAPI action group</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Describe a REST API and</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">the agent calls it</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">directly. No Lambda in the</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">middle for simple</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">integrations.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">The schema</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Parameters, types,</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">descriptions: precise</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">schemas get precise calls.</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">Vague schemas are the top</text>
<text x="622.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">debugging suspect after</text>
<text x="622.0" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">the prompt.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">After any action-group change: PrepareAgent, or the agent keeps using the old DRAFT. The exam</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">asks this constantly.</text>
</svg>