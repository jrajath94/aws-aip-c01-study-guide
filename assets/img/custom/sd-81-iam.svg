<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="610" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">IAM: one role per component, least privilege each</text>
<text x="24" y="58" font-size="13" fill="#7d8590">If one credential does everything, the design is already wrong.</text>
<rect x="24" y="84" width="712" height="96" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="118" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Lambda execution role</text>
<text x="44" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="start">InvokeModel on the models it calls. Nothing else.</text>
<rect x="24" y="194" width="712" height="96" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="228" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Agent service role</text>
<text x="44" y="252" font-size="12.5" fill="#a8a8a8" text-anchor="start">Action groups, KB retrieve, Guardrail apply: only the actions this agent uses.</text>
<rect x="24" y="304" width="712" height="96" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="338" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Human reviewer</text>
<text x="44" y="362" font-size="12.5" fill="#a8a8a8" text-anchor="start">SendTaskSuccess / SendTaskFailure on the workflow: approve or reject, nothing more.</text>
<rect x="24" y="414" width="712" height="96" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="448" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">CI deploy role</text>
<text x="44" y="472" font-size="12.5" fill="#a8a8a8" text-anchor="start">Create and update the stacks: no runtime data access at all.</text>
<rect x="24" y="530" width="712" height="64" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380" y="570" font-size="13" fill="#ececec" text-anchor="middle" font-weight="bold">Exam smell: a single admin-style role shared by Lambda, agent, and humans. Split it.</text>
</svg>