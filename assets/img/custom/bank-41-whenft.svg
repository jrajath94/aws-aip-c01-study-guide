<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">4.1 When fine-tuning is the answer</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Behavior change, not knowledge change. The ladder's top rung.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">New behavior</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Tone, format, domain</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">style, or a skill baked</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">into weights. Labeled</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">prompt-response pairs in</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">S3.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Not for facts</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Private documents and</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">current events belong in</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">RAG. Training facts into</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">weights is the classic</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">trap.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Usually + PT</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Fine-tuned models</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">typically need Provisioned</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Throughput for dedicated</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">serving. Budget both.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Overhead filter: if prompt engineering or RAG solves it, fine-tuning is the wrong answer no</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">matter how well it would work.</text>
</svg>