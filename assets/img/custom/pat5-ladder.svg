<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Pattern 5: Managed-first and the ladder</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Climb only until the requirement is met. Jumping to training fails the overhead filter.</text>
<rect x="24" y="84" width="636" height="72" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="58" cy="120.0" r="17" fill="#22d3ee"/>
<text x="58" y="126.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">1</text>
<text x="88" y="114" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Prompt engineering</text>
<text x="88" y="134" font-size="12" fill="#a8a8a8" text-anchor="start">New format, tone, few-shot, chain-of-thought. Zero infrastructure.</text>
<rect x="24" y="168" width="636" height="72" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<circle cx="58" cy="204.0" r="17" fill="#f0b429"/>
<text x="58" y="210.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">2</text>
<text x="88" y="198" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">RAG / Knowledge Bases</text>
<text x="88" y="218" font-size="12" fill="#a8a8a8" text-anchor="start">Private, current, or cited facts the model was not trained on.</text>
<rect x="24" y="252" width="636" height="72" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<circle cx="58" cy="288.0" r="17" fill="#4ade80"/>
<text x="58" y="294.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">3</text>
<text x="88" y="282" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Agents</text>
<text x="88" y="302" font-size="12" fill="#a8a8a8" text-anchor="start">Actions: API calls, databases, multi-step tool use, session memory.</text>
<rect x="24" y="336" width="636" height="72" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<circle cx="58" cy="372.0" r="17" fill="#fb923c"/>
<text x="58" y="378.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">4</text>
<text x="88" y="366" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Fine-tuning</text>
<text x="88" y="386" font-size="12" fill="#a8a8a8" text-anchor="start">New behavior baked into weights. Labeled data in S3, then usually Provisioned</text>
<text x="88" y="402" font-size="12" fill="#a8a8a8" text-anchor="start">Throughput.</text>
<line x1="678" y1="92" x2="678" y2="412" stroke="#f0b429" stroke-width="2"/>
<line x1="678" y1="400" x2="678" y2="92" stroke="#f0b429" stroke-width="2.2"/>
<polygon points="678.0,92.0 683.6,100.3 672.4,100.3" fill="#f0b429"/>
<text x="678" y="438" font-size="11.5" fill="#f0b429" text-anchor="middle">cost + effort</text>
<rect x="24" y="426" width="712" height="64" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="380" y="460" font-size="13.5" fill="#ececec" text-anchor="middle" font-weight="bold">Options that jump straight to training or custom builds fail the overhead filter.</text>
</svg>