<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="600" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.1 Use case: RAG or fine-tuning?</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The decision the whole cluster keeps asking. One flowchart answers most of it.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">RAG</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Facts are private,</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">current, or need</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">citations. Document corpus</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">changes often. You</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">retrieve at query time.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Fine-tuning</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Behavior must change:</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">tone, format, a new skill</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">baked into weights. You</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">train once on labeled</text>
<text x="380.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">pairs.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Neither</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">A good prompt already does</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">it. Prompt engineering</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">first, always.</text>
<rect x="24" y="420" width="712" height="100" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="450" font-size="14.5" fill="#f87171" text-anchor="start" font-weight="bold">Trap to burn in</text>
<text x="44" y="474" font-size="12.5" fill="#a8a8a8" text-anchor="start">Fine-tuning a model so it 'knows' your private documents is the classic wrong answer. Knowledge</text>
<text x="44" y="492" font-size="12.5" fill="#a8a8a8" text-anchor="start">goes in retrieval; behavior goes in weights.</text>
</svg>