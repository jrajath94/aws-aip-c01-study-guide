<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="620" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Exam surface: what each domain really tests</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Weight decides study time. The test surface decides what to memorize.</text>
<rect x="24" y="84" width="90" height="84" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="69" y="118" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">D1</text>
<text x="69" y="142" font-size="14" fill="#f0b429" text-anchor="middle" font-weight="bold">31%</text>
<rect x="128" y="84" width="608" height="84" rx="8" fill="#101318" stroke="#101318" stroke-width="1.6"/>
<text x="144" y="114" font-size="12.5" fill="#a8a8a8" text-anchor="start">RAG over fine-tuning for fresh docs; chunking and embedding tradeoffs;</text>
<text x="144" y="132" font-size="12.5" fill="#a8a8a8" text-anchor="start">Converse fields; prompt caching; model switching without redeploys</text>
<rect x="24" y="184" width="90" height="84" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="69" y="218" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">D2</text>
<text x="69" y="242" font-size="14" fill="#22d3ee" text-anchor="middle" font-weight="bold">26%</text>
<rect x="128" y="184" width="608" height="84" rx="8" fill="#101318" stroke="#101318" stroke-width="1.6"/>
<text x="144" y="214" font-size="12.5" fill="#a8a8a8" text-anchor="start">Agent lifecycle (configure, prepare, test); action groups with Lambda or</text>
<text x="144" y="232" font-size="12.5" fill="#a8a8a8" text-anchor="start">OpenAPI; KB grounding; returnControl for approvals; trace for debugging</text>
<rect x="24" y="284" width="90" height="84" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="69" y="318" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">D3</text>
<text x="69" y="342" font-size="14" fill="#4ade80" text-anchor="middle" font-weight="bold">20%</text>
<rect x="128" y="284" width="608" height="84" rx="8" fill="#101318" stroke="#101318" stroke-width="1.6"/>
<text x="144" y="314" font-size="12.5" fill="#a8a8a8" text-anchor="start">Guardrail control types; denied topics vs word filters vs PII filters;</text>
<text x="144" y="332" font-size="12.5" fill="#a8a8a8" text-anchor="start">defense in depth in and out; faithfulness and citation metrics; judge bias</text>
<rect x="24" y="384" width="90" height="84" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="69" y="418" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">D4</text>
<text x="69" y="442" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="bold">12%</text>
<rect x="128" y="384" width="608" height="84" rx="8" fill="#101318" stroke="#101318" stroke-width="1.6"/>
<text x="144" y="414" font-size="12.5" fill="#a8a8a8" text-anchor="start">LoRA vs full fine-tuning; catastrophic forgetting; data curation order;</text>
<text x="144" y="432" font-size="12.5" fill="#a8a8a8" text-anchor="start">distributed training vocabulary; SageMaker lineage (Registry + Experiments)</text>
<rect x="24" y="484" width="90" height="84" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="69" y="518" font-size="16" fill="#ececec" text-anchor="middle" font-weight="bold">D5</text>
<text x="69" y="542" font-size="14" fill="#fb923c" text-anchor="middle" font-weight="bold">11%</text>
<rect x="128" y="484" width="608" height="84" rx="8" fill="#101318" stroke="#101318" stroke-width="1.6"/>
<text x="144" y="514" font-size="12.5" fill="#a8a8a8" text-anchor="start">No-training-on-customer-data posture; VPC isolation; human-in-the-loop for</text>
<text x="144" y="532" font-size="12.5" fill="#a8a8a8" text-anchor="start">high-stakes outputs; CloudWatch Bedrock metrics; erasure covers derived data</text>
</svg>