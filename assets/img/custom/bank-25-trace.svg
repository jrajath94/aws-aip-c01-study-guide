<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="520" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">2.5 Trace and debug: read what the agent actually did</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The trace is the flight recorder. Open it before theorizing.</text>
<rect x="24" y="84" width="712" height="200" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="118" font-size="15.5" fill="#ececec" text-anchor="start" font-weight="bold">What the trace shows</text>
<text x="44" y="146" font-size="12.5" fill="#a8a8a8" text-anchor="start">each reasoning step: what the model decided and why</text>
<text x="44" y="172" font-size="12.5" fill="#a8a8a8" text-anchor="start">each action call: exact inputs passed to the tool</text>
<text x="44" y="198" font-size="12.5" fill="#a8a8a8" text-anchor="start">each observation: what the tool returned</text>
<text x="44" y="224" font-size="12.5" fill="#a8a8a8" text-anchor="start">where it went wrong: the step the plan broke down</text>
<rect x="24" y="308" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="336" font-size="12.5" fill="#a8a8a8" text-anchor="start">Debug order after the trace: prompt, schema, tool data, IAM. The trace tells you which one to</text>
<text x="44" y="354" font-size="12.5" fill="#a8a8a8" text-anchor="start">check first.</text>
</svg>