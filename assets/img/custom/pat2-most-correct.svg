<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Pattern 2: MOST correct, not merely correct</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Two or three options will technically work. Tiebreakers, in order:</text>
<rect x="24" y="84" width="636" height="68" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<circle cx="58" cy="118.0" r="17" fill="#f0b429"/>
<text x="58" y="124.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">1</text>
<text x="88" y="114" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Managed service over custom build</text>
<text x="88" y="134" font-size="12" fill="#a8a8a8" text-anchor="start">The AWS-native managed path wins ties.</text>
<rect x="24" y="164" width="636" height="68" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<circle cx="58" cy="198.0" r="17" fill="#22d3ee"/>
<text x="58" y="204.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">2</text>
<text x="88" y="194" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Cheaper over pricier at the same quality</text>
<text x="88" y="214" font-size="12" fill="#a8a8a8" text-anchor="start">Same outcome, lower bill: pick the bill.</text>
<rect x="24" y="244" width="636" height="68" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<circle cx="58" cy="278.0" r="17" fill="#4ade80"/>
<text x="58" y="284.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">3</text>
<text x="88" y="274" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Simpler architecture over complex</text>
<text x="88" y="294" font-size="12" fill="#a8a8a8" text-anchor="start">Fewer moving parts, fewer failure modes.</text>
<rect x="24" y="324" width="636" height="68" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<circle cx="58" cy="358.0" r="17" fill="#a78bfa"/>
<text x="58" y="364.0" font-size="15" fill="#0b0e12" text-anchor="middle" font-weight="bold">4</text>
<text x="88" y="354" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">AWS-native over third-party</text>
<text x="88" y="374" font-size="12" fill="#a8a8a8" text-anchor="start">When torn, ask: which would an AWS solutions architect defend in a review?</text>
<line x1="678" y1="92" x2="678" y2="396" stroke="#f0b429" stroke-width="2"/>
<line x1="678" y1="384" x2="678" y2="92" stroke="#f0b429" stroke-width="2.2"/>
<polygon points="678.0,92.0 683.6,100.3 672.4,100.3" fill="#f0b429"/>
<text x="678" y="422" font-size="11.5" fill="#f0b429" text-anchor="middle">cost + effort</text>
</svg>