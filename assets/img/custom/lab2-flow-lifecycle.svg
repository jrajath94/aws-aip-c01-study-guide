<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="430" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Flow versions: DRAFT, version, alias</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Prompt edits never move production traffic by accident.</text>
<rect x="24" y="100" width="160" height="120" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="104" y="132" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">DRAFT</text>
<text x="104" y="156" font-size="12" fill="#a8a8a8" text-anchor="middle">the editable working</text>
<text x="104" y="174" font-size="12" fill="#a8a8a8" text-anchor="middle">copy; test here</text>
<line x1="184" y1="160" x2="220" y2="160" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="220.0,160.0 211.7,165.6 211.7,154.4" fill="#7d8590"/>
<rect x="220" y="100" width="160" height="120" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="300" y="132" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">PrepareFlow</text>
<text x="300" y="156" font-size="12" fill="#a8a8a8" text-anchor="middle">packages latest</text>
<text x="300" y="174" font-size="12" fill="#a8a8a8" text-anchor="middle">changes</text>
<line x1="380" y1="160" x2="416" y2="160" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="416.0,160.0 407.7,165.6 407.7,154.4" fill="#7d8590"/>
<rect x="416" y="100" width="160" height="120" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="496" y="132" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Version N</text>
<text x="496" y="156" font-size="12" fill="#a8a8a8" text-anchor="middle">immutable numbered</text>
<text x="496" y="174" font-size="12" fill="#a8a8a8" text-anchor="middle">snapshot</text>
<line x1="576" y1="160" x2="612" y2="160" stroke="#7d8590" stroke-width="2.2"/>
<polygon points="612.0,160.0 603.7,165.6 603.7,154.4" fill="#7d8590"/>
<rect x="612" y="100" width="160" height="120" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="692" y="132" font-size="14.5" fill="#ececec" text-anchor="middle" font-weight="bold">Alias "prod"</text>
<text x="692" y="156" font-size="12" fill="#a8a8a8" text-anchor="middle">named pointer at one</text>
<text x="692" y="174" font-size="12" fill="#a8a8a8" text-anchor="middle">version</text>
<rect x="24" y="260" width="712" height="120" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="290" font-size="14.5" fill="#ececec" text-anchor="start" font-weight="bold">Why this discipline exists</text>
<text x="44" y="314" font-size="12.5" fill="#a8a8a8" text-anchor="start">Bedrock Agents use the same DRAFT / version / alias discipline. Production traffic goes through</text>
<text x="44" y="332" font-size="12.5" fill="#a8a8a8" text-anchor="start">the alias, so a bad prompt edit lands on DRAFT, not on your users. If the agent ignores a config</text>
<text x="44" y="350" font-size="12.5" fill="#a8a8a8" text-anchor="start">change, the DRAFT was never prepared.</text>
</svg>