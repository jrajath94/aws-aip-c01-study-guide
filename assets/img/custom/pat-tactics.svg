<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="440" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Tactics: how to attack each format</text>
<text x="24" y="58" font-size="13" fill="#7d8590">75 questions in 180 minutes is about 2.4 minutes per question. Move on fast when a constraint kills an option.</text>
<rect x="24.0" y="84" width="167.5" height="210" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="107.75" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Multiple choice</text>
<text x="107.75" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Extract constraints</text>
<text x="107.75" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">first, then</text>
<text x="107.75" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">eliminate. Never</text>
<text x="107.75" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">pick an option that</text>
<text x="107.75" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">violates a stated</text>
<text x="107.75" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">constraint, however</text>
<text x="107.75" y="233.0" font-size="12" fill="#a8a8a8" text-anchor="middle">sophisticated it</text>
<text x="107.75" y="249.5" font-size="12" fill="#a8a8a8" text-anchor="middle">sounds.</text>
<rect x="205.5" y="84" width="167.5" height="210" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="289.25" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Multiple response</text>
<text x="289.25" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Evaluate each</text>
<text x="289.25" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">option</text>
<text x="289.25" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">independently</text>
<text x="289.25" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">against the</text>
<text x="289.25" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">constraints. The</text>
<text x="289.25" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">two correct answers</text>
<text x="289.25" y="233.0" font-size="12" fill="#a8a8a8" text-anchor="middle">each stand alone;</text>
<text x="289.25" y="249.5" font-size="12" fill="#a8a8a8" text-anchor="middle">do not hunt for</text>
<text x="289.25" y="266.0" font-size="12" fill="#a8a8a8" text-anchor="middle">pairs that sound</text>
<text x="289.25" y="282.5" font-size="12" fill="#a8a8a8" text-anchor="middle">good together.</text>
<rect x="387.0" y="84" width="167.5" height="210" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="470.75" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Ordering</text>
<text x="470.75" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Anchor the first</text>
<text x="470.75" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">and last steps</text>
<text x="470.75" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">(what must come</text>
<text x="470.75" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">before everything,</text>
<text x="470.75" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">what must come</text>
<text x="470.75" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">last), then fill</text>
<text x="470.75" y="233.0" font-size="12" fill="#a8a8a8" text-anchor="middle">the middle.</text>
<text x="470.75" y="249.5" font-size="12" fill="#a8a8a8" text-anchor="middle">Lifecycle</text>
<text x="470.75" y="266.0" font-size="12" fill="#a8a8a8" text-anchor="middle">dependencies decide</text>
<text x="470.75" y="282.5" font-size="12" fill="#a8a8a8" text-anchor="middle">ties.</text>
<rect x="568.5" y="84" width="167.5" height="210" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="652.25" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Matching</text>
<text x="652.25" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Match the most</text>
<text x="652.25" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">distinctive pair</text>
<text x="652.25" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">first to shrink the</text>
<text x="652.25" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">field, then the</text>
<text x="652.25" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">next. Never match</text>
<text x="652.25" y="216.5" font-size="12" fill="#a8a8a8" text-anchor="middle">by vague</text>
<text x="652.25" y="233.0" font-size="12" fill="#a8a8a8" text-anchor="middle">association; each</text>
<text x="652.25" y="249.5" font-size="12" fill="#a8a8a8" text-anchor="middle">pair has one</text>
<text x="652.25" y="266.0" font-size="12" fill="#a8a8a8" text-anchor="middle">precise mechanism.</text>
<rect x="24" y="318" width="712" height="70" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="380" y="362" font-size="13.5" fill="#ececec" text-anchor="middle" font-weight="bold">Time rule: if an option violates a constraint on sight, eliminate and move on. Do not re-read stems.</text>
</svg>