<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">1.4 Inference configuration</text>
<text x="24" y="58" font-size="13" fill="#7d8590">The knobs on every model call, and what each one actually controls.</text>
<rect x="24.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Temperature</text>
<text x="138.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Randomness of sampling. 0</text>
<text x="138.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">for classification and</text>
<text x="138.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">routing; higher for</text>
<text x="138.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">creative drafting. Never a</text>
<text x="138.0" y="200.0" font-size="12" fill="#a8a8a8" text-anchor="middle">fix for bad retrieval.</text>
<rect x="266.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="380.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Top-p / Top-k</text>
<text x="380.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">Which slice of the token</text>
<text x="380.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">distribution the model</text>
<text x="380.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">samples from. Narrows or</text>
<text x="380.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">widens the candidate pool.</text>
<rect x="508.0" y="84" width="228.0" height="300" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="622.0" y="112" font-size="14" fill="#ececec" text-anchor="middle" font-weight="bold">Max tokens</text>
<text x="622.0" y="134.0" font-size="12" fill="#a8a8a8" text-anchor="middle">The hard stop on output</text>
<text x="622.0" y="150.5" font-size="12" fill="#a8a8a8" text-anchor="middle">length. Caps cost and</text>
<text x="622.0" y="167.0" font-size="12" fill="#a8a8a8" text-anchor="middle">forces concision; set it</text>
<text x="622.0" y="183.5" font-size="12" fill="#a8a8a8" text-anchor="middle">deliberately.</text>
<rect x="24" y="420" width="712" height="90" rx="8" fill="#101318" stroke="#7d8590" stroke-width="1.6"/>
<text x="44" y="448" font-size="12.5" fill="#a8a8a8" text-anchor="start">Trap: raising temperature to 'fix' wrong answers. Temperature changes variety, not correctness.</text>
<text x="44" y="466" font-size="12.5" fill="#a8a8a8" text-anchor="start">Fix the retrieval or the prompt.</text>
</svg>