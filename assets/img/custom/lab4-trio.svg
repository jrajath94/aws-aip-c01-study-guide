<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img">
<rect x="0" y="0" width="760" height="470" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Switch models without redeploys: the trio</text>
<text x="24" y="58" font-size="13" fill="#7d8590">Each owner holds one job. Miss one and the switch becomes a deployment.</text>
<rect x="24" y="84" width="229" height="130" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="138" y="116" font-size="15" fill="#ececec" text-anchor="middle" font-weight="bold">Lambda</text>
<text x="138" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="middle">holds the routing logic:</text>
<text x="138" y="160" font-size="12.5" fill="#a8a8a8" text-anchor="middle">which model id to call</text>
<rect x="267" y="84" width="229" height="130" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="381" y="116" font-size="15" fill="#ececec" text-anchor="middle" font-weight="bold">API Gateway</text>
<text x="381" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="middle">holds the stable endpoint +</text>
<text x="381" y="160" font-size="12.5" fill="#a8a8a8" text-anchor="middle">per-client throttling</text>
<rect x="510" y="84" width="229" height="130" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="624" y="116" font-size="15" fill="#ececec" text-anchor="middle" font-weight="bold">AppConfig</text>
<text x="624" y="142" font-size="12.5" fill="#a8a8a8" text-anchor="middle">holds the model id as</text>
<text x="624" y="160" font-size="12.5" fill="#a8a8a8" text-anchor="middle">runtime config; ops flips a</text>
<text x="624" y="178" font-size="12.5" fill="#a8a8a8" text-anchor="middle">flag</text>
<rect x="24" y="244" width="712" height="196" rx="8" fill="#101318" stroke="#f87171" stroke-width="1.6"/>
<text x="44" y="276" font-size="14.5" fill="#f87171" text-anchor="start" font-weight="bold">Distractors that violate a constraint</text>
<line x1="46.24" y1="293.24" x2="57.76" y2="304.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<line x1="57.76" y1="293.24" x2="46.24" y2="304.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<text x="72" y="304" font-size="12.5" fill="#a8a8a8" text-anchor="start">CloudFormation: its changes ARE deployments, so it fails 'no code changes'.</text>
<line x1="46.24" y1="337.24" x2="57.76" y2="348.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<line x1="57.76" y1="337.24" x2="46.24" y2="348.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<text x="72" y="348" font-size="12.5" fill="#a8a8a8" text-anchor="start">EventBridge: routes events; it does not hold configuration.</text>
<line x1="46.24" y1="381.24" x2="57.76" y2="392.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<line x1="57.76" y1="381.24" x2="46.24" y2="392.76" stroke="#f87171" stroke-width="3.2" stroke-linecap="round"/>
<text x="72" y="392" font-size="12.5" fill="#a8a8a8" text-anchor="start">Hardcoded model id in the Lambda: works until the first switch, then it is a redeploy.</text>
</svg>