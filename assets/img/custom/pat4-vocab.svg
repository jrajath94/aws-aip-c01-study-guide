<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img">
<rect x="0" y="0" width="760" height="610" fill="#000000" rx="10"/>
<text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Pattern 4: Vocabulary precision</text>
<text x="24" y="58" font-size="13" fill="#7d8590">If two options sound similar, the difference is one precise term.</text>
<rect x="24" y="84" width="712" height="92" rx="8" fill="#101318" stroke="#f0b429" stroke-width="1.6"/>
<text x="44" y="116" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Inference profile</text>
<text x="44" y="140" font-size="12.5" fill="#a8a8a8" text-anchor="start">A routing ID spanning regions: better availability, higher effective quotas. You call the</text>
<text x="44" y="157" font-size="12.5" fill="#a8a8a8" text-anchor="start">profile ID, not the bare model ID.</text>
<rect x="24" y="190" width="712" height="92" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/>
<text x="44" y="222" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Prompt router</text>
<text x="44" y="246" font-size="12.5" fill="#a8a8a8" text-anchor="start">Bedrock's model router: sends each request to a cheap or flagship model based on prompt</text>
<text x="44" y="263" font-size="12.5" fill="#a8a8a8" text-anchor="start">complexity.</text>
<rect x="24" y="296" width="712" height="92" rx="8" fill="#101318" stroke="#4ade80" stroke-width="1.6"/>
<text x="44" y="328" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">Provisioned Throughput</text>
<text x="44" y="352" font-size="12.5" fill="#a8a8a8" text-anchor="start">Reserved model capacity you pay for by the hour, with latency guarantees. Capacity, not cost</text>
<text x="44" y="369" font-size="12.5" fill="#a8a8a8" text-anchor="start">savings.</text>
<rect x="24" y="402" width="712" height="92" rx="8" fill="#101318" stroke="#a78bfa" stroke-width="1.6"/>
<text x="44" y="434" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">ApplyGuardrail</text>
<text x="44" y="458" font-size="12.5" fill="#a8a8a8" text-anchor="start">Runs a guardrail as a standalone policy check on any text, outside a model call.</text>
<rect x="24" y="508" width="712" height="92" rx="8" fill="#101318" stroke="#fb923c" stroke-width="1.6"/>
<text x="44" y="540" font-size="15" fill="#ececec" text-anchor="start" font-weight="bold">returnControl</text>
<text x="44" y="564" font-size="12.5" fill="#a8a8a8" text-anchor="start">Pauses an agent and hands control back to your code: the hook for human approval gates.</text>
</svg>