<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Who is waiting">
<rect width='960' height='540' fill='#100e0c'/>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif}</style>
<text x='32' y='42' fill='#e7a322' font-size='14' letter-spacing='2'>WHO IS WAITING</text>
<rect x='30.0' y='70.0' width='288.0' height='124' rx='12' fill='#181512' stroke='#e7a322' stroke-width='1.4'/>
<text x='46.0' y='102.0' fill='#e7a322' font-size='13'>1</text>
<text x='66.0' y='102.0' fill='#f4efe6' font-size='16'>Stream</text>
<text x='46.0' y='128.0' fill='#b7aa98' font-size='13'>A person is watching</text>
<path d='M 320.0 132.0 h 14' stroke='#e7a322' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='336.0' y='70.0' width='288.0' height='124' rx='12' fill='#181512' stroke='#e7a322' stroke-width='1.4'/>
<text x='352.0' y='102.0' fill='#e7a322' font-size='13'>2</text>
<text x='372.0' y='102.0' fill='#f4efe6' font-size='16'>Sync call</text>
<text x='352.0' y='128.0' fill='#b7aa98' font-size='13'>Short enough for the timeout</text>
<path d='M 626.0 132.0 h 14' stroke='#e7a322' stroke-width='1.6' marker-end='url(#arrow)'/>
<rect x='642.0' y='70.0' width='288.0' height='124' rx='12' fill='#181512' stroke='#e7a322' stroke-width='1.4'/>
<text x='658.0' y='102.0' fill='#e7a322' font-size='13'>3</text>
<text x='678.0' y='102.0' fill='#f4efe6' font-size='16'>Queue</text>
<text x='658.0' y='128.0' fill='#b7aa98' font-size='13'>Decouple the slow step</text>
<rect x='30.0' y='220.0' width='288.0' height='124' rx='12' fill='#181512' stroke='#e7a322' stroke-width='1.4'/>
<text x='46.0' y='252.0' fill='#e7a322' font-size='13'>4</text>
<text x='66.0' y='252.0' fill='#f4efe6' font-size='16'>Batch</text>
<text x='46.0' y='278.0' fill='#b7aa98' font-size='13'>S3 in, results later</text>
<defs><marker id='arrow' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 1 L9 5 L0 9 z' fill='#e7a322'/></marker></defs>
<text x='32' y='470' fill='#d9cbb8' font-size='14'>Batch price relative to on-demand is a pricing-page number. Treat any discount you</text>
<text x='32' y='490' fill='#d9cbb8' font-size='14'>remember as volatile.</text>
</svg>