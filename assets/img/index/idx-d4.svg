<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="D4 tradeoffs: cost, latency, quality">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">D4 IN ONE PICTURE: THE THREE DIALS</text>
<text x="24" y="76" font-size="13" fill="#222222" text-anchor="start" font-weight="700">Cost</text>
<line x1="120" y1="72" x2="560" y2="72" stroke="#bbb" stroke-width="6"/>
<circle cx="230.0" cy="72" r="11" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2.5"/>
<text x="24" y="94" font-size="11.5" fill="#555555" text-anchor="start">on-demand vs provisioned vs batch</text>
<text x="24" y="128" font-size="13" fill="#222222" text-anchor="start" font-weight="700">Latency</text>
<line x1="120" y1="124" x2="560" y2="124" stroke="#bbb" stroke-width="6"/>
<circle cx="362.0" cy="124" r="11" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2.5"/>
<text x="24" y="146" font-size="11.5" fill="#555555" text-anchor="start">streaming, caching, smaller models</text>
<text x="24" y="180" font-size="13" fill="#222222" text-anchor="start" font-weight="700">Quality</text>
<line x1="120" y1="176" x2="560" y2="176" stroke="#bbb" stroke-width="6"/>
<circle cx="472.0" cy="176" r="11" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2.5"/>
<text x="24" y="198" font-size="11.5" fill="#555555" text-anchor="start">eval scores, guardrails, grounding</text>
<text x="320" y="218" font-size="12" fill="#555555" text-anchor="middle">Every scenario asks you to turn one dial without breaking the other two</text>
</svg>