<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="Guardrails screen the input and the output of the model">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="640" height="220" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">D3 IN ONE PICTURE: GUARDRAILS</text>
<rect x="24" y="60" width="100" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="74.0" y="87.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">User</text>
<text x="74.0" y="104.0" font-size="12" fill="#222222" text-anchor="middle"></text>
<rect x="164" y="60" width="140" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="234.0" y="79.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Input screen</text>
<text x="234.0" y="96.0" font-size="12" fill="#222222" text-anchor="middle">filters, denied</text>
<text x="234.0" y="112.0" font-size="12" fill="#222222" text-anchor="middle">topics, PII</text>
<rect x="344" y="60" width="110" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="399.0" y="87.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Model</text>
<text x="399.0" y="104.0" font-size="12" fill="#222222" text-anchor="middle"></text>
<rect x="494" y="60" width="122" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="555.0" y="79.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Output screen</text>
<text x="555.0" y="96.0" font-size="12" fill="#222222" text-anchor="middle">grounding</text>
<text x="555.0" y="112.0" font-size="12" fill="#222222" text-anchor="middle">checks</text>
<line x1="124" y1="95" x2="164" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="304" y1="95" x2="344" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="454" y1="95" x2="494" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="234" y="160" font-size="12" fill="#555555" text-anchor="middle">blocked requests never reach the model; bad answers never reach the user</text>
<text x="320" y="190" font-size="12" fill="#555555" text-anchor="middle">Plus IAM, KMS, VPC endpoints, and the audit trail</text>
</svg>