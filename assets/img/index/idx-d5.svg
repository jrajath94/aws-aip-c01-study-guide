<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="The eval loop: measure, judge, fix, repeat">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">D5 IN ONE PICTURE: THE EVAL LOOP</text>
<rect x="24" y="56" width="130" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="89.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Dataset</text>
<text x="89.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">prompts +</text>
<text x="89.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">references</text>
<rect x="194" y="56" width="150" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="269.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Automatic</text>
<text x="269.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">ROUGE, BLEU,</text>
<text x="269.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">BERTScore</text>
<rect x="384" y="56" width="232" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="500.0" y="80.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Judges</text>
<text x="500.0" y="97.0" font-size="12" fill="#222222" text-anchor="middle">human raters,</text>
<text x="500.0" y="113.0" font-size="12" fill="#222222" text-anchor="middle">LLM-as-a-judge</text>
<line x1="154" y1="96" x2="194" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="344" y1="96" x2="384" y2="96" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<path d="M 500 136 C 294.5 136, 294.5 136, 89 136" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="320" y="172" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">score, find failures, fix the prompt or data, run again</text>
<text x="320" y="200" font-size="12" fill="#555555" text-anchor="middle">Plus troubleshooting: throttling, guardrail blocks, KB sync, embedding mismatch</text>
</svg>