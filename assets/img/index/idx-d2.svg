<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" role="img" aria-label="The Bedrock agent loop: reason, act with tools, observe, repeat">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="640" height="220" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">D2 IN ONE PICTURE: AGENTS THAT ACT</text>
<rect x="24" y="60" width="120" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="84.0" y="79.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Agent</text>
<text x="84.0" y="96.0" font-size="12" fill="#222222" text-anchor="middle">goal +</text>
<text x="84.0" y="112.0" font-size="12" fill="#222222" text-anchor="middle">instructions</text>
<rect x="300" y="60" width="130" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="365.0" y="79.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Tools</text>
<text x="365.0" y="96.0" font-size="12" fill="#222222" text-anchor="middle">Lambda</text>
<text x="365.0" y="112.0" font-size="12" fill="#222222" text-anchor="middle">action groups</text>
<rect x="494" y="60" width="122" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="555.0" y="79.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">World</text>
<text x="555.0" y="96.0" font-size="12" fill="#222222" text-anchor="middle">result</text>
<text x="555.0" y="112.0" font-size="12" fill="#222222" text-anchor="middle">observation</text>
<line x1="144" y1="95" x2="300" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="95" x2="494" y2="95" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<path d="M 555 130 C 319.5 130, 319.5 130, 84 130" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="320" y="165" font-size="12" fill="#555555" text-anchor="middle" font-style="italic">reason, act, observe, repeat until the goal is done</text>
<text x="320" y="192" font-size="12" fill="#555555" text-anchor="middle">Plus Lambda, API Gateway, and Step Functions wiring it into real apps</text>
