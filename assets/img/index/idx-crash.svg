<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="The crash course: domains by weight, then rules, traps, numbers">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THE CRASH COURSE, ONE SPRINT</text>
<text x="24" y="68" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">D1 31%</text>
<rect x="120" y="56" width="300" height="16" rx="4" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="24" y="96" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">D2 26%</text>
<rect x="120" y="84" width="252" height="16" rx="4" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="24" y="124" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">D3 20%</text>
<rect x="120" y="112" width="195" height="16" rx="4" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="24" y="152" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">D4 12%</text>
<rect x="120" y="140" width="117" height="16" rx="4" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="24" y="180" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">D5 11%</text>
<rect x="120" y="168" width="105" height="16" rx="4" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<rect x="450" y="52" width="166" height="140" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="533" y="80" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">then:</text>
<text x="533" y="106" font-size="11.5" fill="#222222" text-anchor="middle">if stem says X, pick Y</text>
<text x="533" y="132" font-size="11.5" fill="#222222" text-anchor="middle">30 traps, one line each</text>
<text x="533" y="158" font-size="11.5" fill="#222222" text-anchor="middle">must-memorize numbers</text>
<text x="320" y="218" font-size="12" fill="#555555" text-anchor="middle">For the final sprint, not the starting point</text>
