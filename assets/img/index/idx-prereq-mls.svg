<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="The ML lifecycle: prepare, train, deploy, monitor">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THE ML LIFECYCLE</text>
<rect x="24" y="52" width="140" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="94.0" y="84.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Prepare</text>
<text x="94.0" y="101.5" font-size="11.5" fill="#222222" text-anchor="middle">S3, Glue,</text>
<text x="94.0" y="117.0" font-size="11.5" fill="#222222" text-anchor="middle">formats</text>
<line x1="164" y1="100" x2="180" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="180" y="52" width="140" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="250.0" y="84.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Train + tune</text>
<text x="250.0" y="101.5" font-size="11.5" fill="#222222" text-anchor="middle">SageMaker jobs,</text>
<text x="250.0" y="117.0" font-size="11.5" fill="#222222" text-anchor="middle">AMT</text>
<line x1="320" y1="100" x2="336" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="336" y="52" width="140" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="406.0" y="84.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Deploy</text>
<text x="406.0" y="101.5" font-size="11.5" fill="#222222" text-anchor="middle">endpoints,</text>
<text x="406.0" y="117.0" font-size="11.5" fill="#222222" text-anchor="middle">batch, async</text>
<line x1="476" y1="100" x2="492" y2="100" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="492" y="52" width="140" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="562.0" y="84.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Monitor</text>
<text x="562.0" y="101.5" font-size="11.5" fill="#222222" text-anchor="middle">drift,</text>
<text x="562.0" y="117.0" font-size="11.5" fill="#222222" text-anchor="middle">retrain</text>
<text x="320" y="185" font-size="12" fill="#555555" text-anchor="middle">The pro exam wants service judgment at every stage, not deep theory</text>
<text x="320" y="208" font-size="12" fill="#555555" text-anchor="middle">MLOps closes the loop: monitor feeds back into prepare</text>
</svg>