<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-label="The lab loop: build it, probe it, break it, fix it">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="640" height="240" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THE LABS VOLUME, ONE LOOP</text>
<circle cx="79" cy="90" r="44" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2.5"/>
<text x="79" y="96" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">Build</text>
<line x1="123" y1="90" x2="180" y2="90" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="79" y="158" font-size="11" fill="#555555" text-anchor="middle">a Knowledge Base</text>
<text x="79" y="174" font-size="11" fill="#555555" text-anchor="middle">on real docs</text>
<circle cx="235" cy="90" r="44" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="2.5"/>
<text x="235" y="96" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">Probe</text>
<line x1="279" y1="90" x2="336" y2="90" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="235" y="158" font-size="11" fill="#555555" text-anchor="middle">Guardrails with</text>
<text x="235" y="174" font-size="11" fill="#555555" text-anchor="middle">hostile prompts</text>
<circle cx="391" cy="90" r="44" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="2.5"/>
<text x="391" y="96" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">Break</text>
<line x1="435" y1="90" x2="492" y2="90" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="391" y="158" font-size="11" fill="#555555" text-anchor="middle">agents with</text>
<text x="391" y="174" font-size="11" fill="#555555" text-anchor="middle">failing tools</text>
<circle cx="547" cy="90" r="44" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="2.5"/>
<text x="547" y="96" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">Fix</text>
<text x="547" y="158" font-size="11" fill="#555555" text-anchor="middle">then read</text>
<text x="547" y="174" font-size="11" fill="#555555" text-anchor="middle">why it broke</text>
<text x="320" y="212" font-size="12" fill="#555555" text-anchor="middle">9 guided labs, every one ending in a practice question</text>
</svg>