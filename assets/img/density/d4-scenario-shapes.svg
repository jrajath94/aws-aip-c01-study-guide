<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 460" role="img" aria-label="The scenario shapes: each constraint gets its stack">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="460" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The scenario shapes: each constraint gets its stack</text>
<rect x="30" y="70" width="425" height="150" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="44" y="94" font-size="15" font-weight="bold" fill="#ececec">Cost growing, no UX loss</text>
<text x="44" y="116" font-size="13" fill="#ececec">free levers first: compression,</text>
<text x="44" y="134" font-size="13" fill="#ececec">caching, caps; re-verify quality</text>
<rect x="475" y="70" width="425" height="150" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="489" y="94" font-size="15" font-weight="bold" fill="#ececec">Sub-3s + 10x spikes</text>
<text x="489" y="116" font-size="13" fill="#ececec">streaming, smaller model,</text>
<text x="489" y="134" font-size="13" fill="#ececec">PT baseline + on-demand overflow</text>
<rect x="30" y="245" width="425" height="150" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="44" y="269" font-size="15" font-weight="bold" fill="#ececec">Bought PT, still throttled</text>
<text x="44" y="291" font-size="13" fill="#ececec">check the ARN: provisioned model</text>
<text x="44" y="309" font-size="13" fill="#ececec">ARN, not the base model ID</text>
<rect x="475" y="245" width="425" height="150" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="489" y="269" font-size="15" font-weight="bold" fill="#ececec">Need identical answers</text>
<text x="489" y="291" font-size="13" fill="#ececec">temperature 0, deterministic cache,</text>
<text x="489" y="309" font-size="13" fill="#ececec">prompt versioning (not PT)</text>
<text x="60" y="440" font-size="13" text-anchor="start" fill="#a8a8a8">Portfolio questions: walk the ladder per component. The most correct answer is almost always a hybrid</text>
<text x="60" y="459" font-size="13" text-anchor="start" fill="#a8a8a8">matched to the traffic shape.</text>
</svg>