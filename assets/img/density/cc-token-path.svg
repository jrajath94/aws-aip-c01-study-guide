<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 252" role="img" aria-label="Token efficiency in four steps">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="252" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Token efficiency in four steps</text>
<rect x="40" y="96" width="190" height="88" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="56" y="126" font-size="15" font-weight="bold">Measure</text>
<text x="56" y="148" font-size="12" fill="#a8a8a8">CountTokens, free</text>
<line x1="230" y1="140" x2="270" y2="140" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="270,140 260,135 260,145" fill="#a8a8a8"/>
<rect x="270" y="96" width="190" height="88" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="286" y="126" font-size="15" font-weight="bold">Prune</text>
<text x="286" y="148" font-size="12" fill="#a8a8a8">drop old context</text>
<line x1="460" y1="140" x2="500" y2="140" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="500,140 490,135 490,145" fill="#a8a8a8"/>
<rect x="500" y="96" width="190" height="88" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="516" y="126" font-size="15" font-weight="bold">Compress</text>
<text x="516" y="148" font-size="12" fill="#a8a8a8">summarize, use RAG</text>
<line x1="690" y1="140" x2="730" y2="140" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="730,140 720,135 720,145" fill="#a8a8a8"/>
<rect x="730" y="96" width="190" height="88" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="746" y="126" font-size="15" font-weight="bold">Limit</text>
<text x="746" y="148" font-size="12" fill="#a8a8a8">maxTokens, JSON</text>
<text x="60" y="228" font-size="13" fill="#a8a8a8">Measure first. Local tokenizers guess. CountTokens matches the bill.</text>
</svg>
