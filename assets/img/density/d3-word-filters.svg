<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img" aria-label="Word filters: exact strings, no fuzzy matching">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="380" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Word filters: exact strings, no fuzzy matching</text>
<rect x="60" y="100" width="380" height="140" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="74" y="124" font-size="15" font-weight="bold" fill="#ececec">Exact match only</text>
<text x="74" y="146" font-size="13" fill="#ececec">"bank"  -&gt;  fires</text>
<text x="74" y="164" font-size="13" fill="#ececec">"b4nk"  -&gt;  does NOT fire</text>
<text x="74" y="182" font-size="13" fill="#ececec"></text>
<text x="74" y="200" font-size="13" fill="#ececec">No stemming, no leetspeak</text>
<rect x="480" y="100" width="380" height="140" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="494" y="124" font-size="15" font-weight="bold" fill="#ececec">Wrong tool for</text>
<text x="494" y="146" font-size="13" fill="#ececec">Paraphraseable bans -&gt;</text>
<text x="494" y="164" font-size="13" fill="#ececec">use DENIED TOPICS</text>
<text x="494" y="182" font-size="13" fill="#ececec"></text>
<text x="494" y="200" font-size="13" fill="#ececec">PII -&gt; use SENSITIVE</text>
<text x="494" y="218" font-size="13" fill="#ececec">INFO FILTERS</text>
<text x="60" y="290" font-size="13" text-anchor="start" fill="#a8a8a8">Right tool: competitor names, codenames, fixed profanity lists. Precision is the point and the</text>
<text x="60" y="309" font-size="13" text-anchor="start" fill="#a8a8a8">limitation.</text>
</svg>