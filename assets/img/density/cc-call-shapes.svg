<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 440" role="img" aria-label="The API front door and async patterns: three shapes, one question">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="440" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The API front door and async patterns: three shapes, one question</text>
<rect x="40" y="70" width="830" height="90" rx="8" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
<text x="455.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Who waits?</text>
<text x="455.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">Is a user waiting on the answer? YES -&gt; streaming (ConverseStream): tokens now, perceived speed.</text>
<rect x="40" y="200" width="267" height="170" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="54" y="224" font-size="15" font-weight="bold" fill="#ececec">Streaming</text>
<text x="54" y="246" font-size="13" fill="#ececec">tokens to a waiting user</text>
<text x="54" y="264" font-size="13" fill="#ececec">WebSocket API / ALB / Lambda URL</text>
<text x="54" y="282" font-size="13" fill="#ececec"></text>
<rect x="327" y="200" width="267" height="170" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="341" y="224" font-size="15" font-weight="bold" fill="#ececec">Async invoke</text>
<text x="341" y="246" font-size="13" fill="#ececec">ONE slow prompt, nobody waits</text>
<text x="341" y="264" font-size="13" fill="#ececec">start_async_invoke, result to S3</text>
<text x="341" y="282" font-size="13" fill="#ececec"></text>
<rect x="614" y="200" width="267" height="170" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="628" y="224" font-size="15" font-weight="bold" fill="#ececec">Batch inference</text>
<text x="628" y="246" font-size="13" fill="#ececec">MANY prompts, offline</text>
<text x="628" y="264" font-size="13" fill="#ececec">JSONL into S3, results to S3,</text>
<text x="628" y="282" font-size="13" fill="#ececec">hours of latency, ~50% off</text>
<line x1="455" y1="160" x2="173" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="173,200 181.5,194.7 182.6,202.8" fill="#ececec"/>
<line x1="455" y1="160" x2="460" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="460,200 454.8,191.4 462.9,190.4" fill="#ececec"/>
<line x1="455" y1="160" x2="747" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="747,200 737.4,202.8 738.5,194.7" fill="#ececec"/>
<text x="60" y="412" font-size="13" text-anchor="start" fill="#a8a8a8">REST APIs carry a 29-second ceiling: long streams do not fit. Interactive + no auth = direct SDK.</text>
</svg>