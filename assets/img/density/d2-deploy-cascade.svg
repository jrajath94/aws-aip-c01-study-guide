<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Model deployment: the cascade behind prompt routers">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Model deployment: the cascade behind prompt routers</text>
<rect x="60" y="130" width="220" height="130" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="170.0" y="154" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Cheap model</text>
<text x="170.0" y="176" font-size="13" text-anchor="middle" fill="#ececec">classify, extract,</text>
<text x="170.0" y="194" font-size="13" text-anchor="middle" fill="#ececec">short answers</text>
<rect x="640" y="130" width="220" height="130" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="750.0" y="154" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Flagship model</text>
<text x="750.0" y="176" font-size="13" text-anchor="middle" fill="#ececec">reasoning, long-form,</text>
<text x="750.0" y="194" font-size="13" text-anchor="middle" fill="#ececec">high-stakes answers</text>
<rect x="330" y="110" width="260" height="170" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="460.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">The router</text>
<text x="460.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Router / classifier:</text>
<text x="460.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">simple -&gt; cheap,</text>
<text x="460.0" y="192" font-size="13" text-anchor="middle" fill="#ececec">complex -&gt; flagship</text>
<line x1="280" y1="195" x2="330" y2="195" stroke="#ececec" stroke-width="2"/>
<polygon points="330,195 320.9,199.1 320.9,190.9" fill="#ececec"/>
<line x1="590" y1="195" x2="640" y2="195" stroke="#ececec" stroke-width="2"/>
<polygon points="640,195 630.9,199.1 630.9,190.9" fill="#ececec"/>
<text x="60" y="320" font-size="13" text-anchor="start" fill="#a8a8a8">Why it works: most traffic is simple, so most tokens bill at the cheap rate. Measure the split on a</text>
<text x="60" y="339" font-size="13" text-anchor="start" fill="#a8a8a8">golden dataset before trusting it.</text>
</svg>