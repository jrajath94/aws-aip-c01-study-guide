<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 560" role="img" aria-label="The Domain 4 decision map: read the constraint, pick the row">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="560" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The Domain 4 decision map: read the constraint, pick the row</text>
<rect x="40" y="70" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="98" font-size="12" text-anchor="start" fill="#ececec">Same long system prompt, every call</text>
<line x1="470" y1="92" x2="500" y2="92" stroke="#ececec" stroke-width="2"/>
<polygon points="500,92 490.9,96.1 490.9,87.9" fill="#ececec"/>
<rect x="500" y="70" width="380" height="44" rx="8" fill="none" stroke="#7fb069" stroke-width="1.5"/>
<text x="516" y="98" font-size="12" text-anchor="start" fill="#7fb069">Prompt caching</text>
<rect x="40" y="128" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="156" font-size="12" text-anchor="start" fill="#ececec">Repeated similar user questions</text>
<line x1="470" y1="150" x2="500" y2="150" stroke="#ececec" stroke-width="2"/>
<polygon points="500,150 490.9,154.1 490.9,145.9" fill="#ececec"/>
<rect x="500" y="128" width="380" height="44" rx="8" fill="none" stroke="#7fb069" stroke-width="1.5"/>
<text x="516" y="156" font-size="12" text-anchor="start" fill="#7fb069">Semantic caching</text>
<rect x="40" y="186" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="214" font-size="12" text-anchor="start" fill="#ececec">Simple tasks on an expensive model</text>
<line x1="470" y1="208" x2="500" y2="208" stroke="#ececec" stroke-width="2"/>
<polygon points="500,208 490.9,212.1 490.9,203.9" fill="#ececec"/>
<rect x="500" y="186" width="380" height="44" rx="8" fill="none" stroke="#7fb069" stroke-width="1.5"/>
<text x="516" y="214" font-size="12" text-anchor="start" fill="#7fb069">Right-size / cascade</text>
<rect x="40" y="244" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="272" font-size="12" text-anchor="start" fill="#ececec">Retrieved chunks stuffed into prompt</text>
<line x1="470" y1="266" x2="500" y2="266" stroke="#ececec" stroke-width="2"/>
<polygon points="500,266 490.9,270.1 490.9,261.9" fill="#ececec"/>
<rect x="500" y="244" width="380" height="44" rx="8" fill="none" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="516" y="272" font-size="12" text-anchor="start" fill="#7aa5d2">Retrieval tuning</text>
<rect x="40" y="302" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="330" font-size="12" text-anchor="start" fill="#ececec">Hours of latency OK, bulk work</text>
<line x1="470" y1="324" x2="500" y2="324" stroke="#ececec" stroke-width="2"/>
<polygon points="500,324 490.9,328.1 490.9,319.9" fill="#ececec"/>
<rect x="500" y="302" width="380" height="44" rx="8" fill="none" stroke="#f2c14e" stroke-width="1.5"/>
<text x="516" y="330" font-size="12" text-anchor="start" fill="#f2c14e">Batch inference (~50% off)</text>
<rect x="40" y="360" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="388" font-size="12" text-anchor="start" fill="#ececec">Steady traffic, throttling at peak</text>
<line x1="470" y1="382" x2="500" y2="382" stroke="#ececec" stroke-width="2"/>
<polygon points="500,382 490.9,386.1 490.9,377.9" fill="#ececec"/>
<rect x="500" y="360" width="380" height="44" rx="8" fill="none" stroke="#f2c14e" stroke-width="1.5"/>
<text x="516" y="388" font-size="12" text-anchor="start" fill="#f2c14e">Provisioned Throughput</text>
<rect x="40" y="418" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="446" font-size="12" text-anchor="start" fill="#ececec">Chat feels slow</text>
<line x1="470" y1="440" x2="500" y2="440" stroke="#ececec" stroke-width="2"/>
<polygon points="500,440 490.9,444.1 490.9,435.9" fill="#ececec"/>
<rect x="500" y="418" width="380" height="44" rx="8" fill="none" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="516" y="446" font-size="12" text-anchor="start" fill="#7aa5d2">Streaming (TTFT), smaller model</text>
<rect x="40" y="476" width="430" height="44" rx="8" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<text x="56" y="504" font-size="12" text-anchor="start" fill="#ececec">Need identical answers</text>
<line x1="470" y1="498" x2="500" y2="498" stroke="#ececec" stroke-width="2"/>
<polygon points="500,498 490.9,502.1 490.9,493.9" fill="#ececec"/>
<rect x="500" y="476" width="380" height="44" rx="8" fill="none" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="516" y="504" font-size="12" text-anchor="start" fill="#7aa5d2">Temp 0 + cache + versions</text>
<text x="60" y="548" font-size="13" text-anchor="start" fill="#e07a5f">Trap: every distractor is a real lever applied to the wrong constraint. Read the constraint first.</text>
</svg>