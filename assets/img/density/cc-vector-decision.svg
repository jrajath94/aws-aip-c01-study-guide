<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 392" role="img" aria-label="Vector store decision">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="392" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Vector store decision</text>
<rect x="310" y="64" width="300" height="64" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="326" y="94" font-size="15" font-weight="bold">Need vector search?</text>
<text x="326" y="116" font-size="12" fill="#a8a8a8">similarity over embeddings</text>
<line x1="460" y1="128" x2="460" y2="160" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="460,160 450,155 450,165" fill="#a8a8a8"/>
<rect x="310" y="160" width="300" height="64" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="326" y="190" font-size="15" font-weight="bold">Need sub-ms + hybrid?</text>
<text x="326" y="212" font-size="12" fill="#a8a8a8">keyword plus vector</text>
<line x1="460" y1="224" x2="460" y2="256" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="460,256 450,251 450,261" fill="#a8a8a8"/>
<rect x="60" y="256" width="240" height="72" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="76" y="286" font-size="15" font-weight="bold">YES: OpenSearch</text>
<text x="76" y="308" font-size="12" fill="#a8a8a8">fastest, hybrid</text>
<rect x="340" y="256" width="240" height="72" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="356" y="286" font-size="15" font-weight="bold">NO, cheapest: S3 Vectors</text>
<text x="356" y="308" font-size="12" fill="#a8a8a8">sub-second, 90% less</text>
<rect x="620" y="256" width="240" height="72" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="636" y="286" font-size="15" font-weight="bold">SQL + vectors: pgvector</text>
<text x="636" y="308" font-size="12" fill="#a8a8a8">Aurora / RDS</text>
<text x="180" y="248" font-size="12" fill="#a8a8a8">yes</text>
<text x="470" y="248" font-size="12" fill="#a8a8a8">no</text>
<text x="60" y="368" font-size="13" fill="#a8a8a8">DynamoDB stores vectors but cannot search them. That is a trap, not a store.</text>
</svg>
