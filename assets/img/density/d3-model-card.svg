<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Model card: documentation, not a control">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Model card: documentation, not a control</text>
<rect x="30" y="90" width="162" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="111.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">Intended use</text>
<text x="111.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">what it was built for</text>
<rect x="208" y="90" width="162" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="289.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">Out of scope</text>
<text x="289.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">what it must NOT do</text>
<rect x="386" y="90" width="162" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="467.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">Training data</text>
<text x="467.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">what it learned from</text>
<rect x="564" y="90" width="162" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="645.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">Evaluation</text>
<text x="645.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">how it was measured</text>
<rect x="742" y="90" width="162" height="180" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="823.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">Limits + biases</text>
<text x="823.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">known weaknesses</text>
<text x="60" y="320" font-size="13" text-anchor="start" fill="#a8a8a8">Versioned alongside the model. For Bedrock FMs you do not write the card, but the governance habit is the</text>
<text x="60" y="339" font-size="13" text-anchor="start" fill="#a8a8a8">same: know the model before you ship it.</text>
</svg>