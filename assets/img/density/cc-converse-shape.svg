<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 280" role="img" aria-label="Converse API: required vs optional">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="280" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Converse API: required vs optional</text>
<text x="460" y="72" text-anchor="middle" font-size="16" font-weight="bold">Converse request: required vs optional</text>
<rect x="120" y="96" width="320" height="120" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="136" y="126" font-size="15" font-weight="bold">REQUIRED</text>
<text x="136" y="148" font-size="12" fill="#a8a8a8">prompt: messages with</text>
<text x="136" y="180" font-size="12" fill="#a8a8a8">role + content. modelId.</text>
<rect x="480" y="96" width="320" height="120" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="496" y="126" font-size="15" font-weight="bold">OPTIONAL</text>
<text x="496" y="148" font-size="12" fill="#a8a8a8">toolConfig, guardrailConfig,</text>
<text x="496" y="180" font-size="12" fill="#a8a8a8">system, inferenceConfig.</text>
<text x="60" y="256" font-size="13" fill="#a8a8a8">One shape across providers. Required fields never change. Optional fields add tools and safety.</text>
</svg>
