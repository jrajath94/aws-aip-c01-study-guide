<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Lambda timeouts: budget the whole chain under 15 minutes">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Lambda timeouts: budget the whole chain under 15 minutes</text>
<rect x="60" y="110" width="240" height="150" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="180.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Request-response</text>
<text x="180.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Sync invoke:</text>
<text x="180.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">user waits,</text>
<text x="180.0" y="192" font-size="13" text-anchor="middle" fill="#ececec">keep it short</text>
<rect x="340" y="110" width="240" height="150" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="460.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Async</text>
<text x="460.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Event invoke:</text>
<text x="460.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">queue and return,</text>
<text x="460.0" y="192" font-size="13" text-anchor="middle" fill="#ececec">fire-and-forget</text>
<rect x="620" y="110" width="240" height="150" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="740.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Streaming</text>
<text x="740.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Response streaming:</text>
<text x="740.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">tokens flow,</text>
<text x="740.0" y="192" font-size="13" text-anchor="middle" fill="#ececec">mind the 29 s API GW cap</text>
<text x="60" y="320" font-size="13" text-anchor="start" fill="#a8a8a8">Lambda ceiling: 15 minutes (900 s). A multi-step GenAI pipeline that waits on humans or long chains</text>
<text x="60" y="339" font-size="13" text-anchor="start" fill="#a8a8a8">outgrows one Lambda: Step Functions Standard holds state up to a year.</text>
</svg>