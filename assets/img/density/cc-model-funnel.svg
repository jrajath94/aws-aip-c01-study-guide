<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img" aria-label="Picking the model: filter, then rank">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="380" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Picking the model: filter, then rank</text>
<rect x="40" y="80" width="400" height="240" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="54" y="104" font-size="15" font-weight="bold" fill="#ececec">1. FILTER: hard constraints</text>
<text x="54" y="126" font-size="13" fill="#ececec">Region and data residency</text>
<text x="54" y="144" font-size="13" fill="#ececec">Modality: text, image, embedding</text>
<text x="54" y="162" font-size="13" fill="#ececec">Latency SLA (streaming? batch?)</text>
<text x="54" y="180" font-size="13" fill="#ececec">Compliance needs (HIPAA, etc.)</text>
<line x1="440" y1="200" x2="480" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="480,200 470.9,204.1 470.9,195.9" fill="#ececec"/>
<rect x="480" y="80" width="400" height="240" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="494" y="104" font-size="15" font-weight="bold" fill="#ececec">2. RANK: survivors by score</text>
<text x="494" y="126" font-size="13" fill="#ececec">Quality on your golden dataset</text>
<text x="494" y="144" font-size="13" fill="#ececec">Cost per call at your volume</text>
<text x="494" y="162" font-size="13" fill="#ececec">Context window vs prompt size</text>
<text x="60" y="356" font-size="13" text-anchor="start" fill="#a8a8a8">Filtering first throws out models that can never qualify; ranking only compares viable ones.</text>
</svg>