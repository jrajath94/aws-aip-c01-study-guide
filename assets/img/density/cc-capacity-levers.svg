<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 430" role="img" aria-label="Capacity and cost levers: PT, profiles, routers">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="430" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Capacity and cost levers: PT, profiles, routers</text>
<rect x="30" y="70" width="280" height="260" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="44" y="94" font-size="15" font-weight="bold" fill="#ececec">Provisioned Throughput</text>
<text x="44" y="116" font-size="13" fill="#ececec">Reserved model units,</text>
<text x="44" y="134" font-size="13" fill="#ececec">hourly billing, 1 or 6 mo terms</text>
<text x="44" y="152" font-size="13" fill="#ececec"></text>
<text x="44" y="170" font-size="13" fill="#ececec">Fixes: throttled at peak</text>
<text x="44" y="188" font-size="13" fill="#ececec">on STEADY traffic</text>
<text x="44" y="206" font-size="13" fill="#ececec"></text>
<text x="44" y="224" font-size="13" fill="#ececec">Must invoke the provisioned ARN</text>
<rect x="320" y="70" width="280" height="260" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="334" y="94" font-size="15" font-weight="bold" fill="#ececec">Inference profiles</text>
<text x="334" y="116" font-size="13" fill="#ececec">One identifier across</text>
<text x="334" y="134" font-size="13" fill="#ececec">multiple regions</text>
<text x="334" y="152" font-size="13" fill="#ececec"></text>
<text x="334" y="170" font-size="13" fill="#ececec">Fixes: regional failover,</text>
<text x="334" y="188" font-size="13" fill="#ececec">availability, data residency</text>
<text x="334" y="206" font-size="13" fill="#ececec"></text>
<text x="334" y="224" font-size="13" fill="#ececec">Routes for availability</text>
<rect x="610" y="70" width="280" height="260" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="624" y="94" font-size="15" font-weight="bold" fill="#ececec">Prompt routers (cascade)</text>
<text x="624" y="116" font-size="13" fill="#ececec">Simple prompts -&gt; cheap model,</text>
<text x="624" y="134" font-size="13" fill="#ececec">complex -&gt; flagship</text>
<text x="624" y="152" font-size="13" fill="#ececec"></text>
<text x="624" y="170" font-size="13" fill="#ececec">Fixes: simple queries on an</text>
<text x="624" y="188" font-size="13" fill="#ececec">expensive flagship</text>
<text x="624" y="206" font-size="13" fill="#ececec"></text>
<text x="624" y="224" font-size="13" fill="#ececec">Routes for cost</text>
<text x="60" y="372" font-size="13" text-anchor="start" fill="#a8a8a8">Three-way split: profiles route for availability, routers route for cost, PT reserves capacity.</text>
</svg>