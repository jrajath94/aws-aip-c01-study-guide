<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="What the tooling cannot do">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">What the tooling cannot do</text>
<rect x="30" y="90" width="277" height="230" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="44" y="114" font-size="15" font-weight="bold" fill="#ececec">No guaranteed prevention</text>
<text x="44" y="136" font-size="13" fill="#ececec">prompt attacks are an arms race;</text>
<text x="44" y="154" font-size="13" fill="#ececec">novel phrasing beats patterns</text>
<rect x="327" y="90" width="277" height="230" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="341" y="114" font-size="15" font-weight="bold" fill="#ececec">No business-logic sanitizing</text>
<text x="341" y="136" font-size="13" fill="#ececec">injection -&gt; refund API call is</text>
<text x="341" y="154" font-size="13" fill="#ececec">a tool-authorization failure</text>
<rect x="624" y="90" width="277" height="230" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="638" y="114" font-size="15" font-weight="bold" fill="#ececec">No judging truth alone</text>
<text x="638" y="136" font-size="13" fill="#ececec">grounding needs a source;</text>
<text x="638" y="154" font-size="13" fill="#ececec">no source, no verdict</text>
<text x="60" y="365" font-size="13" text-anchor="start" fill="#a8a8a8">The exam tests honesty about limits. Defenses make attacks harder and pricier, never impossible.</text>
</svg>