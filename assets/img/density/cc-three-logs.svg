<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Observability: three logs, three depths">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Observability: three logs, three depths</text>
<rect x="30" y="70" width="277" height="290" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="44" y="94" font-size="15" font-weight="bold" fill="#ececec">CloudTrail: AUDIT</text>
<text x="44" y="116" font-size="13" fill="#ececec">Who called which API,</text>
<text x="44" y="134" font-size="13" fill="#ececec">when, from where, success?</text>
<text x="44" y="152" font-size="13" fill="#ececec"></text>
<text x="44" y="170" font-size="13" fill="#ececec">Metadata only: never prompt</text>
<text x="44" y="188" font-size="13" fill="#ececec">or response text</text>
<text x="44" y="206" font-size="13" fill="#ececec">Event history: 90 days</text>
<rect x="327" y="70" width="277" height="290" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="341" y="94" font-size="15" font-weight="bold" fill="#ececec">CloudWatch: OPERATIONS</text>
<text x="341" y="116" font-size="13" fill="#ececec">Metrics and alarms on</text>
<text x="341" y="134" font-size="13" fill="#ececec">what is happening NOW</text>
<text x="341" y="152" font-size="13" fill="#ececec"></text>
<text x="341" y="170" font-size="13" fill="#ececec">Block rates, token counts,</text>
<text x="341" y="188" font-size="13" fill="#ececec">throttling, guardrail hits</text>
<rect x="624" y="70" width="277" height="290" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="638" y="94" font-size="15" font-weight="bold" fill="#ececec">Invocation logging: CONTENT</text>
<text x="638" y="116" font-size="13" fill="#ececec">Opt-in FULL prompt and</text>
<text x="638" y="134" font-size="13" fill="#ececec">response text to S3/CW</text>
<text x="638" y="152" font-size="13" fill="#ececec"></text>
<text x="638" y="170" font-size="13" fill="#ececec">KMS-encryptable</text>
<text x="638" y="188" font-size="13" fill="#ececec">Only source for exact</text>
<text x="638" y="206" font-size="13" fill="#ececec">blocked prompt</text>
</svg>