<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Contextual grounding: the 5-to-7-day example">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Contextual grounding: the 5-to-7-day example</text>
<rect x="60" y="90" width="800" height="90" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="74" y="114" font-size="15" font-weight="bold" fill="#ececec">The source</text>
<text x="74" y="136" font-size="13" fill="#ececec">Source chunk: "Refunds take 5 to 7 days."</text>
<rect x="60" y="210" width="380" height="130" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="74" y="234" font-size="15" font-weight="bold" fill="#ececec">The answer</text>
<text x="74" y="256" font-size="13" fill="#ececec">Model answer: "Refunds take</text>
<text x="74" y="274" font-size="13" fill="#ececec">3 to 5 days."</text>
<text x="74" y="292" font-size="13" fill="#ececec"></text>
<text x="74" y="310" font-size="13" fill="#ececec">Fluent. Confident. Wrong.</text>
<rect x="480" y="210" width="380" height="130" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="494" y="234" font-size="15" font-weight="bold" fill="#ececec">The check</text>
<text x="494" y="256" font-size="13" fill="#ececec">Score: 0.23</text>
<text x="494" y="274" font-size="13" fill="#ececec">Threshold: 0.7</text>
<text x="494" y="292" font-size="13" fill="#ececec"></text>
<text x="494" y="310" font-size="13" fill="#ececec">0.23 &lt; 0.7 -&gt; BLOCKED</text>
<line x1="440" y1="275" x2="480" y2="275" stroke="#ececec" stroke-width="2"/>
<polygon points="480,275 470.9,279.1 470.9,270.9" fill="#ececec"/>
<text x="60" y="380" font-size="13" text-anchor="start" fill="#a8a8a8">RAG's signature failure: good chunks in, invented details out. The check decomposes the answer and scores</text>
<text x="60" y="399" font-size="13" text-anchor="start" fill="#a8a8a8">each claim against the source.</text>
</svg>