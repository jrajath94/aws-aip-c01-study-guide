<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img" aria-label="Network and data protection">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="360" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Network and data protection</text>
<rect x="60" y="110" width="240" height="140" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="180.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Your VPC</text>
<text x="180.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Lambda in private subnets</text>
<text x="180.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">no public internet</text>
<rect x="360" y="110" width="240" height="140" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="480.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">PrivateLink</text>
<text x="480.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Interface endpoints</text>
<text x="480.0" y="174" font-size="13" text-anchor="middle" fill="#ececec">for Bedrock APIs</text>
<rect x="660" y="110" width="200" height="140" rx="8" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
<text x="760.0" y="134" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Bedrock</text>
<text x="760.0" y="156" font-size="13" text-anchor="middle" fill="#ececec">Bedrock APIs</text>
<line x1="300" y1="180" x2="360" y2="180" stroke="#ececec" stroke-width="2"/>
<polygon points="360,180 350.9,184.1 350.9,175.9" fill="#ececec"/>
<line x1="600" y1="180" x2="660" y2="180" stroke="#ececec" stroke-width="2"/>
<polygon points="660,180 650.9,184.1 650.9,175.9" fill="#ececec"/>
<text x="60" y="300" font-size="13" text-anchor="start" fill="#a8a8a8">A NAT gateway gives public internet access and violates the constraint. KMS at rest, TLS in transit.</text>
</svg>