<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 440" role="img" aria-label="Perceived latency: time to first token beats total time">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="440" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Perceived latency: time to first token beats total time</text>
<text x="60" y="100" font-size="14" font-weight="bold" text-anchor="start" fill="#ececec">Non-streaming:</text>
<rect x="230" y="78" width="610" height="36" rx="6" fill="#141414" stroke="#a8a8a8" stroke-width="1"/>
<line x1="840" y1="70" x2="840" y2="150" stroke="#e07a5f" stroke-width="2"/>
<text x="700" y="105" font-size="12" text-anchor="middle" fill="#a8a8a8">silence, then the whole answer</text>
<text x="840" y="165" font-size="12" text-anchor="middle" fill="#e07a5f">TTFT = total time</text>
<text x="60" y="220" font-size="14" font-weight="bold" text-anchor="start" fill="#ececec">Streaming:</text>
<rect x="230" y="198" width="610" height="36" rx="6" fill="none" stroke="#7fb069" stroke-width="2"/>
<rect x="230" y="198" width="330" height="36" fill="#7fb069" opacity="0.30"/>
<line x1="300" y1="190" x2="300" y2="270" stroke="#7fb069" stroke-width="2"/>
<text x="480" y="225" font-size="12" text-anchor="middle" fill="#ececec">tokens arrive from the first second</text>
<text x="300" y="285" font-size="12" text-anchor="middle" fill="#7fb069">TTFT ~ 1 s</text>
<text x="60" y="340" font-size="13" text-anchor="start" fill="#a8a8a8">Total durations are similar. The difference is entirely when the user sees something.</text>
<text x="60" y="390" font-size="13" text-anchor="start" fill="#e07a5f">What breaks it: a proxy that buffers the full body, or API Gateway's 29-second cap on REST streams.</text>
<text x="60" y="409" font-size="13" text-anchor="start" fill="#e07a5f">Streaming cannot fix a slow model.</text>
</svg>