<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="AgentCore: five parts">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">AgentCore: five parts</text>
<rect x="335" y="88" width="250" height="104" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="351" y="118" font-size="15" font-weight="bold">Runtime</text>
<text x="351" y="140" font-size="12" fill="#a8a8a8">your container, serverless</text>
<text x="351" y="168" font-size="12" fill="#a8a8a8">:8080 /invocations /ping</text>
<rect x="40" y="240" width="192" height="96" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="56" y="270" font-size="15" font-weight="bold">Gateway</text>
<text x="56" y="292" font-size="12" fill="#a8a8a8">APIs to MCP tools</text>
<rect x="252" y="240" width="192" height="96" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="268" y="270" font-size="15" font-weight="bold">Memory</text>
<text x="268" y="292" font-size="12" fill="#a8a8a8">short + long term</text>
<rect x="476" y="240" width="192" height="96" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="492" y="270" font-size="15" font-weight="bold">Identity</text>
<text x="492" y="292" font-size="12" fill="#a8a8a8">agent credentials</text>
<rect x="688" y="240" width="192" height="96" rx="8" fill="none" stroke="#a8a8a8" stroke-width="2"/>
<text x="704" y="270" font-size="15" font-weight="bold">Observability</text>
<text x="704" y="292" font-size="12" fill="#a8a8a8">traces, metrics</text>
<line x1="460" y1="192" x2="460" y2="240" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="460,240 450,235 450,245" fill="#a8a8a8"/>
<line x1="136" y1="240" x2="400" y2="150" stroke="#5C6B7A" stroke-width="2"/>
<polygon points="400,150 390,145 390,155" fill="#5C6B7A"/>
<line x1="348" y1="240" x2="400" y2="150" stroke="#5C6B7A" stroke-width="2"/>
<polygon points="400,150 390,145 390,155" fill="#5C6B7A"/>
<line x1="572" y1="240" x2="520" y2="150" stroke="#5C6B7A" stroke-width="2"/>
<polygon points="520,150 510,145 510,155" fill="#5C6B7A"/>
<line x1="784" y1="240" x2="520" y2="150" stroke="#5C6B7A" stroke-width="2"/>
<polygon points="520,150 510,145 510,155" fill="#5C6B7A"/>
<text x="60" y="376" font-size="13" fill="#a8a8a8">Runtime hosts the container. The four side boxes are platform services the agent calls.</text>
</svg>
