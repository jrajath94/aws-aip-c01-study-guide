<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Retries: exponential backoff with jitter">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Retries: exponential backoff with jitter</text>
<rect x="60" y="80" width="800" height="70" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="460.0" y="104" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">The signal</text>
<text x="460.0" y="126" font-size="13" text-anchor="middle" fill="#ececec">Throttle (429 / ThrottlingException): wait, then retry. Never tight-loop.</text>
<rect x="130" y="200" width="200" height="110" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="230.0" y="224" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Attempt 1</text>
<text x="230.0" y="246" font-size="13" text-anchor="middle" fill="#ececec">wait 1s + jitter</text>
<text x="230.0" y="264" font-size="13" text-anchor="middle" fill="#ececec">then retry</text>
<line x1="330" y1="255" x2="390" y2="255" stroke="#ececec" stroke-width="2"/>
<polygon points="390,255 380.9,259.1 380.9,250.9" fill="#ececec"/>
<rect x="390" y="200" width="200" height="110" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="490.0" y="224" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Attempt 2</text>
<text x="490.0" y="246" font-size="13" text-anchor="middle" fill="#ececec">wait 2s + jitter</text>
<text x="490.0" y="264" font-size="13" text-anchor="middle" fill="#ececec">then retry</text>
<line x1="590" y1="255" x2="650" y2="255" stroke="#ececec" stroke-width="2"/>
<polygon points="650,255 640.9,259.1 640.9,250.9" fill="#ececec"/>
<rect x="650" y="200" width="200" height="110" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="750.0" y="224" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Attempt 3</text>
<text x="750.0" y="246" font-size="13" text-anchor="middle" fill="#ececec">wait 4s + jitter</text>
<text x="750.0" y="264" font-size="13" text-anchor="middle" fill="#ececec">then retry</text>
<text x="60" y="360" font-size="13" text-anchor="start" fill="#a8a8a8">Jitter randomizes each wait so a fleet of clients does not retry in lockstep and re-throttle itself.</text>
<text x="60" y="379" font-size="13" text-anchor="start" fill="#a8a8a8">Sustained throttles mean PT, not more retries.</text>
</svg>