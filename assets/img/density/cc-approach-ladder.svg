<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 460" role="img" aria-label="The approach ladder: climb only when the cheaper rung fails">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="460" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The approach ladder: climb only when the cheaper rung fails</text>
<rect x="60" y="70" width="560" height="72" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="74" y="94" font-size="15" font-weight="bold" fill="#ececec">Fine-tuning</text>
<text x="74" y="116" font-size="13" fill="#ececec">bakes stable behavior into weights</text>
<text x="650" y="100" font-size="13" text-anchor="start" fill="#a8a8a8">most effort</text>
<rect x="60" y="158" width="560" height="72" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="74" y="182" font-size="15" font-weight="bold" fill="#ececec">Agents</text>
<text x="74" y="204" font-size="13" fill="#ececec">model takes actions via tools</text>
<text x="650" y="188" font-size="13" text-anchor="start" fill="#a8a8a8">doing, not just answering</text>
<rect x="60" y="246" width="560" height="72" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="74" y="270" font-size="15" font-weight="bold" fill="#ececec">RAG</text>
<text x="74" y="292" font-size="13" fill="#ececec">looks up your documents at answer time</text>
<text x="650" y="276" font-size="13" text-anchor="start" fill="#a8a8a8">private / fresh / cited facts</text>
<rect x="60" y="334" width="560" height="72" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="74" y="358" font-size="15" font-weight="bold" fill="#ececec">Prompt engineering</text>
<text x="74" y="380" font-size="13" fill="#ececec">change instructions and examples</text>
<text x="650" y="364" font-size="13" text-anchor="start" fill="#a8a8a8">cheapest: formatting, tone,</text>
<text x="650" y="383" font-size="13" text-anchor="start" fill="#a8a8a8">extraction</text>
<text x="60" y="440" font-size="13" text-anchor="start" fill="#7fb069">Start at the bottom. Climb only when the cheaper rung cannot satisfy the requirement.</text>
</svg>