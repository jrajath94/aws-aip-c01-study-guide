<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 232" role="img" aria-label="Reasoning: the tradeoff">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="232" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Reasoning: the tradeoff</text>
<text x="230" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#a8a8a8">Reasoning OFF</text>
<rect x="60" y="96" width="340" height="56" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="76" y="126" font-size="15" font-weight="bold">cheaper, faster</text>
<text x="76" y="148" font-size="12" fill="#a8a8a8">baseline accuracy</text>
<text x="690" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#f2c14e">Reasoning ON</text>
<rect x="520" y="96" width="340" height="56" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="536" y="126" font-size="15" font-weight="bold">costlier, slower</text>
<text x="536" y="148" font-size="12" fill="#a8a8a8">higher accuracy on hard tasks</text>
<line x1="400" y1="124" x2="520" y2="124" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="520,124 510,119 510,129" fill="#a8a8a8"/>
<text x="460.0" y="116.0" text-anchor="middle" font-size="12" fill="#a8a8a8">enable CoT</text>
<text x="60" y="208" font-size="13" fill="#a8a8a8">Chain of thought buys accuracy with tokens and time. Simple tasks do not need it.</text>
</svg>
