<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="The levers in cost order: cheapest first">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The levers in cost order: cheapest first</text>
<rect x="220" y="70" width="660" height="52" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="236" y="102" font-size="15" font-weight="bold" fill="#ececec">1. Right-size + cascade</text>
<rect x="220" y="142" width="540" height="52" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="236" y="174" font-size="15" font-weight="bold" fill="#ececec">2. Prompt caching</text>
<rect x="220" y="214" width="420" height="52" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="236" y="246" font-size="15" font-weight="bold" fill="#ececec">3. Batch inference</text>
<rect x="220" y="286" width="320" height="52" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="236" y="318" font-size="15" font-weight="bold" fill="#ececec">4. Provisioned Throughput</text>
<text x="60" y="382" font-size="13" text-anchor="start" fill="#a8a8a8">TOKEN MATH first: cost = (input + output tokens) x price. Proactive means math before the call, not</text>
<text x="60" y="401" font-size="13" text-anchor="start" fill="#a8a8a8">after.</text>
</svg>