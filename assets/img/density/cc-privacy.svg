<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img" aria-label="Data protection on Bedrock">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="360" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Data protection on Bedrock</text>
<rect x="40" y="80" width="260" height="200" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="54" y="104" font-size="15" font-weight="bold" fill="#ececec">No training on your data</text>
<text x="54" y="126" font-size="13" fill="#ececec">Customer data is NOT used</text>
<text x="54" y="144" font-size="13" fill="#ececec">to train models</text>
<text x="54" y="162" font-size="13" fill="#ececec"></text>
<text x="54" y="180" font-size="13" fill="#ececec">Service terms guarantee</text>
<rect x="330" y="80" width="260" height="200" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="344" y="104" font-size="15" font-weight="bold" fill="#ececec">KMS at rest, TLS in transit</text>
<text x="344" y="126" font-size="13" fill="#ececec">Customer-managed keys</text>
<text x="344" y="144" font-size="13" fill="#ececec">(envelope encryption)</text>
<text x="344" y="162" font-size="13" fill="#ececec"></text>
<text x="344" y="180" font-size="13" fill="#ececec">TLS in transit</text>
<rect x="620" y="80" width="260" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="634" y="104" font-size="15" font-weight="bold" fill="#ececec">Data stays put</text>
<text x="634" y="126" font-size="13" fill="#ececec">Stays in your account</text>
<text x="634" y="144" font-size="13" fill="#ececec">and your region</text>
<text x="634" y="162" font-size="13" fill="#ececec"></text>
<text x="634" y="180" font-size="13" fill="#ececec">Logs may hold PII: justify</text>
<text x="634" y="198" font-size="13" fill="#ececec">keeping them, redact, retain</text>
</svg>