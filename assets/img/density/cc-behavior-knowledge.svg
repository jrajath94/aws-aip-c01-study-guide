<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 360" role="img" aria-label="Custom models are about behavior, not knowledge">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="360" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Custom models are about behavior, not knowledge</text>
<rect x="40" y="80" width="400" height="220" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="54" y="104" font-size="15" font-weight="bold" fill="#ececec">Need new KNOWLEDGE?</text>
<text x="54" y="126" font-size="13" fill="#ececec">External facts the model was</text>
<text x="54" y="144" font-size="13" fill="#ececec">never trained on</text>
<text x="54" y="162" font-size="13" fill="#ececec"></text>
<text x="54" y="180" font-size="13" fill="#ececec">Answer: RAG (lookup at</text>
<text x="54" y="198" font-size="13" fill="#ececec">answer time)</text>
<rect x="480" y="80" width="400" height="220" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="494" y="104" font-size="15" font-weight="bold" fill="#ececec">Need new BEHAVIOR?</text>
<text x="494" y="126" font-size="13" fill="#ececec">Stable tone, format, or style</text>
<text x="494" y="144" font-size="13" fill="#ececec">prompts cannot reliably hold</text>
<text x="494" y="162" font-size="13" fill="#ececec"></text>
<text x="494" y="180" font-size="13" fill="#ececec">Answer: fine-tuning (bake</text>
<text x="494" y="198" font-size="13" fill="#ececec">behavior into weights)</text>
<text x="60" y="336" font-size="13" text-anchor="start" fill="#a8a8a8">Rule: fresh or private facts = RAG. Repeatable behavior = fine-tuning. Never fine-tune to teach facts.</text>
</svg>