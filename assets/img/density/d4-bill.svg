<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="The bill, in one paragraph: input tokens + output tokens, times price">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The bill, in one paragraph: input tokens + output tokens, times price</text>
<rect x="60" y="100" width="240" height="160" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="180.0" y="124" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Input tokens</text>
<text x="180.0" y="146" font-size="13" text-anchor="middle" fill="#ececec">system prompt + history</text>
<text x="180.0" y="164" font-size="13" text-anchor="middle" fill="#ececec">+ user message</text>
<text x="180.0" y="182" font-size="13" text-anchor="middle" fill="#ececec"></text>
<text x="180.0" y="200" font-size="13" text-anchor="middle" fill="#ececec">priced LOWER per token</text>
<text x="345" y="185" font-size="24" text-anchor="middle" fill="#ececec">+</text>
<rect x="390" y="100" width="240" height="160" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="510.0" y="124" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Output tokens</text>
<text x="510.0" y="146" font-size="13" text-anchor="middle" fill="#ececec">every token generated</text>
<text x="510.0" y="164" font-size="13" text-anchor="middle" fill="#ececec"></text>
<text x="510.0" y="182" font-size="13" text-anchor="middle" fill="#ececec">priced HIGHER per token</text>
<text x="510.0" y="200" font-size="13" text-anchor="middle" fill="#ececec">(generation costs compute)</text>
<text x="675" y="185" font-size="24" text-anchor="middle" fill="#ececec">x</text>
<rect x="720" y="100" width="140" height="160" rx="8" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
<text x="790.0" y="124" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Price</text>
<text x="790.0" y="146" font-size="13" text-anchor="middle" fill="#ececec">per-token</text>
<text x="790.0" y="164" font-size="13" text-anchor="middle" fill="#ececec">price</text>
<text x="60" y="320" font-size="13" text-anchor="start" fill="#a8a8a8">Watch the input meter: history accumulation silently multiplies the bill on multi-turn chats. Cap the</text>
<text x="60" y="339" font-size="13" text-anchor="start" fill="#a8a8a8">output meter with max tokens.</text>
</svg>