<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 420" role="img" aria-label="Six categories, one sensitivity dial each">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="420" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Six categories, one sensitivity dial each</text>
<rect x="40" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="106.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">hate</text>
<text x="106.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="106.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="106.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="106.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<rect x="182" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="248.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">insults</text>
<text x="248.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="248.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="248.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="248.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<rect x="324" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="390.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">sexual</text>
<text x="390.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="390.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="390.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="390.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<rect x="466" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="532.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">violence</text>
<text x="532.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="532.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="532.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="532.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<rect x="608" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="674.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">misconduct</text>
<text x="674.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="674.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="674.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="674.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<rect x="750" y="90" width="132" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="816.0" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#ececec">prompt attack</text>
<text x="816.0" y="136" font-size="13" text-anchor="middle" fill="#ececec">NONE</text>
<text x="816.0" y="154" font-size="13" text-anchor="middle" fill="#ececec">LOW</text>
<text x="816.0" y="172" font-size="13" text-anchor="middle" fill="#ececec">MEDIUM</text>
<text x="816.0" y="190" font-size="13" text-anchor="middle" fill="#ececec">HIGH</text>
<text x="60" y="340" font-size="13" text-anchor="start" fill="#a8a8a8">You do not define what counts as hate; AWS's classifier does. You only choose the sensitivity. LOW blocks</text>
<text x="60" y="359" font-size="13" text-anchor="start" fill="#a8a8a8">only severe violations; HIGH blocks even borderline content.</text>
</svg>