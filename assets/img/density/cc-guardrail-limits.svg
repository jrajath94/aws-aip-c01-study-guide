<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="What guardrails can never do">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">What guardrails can never do</text>
<rect x="40" y="70" width="400" height="290" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="54" y="94" font-size="15" font-weight="bold" fill="#ececec">Guardrails CAN</text>
<text x="54" y="116" font-size="13" fill="#ececec">Filter content in and out</text>
<text x="54" y="134" font-size="13" fill="#ececec">Block denied topics</text>
<text x="54" y="152" font-size="13" fill="#ececec">Redact PII</text>
<text x="54" y="170" font-size="13" fill="#ececec">Check grounding</text>
<rect x="480" y="70" width="400" height="290" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="494" y="94" font-size="15" font-weight="bold" fill="#ececec">Guardrails CANNOT</text>
<text x="494" y="116" font-size="13" fill="#ececec">IAM: who may call -&gt; IAM policies</text>
<text x="494" y="134" font-size="13" fill="#ececec">Tenant isolation -&gt; per-KB IAM filtering</text>
<text x="494" y="152" font-size="13" fill="#ececec">Token quotas -&gt; API Gateway usage plans</text>
<text x="494" y="170" font-size="13" fill="#ececec">Data extraction -&gt; not a filter job</text>
</svg>