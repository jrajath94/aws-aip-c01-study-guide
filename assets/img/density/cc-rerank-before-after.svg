<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 280" role="img" aria-label="Reranker: before and after">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="280" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Reranker: before and after</text>
<text x="230" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#e07a5f">BEFORE: vector similarity only</text>
<rect x="60" y="96" width="340" height="56" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="76" y="126" font-size="15" font-weight="bold">1. Bob: vanilla</text>
<text x="76" y="148" font-size="12" fill="#a8a8a8">similar shape, wrong person</text>
<rect x="60" y="160" width="340" height="56" rx="8" fill="none" stroke="#5C6B7A" stroke-width="2"/>
<text x="76" y="190" font-size="15" font-weight="bold">2. Tom: chocolate</text>
<text x="76" y="212" font-size="12" fill="#a8a8a8">buried, actually relevant</text>
<text x="690" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#7fb069">AFTER: reranker reorders top-k</text>
<rect x="520" y="96" width="340" height="56" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="536" y="126" font-size="15" font-weight="bold">1. Tom: chocolate</text>
<text x="536" y="148" font-size="12" fill="#a8a8a8">relevant, now on top</text>
<rect x="520" y="160" width="340" height="56" rx="8" fill="none" stroke="#5C6B7A" stroke-width="2"/>
<text x="536" y="190" font-size="15" font-weight="bold">2. Bob: vanilla</text>
<text x="536" y="212" font-size="12" fill="#a8a8a8">similar but demoted</text>
<line x1="400" y1="140" x2="520" y2="140" stroke="#f2c14e" stroke-width="2"/>
<polygon points="520,140 510,135 510,145" fill="#f2c14e"/>
<text x="460.0" y="132.0" text-anchor="middle" font-size="12" fill="#f2c14e">Rerank API</text>
<text x="60" y="256" font-size="13" fill="#a8a8a8">Similarity is cheap. Relevance needs a judge. Rerank the top-k only.</text>
</svg>
