<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 480" role="img" aria-label="The six guardrail policies at a glance">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="480" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The six guardrail policies at a glance</text>
<rect x="30" y="70" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="170.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Content filters</text>
<text x="170.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">hate, insults, sexual, violence,</text>
<text x="170.0" y="134" font-size="13" text-anchor="middle" fill="#ececec">misconduct, prompt attack</text>
<rect x="330" y="70" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="470.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Denied topics</text>
<text x="470.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">ban whole subjects:</text>
<text x="470.0" y="134" font-size="13" text-anchor="middle" fill="#ececec">diagnosis, investment advice</text>
<rect x="630" y="70" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="770.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Word filters</text>
<text x="770.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">exact strings that must</text>
<text x="770.0" y="134" font-size="13" text-anchor="middle" fill="#ececec">never appear</text>
<rect x="30" y="260" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="170.0" y="284" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Sensitive info</text>
<text x="170.0" y="306" font-size="13" text-anchor="middle" fill="#ececec">30+ PII entity types;</text>
<text x="170.0" y="324" font-size="13" text-anchor="middle" fill="#ececec">BLOCK or MASK</text>
<rect x="330" y="260" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="470.0" y="284" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Grounding check</text>
<text x="470.0" y="306" font-size="13" text-anchor="middle" fill="#ececec">is the answer supported</text>
<text x="470.0" y="324" font-size="13" text-anchor="middle" fill="#ececec">by the source? score 0-1</text>
<rect x="630" y="260" width="280" height="165" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="770.0" y="284" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Auto Reasoning</text>
<text x="770.0" y="306" font-size="13" text-anchor="middle" fill="#ececec">does the answer obey</text>
<text x="770.0" y="324" font-size="13" text-anchor="middle" fill="#ececec">the policy? formal logic</text>
</svg>