<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Two attacks, different doors">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Two attacks, different doors</text>
<rect x="60" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="74" y="124" font-size="15" font-weight="bold" fill="#ececec">Prompt INJECTION (indirect)</text>
<text x="74" y="146" font-size="13" fill="#ececec">User is innocent;</text>
<text x="74" y="164" font-size="13" fill="#ececec">the DATA is poisoned</text>
<text x="74" y="182" font-size="13" fill="#ececec"></text>
<text x="74" y="200" font-size="13" fill="#ececec">A tool output, retrieved chunk,</text>
<text x="74" y="218" font-size="13" fill="#ececec">or web page smuggles:</text>
<text x="74" y="236" font-size="13" fill="#ececec">"ignore all safety rules..."</text>
<rect x="480" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="494" y="124" font-size="15" font-weight="bold" fill="#ececec">JAILBREAK (direct)</text>
<text x="494" y="146" font-size="13" fill="#ececec">User attacks directly:</text>
<text x="494" y="164" font-size="13" fill="#ececec"></text>
<text x="494" y="182" font-size="13" fill="#ececec">"ignore all previous</text>
<text x="494" y="200" font-size="13" fill="#ececec">instructions"</text>
<text x="494" y="218" font-size="13" fill="#ececec">"you are now unrestricted"</text>
<text x="494" y="236" font-size="13" fill="#ececec"></text>
<text x="494" y="254" font-size="13" fill="#ececec">Override, role play, hypotheticals</text>
<text x="60" y="350" font-size="13" text-anchor="start" fill="#a8a8a8">One door is the data, the other is the user. Both are caught by the prompt attack content filter on</text>
<text x="60" y="369" font-size="13" text-anchor="start" fill="#a8a8a8">inputs.</text>
</svg>