<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 500" role="img" aria-label="Retrieval quality: the four fixes, in exam order">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="500" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Retrieval quality: the four fixes, in exam order</text>
<rect x="260" y="70" width="400" height="70" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="460.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Symptom</text>
<text x="460.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">RAG retrieves the wrong chunks</text>
<rect x="110" y="170" width="700" height="62" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="124" y="194" font-size="15" font-weight="bold" fill="#ececec">1. Hybrid search</text>
<text x="124" y="216" font-size="13" fill="#ececec">vector (meaning) + keyword (BM25) in parallel; exact product codes stop being lost</text>
<line x1="460" y1="140" x2="460" y2="170" stroke="#ececec" stroke-width="2"/>
<polygon points="460,170 455.9,160.9 464.1,160.9" fill="#ececec"/>
<rect x="110" y="248" width="700" height="62" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="124" y="272" font-size="15" font-weight="bold" fill="#ececec">2. Rerank</text>
<text x="124" y="294" font-size="13" fill="#ececec">top 50 candidates through a rerank model; best-ordered top 5 reach the prompt</text>
<line x1="460" y1="232" x2="460" y2="248" stroke="#ececec" stroke-width="2"/>
<polygon points="460,248 455.9,238.9 464.1,238.9" fill="#ececec"/>
<rect x="110" y="326" width="700" height="62" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="124" y="350" font-size="15" font-weight="bold" fill="#ececec">3. Query handling</text>
<text x="124" y="372" font-size="13" fill="#ececec">expansion (synonyms), decomposition (split complex questions), HyDE</text>
<line x1="460" y1="310" x2="460" y2="326" stroke="#ececec" stroke-width="2"/>
<polygon points="460,326 455.9,316.9 464.1,316.9" fill="#ececec"/>
<rect x="110" y="404" width="700" height="62" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="124" y="428" font-size="15" font-weight="bold" fill="#ececec">4. Debug the pipeline</text>
<text x="124" y="450" font-size="13" fill="#ececec">same embedding model at ingest and query? chunking changed? KB out of sync?</text>
<line x1="460" y1="388" x2="460" y2="404" stroke="#ececec" stroke-width="2"/>
<polygon points="460,404 455.9,394.9 464.1,394.9" fill="#ececec"/>
</svg>