<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Identity: three locks, three scopes">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Identity: three locks, three scopes</text>
<rect x="110" y="70" width="700" height="90" rx="8" fill="#141414" stroke="#e07a5f" stroke-width="1.5"/>
<text x="460.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">SCPs bound the ORG</text>
<text x="460.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">SCPs: org-wide maximum permissions across accounts (StackSets keep them uniform)</text>
<line x1="460" y1="160" x2="460" y2="190" stroke="#ececec" stroke-width="2"/>
<polygon points="460,190 455.9,180.9 464.1,180.9" fill="#ececec"/>
<rect x="110" y="190" width="700" height="90" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="460.0" y="214" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">Boundaries bound the ROLE</text>
<text x="460.0" y="236" font-size="13" text-anchor="middle" fill="#ececec">Permissions boundaries: cap what a single role can ever be granted</text>
<line x1="460" y1="280" x2="460" y2="310" stroke="#ececec" stroke-width="2"/>
<polygon points="460,310 455.9,300.9 464.1,300.9" fill="#ececec"/>
<rect x="110" y="310" width="700" height="70" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="460.0" y="334" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">IAM grants the ACCESS</text>
<text x="460.0" y="356" font-size="13" text-anchor="middle" fill="#ececec">IAM policies: least-privilege grants on model, KB, and agent ARNs</text>
</svg>