<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="CloudTrail vs invocation logging: two logs, two jobs">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">CloudTrail vs invocation logging: two logs, two jobs</text>
<rect x="60" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="74" y="124" font-size="15" font-weight="bold" fill="#ececec">CloudTrail: AUDIT</text>
<text x="74" y="146" font-size="13" fill="#ececec">WHO called WHICH api,</text>
<text x="74" y="164" font-size="13" fill="#ececec">when, from where, success?</text>
<text x="74" y="182" font-size="13" fill="#ececec"></text>
<text x="74" y="200" font-size="13" fill="#ececec">NEVER prompt or response text</text>
<text x="74" y="218" font-size="13" fill="#ececec">Event history: 90 days</text>
<text x="74" y="236" font-size="13" fill="#ececec"></text>
<text x="74" y="254" font-size="13" fill="#ececec">"who invoked which model at 2am"</text>
<rect x="480" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="494" y="124" font-size="15" font-weight="bold" fill="#ececec">Invocation logging: CONTENT</text>
<text x="494" y="146" font-size="13" fill="#ececec">FULL prompt and response text</text>
<text x="494" y="164" font-size="13" fill="#ececec">to S3 or CloudWatch Logs</text>
<text x="494" y="182" font-size="13" fill="#ececec"></text>
<text x="494" y="200" font-size="13" fill="#ececec">Opt-in. KMS-encryptable.</text>
<text x="494" y="218" font-size="13" fill="#ececec">May contain PII: justify,</text>
<text x="494" y="236" font-size="13" fill="#ececec">redact, retain deliberately</text>
<text x="494" y="254" font-size="13" fill="#ececec"></text>
<text x="494" y="272" font-size="13" fill="#ececec">"show the exact blocked prompt"</text>
</svg>