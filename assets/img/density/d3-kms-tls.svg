<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="KMS at rest, TLS in transit">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">KMS at rest, TLS in transit</text>
<rect x="60" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="74" y="124" font-size="15" font-weight="bold" fill="#ececec">Customer managed key</text>
<text x="74" y="146" font-size="13" fill="#ececec">CMK: you create, control,</text>
<text x="74" y="164" font-size="13" fill="#ececec">rotate, and can disable it</text>
<text x="74" y="182" font-size="13" fill="#ececec"></text>
<text x="74" y="200" font-size="13" fill="#ececec">Every key use logged</text>
<text x="74" y="218" font-size="13" fill="#ececec">in CloudTrail</text>
<text x="74" y="236" font-size="13" fill="#ececec"></text>
<text x="74" y="254" font-size="13" fill="#ececec">Envelope encryption</text>
<rect x="480" y="100" width="380" height="200" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="494" y="124" font-size="15" font-weight="bold" fill="#ececec">Protected at rest</text>
<text x="494" y="146" font-size="13" fill="#ececec">KB vector stores</text>
<text x="494" y="164" font-size="13" fill="#ececec">agent session data</text>
<text x="494" y="182" font-size="13" fill="#ececec">invocation logs</text>
<text x="494" y="200" font-size="13" fill="#ececec">custom model artifacts in S3</text>
<text x="494" y="218" font-size="13" fill="#ececec"></text>
<text x="494" y="236" font-size="13" fill="#ececec">Exposed volume = still ciphertext</text>
<text x="60" y="350" font-size="13" text-anchor="start" fill="#a8a8a8">AWS-owned keys give you no key-level control. Regulated workloads want customer-controlled keys.</text>
</svg>