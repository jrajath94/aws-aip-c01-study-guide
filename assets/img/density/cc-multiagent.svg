<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 440" role="img" aria-label="Five multi-agent patterns">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="440" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Five multi-agent patterns</text>
<rect x="60" y="72" width="800" height="56" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="76" y="102" font-size="15" font-weight="bold">Manager</text>
<text x="76" y="124" font-size="12" fill="#a8a8a8">one boss splits work, coordinates specialists</text>
<rect x="60" y="136" width="800" height="56" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="76" y="166" font-size="15" font-weight="bold">Router</text>
<text x="76" y="188" font-size="12" fill="#a8a8a8">classifier picks exactly one specialist</text>
<rect x="60" y="200" width="800" height="56" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="76" y="230" font-size="15" font-weight="bold">Parallel</text>
<text x="76" y="252" font-size="12" fill="#a8a8a8">independent subtasks run at once</text>
<rect x="60" y="264" width="800" height="56" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="76" y="294" font-size="15" font-weight="bold">Chaining</text>
<text x="76" y="316" font-size="12" fill="#a8a8a8">each output feeds the next prompt</text>
<rect x="60" y="328" width="800" height="56" rx="8" fill="none" stroke="#a8a8a8" stroke-width="2"/>
<text x="76" y="358" font-size="15" font-weight="bold">Evaluator</text>
<text x="76" y="380" font-size="12" fill="#a8a8a8">judge loops until quality passes</text>
<text x="60" y="416" font-size="13" fill="#a8a8a8">Too many tools or tangled logic means split. Simple deterministic flow means no agents.</text>
</svg>
