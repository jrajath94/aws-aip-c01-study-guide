<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 480" role="img" aria-label="Calling models: InvokeModel vs Converse vs streaming">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="480" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Calling models: InvokeModel vs Converse vs streaming</text>
<rect x="60" y="70" width="800" height="80" rx="8" fill="#141414" stroke="#ececec" stroke-width="1.5"/>
<text x="460.0" y="94" font-size="15" font-weight="bold" text-anchor="middle" fill="#ececec">The one question</text>
<text x="460.0" y="116" font-size="13" text-anchor="middle" fill="#ececec">Do you need a provider-only feature (embeddings, image gen params, provider sampling)?</text>
<line x1="460" y1="150" x2="200" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="200,200 208.2,194.3 209.7,202.3" fill="#ececec"/>
<text x="330.0" y="169.0" font-size="12" text-anchor="middle" fill="#a8a8a8">YES</text>
<line x1="460" y1="150" x2="720" y2="200" stroke="#ececec" stroke-width="2"/>
<polygon points="720,200 710.3,202.3 711.8,194.3" fill="#ececec"/>
<text x="590.0" y="169.0" font-size="12" text-anchor="middle" fill="#a8a8a8">NO</text>
<rect x="40" y="200" width="320" height="200" rx="8" fill="#141414" stroke="#f2c14e" stroke-width="1.5"/>
<text x="54" y="224" font-size="15" font-weight="bold" fill="#ececec">InvokeModel</text>
<text x="54" y="246" font-size="13" fill="#ececec">Provider-specific JSON body</text>
<text x="54" y="264" font-size="13" fill="#ececec">Claude needs anthropic_version</text>
<text x="54" y="282" font-size="13" fill="#ececec">and max_tokens</text>
<text x="54" y="300" font-size="13" fill="#ececec"></text>
<text x="54" y="318" font-size="13" fill="#ececec">Embeddings go through here</text>
<rect x="560" y="200" width="320" height="200" rx="8" fill="#141414" stroke="#7fb069" stroke-width="1.5"/>
<text x="574" y="224" font-size="15" font-weight="bold" fill="#ececec">Converse</text>
<text x="574" y="246" font-size="13" fill="#ececec">One shape: modelId, messages,</text>
<text x="574" y="264" font-size="13" fill="#ececec">system, inferenceConfig,</text>
<text x="574" y="282" font-size="13" fill="#ececec">toolConfig, guardrailConfig</text>
<text x="574" y="300" font-size="13" fill="#ececec"></text>
<text x="574" y="318" font-size="13" fill="#ececec">Tool use + caching + guardrails</text>
<text x="574" y="336" font-size="13" fill="#ececec">built in. New code default.</text>
<rect x="110" y="420" width="700" height="46" rx="8" fill="#141414" stroke="#7aa5d2" stroke-width="1.5"/>
<text x="460" y="440" font-size="12" text-anchor="middle" fill="#ececec">Waiting user? Use the Stream variants:</text>
<text x="460" y="460" font-size="12" text-anchor="middle" fill="#a8a8a8">ConverseStream / InvokeModelWithResponseStream</text>
</svg>