<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 380" role="img" aria-label="RAG in three stages">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="920" height="380" fill="#0a0a0a"/>
<text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">RAG in three stages</text>
<rect x="40" y="80" width="250" height="120" rx="8" fill="none" stroke="#7fb069" stroke-width="2"/>
<text x="56" y="110" font-size="15" font-weight="bold">1. Pre-retrieval</text>
<text x="56" y="132" font-size="12" fill="#a8a8a8">chunking, indexing,</text>
<text x="56" y="168" font-size="12" fill="#a8a8a8">extraction, query rewrite</text>
<rect x="335" y="80" width="250" height="120" rx="8" fill="none" stroke="#f2c14e" stroke-width="2"/>
<text x="351" y="110" font-size="15" font-weight="bold">2. Retrieval</text>
<text x="351" y="132" font-size="12" fill="#a8a8a8">vector / keyword / hybrid</text>
<text x="351" y="168" font-size="12" fill="#a8a8a8">search the store</text>
<rect x="630" y="80" width="250" height="120" rx="8" fill="none" stroke="#e07a5f" stroke-width="2"/>
<text x="646" y="110" font-size="15" font-weight="bold">3. Post-retrieval</text>
<text x="646" y="132" font-size="12" fill="#a8a8a8">re-rank, filter,</text>
<text x="646" y="168" font-size="12" fill="#a8a8a8">augment, then generate</text>
<line x1="290" y1="140" x2="335" y2="140" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="335,140 325,135 325,145" fill="#a8a8a8"/>
<line x1="585" y1="140" x2="630" y2="140" stroke="#a8a8a8" stroke-width="2"/>
<polygon points="630,140 620,135 620,145" fill="#a8a8a8"/>
<rect x="40" y="240" width="840" height="72" rx="8" fill="none" stroke="#1E4D8C" stroke-width="2"/>
<text x="56" y="270" font-size="15" font-weight="bold">Fix in the stage that owns the problem</text>
<text x="56" y="292" font-size="12" fill="#a8a8a8">re-rank = post-retrieval. query rewrite = pre-retrieval.</text>
<text x="60" y="352" font-size="13" fill="#a8a8a8">One pipeline, three stages. The exam asks which stage a fix belongs to.</text>
</svg>
