<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="EC2 instance type letters: the letter tells you the strength">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Instance type m7i.large: first letter = family = strength</text>
<rect x="60" y="60" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="92" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">T, M</text>
<text x="200" y="120" text-anchor="middle" font-size="14" fill="#555555">general purpose</text>
<text x="200" y="146" text-anchor="middle" font-size="14" fill="#555555">balanced: web servers, small apps</text>
<rect x="360" y="60" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="92" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">C</text>
<text x="500" y="120" text-anchor="middle" font-size="14" fill="#555555">compute heavy</text>
<text x="500" y="146" text-anchor="middle" font-size="14" fill="#555555">batch jobs, game servers</text>
<rect x="660" y="60" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="92" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">R, X</text>
<text x="800" y="120" text-anchor="middle" font-size="14" fill="#555555">memory heavy</text>
<text x="800" y="146" text-anchor="middle" font-size="14" fill="#555555">databases, caches</text>
<rect x="60" y="210" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="242" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">I, D</text>
<text x="200" y="270" text-anchor="middle" font-size="14" fill="#555555">storage heavy</text>
<text x="200" y="296" text-anchor="middle" font-size="14" fill="#555555">fast local disks, warehouses</text>
<rect x="360" y="210" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="242" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">P, G</text>
<text x="500" y="270" text-anchor="middle" font-size="14" fill="#555555">GPU</text>
<text x="500" y="296" text-anchor="middle" font-size="14" fill="#555555">model training, graphics</text>
<rect x="660" y="210" width="280" height="130" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="242" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Inf, Trn</text>
<text x="800" y="270" text-anchor="middle" font-size="14" fill="#555555">AWS chips</text>
<text x="800" y="296" text-anchor="middle" font-size="14" fill="#555555">inference and training</text>
<text x="500" y="384" text-anchor="middle" font-size="14" fill="#555555">The exam gives the workload ("memory-intensive database") and expects the family ("R").</text>
</svg>
