<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Lambda: events in, code runs, writes out">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="310" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">LAMBDA: CODE WITH NO SERVERS</text>
<rect x="24" y="56" width="170" height="34" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="109" y="78" font-size="12" fill="#222222" text-anchor="middle">S3 upload</text>
<line x1="194" y1="73" x2="300" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="100" width="170" height="34" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="109" y="122" font-size="12" fill="#222222" text-anchor="middle">SQS message</text>
<line x1="194" y1="117" x2="300" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="144" width="170" height="34" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="109" y="166" font-size="12" fill="#222222" text-anchor="middle">API call</text>
<line x1="194" y1="161" x2="300" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="24" y="188" width="170" height="34" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="109" y="210" font-size="12" fill="#222222" text-anchor="middle">schedule</text>
<line x1="194" y1="205" x2="300" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="96" width="150" height="68" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2"/>
<text x="375" y="124" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">Lambda runs</text>
<text x="375" y="146" font-size="11.5" fill="#555555" text-anchor="middle">your function</text>
<line x1="450" y1="130" x2="530" y2="130" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="530" y="96" width="166" height="68" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="613" y="124" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">writes to</text>
<text x="613" y="146" font-size="11.5" fill="#555555" text-anchor="middle">DynamoDB, S3, ...</text>
<text x="360" y="258" font-size="12" fill="#555555" text-anchor="middle">Event in, code runs, bill per millisecond. Fifteen minutes max.</text>
<text x="360" y="282" font-size="12" fill="#555555" text-anchor="middle">'Run code when a file lands in S3' means a Lambda trigger, not a polling EC2.</text>
