<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 420" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="KMS envelope encryption">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Envelope encryption: the fast key encrypts data, the master key encrypts the fast key</text>
<rect x="60" y="60" width="380" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="250" y="90" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. KMS makes a data key</text>
<text x="250" y="116" text-anchor="middle" font-size="14" fill="#555555">2. the data key encrypts your file (fast, local)</text>
<text x="250" y="142" text-anchor="middle" font-size="14" fill="#555555">3. KMS encrypts the data key with your master key</text>
<path d="M440,120 L540,120" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="540" y="60" width="400" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="740" y="90" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">stored together:</text>
<text x="740" y="116" text-anchor="middle" font-size="14" fill="#555555">encrypted file + encrypted data key</text>
<text x="740" y="142" text-anchor="middle" font-size="14" fill="#555555">you never see raw key material</text>
<rect x="60" y="210" width="880" height="60" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="236" text-anchor="middle" font-size="14" fill="#111111">to read: ask KMS to unwrap the data key, then decrypt the file</text>
<rect x="60" y="290" width="420" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="270" y="318" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">every use is written to CloudTrail</text>
<text x="270" y="342" text-anchor="middle" font-size="14" fill="#555555">"audit every decryption" = SSE-KMS</text>
<rect x="520" y="290" width="420" height="100" rx="8" fill="#ffe9e9" stroke="#cc5555" stroke-width="1.5"/>
<text x="730" y="318" text-anchor="middle" font-size="13" fill="#991111" font-weight="bold">disable the key = instant revoke</text>
<text x="730" y="342" text-anchor="middle" font-size="13" fill="#991111">everything under it unreadable</text>
<text x="730" y="364" text-anchor="middle" font-size="13" fill="#555555">the safety switch AND the footgun</text>
</svg>
