<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 330" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Humans get SSO, machines get roles">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="60" y="30" width="400" height="260" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="260" y="60" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">HUMANS: IAM Identity Center (SSO)</text>
<rect x="110" y="100" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260" y="124" text-anchor="middle" font-size="13" fill="#111111">company login (Google, Okta, AD)</text>
<path d="M260,136 L260,146" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="110" y="150" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260" y="174" text-anchor="middle" font-size="13" fill="#111111">permission sets</text>
<path d="M260,186 L260,196" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="110" y="200" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260" y="224" text-anchor="middle" font-size="13" fill="#111111">short-lived AWS access</text>
<path d="M260,236 L260,246" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="110" y="250" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="260" y="274" text-anchor="middle" font-size="13" fill="#111111">no long-term keys</text>
<rect x="540" y="30" width="400" height="260" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="740" y="60" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">MACHINES AND SERVICES: IAM roles</text>
<rect x="590" y="100" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="740" y="124" text-anchor="middle" font-size="13" fill="#111111">EC2 / Lambda assumes a role</text>
<path d="M740,136 L740,146" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="590" y="150" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="740" y="174" text-anchor="middle" font-size="13" fill="#111111">temporary keys, auto-expire</text>
<path d="M740,186 L740,196" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="590" y="200" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="740" y="224" text-anchor="middle" font-size="13" fill="#111111">instance profile, never baked-in keys</text>
<path d="M740,236 L740,246" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="590" y="250" width="300" height="36" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="740" y="274" text-anchor="middle" font-size="13" fill="#111111">two-hour admin? assume a role, not a user</text>
<text x="500" y="316" text-anchor="middle" font-size="14" fill="#555555">Users are for people in small setups. Groups bundle users. Roles are for everything temporary.</text>
</svg>
