<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1100 470" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="VPC pieces: subnets, route tables, IGW, NAT">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="30" y="50" width="1040" height="340" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="550" y="80" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">VPC 10.0.0.0/16 (your private IP range; AWS reserves 5 addresses per subnet)</text>
<rect x="70" y="110" width="460" height="250" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="300" y="138" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Public subnet 10.0.1.0/24 (us-east-1a)</text>
<text x="300" y="164" text-anchor="middle" font-size="14" fill="#555555">route table: 0.0.0.0/0 -> internet gateway</text>
<rect x="120" y="190" width="170" height="60" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="205" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">EC2</text>
<text x="205" y="238" text-anchor="middle" font-size="14" fill="#555555">web server</text>
<rect x="320" y="190" width="170" height="60" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="405" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">NAT gateway</text>
<text x="405" y="238" text-anchor="middle" font-size="14" fill="#555555">one-way door out</text>
<rect x="580" y="110" width="460" height="250" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="810" y="138" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Private subnet 10.0.2.0/24 (us-east-1b)</text>
<text x="810" y="164" text-anchor="middle" font-size="14" fill="#555555">route table: 0.0.0.0/0 -> NAT gateway</text>
<rect x="650" y="190" width="150" height="60" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="725" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">EC2</text>
<text x="725" y="238" text-anchor="middle" font-size="14" fill="#555555">app server</text>
<rect x="830" y="190" width="150" height="60" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="905" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">RDS</text>
<text x="905" y="238" text-anchor="middle" font-size="14" fill="#555555">database</text>
<path d="M505,220 L555,220" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="530" y="205" text-anchor="middle" font-size="14" fill="#555555"></text>
<rect x="70" y="400" width="460" height="44" rx="8" fill="#e8f4e8" stroke="#5a8f5a" stroke-width="1.5"/>
<text x="300" y="428" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Internet gateway (IGW): the two-way door</text>
<path d="M300,360 L300,400" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="810" y="420" text-anchor="middle" font-size="14" fill="#555555">NAT = instances can reach OUT (patches, APIs), nobody can reach IN</text>
<text x="810" y="442" text-anchor="middle" font-size="14" fill="#555555">NAT costs $/hour + $/GB: a favorite exam cost trap</text>
</svg>
