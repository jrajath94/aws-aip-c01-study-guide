<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 400" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="S3 storage classes ordered by access frequency">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="30" y="60" width="168" height="240" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="114" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">S3 Standard</text>
<text x="114" y="120" text-anchor="middle" font-size="14" fill="#555555">hot, read often</text>
<text x="114" y="144" text-anchor="middle" font-size="14" fill="#555555">highest storage price</text>
<text x="114" y="168" text-anchor="middle" font-size="14" fill="#555555">no retrieval fee</text>
<rect x="222" y="60" width="168" height="240" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="306" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">S3 Intelligent-Tiering</text>
<text x="306" y="120" text-anchor="middle" font-size="14" fill="#555555">unknown / shifting</text>
<text x="306" y="144" text-anchor="middle" font-size="14" fill="#555555">auto-moves tiers</text>
<text x="306" y="168" text-anchor="middle" font-size="14" fill="#555555">small monitoring fee</text>
<rect x="414" y="60" width="168" height="240" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="498" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">S3 Standard-IA</text>
<text x="498" y="120" text-anchor="middle" font-size="14" fill="#555555">backups, monthly</text>
<text x="498" y="144" text-anchor="middle" font-size="14" fill="#555555">cheaper storage</text>
<text x="498" y="168" text-anchor="middle" font-size="14" fill="#555555">30-day minimum</text>
<rect x="606" y="60" width="168" height="240" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="690" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Glacier Instant</text>
<text x="690" y="120" text-anchor="middle" font-size="14" fill="#555555">archive, ms access</text>
<text x="690" y="144" text-anchor="middle" font-size="14" fill="#555555">quarterly reads</text>
<text x="690" y="168" text-anchor="middle" font-size="14" fill="#555555">90-day minimum</text>
<rect x="798" y="60" width="168" height="240" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="882" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Glacier Flexible</text>
<text x="882" y="120" text-anchor="middle" font-size="14" fill="#555555">archive, min-hours</text>
<text x="882" y="144" text-anchor="middle" font-size="14" fill="#555555">slow retrieval</text>
<text x="882" y="168" text-anchor="middle" font-size="14" fill="#555555">90-day minimum</text>
<rect x="990" y="60" width="168" height="240" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1074" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Glacier Deep Archive</text>
<text x="1074" y="120" text-anchor="middle" font-size="14" fill="#555555">7-10 year keeps</text>
<text x="1074" y="144" text-anchor="middle" font-size="14" fill="#555555">cheapest</text>
<text x="1074" y="168" text-anchor="middle" font-size="14" fill="#555555">180-day minimum, 12-48h</text>
<text x="600" y="36" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pick by access pattern. The exam traps hide in the minimum days.</text>
<text x="600" y="330" text-anchor="middle" font-size="14" fill="#555555">touch often -> Standard        touch rarely -> archive        delete early -> you still pay the minimum</text>
<text x="600" y="356" text-anchor="middle" font-size="14" fill="#555555">Deep Archive deleted after 60 days still bills 180 days.</text>
</svg>
