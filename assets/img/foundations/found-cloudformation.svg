<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 360" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="CloudFormation: template in, stack out">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="80" y="60" width="280" height="120" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="220" y="92" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">template (YAML/JSON)</text>
<text x="220" y="118" text-anchor="middle" font-size="14" fill="#555555">every resource described</text>
<text x="220" y="142" text-anchor="middle" font-size="14" fill="#555555">CDK: write it in Python/TS</text>
<path d="M360,120 L440,120" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="440" y="60" width="200" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="540" y="104" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">CloudFormation</text>
<text x="540" y="130" text-anchor="middle" font-size="14" fill="#555555">creates together</text>
<text x="540" y="152" text-anchor="middle" font-size="14" fill="#555555">as a stack</text>
<path d="M640,120 L720,120" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="720" y="60" width="200" height="120" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="820" y="104" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">stack</text>
<text x="820" y="130" text-anchor="middle" font-size="14" fill="#555555">same file, same environment,</text>
<text x="820" y="152" text-anchor="middle" font-size="14" fill="#555555">any Region</text>
<rect x="80" y="220" width="273" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="216" y="250" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">change sets</text>
<text x="216" y="276" text-anchor="middle" font-size="14" fill="#555555">preview what an update will do</text>
<rect x="373" y="220" width="273" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="509" y="250" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">drift detection</text>
<text x="509" y="276" text-anchor="middle" font-size="14" fill="#555555">catches hand-edits outside the template</text>
<rect x="666" y="220" width="273" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="802" y="250" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">StackSets</text>
<text x="802" y="276" text-anchor="middle" font-size="14" fill="#555555">one template, many accounts and Regions</text>
<text x="500" y="344" text-anchor="middle" font-size="14" fill="#555555">"deploy identical dev, staging, prod" = templates, not click-ops</text>
</svg>
