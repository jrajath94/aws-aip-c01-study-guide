<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="API Gateway: three flavors of front door">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">API Gateway: one HTTPS endpoint in front of your backends</text>
<rect x="380" y="60" width="240" height="70" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="500" y="88" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">clients</text>
<text x="500" y="112" text-anchor="middle" font-size="14" fill="#555555">one HTTPS endpoint</text>
<path d="M500,130 L500,158" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="158" width="400" height="60" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="184" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">API Gateway</text>
<text x="500" y="206" text-anchor="middle" font-size="14" fill="#555555">throttling, auth, validation, caching, routing</text>
<rect x="60" y="240" width="280" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="268" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">HTTP API</text>
<text x="200" y="294" text-anchor="middle" font-size="14" fill="#555555">cheap and fast</text>
<text x="200" y="316" text-anchor="middle" font-size="14" fill="#555555">Lambda + HTTP backends</text>
<path d="M500,218 L200,240" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="360" y="240" width="280" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="268" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">REST API</text>
<text x="500" y="294" text-anchor="middle" font-size="14" fill="#555555">full features</text>
<text x="500" y="316" text-anchor="middle" font-size="14" fill="#555555">usage plans, API keys, WAF</text>
<path d="M500,218 L500,240" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="660" y="240" width="280" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="268" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">WebSocket API</text>
<text x="800" y="294" text-anchor="middle" font-size="14" fill="#555555">two-way</text>
<text x="800" y="316" text-anchor="middle" font-size="14" fill="#555555">chat, live feeds</text>
<path d="M500,218 L800,240" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="500" y="360" text-anchor="middle" font-size="14" fill="#555555">Deploy in stages (dev, prod). Protect backends: IAM, Cognito user pools, or a Lambda authorizer.</text>
<text x="500" y="384" text-anchor="middle" font-size="14" fill="#555555">"per-customer rate limits + API keys + caching" = REST API, not HTTP API</text>
</svg>
