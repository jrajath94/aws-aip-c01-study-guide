<svg xmlns="http://www.w3.org/2000/svg" width="780" height="530" viewBox="0 0 780 530" role="img" aria-label="Which database: decide by the shape of the data">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="530" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">DATABASES: PICK BY SHAPE OF DATA</text>
<rect x="300" y="52" width="180" height="48" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="390" y="72" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Need SQL tables?</text>
<text x="390" y="92" font-size="11.5" fill="#555555" text-anchor="middle">yes -&gt; / no -&gt;</text>
<line x1="480" y1="76" x2="640" y2="76" stroke="#555555" stroke-width="2"/>
<text x="560" y="68" font-size="11" fill="#555555" text-anchor="middle">yes</text>
<rect x="520" y="52" width="240" height="48" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="640" y="72" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Scale past one box,</text>
<text x="640" y="90" font-size="11.5" fill="#555555" text-anchor="middle">near-zero ops?</text>
<line x1="640" y1="100" x2="560" y2="132" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="545" y="126" font-size="11" fill="#555555" text-anchor="middle">yes</text>
<line x1="640" y1="100" x2="720" y2="132" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="735" y="126" font-size="11" fill="#555555" text-anchor="middle">no</text>
<rect x="470" y="132" width="170" height="52" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="555" y="153" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Aurora</text>
<text x="555" y="172" font-size="11" fill="#555555" text-anchor="middle">serverless SQL</text>
<rect x="650" y="132" width="110" height="52" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="705" y="153" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">RDS</text>
<text x="705" y="172" font-size="11" fill="#555555" text-anchor="middle">managed SQL</text>
<line x1="390" y1="100" x2="390" y2="210" stroke="#555555" stroke-width="2"/>
<text x="372" y="160" font-size="11" fill="#555555" text-anchor="middle">no</text>
<rect x="180" y="210" width="420" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="390" y="232" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Key-value / document, huge scale, ms latency?</text>
<line x1="390" y1="262" x2="390" y2="288" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="288" width="180" height="52" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="390" y="309" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">DynamoDB</text>
<text x="390" y="328" font-size="11" fill="#555555" text-anchor="middle">serverless NoSQL</text>
<rect x="120" y="360" width="540" height="130" rx="8" fill="#efefef" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="390" y="386" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Specialists the exam name-drops:</text>
<text x="140" y="414" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Timestream</text>
<text x="140" y="432" font-size="11" fill="#555555" text-anchor="middle">time-series</text>
<text x="272" y="414" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Neptune</text>
<text x="272" y="432" font-size="11" fill="#555555" text-anchor="middle">graph data</text>
<text x="404" y="414" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">ElastiCache</text>
<text x="404" y="432" font-size="11" fill="#555555" text-anchor="middle">cache in front of a DB</text>
<text x="536" y="414" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Redshift</text>
<text x="536" y="432" font-size="11" fill="#555555" text-anchor="middle">petabyte warehouse</text>
<text x="390" y="508" font-size="12" fill="#555555" text-anchor="middle">Reach past the big three only when the stem asks for the specialist's shape.</text>
</svg>