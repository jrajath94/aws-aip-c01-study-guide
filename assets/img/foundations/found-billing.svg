<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Billing: the tools that answer money questions">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pay as you go. Then tag everything, budget everything.</text>
<rect x="40" y="60" width="172" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="126" y="96" text-anchor="middle" font-size="12.5" fill="#111111" font-weight="bold">Cost Explorer</text>
<text x="126" y="126" text-anchor="middle" font-size="14" fill="#555555">where did the money go?</text>
<text x="126" y="150" text-anchor="middle" font-size="14" fill="#555555"></text>
<rect x="226" y="60" width="172" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="312" y="96" text-anchor="middle" font-size="12.5" fill="#111111" font-weight="bold">Budgets</text>
<text x="312" y="126" text-anchor="middle" font-size="14" fill="#555555">alert (and act) at 80% of </text>
<text x="312" y="150" text-anchor="middle" font-size="14" fill="#555555">budget</text>
<rect x="412" y="60" width="172" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="498" y="96" text-anchor="middle" font-size="12.5" fill="#111111" font-weight="bold">Anomaly Detection</text>
<text x="498" y="126" text-anchor="middle" font-size="14" fill="#555555">pings you on weird spikes</text>
<text x="498" y="150" text-anchor="middle" font-size="14" fill="#555555"></text>
<rect x="598" y="60" width="172" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="684" y="96" text-anchor="middle" font-size="12.5" fill="#111111" font-weight="bold">cost allocation tags</text>
<text x="684" y="126" text-anchor="middle" font-size="14" fill="#555555">split the bill by team / p</text>
<text x="684" y="150" text-anchor="middle" font-size="14" fill="#555555">roject</text>
<rect x="784" y="60" width="172" height="150" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="870" y="96" text-anchor="middle" font-size="12.5" fill="#111111" font-weight="bold">consolidated billing</text>
<text x="870" y="126" text-anchor="middle" font-size="14" fill="#555555">one bill, many accounts, v</text>
<text x="870" y="150" text-anchor="middle" font-size="14" fill="#555555">olume discounts</text>
<rect x="60" y="240" width="880" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="270" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Free Tier: three kinds</text>
<text x="500" y="296" text-anchor="middle" font-size="14" fill="#555555">12 months free for new accounts (750 EC2 hrs/month) - always-free amounts (1M Lambda invocations/month) - short trials</text>
<text x="500" y="326" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Support plans: Basic (free) -> Developer -> Business -> Enterprise</text>
<text x="500" y="350" text-anchor="middle" font-size="14" fill="#555555">fast incident response = Business and up; a TAM (Technical Account Manager) = Enterprise</text>
</svg>
