<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 420" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="IAM policy anatomy and the identity-plus-resource union rule">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="270" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">A policy: allow or deny, in JSON</text>
<rect x="40" y="48" width="460" height="210" rx="8" fill="#fbfbfb" stroke="#999999" stroke-width="1.5"/>
<text x="58" y="82" font-size="13.5" fill="#111111" font-family="monospace">{</text>
<text x="58" y="108" font-size="13.5" fill="#111111" font-family="monospace">  "Effect": "Allow",        &lt;- allow or deny</text>
<text x="58" y="134" font-size="13.5" fill="#111111" font-family="monospace">  "Action": "s3:GetObject",  &lt;- the API call (service prefix)</text>
<text x="58" y="160" font-size="13.5" fill="#111111" font-family="monospace">  "Resource": "arn:aws:s3:::my-bucket/*",</text>
<text x="58" y="186" font-size="13.5" fill="#111111" font-family="monospace">                         &lt;- the ARN: Amazon's address format</text>
<text x="58" y="212" font-size="13.5" fill="#111111" font-family="monospace">}</text>
<text x="730" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">How AWS combines policies</text>
<rect x="560" y="48" width="150" height="60" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="635" y="74" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">identity-based</text>
<text x="635" y="94" text-anchor="middle" font-size="14" fill="#555555">on the user / role</text>
<rect x="800" y="48" width="150" height="60" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="875" y="74" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">resource-based</text>
<text x="875" y="94" text-anchor="middle" font-size="14" fill="#555555">on the bucket / key</text>
<path d="M635,108 L700,150" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M875,108 L810,150" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="660" y="150" width="190" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="755" y="176" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">same account:</text>
<text x="755" y="200" text-anchor="middle" font-size="14" fill="#555555">an allow from EITHER side</text>
<text x="755" y="222" text-anchor="middle" font-size="14" fill="#555555">is enough (union rule)</text>
<rect x="560" y="262" width="390" height="120" rx="8" fill="#ffe9e9" stroke="#cc5555" stroke-width="1.5"/>
<text x="755" y="290" text-anchor="middle" font-size="15" fill="#991111" font-weight="bold">BUT: one explicit Deny anywhere</text>
<text x="755" y="314" text-anchor="middle" font-size="14" fill="#991111">overrides every Allow.</text>
<text x="755" y="340" text-anchor="middle" font-size="14" fill="#991111" font-weight="bold">Deny always wins.</text>
<text x="500" y="406" text-anchor="middle" font-size="14" fill="#555555">Evaluation: start denied -> any explicit Deny = stop -> any Allow = continue to boundary checks</text>
</svg>
