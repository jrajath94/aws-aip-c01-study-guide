<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 520" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="A secure RAG chatbot on AWS">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The architecture AIP-C01 scenarios are built from: a RAG chatbot</text>
<rect x="60" y="60" width="200" height="70" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="160" y="88" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">user</text>
<text x="160" y="112" text-anchor="middle" font-size="14" fill="#555555">never touches compute</text>
<path d="M260,95 L340,95" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="340" y="60" width="220" height="70" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="450" y="88" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">CloudFront + API Gateway</text>
<text x="450" y="112" text-anchor="middle" font-size="14" fill="#555555">the front door</text>
<path d="M560,95 L640,95" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="640" y="60" width="220" height="130" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="750" y="88" text-anchor="middle" font-size="15" fill="#111111" font-weight="bold">Lambda</text>
<text x="750" y="112" text-anchor="middle" font-size="14" fill="#555555">private subnets, no public IP</text>
<text x="750" y="136" text-anchor="middle" font-size="14" fill="#555555">IAM role: invoke model +</text>
<text x="750" y="158" text-anchor="middle" font-size="14" fill="#555555">read one bucket. nothing else.</text>
<path d="M860,95 L940,95" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="940" y="60" width="150" height="70" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="1015" y="88" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bedrock</text>
<text x="1015" y="112" text-anchor="middle" font-size="14" fill="#555555">via VPC endpoint</text>
<text x="640" y="216" text-anchor="middle" font-size="14" fill="#555555">prompts never cross the public internet</text>
<rect x="640" y="240" width="220" height="70" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="750" y="268" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">S3 documents</text>
<text x="750" y="292" text-anchor="middle" font-size="14" fill="#555555">versioned + KMS-encrypted</text>
<path d="M750,190 L750,240" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="360" width="330" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="225" y="390" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">audit layer</text>
<text x="225" y="416" text-anchor="middle" font-size="14" fill="#555555">CloudTrail: every API call logged</text>
<text x="225" y="440" text-anchor="middle" font-size="14" fill="#555555">CloudWatch: errors surface here</text>
<text x="225" y="462" text-anchor="middle" font-size="14" fill="#555555">Config: flags buckets that drift from encryption</text>
<rect x="430" y="360" width="330" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="595" y="390" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">network</text>
<text x="595" y="416" text-anchor="middle" font-size="14" fill="#555555">private subnets + VPC endpoints</text>
<text x="595" y="440" text-anchor="middle" font-size="14" fill="#555555">NAT only if the internet is needed</text>
<rect x="800" y="360" width="290" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="945" y="390" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">swap pieces, scenario changes</text>
<text x="945" y="416" text-anchor="middle" font-size="14" fill="#555555">nightly embeddings: EventBridge cron</text>
<text x="945" y="440" text-anchor="middle" font-size="14" fill="#555555">multi-Region: CRR + StackSets</text>
<text x="575" y="508" text-anchor="middle" font-size="14" fill="#555555">Secure GenAI checklist: (1) network: private subnets + endpoints (2) identity: least-privilege roles, no keys</text>
</svg>
