<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 360" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="CloudWatch vs CloudTrail vs Config">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Three services, three questions</text>
<rect x="60" y="52" width="280" height="250" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="84" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">CloudWatch</text>
<text x="200" y="114" text-anchor="middle" font-size="13" fill="#111111">"how healthy is it right now?"</text>
<text x="200" y="148" text-anchor="middle" font-size="14" fill="#555555">metrics, alarms, logs, dashboards</text>
<rect x="80" y="180" width="240" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="200" y="216" text-anchor="middle" font-size="14" fill="#555555">"alert me before the disk fills"</text>
<text x="200" y="240" text-anchor="middle" font-size="14" fill="#555555"></text>
<rect x="360" y="52" width="280" height="250" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="84" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">CloudTrail</text>
<text x="500" y="114" text-anchor="middle" font-size="13" fill="#111111">"who did what, when?"</text>
<text x="500" y="148" text-anchor="middle" font-size="14" fill="#555555">every API call, logged to S3</text>
<rect x="380" y="180" width="240" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="500" y="216" text-anchor="middle" font-size="14" fill="#555555">"prove who changed the security gr</text>
<text x="500" y="240" text-anchor="middle" font-size="14" fill="#555555">oup"</text>
<rect x="660" y="52" width="280" height="250" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="84" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Config</text>
<text x="800" y="114" text-anchor="middle" font-size="13" fill="#111111">"is it still configured right?"</text>
<text x="800" y="148" text-anchor="middle" font-size="14" fill="#555555">resource settings over time</text>
<rect x="680" y="180" width="240" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="800" y="216" text-anchor="middle" font-size="14" fill="#555555">"auto-remediate unencrypted bucket</text>
<text x="800" y="240" text-anchor="middle" font-size="14" fill="#555555">s"</text>
<text x="500" y="336" text-anchor="middle" font-size="14" fill="#555555">Who/what/when = Trail. Is-it-right = Config. Health = Watch.</text>
</svg>
