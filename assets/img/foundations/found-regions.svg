<text x="24" y="362" font-size="12" fill="#555555" text-anchor="start">Regions are fully independent: AWS copies nothing across them unless you ask</text>
<text x="24" y="384" font-size="12" fill="#555555" text-anchor="start">Pick a Region for: closeness to users (latency) - law (data must stay in a country)</text>
<text x="24" y="406" font-size="12" fill="#555555" text-anchor="start">price (same service, different cost per Region) - availability (new services land in big Regions first)</text>
<circle cx="596" cy="358" r="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="612" y="362" font-size="12" fill="#222222" text-anchor="start" font-weight="700">600+ edge locations</text>
<text x="612" y="380" font-size="11.5" fill="#555555" text-anchor="start">(CloudFront, Route 53)</text>
