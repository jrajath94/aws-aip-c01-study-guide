<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Lambda limits: the 15-minute wall, cold starts, VPC access">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="300" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">LAMBDA LIMITS THE EXAM TESTS</text>
<rect x="24" y="52" width="162" height="160" rx="8" fill="#fbe9e7" stroke="#a93226" stroke-width="1.5"/>
<text x="105.0" y="109.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">15-minute wall</text>
<text x="105.0" y="126.5" font-size="11" fill="#222222" text-anchor="middle">One run caps at 15 min.</text>
<text x="105.0" y="141.5" font-size="11" fill="#222222" text-anchor="middle">45-min job? Use Fargate,</text>
<text x="105.0" y="156.5" font-size="11" fill="#222222" text-anchor="middle">not Lambda.</text>
<rect x="196" y="52" width="162" height="160" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="277.0" y="102.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Cold starts</text>
<text x="277.0" y="119.0" font-size="11" fill="#222222" text-anchor="middle">First call builds a fresh</text>
<text x="277.0" y="134.0" font-size="11" fill="#222222" text-anchor="middle">execution environment.</text>
<text x="277.0" y="149.0" font-size="11" fill="#222222" text-anchor="middle">Fix p99: provisioned</text>
<text x="277.0" y="164.0" font-size="11" fill="#222222" text-anchor="middle">concurrency.</text>
<rect x="368" y="52" width="162" height="160" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="449.0" y="109.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Concurrency</text>
<text x="449.0" y="126.5" font-size="11" fill="#222222" text-anchor="middle">Many events = many parallel</text>
<text x="449.0" y="141.5" font-size="11" fill="#222222" text-anchor="middle">runs. Throttles exist;</text>
<text x="449.0" y="156.5" font-size="11" fill="#222222" text-anchor="middle">reserved concurrency caps it.</text>
<rect x="540" y="52" width="162" height="160" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="621.0" y="102.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">VPC access</text>
<text x="621.0" y="119.0" font-size="11" fill="#222222" text-anchor="middle">Needs a private subnet to</text>
<text x="621.0" y="134.0" font-size="11" fill="#222222" text-anchor="middle">touch VPC resources.</text>
<text x="621.0" y="149.0" font-size="11" fill="#222222" text-anchor="middle">Then it needs a NAT or</text>
<text x="621.0" y="164.0" font-size="11" fill="#222222" text-anchor="middle">endpoint for the internet.</text>
<text x="360" y="246" font-size="12" fill="#555555" text-anchor="middle">Takeaway: event in, code runs, bill per millisecond. Triggers are the whole game.</text>
<text x="360" y="268" font-size="12" fill="#555555" text-anchor="middle">'Least operational overhead' almost always points at Lambda or serverless.</text>
</svg>