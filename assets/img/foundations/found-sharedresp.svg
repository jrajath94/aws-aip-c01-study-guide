<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" role="img" aria-label="Shared responsibility: what AWS owns vs what you own">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="780" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THE SHARED RESPONSIBILITY LINE</text>
<rect x="24" y="52" width="360" height="210" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/>
<text x="204" y="78" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">AWS takes care of</text>
<text x="44" y="108" font-size="12" fill="#222222" text-anchor="start">physical buildings</text>
<text x="44" y="138" font-size="12" fill="#222222" text-anchor="start">hardware, servers</text>
<text x="44" y="168" font-size="12" fill="#222222" text-anchor="start">network cables</text>
<text x="44" y="198" font-size="12" fill="#222222" text-anchor="start">virtualization layer</text>
<text x="44" y="228" font-size="12" fill="#222222" text-anchor="start">managed service platforms</text>
<rect x="396" y="52" width="360" height="210" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="576" y="78" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">You take care of</text>
<text x="416" y="108" font-size="12" fill="#222222" text-anchor="start">your data (classify it, encrypt it)</text>
<text x="416" y="138" font-size="12" fill="#222222" text-anchor="start">who can touch it (IAM)</text>
<text x="416" y="168" font-size="12" fill="#222222" text-anchor="start">the guest OS on your EC2 (patch it)</text>
<text x="416" y="198" font-size="12" fill="#222222" text-anchor="start">your app code and its config</text>
<text x="416" y="228" font-size="12" fill="#222222" text-anchor="start">firewall rules (security groups)</text>
<text x="24" y="296" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">The line moves with the service:</text>
<text x="24" y="320" font-size="12" fill="#555555" text-anchor="start">EC2: you patch the OS. RDS: AWS patches the OS. Lambda: AWS. S3 / Bedrock: AWS runs</text>
<text x="24" y="342" font-size="12" fill="#555555" text-anchor="start">everything under the API; you own the data, encryption, and IAM.</text>
<text x="24" y="372" font-size="12" fill="#555555" text-anchor="start">Rule of thumb: 'managed' or 'serverless' in the name means AWS owns the OS.</text>
</svg>