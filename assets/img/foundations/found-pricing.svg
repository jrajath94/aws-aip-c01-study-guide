<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 400" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="EC2 pricing: more commitment, less price">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="32" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Five ways to pay: pick by commitment level</text>
<rect x="40" y="60" width="172" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="126" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">On-Demand</text>
<text x="126" y="122" text-anchor="middle" font-size="14" fill="#555555">no commitment</text>
<text x="126" y="146" text-anchor="middle" font-size="14" fill="#555555">pay per second</text>
<text x="126" y="170" text-anchor="middle" font-size="14" fill="#555555">spiky / unknown</text>
<rect x="226" y="60" width="172" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="312" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Spot</text>
<text x="312" y="122" text-anchor="middle" font-size="14" fill="#555555">spare capacity</text>
<text x="312" y="146" text-anchor="middle" font-size="14" fill="#555555">up to 90% off</text>
<text x="312" y="170" text-anchor="middle" font-size="14" fill="#555555">2-min reclaim warning</text>
<rect x="412" y="60" width="172" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="498" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Reserved</text>
<text x="498" y="122" text-anchor="middle" font-size="14" fill="#555555">1-3 year commit</text>
<text x="498" y="146" text-anchor="middle" font-size="14" fill="#555555">up to 72% off</text>
<text x="498" y="170" text-anchor="middle" font-size="14" fill="#555555">steady-state servers</text>
<rect x="598" y="60" width="172" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="684" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Savings Plans</text>
<text x="684" y="122" text-anchor="middle" font-size="14" fill="#555555">$/hour commit</text>
<text x="684" y="146" text-anchor="middle" font-size="14" fill="#555555">up to 72% off</text>
<text x="684" y="170" text-anchor="middle" font-size="14" fill="#555555">flexible types</text>
<rect x="784" y="60" width="172" height="220" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/>
<text x="870" y="92" text-anchor="middle" font-size="13.5" fill="#111111" font-weight="bold">Dedicated Host</text>
<text x="870" y="122" text-anchor="middle" font-size="14" fill="#555555">whole server</text>
<text x="870" y="146" text-anchor="middle" font-size="14" fill="#555555">most expensive</text>
<text x="870" y="170" text-anchor="middle" font-size="14" fill="#555555">license / compliance</text>
<text x="500" y="320" text-anchor="middle" font-size="14" fill="#555555">Cheapest nightly batch that tolerates interruption = Spot. Compliance needs the hardware = Dedicated Host.</text>
<text x="500" y="348" text-anchor="middle" font-size="14" fill="#555555">Reserved and Savings Plans are for workloads you know will run for years.</text>
<text x="500" y="376" text-anchor="middle" font-size="14" fill="#555555">commitment -> price: On-Demand (none) > Reserved (years) > Spot (interruptible, cheapest)</text>
</svg>
