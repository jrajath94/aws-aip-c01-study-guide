<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="AIP-C01 exam facts: 75 questions, 180 minutes, pass 750 of 1000, MC and multiple response">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="280" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">EXAM FACTS</text><rect x="24" y="56" width="160" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="104" y="88" font-size="14" fill="#222222" text-anchor="middle" font-weight="700" >75 questions</text><text x="104" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >65 scored + 10 unscored</text><text x="104" y="134" font-size="11.5" fill="#555555" text-anchor="middle" >unscored are unmarked</text><rect x="196" y="56" width="160" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="276" y="88" font-size="14" fill="#222222" text-anchor="middle" font-weight="700" >180 minutes</text><text x="276" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >about 2.4 min per question</text><text x="276" y="134" font-size="11.5" fill="#555555" text-anchor="middle" >use the time budget</text><rect x="368" y="56" width="160" height="120" rx="8" fill=" #fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="448" y="88" font-size="14" fill="#222222" text-anchor="middle" font-weight="700" >Pass 750 / 1000</text><text x="448" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >scaled score</text><text x="448" y="134" font-size="11.5" fill="#555555" text-anchor="middle" >not 700, not percent</text><rect x="540" y="56" width="160" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="620" y="88" font-size="14" fill="#222222" text-anchor="middle" font-weight="700" >MC + multiple response</text><text x="620" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >one correct / two or more</text><text x="620" y="134" font-size="11.5" fill="#555555" text-anchor="middle" >no partial credit</text><text x="360" y="222" font-size="12" fill="#555555" text-anchor="middle" >Format facts from the official exam guide (Sept 2026).</text><text x="360" y="246" font-size="12" fill="#555555" text-anchor="middle" >Know these well: they frame every time decision on exam day.</text></svg>