<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 790 394" role="img" aria-label="Secrets Manager rotation: a schedule triggers a Lambda function that writes a new secret version, and apps re-read the new version"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="790" height="394" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">SECRETS ROTATION: THE FOUR-STEP CYCLE</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Rotation is automatic: schedule, Lambda, new version, re-read.</text><rect x="24" y="90" width="160" height="150" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="104" y="128" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">Schedule</text><text x="104" y="154" text-anchor="middle" font-size="12" fill="#555555">every 30 days</text><text x="104" y="176" text-anchor="middle" font-size="12" fill="#555555">rotation starts</text><path d="M184,165 L214,165" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><rect x="214" y="90" width="160" height="150" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="294" y="128" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">Lambda</text><text x="294" y="154" text-anchor="middle" font-size="12" fill="#555555">rotation function</text><text x="294" y="176" text-anchor="middle" font-size="12" fill="#555555">writes the new secret</text><path d="M374,165 L404,165" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><rect x="404" y="90" width="160" height="150" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="484" y="128" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">Secrets Manager</text><text x="484" y="154" text-anchor="middle" font-size="12" fill="#555555">new version</text><text x="484" y="176" text-anchor="middle" font-size="12" fill="#555555">old version staged out</text><path d="M564,165 L594,165" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><rect x="594" y="90" width="160" height="150" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="674" y="128" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">App</text><text x="674" y="154" text-anchor="middle" font-size="12" fill="#555555">re-reads secret</text><text x="674" y="176" text-anchor="middle" font-size="12" fill="#555555">fetches the new version</text><rect x="24" y="270" width="700" height="90" rx="8" fill="#fdeeee" stroke="#a33b3b" stroke-width="1.5"/><text x="374" y="300" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">Never hard-code secrets.</text><text x="374" y="324" text-anchor="middle" font-size="12" fill="#555555">AppFlow connector profiles store credentials in Secrets Manager,</text><text x="374" y="342" text-anchor="middle" font-size="12" fill="#555555">so flows never embed secrets.</text></svg>