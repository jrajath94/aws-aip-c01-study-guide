<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 438" role="img" aria-label="stopReason values: end_turn means finished, max_tokens means cut mid-generation, guardrail_intervened means blocked"><style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="438" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">stopReason: read the ending before you trust the answer</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">The exam trap: max_tokens looks finished but means cut.</text><rect x="60" y="92" width="800" height="76" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="80" y="124" text-anchor="start" font-size="15" fill="#ececec" font-weight="bold">end_turn</text><text x="80" y="148" text-anchor="start" font-size="13" fill="#a8a8a8">Finished normally. Trust the answer.</text><text x="880" y="136" text-anchor="end" font-size="13" fill="#a8a8a8">No action needed.</text><rect x="60" y="184" width="800" height="76" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="80" y="216" text-anchor="start" font-size="15" fill="#ececec" font-weight="bold">max_tokens</text><text x="80" y="240" text-anchor="start" font-size="13" fill="#a8a8a8">CUT mid-generation, not finished. A clean-looking answer can be truncated.</text><text x="880" y="228" text-anchor="end" font-size="13" fill="#a8a8a8">Raise maxTokens or shorten the input.</text><rect x="60" y="276" width="800" height="76" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="80" y="308" text-anchor="start" font-size="15" fill="#ececec" font-weight="bold">guardrail_intervened</text><text x="80" y="332" text-anchor="start" font-size="13" fill="#a8a8a8">The guardrail blocked the call.</text><text x="880" y="320" text-anchor="end" font-size="13" fill="#a8a8a8">Enable trace: read which policy fired.</text><text x="460" y="402" text-anchor="middle" font-size="14" fill="#a8a8a8">Read stopReason before you trust the answer.</text></svg>