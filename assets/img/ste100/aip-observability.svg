<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 310" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Observability trio: CloudWatch metrics, invocation logs, X-Ray traces">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The observability trio</text>
<rect x="40" y="90" width="290" height="150" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="185" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">CloudWatch</text><text x="185" y="157" text-anchor="middle" font-size="12" fill="#111111">metrics:</text><text x="185" y="183" text-anchor="middle" font-size="12" fill="#111111">input/output tokens</text><text x="185" y="209" text-anchor="middle" font-size="12" fill="#111111">invocations, latency</text><rect x="355" y="90" width="290" height="150" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="500" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Invocation logs</text><text x="500" y="157" text-anchor="middle" font-size="12" fill="#111111">full prompt + answer</text><text x="500" y="183" text-anchor="middle" font-size="12" fill="#111111">to S3 / CloudWatch</text><text x="500" y="209" text-anchor="middle" font-size="12" fill="#111111">sample, not all</text><rect x="670" y="90" width="290" height="150" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="815" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">X-Ray trace</text><text x="815" y="157" text-anchor="middle" font-size="12" fill="#111111">app -> Bedrock</text><text x="815" y="183" text-anchor="middle" font-size="12" fill="#111111">-> model</text><text x="815" y="209" text-anchor="middle" font-size="12" fill="#111111">find the slow hop</text><text x="500" y="280" text-anchor="middle" font-size="13" fill="#555555">Metrics tell you WHAT moved. Logs tell you WHY. Traces tell you WHERE it slowed.</text></svg>
