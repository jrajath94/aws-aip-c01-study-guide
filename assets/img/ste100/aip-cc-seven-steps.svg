<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 620" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Seven step best answer method for exam questions">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="400" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">7-step best-answer method</text><rect x="160" y="96" width="480" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="400" y="130" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">1. Read the stem. Name the decisive requirement.</text><rect x="160" y="160" width="480" height="56" rx="8" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="400" y="194" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">2. List hard constraints (never, must, only).</text><rect x="160" y="224" width="480" height="56" rx="8" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="400" y="258" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">3. Match the constraint to a mechanism.</text><rect x="160" y="288" width="480" height="56" rx="8" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="400" y="322" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">4. Eliminate distractors by mechanism mismatch.</text><rect x="160" y="352" width="480" height="56" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="400" y="386" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">5. Pick the MOST correct, not just correct.</text><rect x="160" y="416" width="480" height="56" rx="8" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="400" y="450" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">6. Verify: does it break any hard rule?</text><rect x="160" y="480" width="480" height="56" rx="8" fill="#FFFDF8" stroke="#1B2838" stroke-width="1.5"/><text x="400" y="514" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="500">7. If two remain, pick the simpler mechanism.</text><text x="400" y="590" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">When hard requirements contradict, say so and escalate.</text></svg>