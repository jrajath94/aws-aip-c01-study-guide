<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 290" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Governance loop from data lineage to monitoring and back">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The governance loop</text>
<rect x="40" y="110" width="130" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="105" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Data lineage</text><line x1="170" y1="155" x2="200" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="200" y="110" width="130" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="265" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Model version</text><line x1="330" y1="155" x2="360" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="360" y="110" width="130" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="425" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Evaluation</text><line x1="490" y1="155" x2="520" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="520" y="110" width="130" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="585" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Approval</text><line x1="650" y1="155" x2="680" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="680" y="110" width="130" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="745" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Deploy</text><line x1="810" y1="155" x2="840" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="840" y="110" width="130" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="905" y="160" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Monitor</text><line x1="960" y1="222" x2="40" y2="222" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="214" text-anchor="middle" font-size="12" fill="#555555">audit trail</text><text x="500" y="266" text-anchor="middle" font-size="13" fill="#555555">Every deploy links back to its data and version. Auditors follow the loop backwards.</text></svg>
