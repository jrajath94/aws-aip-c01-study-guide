<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 360" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Batch inference versus provisioned throughput trade-offs">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Batch vs provisioned</text>
<rect x="60" y="90" width="420" height="200" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="270" y="143" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">BATCH</text><text x="270" y="169" text-anchor="middle" font-size="13" fill="#111111">up to 50% cheaper</text><text x="270" y="195" text-anchor="middle" font-size="13" fill="#111111">hours of latency</text><text x="270" y="221" text-anchor="middle" font-size="13" fill="#111111">min batch size</text><text x="270" y="247" text-anchor="middle" font-size="13" fill="#111111">no streaming</text><rect x="520" y="90" width="420" height="200" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="730" y="143" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">PROVISIONED</text><text x="730" y="169" text-anchor="middle" font-size="13" fill="#111111">fixed $ per hour</text><text x="730" y="195" text-anchor="middle" font-size="13" fill="#111111">guaranteed capacity</text><text x="730" y="221" text-anchor="middle" font-size="13" fill="#111111">no throttling</text><text x="730" y="247" text-anchor="middle" font-size="13" fill="#111111">1 or 6 month commit</text><text x="500" y="330" text-anchor="middle" font-size="13" fill="#555555">Batch: cheap, slow, offline. Provisioned: fast, fixed price, steady load only.</text></svg>
