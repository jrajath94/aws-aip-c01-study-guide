<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="Region us-east-1 holding three availability zones, with edge locations in NYC, London, and Tokyo caching content near users">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">REGION, AVAILABILITY ZONES, EDGE LOCATIONS</text>

<rect x="60" y="60" width="600" height="210" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="80" y="90" font-size="13" font-weight="700">REGION: us-east-1 (N. Virginia)</text>
<text x="80" y="110" font-size="11.5" fill="#555555">a geographic area</text>
<rect x="100" y="120" width="160" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="180.0" y="173.0" font-size="13" text-anchor="middle" font-weight="700">AZ us-east-1a</text>
<text x="180.0" y="191.0" font-size="11" fill="#555555" text-anchor="middle">data center 1</text>

<rect x="280" y="120" width="160" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="360.0" y="173.0" font-size="13" text-anchor="middle" font-weight="700">AZ us-east-1b</text>
<text x="360.0" y="191.0" font-size="11" fill="#555555" text-anchor="middle">data center 2</text>

<rect x="460" y="120" width="160" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="540.0" y="173.0" font-size="13" text-anchor="middle" font-weight="700">AZ us-east-1c</text>
<text x="540.0" y="191.0" font-size="11" fill="#555555" text-anchor="middle">data center 3</text>

<text x="360" y="252" font-size="11.5" fill="#555555" text-anchor="middle">2 or more AZs per Region = high availability</text>
<circle cx="150" cy="330" r="26" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="150" y="334" font-size="11" text-anchor="middle" font-weight="700">NYC</text>
<circle cx="360" cy="330" r="26" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="360" y="334" font-size="11" text-anchor="middle" font-weight="700">LON</text>
<circle cx="570" cy="330" r="26" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="570" y="334" font-size="11" text-anchor="middle" font-weight="700">TYO</text>
<text x="360" y="300" font-size="12" text-anchor="middle" font-weight="700">EDGE LOCATIONS</text>
<text x="360" y="380" font-size="11.5" fill="#555555" text-anchor="middle">cache content (CloudFront) and answer DNS (Route 53) close to users</text>
<line x1="150" y1="304" x2="120" y2="270" stroke="#1f7a6d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<line x1="570" y1="304" x2="600" y2="270" stroke="#1f7a6d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
</svg>