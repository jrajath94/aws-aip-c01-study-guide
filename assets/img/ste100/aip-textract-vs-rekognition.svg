<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 396" role="img" aria-label="Textract versus Rekognition: Textract extracts text from documents, Rekognition analyzes images and video"><style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="396" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">TEXTRACT VERSUS REKOGNITION: DOCUMENTS VERSUS IMAGES</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">The exam swaps them. Match the service to the media type.</text><rect x="24" y="80" width="340" height="240" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="194" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Amazon Textract</text><text x="194" y="138" text-anchor="middle" font-size="12" fill="#555555">Documents</text><text x="194" y="170" text-anchor="middle" font-size="12" fill="#555555">Extracts text, forms, and tables</text><text x="194" y="188" text-anchor="middle" font-size="12" fill="#555555">from PDFs, scans, and</text><text x="194" y="206" text-anchor="middle" font-size="12" fill="#555555">handwriting.</text><text x="194" y="240" text-anchor="middle" font-size="12" fill="#555555">Feeds document pipelines:</text><text x="194" y="258" text-anchor="middle" font-size="12" fill="#555555">Textract output becomes RAG</text><text x="194" y="276" text-anchor="middle" font-size="12" fill="#555555">input.</text><rect x="384" y="80" width="340" height="240" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="554" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Amazon Rekognition</text><text x="554" y="138" text-anchor="middle" font-size="12" fill="#555555">Images and video</text><text x="554" y="170" text-anchor="middle" font-size="12" fill="#555555">Detects objects, faces, and</text><text x="554" y="188" text-anchor="middle" font-size="12" fill="#555555">scenes in photos and video</text><text x="554" y="206" text-anchor="middle" font-size="12" fill="#555555">frames.</text><text x="554" y="240" text-anchor="middle" font-size="12" fill="#555555">Not a document service. The exam</text><text x="554" y="258" text-anchor="middle" font-size="12" fill="#555555">swaps them as distractors.</text><text x="374" y="362" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">Documents go to Textract. Photos and video go to Rekognition.</text></svg>