<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">CI/CD for GenAI apps</text>
<rect x="40" y="130" width="200" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="140" y="167" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Prompt v3</text><text x="140" y="193" text-anchor="middle" font-size="13" fill="#111111">in git</text><line x1="240" y1="175" x2="290" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="290" y="110" width="240" height="130" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="410" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">EVAL GATE</text><text x="410" y="180" text-anchor="middle" font-size="12" fill="#111111">score >= line?</text><text x="410" y="206" text-anchor="middle" font-size="12" fill="#111111">on golden set</text><line x1="530" y1="175" x2="580" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="555" y="167" text-anchor="middle" font-size="12" fill="#555555">pass</text><rect x="580" y="130" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="680" y="180" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Deploy</text><line x1="780" y1="175" x2="830" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="830" y="110" width="130" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="895" y="154" text-anchor="middle" font-size="11" fill="#111111" font-weight="bold">Monitor</text><text x="895" y="180" text-anchor="middle" font-size="11" fill="#111111">rollback</text><text x="895" y="206" text-anchor="middle" font-size="11" fill="#111111">on drop</text><text x="500" y="280" text-anchor="middle" font-size="13" fill="#555555">Prompts are code: version them, gate them on eval scores, roll back on regression.</text></svg>
