<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 340" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Semantic cache returns a cached answer when a similar question was asked before">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Semantic caching</text>
<rect x="40" y="130" width="220" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="150" y="167" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">New</text><text x="150" y="193" text-anchor="middle" font-size="13" fill="#111111">question</text><line x1="260" y1="175" x2="310" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="310" y="110" width="280" height="130" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="450" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Similarity check</text><text x="450" y="180" text-anchor="middle" font-size="12" fill="#111111">embed the question</text><text x="450" y="206" text-anchor="middle" font-size="12" fill="#111111">compare to cached</text><line x1="590" y1="175" x2="640" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="640" y="80" width="320" height="190" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="800" y="128" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Match above line?</text><text x="800" y="154" text-anchor="middle" font-size="12" fill="#111111">YES: return cached</text><text x="800" y="180" text-anchor="middle" font-size="12" fill="#111111">answer, no model call</text><text x="800" y="206" text-anchor="middle" font-size="12" fill="#111111">NO: call the model,</text><text x="800" y="232" text-anchor="middle" font-size="12" fill="#111111">then cache the pair</text><text x="500" y="310" text-anchor="middle" font-size="13" fill="#555555">Different words, same meaning still hits. Set the similarity line with real traffic.</text></svg>
