<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="AgentCore Runtime container contract: POST invocations runs the agent, GET ping is the health check; the platform supplies sessions, memory, identity, and traces"><rect x="0" y="0" width="760" height="446" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">AgentCore Runtime: the container contract is two routes</text><text x="24" y="58" font-size="13" fill="#7d8590">Serve /invocations and /ping on port 8080. AgentCore does the rest.</text><rect x="24" y="80" width="344" height="200" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="196" y="118" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">POST /invocations</text><text x="196" y="150" text-anchor="middle" font-size="12.5" fill="#7d8590">The agent runs here. One request</text><text x="196" y="169" text-anchor="middle" font-size="12.5" fill="#7d8590">in, the agent loop runs, the</text><text x="196" y="188" text-anchor="middle" font-size="12.5" fill="#7d8590">answer returns.</text><rect x="392" y="80" width="344" height="200" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="564" y="118" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">GET /ping</text><text x="564" y="150" text-anchor="middle" font-size="12.5" fill="#7d8590">Health check. The platform calls</text><text x="564" y="169" text-anchor="middle" font-size="12.5" fill="#7d8590">it to decide the container is</text><text x="564" y="188" text-anchor="middle" font-size="12.5" fill="#7d8590">alive.</text><rect x="24" y="306" width="712" height="110" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="380" y="338" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">The platform supplies the rest.</text><text x="380" y="364" text-anchor="middle" font-size="12.5" fill="#7d8590">Sessions, tools, memory, identity, and traces come from</text><text x="380" y="383" text-anchor="middle" font-size="12.5" fill="#7d8590">AgentCore. Your container is just the agent.</text></svg>