<svg xmlns="http://www.w3.org/2000/svg" width="720" height="375" viewBox="0 0 720 375" role="img" aria-label="SageMaker Feature Store: ingest once, serve training from the offline store and real-time inference from the online store, with point-in-time correctness">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="375" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">FEATURE STORE: ONE HOME, TWO DOORS</text>

<rect x="265" y="60" width="190" height="64" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="97.0" font-size="13" text-anchor="middle" font-weight="700">INGEST ONCE</text>

<line x1="360" y1="124" x2="180" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="360" y1="124" x2="540" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="60" y="150" width="240" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="180.0" y="203.0" font-size="14" text-anchor="middle" font-weight="700">OFFLINE STORE</text>
<text x="180.0" y="221.0" font-size="11" fill="#555555" text-anchor="middle">training history in S3</text>

<rect x="420" y="150" width="240" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="540.0" y="203.0" font-size="14" text-anchor="middle" font-weight="700">ONLINE STORE</text>
<text x="540.0" y="221.0" font-size="11" fill="#555555" text-anchor="middle">ms lookups for inference</text>

<text x="360" y="300" font-size="12" text-anchor="middle" font-weight="700">Point-in-time correctness</text>
<text x="360" y="325" font-size="11.5" fill="#555555" text-anchor="middle">Training uses feature values as they were at event time, never as they are today.</text>
<text x="360" y="350" font-size="11.5" fill="#555555" text-anchor="middle">"consistent features between training and inference" = Feature Store</text>
</svg>