<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Bias enters through three doors: historical bias from past discrimination, sampling bias from unrepresentative data, label bias from prejudiced labels">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="310" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">BIAS DOORS</text><rect x="24" y="56" width="216" height="130" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="132" y="88" font-size="13" fill="#b00020" text-anchor="middle" font-weight="700">HISTORICAL</text><text x="132" y="114" font-size="11.5" fill="#222222" text-anchor="middle">past discrimination</text><text x="132" y="134" font-size="11.5" fill="#222222" text-anchor="middle">in the data</text><line x1="132" y1="186" x2="132" y2="216" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="252" y="56" width="216" height="130" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="360" y="88" font-size="13" fill="#b00020" text-anchor="middle" font-weight="700">SAMPLING</text><text x="360" y="114" font-size="11.5" fill="#222222" text-anchor="middle">data misses</text><text x="360" y="134" font-size="11.5" fill="#222222" text-anchor="middle">whole groups</text><line x1="360" y1="186" x2="360" y2="216" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="480" y="56" width="216" height="130" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="588" y="88" font-size="13" fill="#b00020" text-anchor="middle" font-weight="700">LABEL</text><text x="588" y="114" font-size="11.5" fill="#222222" text-anchor="middle">labels encode</text><text x="588" y="134" font-size="11.5" fill="#222222" text-anchor="middle">prejudice</text><line x1="588" y1="186" x2="588" y2="216" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="24" y="220" width="672" height="56" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="360" y="244" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">A model can be highly accurate on average</text><text x="360" y="264" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">and still be unfair to a subgroup.</text></svg>