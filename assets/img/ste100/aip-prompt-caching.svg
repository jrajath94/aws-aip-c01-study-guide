<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 340" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Prompt caching stores the static prefix so later turns pay only for new tokens">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Prompt caching</text>
<rect x="40" y="120" width="260" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="170" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Turn 1</text><text x="170" y="180" text-anchor="middle" font-size="12" fill="#111111">full system prompt</text><text x="170" y="206" text-anchor="middle" font-size="12" fill="#111111">full price</text><line x1="300" y1="175" x2="350" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="350" y="90" width="300" height="170" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="500" y="141" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Cache</text><text x="500" y="167" text-anchor="middle" font-size="12" fill="#111111">static prefix stored</text><text x="500" y="193" text-anchor="middle" font-size="12" fill="#111111">system + few-shot</text><text x="500" y="219" text-anchor="middle" font-size="12" fill="#111111">up to 5 min</text><line x1="650" y1="175" x2="700" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="675" y="167" text-anchor="middle" font-size="12" fill="#555555">turns 2+</text><rect x="700" y="120" width="260" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="830" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Later turns</text><text x="830" y="180" text-anchor="middle" font-size="12" fill="#111111">pay only new</text><text x="830" y="206" text-anchor="middle" font-size="12" fill="#111111">tokens</text><text x="500" y="310" text-anchor="middle" font-size="13" fill="#555555">Works when the start of the prompt never changes. Moving text breaks the cache.</text></svg>
