<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Strands tool anatomy: the docstring becomes the tool description and type hints become the input schema"><rect x="0" y="0" width="760" height="410" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The @tool decorator: a plain function becomes a tool</text><text x="24" y="58" font-size="13" fill="#7d8590">Docstring routes. Type hints shape the schema.</text><rect x="24" y="80" width="712" height="190" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="380" y="116" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">@tool</text><text x="380" y="142" text-anchor="middle" font-size="13.5" fill="#22d3ee">def count_keyword(text: str, word: str) -> int:</text><text x="380" y="166" text-anchor="middle" font-size="13.5" fill="#22d3ee">"""Count how many times WORD appears in TEXT."""</text><text x="380" y="190" text-anchor="middle" font-size="13.5" fill="#22d3ee">return text.lower().split().count(word.lower())</text><text x="380" y="224" text-anchor="middle" font-size="12.5" fill="#7d8590">docstring becomes the description the model reads</text><text x="380" y="246" text-anchor="middle" font-size="12.5" fill="#7d8590">type hints become the input JSON schema</text><rect x="24" y="290" width="712" height="90" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="380" y="322" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">The docstring is routing logic, not documentation.</text><text x="380" y="348" text-anchor="middle" font-size="13" fill="#7d8590">"utility function" makes tool selection random. Write docstrings the model can route on.</text></svg>