<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="CI CD eval gate: the candidate is scored against the golden dataset; above the threshold it deploys, below it the build fails"><rect x="0" y="0" width="760" height="490" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The CI/CD eval gate: score or do not deploy</text><text x="24" y="58" font-size="13" fill="#7d8590">The gate is a build phase that fails the pipeline on metric regression.</text><rect x="180" y="80" width="400" height="90" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="380" y="112" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Candidate build finishes</text><text x="380" y="140" text-anchor="middle" font-size="12.5" fill="#7d8590">new prompt version, new model, new guardrail</text><line x1="380" y1="170" x2="380" y2="204" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,204 371.7,209.6 371.7,198.4" fill="#7d8590"/><rect x="180" y="204" width="400" height="110" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="380" y="236" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Eval gate: run the golden dataset</text><text x="380" y="264" text-anchor="middle" font-size="12.5" fill="#7d8590">score the candidate against the threshold</text><line x1="280" y1="314" x2="180" y2="350" stroke="#7d8590" stroke-width="2.2"/><polygon points="180,350 171.7,355.6 171.7,344.4" fill="#7d8590"/><line x1="480" y1="314" x2="580" y2="350" stroke="#7d8590" stroke-width="2.2"/><polygon points="580,350 571.7,355.6 571.7,344.4" fill="#7d8590"/><rect x="40" y="350" width="280" height="110" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="180" y="384" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Above threshold: deploy</text><text x="180" y="410" text-anchor="middle" font-size="12.5" fill="#7d8590">A/B or shadow traffic next</text><rect x="440" y="350" width="280" height="110" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="580" y="384" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Below threshold: FAIL the build</text><text x="580" y="410" text-anchor="middle" font-size="12.5" fill="#7d8590">no deploy, fix the candidate</text></svg>