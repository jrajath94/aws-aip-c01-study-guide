<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Token budget: system prompt, retrieved chunks, conversation history, and output reserve must fit inside the model context window"><rect x="0" y="0" width="760" height="400" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The token budget: every input must fit the window</text><text x="24" y="58" font-size="13" fill="#7d8590">System plus retrieved chunks plus history plus reserved output.</text><rect x="60" y="110" width="139" height="90" fill="#60a5fa" opacity="0.85" rx="6"/><text x="129.5" y="148" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">System prompt</text><text x="129.5" y="172" text-anchor="middle" font-size="12" fill="#0a0a0a">2,000 tok</text><rect x="199" y="110" width="224" height="90" fill="#22d3ee" opacity="0.85" rx="6"/><text x="311.0" y="148" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">Retrieved chunks</text><text x="311.0" y="172" text-anchor="middle" font-size="12" fill="#0a0a0a">4,000 tok</text><rect x="423" y="110" width="160" height="90" fill="#d99a06" opacity="0.85" rx="6"/><text x="503.0" y="148" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">Conversation history</text><text x="503.0" y="172" text-anchor="middle" font-size="12" fill="#0a0a0a">3,000 tok</text><rect x="583" y="110" width="117" height="90" fill="#5a8f5a" opacity="0.85" rx="6"/><text x="641.5" y="148" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">Output reserve</text><text x="641.5" y="172" text-anchor="middle" font-size="12" fill="#0a0a0a">2,000 tok</text><text x="60" y="240" text-anchor="start" font-size="13.5" fill="#ececec" font-weight="bold">Total in + reserved out must fit the context window.</text><text x="60" y="266" text-anchor="start" font-size="12.5" fill="#7d8590">200K window, 11K used here: room to spare. Small window with long docs: chunk, summarize, or upsize.</text><rect x="60" y="290" width="640" height="80" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="380" y="322" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">The classic design bug: retrieved chunks grow until the prompt no longer fits.</text><text x="380" y="348" text-anchor="middle" font-size="12.5" fill="#7d8590">Budget the window like money: system + chunks + history + output.</text></svg>