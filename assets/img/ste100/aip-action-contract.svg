<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Lambda action function contract: parameters arrive as a list of name-value dicts, the response echoes messageVersion, actionGroup, function, and the result in responseBody.TEXT.body"><rect x="0" y="0" width="760" height="424" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The Lambda action contract: list in, nested shape out</text><text x="24" y="58" font-size="13" fill="#7d8590">Both sides must honor the fixed contract.</text><rect x="24" y="80" width="712" height="130" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="380" y="112" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">IN: event["parameters"] is a LIST of {"name", "value"} dicts</text><text x="380" y="140" text-anchor="middle" font-size="12.5" fill="#7d8590">Not a plain dict. Treating it as a dict drops every parameter.</text><text x="380" y="168" text-anchor="middle" font-size="12.5" fill="#7d8590">The exam tests this exact mistake.</text><line x1="380" y1="210" x2="380" y2="244" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,244 371.7,249.6 371.7,238.4" fill="#7d8590"/><rect x="24" y="244" width="712" height="150" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="380" y="276" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">OUT: echo the nested shape</text><text x="380" y="306" text-anchor="middle" font-size="12.5" fill="#7d8590">messageVersion, actionGroup, function, then the result string</text><text x="380" y="325" text-anchor="middle" font-size="12.5" fill="#7d8590">inside responseBody.TEXT.body.</text><text x="380" y="362" text-anchor="middle" font-size="12.5" fill="#7d8590">Get the shape wrong and the agent cannot parse the tool result.</text></svg>