<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 520" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Chatbot stack: state in DynamoDB, grounding from a KB">
<title>Chatbot stack: state in DynamoDB, grounding from a KB</title>
<desc>A pipeline left to right. API Gateway exposes REST plus WebSocket to the Lambda handler. The Lambda calls Bedrock Converse with history, calls the knowledge base for grounding, and reads and writes conversation state in DynamoDB. A bold note says conversation state lives in DynamoDB, not S3: it is key-value lookups by session ID, not document storage.</desc>
<defs><marker id="aip-chatbot-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">CHATBOT STACK: HISTORY IN DYNAMODB, FACTS FROM THE KB</text>
<rect x="30" y="90" width="200" height="110" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="130.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">API Gateway</text>
<text x="130.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">REST + WebSocket</text>
<text x="130.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">the chat front door</text>
<rect x="260" y="90" width="200" height="110" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="360.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Lambda</text>
<text x="360.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">chat handler</text>
<text x="360.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">Converse with history</text>
<rect x="490" y="90" width="200" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="590.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bedrock</text>
<text x="590.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">Converse API</text>
<text x="590.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">streams the answer</text>
<line x1="230" y1="145" x2="260" y2="145" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-chatbot-ah)"/>
<line x1="460" y1="145" x2="490" y2="145" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-chatbot-ah)"/>
<rect x="90" y="270" width="330" height="110" rx="8" fill="#efeafd" stroke="#6a4fd6" stroke-width="1.5"/>
<text x="255.0" y="302" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">DynamoDB</text>
<text x="255.0" y="324" text-anchor="middle" font-size="12.5" fill="#555555">conversation history</text>
<text x="255.0" y="343" text-anchor="middle" font-size="12.5" fill="#555555">keyed by session ID</text>
<rect x="510" y="270" width="330" height="110" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="675.0" y="302" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Knowledge base</text>
<text x="675.0" y="324" text-anchor="middle" font-size="12.5" fill="#555555">grounding with citations</text>
<text x="675.0" y="343" text-anchor="middle" font-size="12.5" fill="#555555">private documents</text>
<line x1="360" y1="200" x2="255" y2="270" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-chatbot-ah)"/>
<line x1="360" y1="200" x2="675" y2="270" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-chatbot-ah)"/>
<text x="30" y="420" font-size="14" fill="#111111" font-weight="bold">Conversation state lives in DynamoDB, not S3.</text>
<text x="30" y="444" font-size="12.5" fill="#555555">Chat history is key-value lookups by session ID with millisecond reads. S3 is document storage, not session state.</text>
<text x="30" y="476" font-size="12.5" fill="#555555">Exam trap: a distractor that stores chat sessions in S3 fails on latency and access pattern.</text>
</svg>