<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 310" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Grounding check compares each model claim against the source passage">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Contextual grounding: claim vs source</text>
<rect x="60" y="120" width="260" height="100" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="190" y="162" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Model claim</text><text x="190" y="188" text-anchor="middle" font-size="13" fill="#111111">"Revenue was $5M"</text><line x1="320" y1="170" x2="380" y2="170" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="350" y="162" text-anchor="middle" font-size="12" fill="#555555">compare</text><rect x="380" y="120" width="240" height="100" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="500" y="149" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Source</text><text x="500" y="175" text-anchor="middle" font-size="13" fill="#111111">passage</text><text x="500" y="201" text-anchor="middle" font-size="13" fill="#111111">you gave</text><line x1="620" y1="170" x2="680" y2="170" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="680" y="100" width="260" height="140" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="810" y="136" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Verdict</text><text x="810" y="162" text-anchor="middle" font-size="12" fill="#111111">supported: keep</text><text x="810" y="188" text-anchor="middle" font-size="12" fill="#111111">unsupported: flag</text><text x="810" y="214" text-anchor="middle" font-size="12" fill="#111111">or block</text><text x="500" y="280" text-anchor="middle" font-size="13" fill="#555555">Grounding checks catch hallucinations: every claim must trace to the source you provided.</text></svg>
