<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The agent loop: reason, act through tools via the MCP standard plug, observe the result, repeat until the goal is done">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">AGENT LOOP</text><rect x="270" y="56" width="180" height="70" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="360" y="84" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">REASON</text><text x="360" y="106" font-size="11.5" fill="#555555" text-anchor="middle">about the goal</text><line x1="360" y1="126" x2="360" y2="156" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="270" y="160" width="180" height="70" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="360" y="188" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">ACT</text><text x="360" y="210" font-size="11.5" fill="#555555" text-anchor="middle">call a tool (MCP plug)</text><line x1="360" y1="230" x2="360" y2="260" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="270" y="264" width="180" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="360" y="292" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">OBSERVE</text><text x="360" y="314" font-size="11.5" fill="#555555" text-anchor="middle">the result</text><path d="M 270 299 C 180 299, 180 91, 262 91" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><text x="150" y="200" font-size="11.5" fill="#555555" text-anchor="middle">repeat until</text><text x="150" y="220" font-size="11.5" fill="#555555" text-anchor="middle">the goal is done</text><text x="360" y="372" font-size="12" fill="#555555" text-anchor="middle">Tools are the agent's hands. MCP: one standard plug, not one-off integrations.</text></svg>