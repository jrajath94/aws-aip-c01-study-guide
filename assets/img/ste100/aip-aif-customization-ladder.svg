<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Customization ladder cheapest first: prompt engineering is free, then RAG, fine-tuning, pre-training">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">CUSTOMIZATION LADDER</text><rect x="150" y="56" width="420" height="42" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="2"/><text x="230" y="83" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">Prompt engineering</text><text x="550" y="83" font-size="11" fill="#555555" text-anchor="end">$0 · rewrite the prompt</text><line x1="360" y1="98" x2="360" y2="108" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="108" width="420" height="42" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="230" y="135" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">RAG</text><text x="550" y="135" font-size="11" fill="#555555" text-anchor="end">fetch facts at query time</text><line x1="360" y1="150" x2="360" y2="160" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="160" width="420" height="42" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="230" y="187" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">Fine-tuning</text><text x="550" y="187" font-size="11" fill="#555555" text-anchor="end">retrain on your examples</text><line x1="360" y1="202" x2="360" y2="212" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="150" y="212" width="420" height="42" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="230" y="239" font-size="12.5" fill="#222222" text-anchor="start" font-weight="700">Pre-training</text><text x="550" y="239" font-size="11" fill="#555555" text-anchor="end">months, millions</text><text x="60" y="286" font-size="12" fill="#1f7a6d" text-anchor="middle" font-weight="700">cheapest</text><text x="660" y="286" font-size="12" fill="#b00020" text-anchor="middle" font-weight="700">priciest</text><text x="360" y="310" font-size="11.5" fill="#555555" text-anchor="middle">Ask what is missing: answers -> prompt eng; facts -> RAG; behavior -> fine-tuning; base knowledge -> pre-training.</text></svg>