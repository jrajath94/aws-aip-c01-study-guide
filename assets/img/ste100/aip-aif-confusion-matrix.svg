<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-label="Confusion matrix with the fraud example: TP 6, FP 2, FN 4, TN 88; precision 0.75, recall 0.60">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="390" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">CONFUSION MATRIX</text><text x="200" y="80" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Predicted: fraud</text><text x="470" y="80" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Predicted: clean</text><text x="40" y="150" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Actual:</text><text x="40" y="170" font-size="12" fill="#222222" text-anchor="middle">fraud</text><text x="40" y="240" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">Actual:</text><text x="40" y="260" font-size="12" fill="#222222" text-anchor="middle">clean</text><rect x="110" y="100" width="250" height="80" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="235" y="132" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">TP = 6</text><text x="235" y="156" font-size="11.5" fill="#555555" text-anchor="middle">caught fraud</text><rect x="380" y="100" width="250" height="80" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="505" y="132" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">FP = 2</text><text x="505" y="156" font-size="11.5" fill="#555555" text-anchor="middle">false alarm</text><rect x="110" y="190" width="250" height="80" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="235" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">FN = 4</text><text x="235" y="246" font-size="11.5" fill="#555555" text-anchor="middle">missed fraud</text><rect x="380" y="190" width="250" height="80" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="505" y="222" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">TN = 88</text><text x="505" y="246" font-size="11.5" fill="#555555" text-anchor="middle">correctly cleared</text><rect x="110" y="300" width="520" height="60" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="360" y="324" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">precision = 6 / (6 + 2) = 0.75</text><text x="360" y="346" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">recall = 6 / (6 + 4) = 0.60</text></svg>