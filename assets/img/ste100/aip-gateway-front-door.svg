<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 560" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="API Gateway in front of Bedrock: the stable front door">
<title>API Gateway in front of Bedrock: the stable front door</title>
<desc>A pipeline left to right. Client calls one stable URL. API Gateway applies authentication (Cognito user pools, Lambda authorizers, IAM), throttling, usage plans, and request validation. A Lambda handler behind the gateway calls Bedrock, usually through the Converse API, reading the model ID from AppConfig. A bottom panel lists why you never call Bedrock straight from a browser or mobile app: credentials would ship to the client, no throttling, no audit, and every model change would touch every client.</desc>
<defs><marker id="aip-gateway-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">API GATEWAY: ONE URL, AUTH, THROTTLE, THEN BEDROCK</text>
<rect x="30" y="90" width="180" height="120" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="120.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Client</text>
<text x="120.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">browser or app</text>
<text x="120.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">calls one stable URL</text>
<rect x="240" y="90" width="260" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="370.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">API Gateway</text>
<text x="370.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">auth, throttling, usage plans</text>
<text x="370.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">request validation</text>
<rect x="530" y="90" width="180" height="120" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="620.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Lambda</text>
<text x="620.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">handler logic</text>
<text x="620.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">reads model from AppConfig</text>
<rect x="740" y="90" width="170" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="825.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bedrock</text>
<text x="825.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">Converse API</text>
<text x="825.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">the model behind it all</text>
<line x1="210" y1="150" x2="240" y2="150" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-gateway-ah)"/>
<line x1="500" y1="150" x2="530" y2="150" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-gateway-ah)"/>
<line x1="710" y1="150" x2="740" y2="150" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-gateway-ah)"/>
<text x="30" y="252" font-size="13" fill="#111111" font-weight="bold">Auth options:</text>
<text x="30" y="274" font-size="12.5" fill="#555555">Cognito user pools, Lambda authorizers, IAM. Throttling per key or per route. Usage plans per client.</text>
<text x="30" y="312" font-size="13" fill="#b3261e" font-weight="bold">Why never call Bedrock straight from the client:</text>
<text x="30" y="336" font-size="12.5" fill="#555555">- AWS credentials would ship to the browser or phone.</text>
<text x="30" y="360" font-size="12.5" fill="#555555">- No throttling, no centralized audit.</text>
<text x="30" y="384" font-size="12.5" fill="#555555">- Every model swap would touch every client instead of one config change.</text>
<text x="30" y="430" font-size="13" fill="#111111">Exam note: when the scenario says switch models without redeploying clients, the gateway URL stays fixed</text>
<text x="30" y="452" font-size="12.5" fill="#555555">while the Lambda behind it reads the model ID from AppConfig. Stable endpoint wins.</text>
</svg>