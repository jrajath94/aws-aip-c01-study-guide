<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 564" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Six layers of defense from app code to audit logs">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Defense in depth: six layers</text>
<rect x="60" y="60" width="880" height="56" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="500" y="93" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Your app: validate input, escape output</text><line x1="500" y1="116" x2="500" y2="136" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="136" width="880" height="56" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="500" y="169" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bedrock Guardrails: filters, topics, PII</text><line x1="500" y1="192" x2="500" y2="212" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="212" width="880" height="56" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="500" y="245" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">IAM: who can call the model</text><line x1="500" y1="268" x2="500" y2="288" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="288" width="880" height="56" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="500" y="321" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">KMS: encrypt data at rest</text><line x1="500" y1="344" x2="500" y2="364" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="364" width="880" height="56" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="500" y="397" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">VPC endpoints: private network path</text><line x1="500" y1="420" x2="500" y2="440" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="60" y="440" width="880" height="56" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="500" y="473" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">CloudTrail + logs: record everything</text><text x="500" y="540" text-anchor="middle" font-size="13" fill="#555555">An attacker must beat every layer. One layer is never enough.</text></svg>
