<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 390" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Thirty traps in five families: distractor services, absolute wording, associate-level answers, reversed causality, missed constraints">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The 30 traps in 5 families: name each one on sight</text>
