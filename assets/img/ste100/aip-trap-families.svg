<text x="210" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Distractor services</text>
<text x="210" y="118" text-anchor="middle" font-size="13" fill="#555555">Lambda 15-min timeout</text>
<text x="210" y="140" text-anchor="middle" font-size="13" fill="#555555">KB scope, guardrails plane</text>
<text x="210" y="162" text-anchor="middle" font-size="13" fill="#555555">fabricated features</text>
