<text x="580" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Absolute wording</text>
<text x="580" y="118" text-anchor="middle" font-size="13" fill="#555555">always/never in options</text>
<text x="580" y="140" text-anchor="middle" font-size="13" fill="#555555">adjective precision</text>
<text x="580" y="162" text-anchor="middle" font-size="13" fill="#555555">built-in safety is enough</text>
