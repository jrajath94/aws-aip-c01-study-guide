<text x="950" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Associate-level answers</text>
<text x="950" y="118" text-anchor="middle" font-size="13" fill="#555555">custom code vs managed</text>
<text x="950" y="140" text-anchor="middle" font-size="13" fill="#555555">ladder jumping</text>
<text x="950" y="162" text-anchor="middle" font-size="13" fill="#555555">proactive vs reactive</text>
<rect x="40" y="220" width="340" height="130" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="210" y="246" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Reversed causality</text>
<text x="210" y="268" text-anchor="middle" font-size="13" fill="#555555">PII pipeline order</text>
<text x="210" y="290" text-anchor="middle" font-size="13" fill="#555555">missing prepare step</text>
