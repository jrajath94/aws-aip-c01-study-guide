<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img" aria-label="RAG versus fine-tuning versus long context: RAG adds knowledge at query time, fine-tuning bakes in behavior at train time, long context stuffs documents into the prompt">
<rect x="0" y="0" width="760" height="560" fill="#000000" rx="10"/>
<text x="24" y="36" font-size="20" font-weight="600" fill="#ececec">RAG vs fine-tuning vs long context</text>
<text x="24" y="60" font-size="13" fill="#7d8590">One claim: match the change you need to the column that makes it.</text>
<rect x="24" y="80" width="224" height="392" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="136" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#ececec">RAG</text>
<text x="136" y="130" text-anchor="middle" font-size="12" fill="#7d8590">adds knowledge</text>
<text x="136" y="148" text-anchor="middle" font-size="12" fill="#7d8590">at query time</text>
<rect x="40" y="168" width="192" height="40" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="136" y="193" text-anchor="middle" font-size="12" fill="#7ee2b0">citations: yes</text>
<text x="48" y="232" font-size="12" fill="#ececec">facts change: fine</text>
<text x="48" y="256" font-size="12" fill="#ececec">cost: pay per query</text>
<text x="48" y="280" font-size="12" fill="#ececec">staleness: re-sync docs</text>
<text x="48" y="304" font-size="12" fill="#ececec">behavior change: no</text>
<rect x="40" y="328" width="192" height="56" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="136" y="350" text-anchor="middle" font-size="12" fill="#9ecfff">use when facts change</text>
<text x="136" y="370" text-anchor="middle" font-size="12" fill="#9ecfff">or answers must cite</text>
<rect x="40" y="408" width="192" height="48" rx="8" fill="#2e1414" stroke="#a53b3b" stroke-width="1.5"/>
<text x="136" y="430" text-anchor="middle" font-size="12" fill="#ff9e9e">wrong for: tone,</text>
<text x="136" y="448" text-anchor="middle" font-size="12" fill="#ff9e9e">format, behavior</text>
<rect x="268" y="80" width="224" height="392" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="380" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#ececec">FINE-TUNING</text>
<text x="380" y="130" text-anchor="middle" font-size="12" fill="#7d8590">bakes behavior</text>
<text x="380" y="148" text-anchor="middle" font-size="12" fill="#7d8590">at train time</text>
<rect x="284" y="168" width="192" height="40" rx="8" fill="#0d2818" stroke="#2f9e6e" stroke-width="1.5"/>
<text x="380" y="193" text-anchor="middle" font-size="12" fill="#7ee2b0">citations: no</text>
<text x="292" y="232" font-size="12" fill="#ececec">facts change: stale</text>
<text x="292" y="256" font-size="12" fill="#ececec">cost: train + serve</text>
<text x="292" y="280" font-size="12" fill="#ececec">staleness: retrain</text>
<text x="292" y="304" font-size="12" fill="#ececec">behavior change: yes</text>
<rect x="284" y="328" width="192" height="56" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="380" y="350" text-anchor="middle" font-size="12" fill="#9ecfff">use when tone, format,</text>
<text x="380" y="370" text-anchor="middle" font-size="12" fill="#9ecfff">or style must stick</text>
<rect x="284" y="408" width="192" height="48" rx="8" fill="#2e1414" stroke="#a53b3b" stroke-width="1.5"/>
<text x="380" y="430" text-anchor="middle" font-size="12" fill="#ff9e9e">wrong for: changing</text>
<text x="380" y="448" text-anchor="middle" font-size="12" fill="#ff9e9e">facts, citations</text>
<rect x="512" y="80" width="224" height="392" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="624" y="108" text-anchor="middle" font-size="14" font-weight="600" fill="#ececec">LONG CONTEXT</text>
<text x="624" y="130" text-anchor="middle" font-size="12" fill="#7d8590">stuffs documents</text>
<text x="624" y="148" text-anchor="middle" font-size="12" fill="#7d8590">into the prompt</text>
<rect x="528" y="168" width="192" height="40" rx="8" fill="#3a2b10" stroke="#a5813b" stroke-width="1.5"/>
<text x="624" y="193" text-anchor="middle" font-size="12" fill="#ffd97e">citations: weak</text>
<text x="536" y="232" font-size="12" fill="#ececec">facts change: edit prompt</text>
<text x="536" y="256" font-size="12" fill="#ececec">cost: tokens each call</text>
<text x="536" y="280" font-size="12" fill="#ececec">staleness: prompt edits</text>
<text x="536" y="304" font-size="12" fill="#ececec">behavior change: partial</text>
<rect x="528" y="328" width="192" height="56" rx="8" fill="#13202e" stroke="#3b6ea5" stroke-width="1.5"/>
<text x="624" y="350" text-anchor="middle" font-size="12" fill="#9ecfff">use when the doc set</text>
<text x="624" y="370" text-anchor="middle" font-size="12" fill="#9ecfff">is small and stable</text>
<rect x="528" y="408" width="192" height="48" rx="8" fill="#2e1414" stroke="#a53b3b" stroke-width="1.5"/>
<text x="624" y="430" text-anchor="middle" font-size="12" fill="#ff9e9e">wrong for: large or</text>
<text x="624" y="448" text-anchor="middle" font-size="12" fill="#ff9e9e">fast-changing docs</text>
<text x="24" y="512" font-size="13" fill="#ececec">Knowledge questions take the left column. Behavior questions take the middle column.</text>
<text x="24" y="534" font-size="12" fill="#7d8590">Shell: comparison plate. Source: original figure for the AWS AIP-C01 Study Guide.</text>
</svg>
