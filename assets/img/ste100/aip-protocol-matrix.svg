<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 744 596" role="img" aria-label="Transfer Family protocol matrix: SFTP, FTPS, and AS2 work on public and VPC-internal endpoints; plain FTP works only on VPC-internal endpoints"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="744" height="596" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">PROTOCOL MATRIX: WHICH ENDPOINT SPEAKS WHICH PROTOCOL</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">One rule matters: plain FTP never crosses the public internet.</text><rect x="24" y="72" width="340" height="220" rx="8" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="1.5"/><text x="194" y="104" text-anchor="middle" font-size="15" fill="#222222" font-weight="700">SFTP</text><text x="194" y="128" text-anchor="middle" font-size="12" fill="#555555">SSH File Transfer Protocol</text><text x="194" y="160" text-anchor="middle" font-size="12" fill="#1f7a4d">Public endpoint: yes. VPC-internal</text><text x="194" y="178" text-anchor="middle" font-size="12" fill="#1f7a4d">endpoint: yes.</text><rect x="380" y="72" width="340" height="220" rx="8" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="1.5"/><text x="550" y="104" text-anchor="middle" font-size="15" fill="#222222" font-weight="700">FTPS</text><text x="550" y="128" text-anchor="middle" font-size="12" fill="#555555">FTP over TLS/SSL</text><text x="550" y="160" text-anchor="middle" font-size="12" fill="#1f7a4d">Public endpoint: yes. VPC-internal</text><text x="550" y="178" text-anchor="middle" font-size="12" fill="#1f7a4d">endpoint: yes.</text><rect x="24" y="308" width="340" height="220" rx="8" fill="#fdeeee" stroke="#a33b3b" stroke-width="1.5"/><text x="194" y="340" text-anchor="middle" font-size="15" fill="#222222" font-weight="700">FTP (plain)</text><text x="194" y="364" text-anchor="middle" font-size="12" fill="#555555">Unencrypted file transfer</text><text x="194" y="396" text-anchor="middle" font-size="12" fill="#a33b3b">Public endpoint: NO. VPC-internal</text><text x="194" y="414" text-anchor="middle" font-size="12" fill="#a33b3b">endpoint: yes.</text><text x="194" y="452" text-anchor="middle" font-size="12" fill="#555555">Unencrypted FTP must never cross</text><text x="194" y="470" text-anchor="middle" font-size="12" fill="#555555">the public internet.</text><rect x="380" y="308" width="340" height="220" rx="8" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="1.5"/><text x="550" y="340" text-anchor="middle" font-size="15" fill="#222222" font-weight="700">AS2</text><text x="550" y="364" text-anchor="middle" font-size="12" fill="#555555">B2B messaging protocol</text><text x="550" y="396" text-anchor="middle" font-size="12" fill="#1f7a4d">Public endpoint: yes. VPC-internal</text><text x="550" y="414" text-anchor="middle" font-size="12" fill="#1f7a4d">endpoint: yes.</text><text x="372" y="562" text-anchor="middle" font-size="12.5" fill="#555555">The exam asks exactly one question here: which protocol is VPC-internal only? Plain FTP.</text></svg>