<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 470" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="The five axes and the filter order">
<title>The five axes and the filter order</title>
<desc>Five filter boxes in a row with arrows between them. Capability floor first: drop models below the quality bar on a golden dataset. Then regional availability: drop models not offered where you run, or add a cross-region profile. Then cost and latency: rank survivors by tokens per request and time to first token. Then context window: check it against the longest input plus expected output. The survivor with the lowest cost that clears every bar wins. A footer notes the five axes to judge: capability, cost per token, latency, context window, regional availability.</desc>
<defs><marker id="aip-axes-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="470" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">SELECTION IS A FILTER, APPLIED IN ORDER</text>
<rect x="30" y="70" width="200" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="130.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. capability floor</text>
<text x="130.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">golden dataset</text>
<text x="130.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">drop below bar</text>
<line x1="230" y1="130" x2="245" y2="130" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-axes-ah)"/>
<rect x="245" y="70" width="200" height="120" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="345.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. region</text>
<text x="345.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">offered where you run?</text>
<text x="345.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">or cross-region profile</text>
<line x1="445" y1="130" x2="460" y2="130" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-axes-ah)"/>
<rect x="460" y="70" width="200" height="120" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="560.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. cost + latency</text>
<text x="560.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">rank by $ and TTFT</text>
<text x="560.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">tokens per request</text>
<line x1="660" y1="130" x2="675" y2="130" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-axes-ah)"/>
<rect x="675" y="70" width="200" height="120" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="775.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. context window</text>
<text x="775.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">longest input + output</text>
<text x="775.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">must fit</text>
<rect x="30" y="240" width="830" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="445.0" y="272" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Winner: the cheapest model that clears every bar</text>
<text x="445.0" y="294" text-anchor="middle" font-size="12.5" fill="#555555">revisit quarterly: prices and capabilities move</text>
<text x="30" y="360" font-size="13" fill="#111111" font-weight="bold">Judge every candidate on five axes:</text>
<text x="30" y="384" font-size="12" fill="#555555">capability (reasoning, multilingual, code, vision) - cost per token (input and output differ) - latency (time to first token, tokens per second)</text>
<text x="30" y="406" font-size="12" fill="#555555">context window (input plus output together) - regional availability (is it offered where you run)</text>
<text x="30" y="440" font-size="13" fill="#111111">Picking on capability alone burns money. Picking on cost alone fails hard tasks. Hold all five at once.</text>
</svg>