<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 380" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Time budget: 2.4 minutes per question; easy under 90 seconds, medium on pace, hard capped at 4 minutes">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Time budget: 75 questions in 180 minutes</text>
<rect x="175" y="70" width="800" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2.4 minutes per question</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">75 questions / 180 minutes</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">if an option violates a constraint on sight: eliminate and move on</text>
<rect x="60" y="220" width="330" height="130" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="225" y="246" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Easy questions</text>
<text x="225" y="268" text-anchor="middle" font-size="13" fill="#555555">bank them fast</text>
<text x="225" y="290" text-anchor="middle" font-size="13" fill="#555555">under 90 seconds</text>
<text x="225" y="312" text-anchor="middle" font-size="13" fill="#555555">they fund the hard ones</text>
<rect x="410" y="220" width="330" height="130" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="246" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Medium questions</text>
<text x="575" y="268" text-anchor="middle" font-size="13" fill="#555555">the bulk: ~2.4 minutes</text>
<text x="575" y="290" text-anchor="middle" font-size="13" fill="#555555">constraints, then tiebreak</text>
<text x="575" y="312" text-anchor="middle" font-size="13" fill="#555555">flag and return if stuck</text>
<rect x="760" y="220" width="330" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="925" y="246" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Hard questions</text>
<text x="925" y="268" text-anchor="middle" font-size="13" fill="#555555">never over 4 minutes</text>
<text x="925" y="290" text-anchor="middle" font-size="13" fill="#555555">a guess beats a blank</text>
<text x="925" y="312" text-anchor="middle" font-size="13" fill="#555555">no penalty for guessing</text>
<path d="M390,285 L408,285" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M740,285 L758,285" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
