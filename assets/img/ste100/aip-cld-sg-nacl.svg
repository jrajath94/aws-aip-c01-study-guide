<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410" role="img" aria-label="Security group versus network ACL: security groups attach to instances, are stateful and allow-only; NACLs attach to subnets, are stateless, and can deny">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="410" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">SECURITY GROUP VS NETWORK ACL</text>

<rect x="60" y="60" width="280" height="290" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="200" y="95" font-size="14" text-anchor="middle" font-weight="700">SECURITY GROUP</text>
<text x="200" y="140" font-size="12" text-anchor="middle">attaches to an instance</text>
<text x="200" y="170" font-size="12" text-anchor="middle">stateful: return traffic allowed</text>
<text x="200" y="200" font-size="12" text-anchor="middle">allow rules only</text>
<text x="200" y="245" font-size="12" text-anchor="middle" fill="#b00020">cannot deny</text>
<text x="200" y="290" font-size="11.5" fill="#555555" text-anchor="middle">reference another group,</text>
<text x="200" y="310" font-size="11.5" fill="#555555" text-anchor="middle">not an IP</text>
<rect x="380" y="60" width="280" height="290" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="520" y="95" font-size="14" text-anchor="middle" font-weight="700">NETWORK ACL</text>
<text x="520" y="140" font-size="12" text-anchor="middle">attaches to a subnet</text>
<text x="520" y="170" font-size="12" text-anchor="middle">stateless: both ways checked</text>
<text x="520" y="200" font-size="12" text-anchor="middle">allow AND deny rules</text>
<text x="520" y="245" font-size="12" text-anchor="middle" fill="#1f7a6d">can block one bad IP fast</text>
<text x="520" y="290" font-size="11.5" fill="#555555" text-anchor="middle">rules have numbers,</text>
<text x="520" y="310" font-size="11.5" fill="#555555" text-anchor="middle">lowest number wins</text>
<text x="360" y="385" font-size="11.5" fill="#555555" text-anchor="middle">Exam shortcut: “block a single attacking IP” = NACL deny rule</text>
</svg>