<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 480" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Bedrock Data Automation: messy files become structured content">
<title>Bedrock Data Automation: messy files become structured content</title>
<desc>A pipeline left to right. Messy files such as PDFs, scans, and audio go into Bedrock Data Automation. It extracts structured content: text, tables, and fields. That structured content feeds the three app shapes: chatbots, copilots, and Q and A over docs. A note says Data Automation is the content refinery behind the applications, not the application itself.</desc>
<defs><marker id="aip-dataauto-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="480" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">DATA AUTOMATION: THE CONTENT REFINERY BEHIND THE APPS</text>
<rect x="30" y="90" width="260" height="120" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="160.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Messy files</text>
<text x="160.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">PDFs, scans, audio, video</text>
<text x="160.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">unstructured input</text>
<rect x="340" y="90" width="260" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Data Automation</text>
<text x="470.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">extracts text, tables, fields</text>
<text x="470.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">structured output</text>
<line x1="290" y1="150" x2="340" y2="150" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-dataauto-ah)"/>
<rect x="650" y="90" width="260" height="120" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="780.0" y="122" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">App shapes</text>
<text x="780.0" y="144" text-anchor="middle" font-size="12.5" fill="#555555">chatbots, copilots</text>
<text x="780.0" y="163" text-anchor="middle" font-size="12.5" fill="#555555">Q and A over docs</text>
<line x1="600" y1="150" x2="650" y2="150" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-dataauto-ah)"/>
<text x="30" y="252" font-size="13" fill="#111111" font-weight="bold">Three app shapes it feeds:</text>
<text x="30" y="278" font-size="12.5" fill="#555555">Chatbot: conversational Q and A with history and grounding.</text>
<text x="30" y="304" font-size="12.5" fill="#555555">Copilot: assistant inside a product: low latency, streaming, host context.</text>
<text x="30" y="330" font-size="12.5" fill="#555555">Q and A over docs: RAG in its purest form: documents in, cited answers out.</text>
<text x="30" y="380" font-size="13" fill="#111111">Mental model: Data Automation is the refinery, not the storefront. It prepares content; the apps serve users.</text>
</svg>