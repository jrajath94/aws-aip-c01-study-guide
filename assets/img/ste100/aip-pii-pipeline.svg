<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1230 380" role="img" aria-label="PII pipeline: Macie discovers PII in S3, Comprehend detects PII in live text, Guardrails filter PII at the model boundary"><style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="1230" height="380" fill="#0a0a0a"/><text x="615.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">The PII pipeline: find it, detect it, filter it</text><text x="615.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Macie finds it at rest, Comprehend detects it in flight, Guardrails filter it at inference.</text><rect x="25" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="115" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">S3 buckets</text><text x="115" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">PII sitting at rest</text><path d="M205,170 L231,170" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="231" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="321" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Amazon Macie</text><text x="321" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">discovers PII across</text><text x="321" y="195" text-anchor="middle" font-size="12" fill="#a8a8a8">buckets</text><path d="M411,170 L437,170" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="437" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="527" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Live text</text><text x="527" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">PII in flight</text><path d="M617,170 L643,170" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="643" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="733" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Amazon Comprehend</text><text x="733" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">detects 30+ entity</text><text x="733" y="195" text-anchor="middle" font-size="12" fill="#a8a8a8">types</text><path d="M823,170 L849,170" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="849" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="939" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Model boundary</text><text x="939" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">the inference door</text><path d="M1029,170 L1055,170" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="1055" y="110" width="180" height="120" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="1145" y="148" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Bedrock Guardrails</text><text x="1145" y="176" text-anchor="middle" font-size="12" fill="#a8a8a8">sensitive-info</text><text x="1145" y="195" text-anchor="middle" font-size="12" fill="#a8a8a8">filters block or</text><text x="1145" y="214" text-anchor="middle" font-size="12" fill="#a8a8a8">mask</text><rect x="60" y="260" width="1110" height="88" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="615" y="292" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Warning: model invocation logging keeps full prompt and response text.</text><text x="615" y="318" text-anchor="middle" font-size="13" fill="#a8a8a8">Logs can contain PII. In regulated scenarios, justify retention or disable logging.</text></svg>