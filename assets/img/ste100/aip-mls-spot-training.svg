<svg xmlns="http://www.w3.org/2000/svg" width="720" height="315" viewBox="0 0 720 315" role="img" aria-label="Spot training economics: cheap interrupted compute plus S3 checkpoints equals full-price results at a fraction of the cost">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="315" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">SPOT TRAINING: CHEAP AND SAFE</text>

<rect x="60" y="60" width="290" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="205.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">SPOT INSTANCES</text>
<text x="205.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">up to 90% off</text>

<text x="205" y="205" font-size="11.5" fill="#555555" text-anchor="middle">2-minute interrupt notice</text>
<rect x="370" y="60" width="290" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="515.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">CHECKPOINTING</text>
<text x="515.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">resume, do not restart</text>

<text x="515" y="205" font-size="11.5" fill="#555555" text-anchor="middle">progress saved to S3</text>
<text x="360" y="260" font-size="14" text-anchor="middle" font-weight="700">cheap interrupted compute + checkpoints = full-price results</text>
<text x="360" y="290" font-size="11.5" fill="#555555" text-anchor="middle">Training metrics come from script logs: regex metric definitions scrape them into CloudWatch</text>
</svg>