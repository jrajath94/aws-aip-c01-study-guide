<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 400" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="8 field-research questions from September 2026 passer reports, grouped by domain">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Field-research questions: 8 questions from September 2026 passer reports</text>
<rect x="60" y="70" width="1030" height="90" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="98" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Built from real passer-report trap patterns</text>
<text x="575" y="121" text-anchor="middle" font-size="13" fill="#555555">Q193-Q200: the traps that caught real test-takers</text>
<text x="575" y="144" text-anchor="middle" font-size="13" fill="#555555">study them last among the bank: they are the freshest signal</text>
