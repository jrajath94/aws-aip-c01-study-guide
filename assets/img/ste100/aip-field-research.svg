<text x="158" y="218" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">D1: 1 question</text>
<text x="158" y="241" text-anchor="middle" font-size="13" fill="#555555">q-d1-217</text>
<rect x="268" y="190" width="196" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="366" y="218" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">D2: 2 questions</text>
<text x="366" y="241" text-anchor="middle" font-size="13" fill="#555555">q-d2-214, q-d2-215</text>
<rect x="476" y="190" width="196" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="574" y="218" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">D3: 2 questions</text>
<text x="574" y="241" text-anchor="middle" font-size="13" fill="#555555">q-d3-212, q-d3-213</text>
<rect x="684" y="190" width="196" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="782" y="218" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">D4: 2 questions</text>
<text x="782" y="241" text-anchor="middle" font-size="13" fill="#555555">q-d4-207, q-d4-208</text>
<rect x="892" y="190" width="196" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="990" y="218" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">D5: 1 question</text>
<text x="990" y="241" text-anchor="middle" font-size="13" fill="#555555">q-d5-207</text>
<text x="575" y="350" text-anchor="middle" font-size="13" fill="#555555">Each one maps to a master trap: name the trap before you reveal the answer.</text>
