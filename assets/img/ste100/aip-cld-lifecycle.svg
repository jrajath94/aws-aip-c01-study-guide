<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-label="S3 lifecycle rule timeline: Standard at day 0, Standard-IA at day 30, Glacier at day 90, expire at year 7">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="370" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">LIFECYCLE RULE: THE COST LADDER</text>

<line x1="60" y1="180" x2="660" y2="180" stroke="#555" stroke-width="2"/>
<circle cx="90" cy="180" r="10" fill="#1f7a6d"/><text x="90" y="215" font-size="12" text-anchor="middle" font-weight="700">Day 0</text><text x="90" y="235" font-size="11.5" fill="#555555" text-anchor="middle">Standard</text>
<circle cx="270" cy="180" r="10" fill="#c98a1b"/><text x="270" y="215" font-size="12" text-anchor="middle" font-weight="700">Day 30</text><text x="270" y="235" font-size="11.5" fill="#555555" text-anchor="middle">Standard-IA</text>
<circle cx="450" cy="180" r="10" fill="#2b6cb0"/><text x="450" y="215" font-size="12" text-anchor="middle" font-weight="700">Day 90</text><text x="450" y="235" font-size="11.5" fill="#555555" text-anchor="middle">Glacier</text>
<circle cx="630" cy="180" r="10" fill="#b00020"/><text x="630" y="215" font-size="12" text-anchor="middle" font-weight="700">Year 7</text><text x="630" y="235" font-size="11.5" fill="#555555" text-anchor="middle">Expire</text>
<rect x="60" y="280" width="600" height="64" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="310.0" font-size="13" text-anchor="middle" font-weight="700">Lifecycle rules move objects on a schedule</text>
<text x="360.0" y="328.0" font-size="11" fill="#555555" text-anchor="middle">versioning keeps old copies; replication copies buckets</text>

<text x="360" y="120" font-size="12" text-anchor="middle" font-weight="700">A lifecycle rule on a training-data bucket</text>
</svg>