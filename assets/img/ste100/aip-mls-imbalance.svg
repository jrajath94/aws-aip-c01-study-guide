<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-label="Class imbalance: the always-say-normal model scores 99 percent accuracy and catches zero fraud; fix the data, the model weights, or the metric">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="350" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">THE 99% ACCURACY TRAP</text>

<rect x="60" y="60" width="600" height="60" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/>
<text x="360.0" y="88.0" font-size="14" text-anchor="middle" font-weight="700">1% fraud, 99% normal</text>
<text x="360.0" y="106.0" font-size="11.5" fill="#555555" text-anchor="middle">the always-say-normal model scores 99% and catches zero</text>

<text x="360" y="160" font-size="12" text-anchor="middle" font-weight="700">Three fixes</text>
<rect x="60" y="175" width="190" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.0" y="228.0" font-size="13" text-anchor="middle" font-weight="700">FIX THE DATA</text>
<text x="155.0" y="246.0" font-size="11" fill="#555555" text-anchor="middle">oversample, undersample, SMOTE</text>

<rect x="265" y="175" width="190" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="360.0" y="228.0" font-size="13" text-anchor="middle" font-weight="700">FIX THE MODEL</text>
<text x="360.0" y="246.0" font-size="11" fill="#555555" text-anchor="middle">class weights</text>

<rect x="470" y="175" width="190" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="565.0" y="228.0" font-size="13" text-anchor="middle" font-weight="700">FIX THE YARDSTICK</text>
<text x="565.0" y="246.0" font-size="11" fill="#555555" text-anchor="middle">precision-recall, not accuracy</text>

<text x="360" y="325" font-size="11.5" fill="#555555" text-anchor="middle">Accuracy on a 1% positive class is a misleading number</text>
</svg>