<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="The same-model rule: documents and queries embedded with different models break retrieval; one model keeps one vector space">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="270" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">SAME MODEL RULE</text><rect x="24" y="56" width="320" height="150" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/><text x="184" y="86" font-size="13" fill="#b00020" text-anchor="middle" font-weight="700">BROKEN</text><text x="184" y="110" font-size="12" fill="#222222" text-anchor="middle">docs: Model X</text><text x="184" y="132" font-size="12" fill="#222222" text-anchor="middle">query: Model Y</text><text x="184" y="156" font-size="11.5" fill="#555555" text-anchor="middle">different vector spaces</text><text x="184" y="178" font-size="11.5" fill="#555555" text-anchor="middle">nearest = meaningless</text><rect x="376" y="56" width="320" height="150" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="536" y="86" font-size="13" fill="#1f7a6d" text-anchor="middle" font-weight="700">WORKS</text><text x="536" y="110" font-size="12" fill="#222222" text-anchor="middle">docs: Model X</text><text x="536" y="132" font-size="12" fill="#222222" text-anchor="middle">query: Model X</text><text x="536" y="156" font-size="11.5" fill="#555555" text-anchor="middle">one shared vector space</text><text x="536" y="178" font-size="11.5" fill="#555555" text-anchor="middle">nearest = truly nearest</text><text x="360" y="240" font-size="12" fill="#555555" text-anchor="middle">The same embedding model must run at ingest time and at query time.</text></svg>