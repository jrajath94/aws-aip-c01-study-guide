<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Five ways to pay for EC2: On-Demand, Spot at up to 90 percent off but interruptible, Reserved and Savings Plans for steady state, Dedicated Host and Instance for single-tenant hardware">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">EC2: FIVE WAYS TO PAY</text>

<rect x="60" y="60" width="180" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="150.0" y="113.0" font-size="13" text-anchor="middle" font-weight="700">ON-DEMAND</text>
<text x="150.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">the unknown</text>

<rect x="270" y="60" width="180" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="360.0" y="113.0" font-size="13" text-anchor="middle" font-weight="700">SPOT</text>
<text x="360.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">up to 90% off</text>

<text x="360" y="205" font-size="11" fill="#555555" text-anchor="middle">interruptible: batch, not databases</text>
<rect x="480" y="60" width="180" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="570.0" y="113.0" font-size="13" text-anchor="middle" font-weight="700">RESERVED /</text>
<text x="570.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">Savings Plans</text>

<text x="570" y="205" font-size="11" fill="#555555" text-anchor="middle">steady state, commit 1-3 years</text>
<rect x="165" y="245" width="180" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="255.0" y="298.0" font-size="13" text-anchor="middle" font-weight="700">DEDICATED HOST</text>
<text x="255.0" y="316.0" font-size="11" fill="#555555" text-anchor="middle">compliance hardware</text>

<rect x="375" y="245" width="180" height="110" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/>
<text x="465.0" y="298.0" font-size="13" text-anchor="middle" font-weight="700">DEDICATED INSTANCE</text>
<text x="465.0" y="316.0" font-size="11" fill="#555555" text-anchor="middle">single tenant</text>

<text x="360" y="395" font-size="12" text-anchor="middle" font-weight="700">Ordered by commitment: none, interruptible, 1-3 years, dedicated</text>
</svg>