<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="S3 storage class ladder: Standard for daily reads, Standard-IA for monthly reads with a 30-day minimum, Glacier for archives with a 90-day minimum">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="400" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">S3 STORAGE CLASSES: HOT TO COLD</text>

<rect x="90" y="60" width="540" height="70" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="360.0" y="93.0" font-size="14" text-anchor="middle" font-weight="700">STANDARD</text>
<text x="360.0" y="111.0" font-size="11" fill="#555555" text-anchor="middle">read daily, no minimum days</text>

<line x1="360" y1="130" x2="360" y2="158" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="90" y="158" width="540" height="70" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="360.0" y="191.0" font-size="14" text-anchor="middle" font-weight="700">STANDARD-IA</text>
<text x="360.0" y="209.0" font-size="11" fill="#555555" text-anchor="middle">read monthly, 30-day minimum</text>

<line x1="360" y1="228" x2="360" y2="256" stroke="#555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="90" y="256" width="540" height="70" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="360.0" y="289.0" font-size="14" text-anchor="middle" font-weight="700">GLACIER</text>
<text x="360.0" y="307.0" font-size="11" fill="#555555" text-anchor="middle">archives, 90-day minimum</text>

<text x="360" y="358" font-size="12" text-anchor="middle" font-weight="700">Pick by access pattern, not by feel</text>
<text x="360" y="382" font-size="11.5" fill="#555555" text-anchor="middle">Early delete = you still pay the minimum days</text>
</svg>