<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 640" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Converse request anatomy: one shape for every model">
<title>Converse request anatomy: one shape for every model</title>
<desc>A central box labeled Converse request with eight labeled rows: modelId, messages, system, inferenceConfig, toolConfig, guardrailConfig, cachePoint, and outputConfig. Each row names what the field carries. A note at the bottom says Converse is text-generation only and cannot do embeddings.</desc>
<defs><marker id="aip-convan-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">CONVERSE REQUEST: ONE SHAPE FOR CLAUDE, LLAMA, TITAN, NOVA</text>
<rect x="60" y="70" width="820" height="44" rx="6" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="80" y="98" font-size="14" fill="#111111" font-weight="bold">modelId</text>
<text x="330" y="98" font-size="12.5" fill="#555555">which model: base ID, inference profile, or provisioned model ARN</text>
<rect x="60" y="120" width="820" height="44" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="80" y="148" font-size="14" fill="#111111" font-weight="bold">messages</text>
<text x="330" y="148" font-size="12.5" fill="#555555">the conversation: user and assistant roles with content blocks</text>
<rect x="60" y="170" width="820" height="44" rx="6" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="80" y="198" font-size="14" fill="#111111" font-weight="bold">system</text>
<text x="330" y="198" font-size="12.5" fill="#555555">system prompts that set behavior for the whole conversation</text>
<rect x="60" y="220" width="820" height="44" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="80" y="248" font-size="14" fill="#111111" font-weight="bold">inferenceConfig</text>
<text x="330" y="248" font-size="12.5" fill="#555555">maxTokens, temperature, topP</text>
<rect x="60" y="270" width="820" height="44" rx="6" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="80" y="298" font-size="14" fill="#111111" font-weight="bold">toolConfig</text>
<text x="330" y="298" font-size="12.5" fill="#555555">tools the model may call, each with a JSON schema for its inputs</text>
<rect x="60" y="320" width="820" height="44" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="80" y="348" font-size="14" fill="#111111" font-weight="bold">guardrailConfig</text>
<text x="330" y="348" font-size="12.5" fill="#555555">guardrail ID plus version, applied inline, optional trace</text>
<rect x="60" y="370" width="820" height="44" rx="6" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="80" y="398" font-size="14" fill="#111111" font-weight="bold">additionalModelRequestFields</text>
<text x="330" y="398" font-size="12.5" fill="#555555">escape hatch for provider-only parameters</text>
<rect x="60" y="420" width="820" height="44" rx="6" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="80" y="448" font-size="14" fill="#111111" font-weight="bold">cachePoint</text>
<text x="330" y="448" font-size="12.5" fill="#555555">marks where prompt caching starts</text>
<rect x="60" y="470" width="820" height="44" rx="6" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="80" y="498" font-size="14" fill="#111111" font-weight="bold">outputConfig</text>
<text x="330" y="498" font-size="12.5" fill="#555555">structured output as JSON schema</text>
<text x="30" y="556" font-size="13" fill="#111111" font-weight="bold">Same fields for every provider. Swap the model ID and the code stays the same.</text>
<text x="30" y="580" font-size="13" fill="#b3261e">Limit: Converse is text-generation only. It cannot do embeddings. Use InvokeModel for embedding models.</text>
</svg>