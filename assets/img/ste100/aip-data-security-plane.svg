<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 460" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="IAM, KMS, VPC, and logging form the data security plane">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The data security plane</text>
<rect x="40" y="90" width="280" height="150" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="180" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">IAM</text><text x="180" y="157" text-anchor="middle" font-size="12" fill="#111111">roles + policies</text><text x="180" y="183" text-anchor="middle" font-size="12" fill="#111111">least privilege</text><text x="180" y="209" text-anchor="middle" font-size="12" fill="#111111">no long-lived keys</text><rect x="360" y="90" width="280" height="150" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="500" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">KMS</text><text x="500" y="157" text-anchor="middle" font-size="12" fill="#111111">encrypt S3, logs</text><text x="500" y="183" text-anchor="middle" font-size="12" fill="#111111">disable key = revoke</text><text x="500" y="209" text-anchor="middle" font-size="12" fill="#111111">CloudTrail logs use</text><rect x="680" y="90" width="280" height="150" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="820" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">VPC</text><text x="820" y="157" text-anchor="middle" font-size="12" fill="#111111">private endpoints</text><text x="820" y="183" text-anchor="middle" font-size="12" fill="#111111">no public internet</text><text x="820" y="209" text-anchor="middle" font-size="12" fill="#111111">for Bedrock calls</text><rect x="200" y="280" width="600" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="500" y="301" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Logging + audit</text><text x="500" y="327" text-anchor="middle" font-size="12" fill="#111111">CloudTrail: every API call</text><text x="500" y="353" text-anchor="middle" font-size="12" fill="#111111">Model invocation logs: every prompt/answer</text><text x="500" y="379" text-anchor="middle" font-size="12" fill="#111111">kept in encrypted S3</text><text x="500" y="430" text-anchor="middle" font-size="13" fill="#555555">The data security plane: identity, encryption, network, and proof.</text></svg>
