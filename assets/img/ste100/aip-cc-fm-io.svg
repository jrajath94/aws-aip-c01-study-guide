<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Foundation model: prompt text in, generated text out">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="400" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Foundation model I/O</text><rect x="56" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#1E4D8C" stroke-width="1.5"/><text x="152" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Your prompt</text><text x="152" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">plain text</text><rect x="304" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="400" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Foundation model</text><text x="400" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">pre-trained once</text><rect x="552" y="120" width="192" height="104" rx="12" fill="#FFFDF8" stroke="#C46B2C" stroke-width="1.5"/><text x="648" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Generated text</text><text x="648" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">one token at a time</text><line x1="248" y1="172" x2="296" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="272" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">send</text><line x1="496" y1="172" x2="544" y2="172" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="520" y="164" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">generate</text><text x="400" y="300" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">You never train it. You call it through an API.</text><text x="400" y="328" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Every API call is one inference request.</text></svg>