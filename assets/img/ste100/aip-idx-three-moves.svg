<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="The three moves every exam question tests: ground with RAG, wire into apps, guard with guardrails and IAM">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="290" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THREE MOVES</text><rect x="24" y="56" width="200" height="120" rx="8" fill=" #fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="124" y="86" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >1 · GROUND</text><text x="124" y="110" font-size="11.5" fill="#555555" text-anchor="middle" >RAG fetches docs</text><text x="124" y="130" font-size="11.5" fill="#555555" text-anchor="middle" >at answer time,</text><text x="124" y="150" font-size="11.5" fill="#555555" text-anchor="middle" >answers cite them</text><line x1="224" y1="116" x2="250" y2="116" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="250" y="56" width="200" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="350" y="86" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >2 · WIRE</text><text x="350" y="110" font-size="11.5" fill="#555555" text-anchor="middle" >agents take actions,</text><text x="350" y="130" font-size="11.5" fill="#555555" text-anchor="middle" >Lambda and API Gateway</text><text x="350" y="150" font-size="11.5" fill="#555555" text-anchor="middle" >connect the model to apps</text><line x1="450" y1="116" x2="476" y2="116" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="476" y="56" width="200" height="120" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="576" y="86" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >3 · GUARD</text><text x="576" y="110" font-size="11.5" fill="#555555" text-anchor="middle" >guardrails filter</text><text x="576" y="130" font-size="11.5" fill="#555555" text-anchor="middle" >content; IAM controls</text><text x="576" y="150" font-size="11.5" fill="#555555" text-anchor="middle" >who can call what</text><rect x="24" y="206" width="672" height="52" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="360" y="228" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >Run it well</text><text x="360" y="250" font-size="11.5" fill="#555555" text-anchor="middle" >pick the right model · cache repeated work · eval quality · debug what breaks</text></svg>