<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Latency waterfall: network plus queue plus time to first token plus time per output token; each lever acts on one leg"><rect x="0" y="0" width="760" height="422" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The latency waterfall: four legs, four levers</text><text x="24" y="58" font-size="13" fill="#7d8590">Measure each leg before you optimize. The slowest leg names the fix.</text><rect x="15" y="120" width="140" height="80" fill="#8a8a8a" opacity="0.85" rx="6"/><text x="85.0" y="152" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">Network</text><text x="85.0" y="176" text-anchor="middle" font-size="11.5" fill="#0a0a0a">queue + TLS</text><rect x="155" y="120" width="110" height="80" fill="#8a8a8a" opacity="0.85" rx="6"/><text x="210.0" y="152" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">Queue</text><text x="210.0" y="176" text-anchor="middle" font-size="11.5" fill="#0a0a0a">throttle wait</text><rect x="265" y="120" width="170" height="80" fill="#d99a06" opacity="0.85" rx="6"/><text x="350.0" y="152" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">TTFT</text><text x="350.0" y="176" text-anchor="middle" font-size="11.5" fill="#0a0a0a">first token</text><rect x="435" y="120" width="310" height="80" fill="#60a5fa" opacity="0.85" rx="6"/><text x="590.0" y="152" text-anchor="middle" font-size="13" fill="#0a0a0a" font-weight="bold">TPOT x tokens</text><text x="590.0" y="176" text-anchor="middle" font-size="11.5" fill="#0a0a0a">generation</text><text x="30" y="240" text-anchor="start" font-size="13.5" fill="#ececec" font-weight="bold">End-to-end = network + queue + TTFT + (TPOT x output tokens).</text><rect x="60" y="262" width="640" height="130" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="294" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Where each lever acts</text><text x="380" y="320" text-anchor="middle" font-size="12.5" fill="#7d8590">Streaming shrinks perceived TTFT. PT shrinks queue. Caching shrinks TTFT on repeats.</text><text x="380" y="344" text-anchor="middle" font-size="12.5" fill="#7d8590">Smaller models shrink TPOT. Nothing shrinks the speed of light in the network leg.</text></svg>