<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Lambda front end versus direct SDK call: direct is fastest, the front end adds auth, throttling, and model switching"><rect x="0" y="0" width="760" height="386" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Lambda front end versus direct SDK call</text><text x="24" y="58" font-size="13" fill="#7d8590">Direct wins on latency. The front end wins on everything else.</text><rect x="24" y="90" width="344" height="220" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="196" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Direct SDK call</text><text x="196" y="160" text-anchor="middle" font-size="12.5" fill="#7d8590">App calls Bedrock directly.</text><text x="196" y="179" text-anchor="middle" font-size="12.5" fill="#7d8590">Fastest path, no middle layer.</text><text x="196" y="224" text-anchor="middle" font-size="12.5" fill="#7d8590">Wins only when latency is king</text><text x="196" y="243" text-anchor="middle" font-size="12.5" fill="#7d8590">and no auth is needed.</text><rect x="392" y="90" width="344" height="220" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="564" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Lambda front end</text><text x="564" y="160" text-anchor="middle" font-size="12.5" fill="#7d8590">Gateway owns the endpoint</text><text x="564" y="179" text-anchor="middle" font-size="12.5" fill="#7d8590">contract. Lambda owns the logic.</text><text x="564" y="198" text-anchor="middle" font-size="12.5" fill="#7d8590">AppConfig owns the model choice.</text><text x="564" y="248" text-anchor="middle" font-size="12.5" fill="#7d8590">Wins for auth, throttling, and</text><text x="564" y="267" text-anchor="middle" font-size="12.5" fill="#7d8590">model switching without</text><text x="564" y="286" text-anchor="middle" font-size="12.5" fill="#7d8590">redeploys.</text><text x="380" y="352" text-anchor="middle" font-size="13" fill="#7d8590">The lab builds the front end because production needs the contract, not just the call.</text></svg>