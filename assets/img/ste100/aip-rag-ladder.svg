<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 575" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="The ladder from prompt engineering up to training from scratch, with cost and effort rising; stop at RAG when documents change or citations are required">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The ladder: climb only until the requirement is met</text>
<rect x="330" y="70" width="490" height="74" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Prompt engineering</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">cheapest, fastest</text>
<rect x="330" y="162" width="490" height="74" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="188" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">RAG + Knowledge Base</text>
<text x="575" y="210" text-anchor="middle" font-size="13" fill="#555555">fresh docs + citations</text>
<rect x="330" y="254" width="490" height="74" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="280" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Agents</text>
<text x="575" y="302" text-anchor="middle" font-size="13" fill="#555555">tools and workflows</text>
<rect x="330" y="346" width="490" height="74" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="372" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Fine-tuning</text>
<text x="575" y="394" text-anchor="middle" font-size="13" fill="#555555">behavior change, stable data</text>
<rect x="330" y="438" width="490" height="74" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="575" y="464" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Train from scratch</text>
<text x="575" y="486" text-anchor="middle" font-size="13" fill="#555555">almost never on this exam</text>
<text x="575" y="545" text-anchor="middle" font-size="13" fill="#555555">Fresh documents or required citations: stop at RAG. That is master trap 7.</text>
<text x="240" y="300" text-anchor="middle" font-size="14" fill="#555555" transform="rotate(-90 240 300)">cost and effort rise</text>
<path d="M240,470 L240,120" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
