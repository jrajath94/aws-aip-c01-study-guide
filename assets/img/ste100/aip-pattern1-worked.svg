<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 330" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Worked constraint extraction: three constraints from the stem eliminate three options and leave the RAG survivor">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 1, worked: extract constraints, then eliminate</text>
<rect x="60" y="70" width="1030" height="100" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Stem: chatbot over 2,000-page policy, changes quarterly, answers must cite sections</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">constraint 1: private documents that change</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">constraint 2: every answer must cite its source</text>
<text x="575" y="162" text-anchor="middle" font-size="13" fill="#555555">constraint 3: 2,000 pages, too big for a prompt</text>
<path d="M575,170 L575,190" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="190" width="250" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="185" y="216" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">A) Fine-tune quarterly</text>
<text x="185" y="238" text-anchor="middle" font-size="13" fill="#555555">violates 1 and 2: retraining</text>
<rect x="325" y="190" width="250" height="110" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="450" y="216" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">B) RAG Knowledge Base</text>
<text x="450" y="238" text-anchor="middle" font-size="13" fill="#555555">satisfies 1, 2, 3: survivor</text>
<rect x="590" y="190" width="250" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="715" y="216" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">C) Long system prompt</text>
<text x="715" y="238" text-anchor="middle" font-size="13" fill="#555555">violates 3: will not fit</text>
<rect x="855" y="190" width="250" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="980" y="216" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">D) Train from scratch</text>
<text x="980" y="238" text-anchor="middle" font-size="13" fill="#555555">violates 1: months of work</text>
</svg>
