<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Agent Squad routing: a classifier picks one specialist agent per request; adding a specialty means registering one more agent"><rect x="0" y="0" width="760" height="490" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Agent Squad: the classifier picks one specialist</text><text x="24" y="58" font-size="13" fill="#7d8590">One entry point, many specialists. History persists per user and session.</text><rect x="180" y="80" width="400" height="90" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="380" y="114" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Classifier (entry point)</text><text x="380" y="140" text-anchor="middle" font-size="12.5" fill="#7d8590">reads the request, picks one specialist</text><line x1="280" y1="170" x2="220" y2="205" stroke="#7d8590" stroke-width="2.2"/><polygon points="220,205 211.7,210.6 211.7,199.4" fill="#7d8590"/><line x1="380" y1="170" x2="380" y2="205" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,205 371.7,210.6 371.7,199.4" fill="#7d8590"/><line x1="480" y1="170" x2="540" y2="205" stroke="#7d8590" stroke-width="2.2"/><polygon points="540,205 531.7,210.6 531.7,199.4" fill="#7d8590"/><rect x="60" y="205" width="200" height="130" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="160" y="240" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Billing agent</text><text x="160" y="268" text-anchor="middle" font-size="12" fill="#7d8590">invoices, refunds, its</text><text x="160" y="287" text-anchor="middle" font-size="12" fill="#7d8590">own tools</text><rect x="280" y="205" width="200" height="130" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="380" y="240" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Support agent</text><text x="380" y="268" text-anchor="middle" font-size="12" fill="#7d8590">tickets, KB lookup, its</text><text x="380" y="287" text-anchor="middle" font-size="12" fill="#7d8590">own tools</text><rect x="500" y="205" width="200" height="130" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="600" y="240" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">General agent</text><text x="600" y="268" text-anchor="middle" font-size="12" fill="#7d8590">catch-all, plain Bedrock</text><text x="600" y="287" text-anchor="middle" font-size="12" fill="#7d8590">model</text><rect x="60" y="360" width="640" height="100" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="380" y="392" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Adding a fourth specialty: register one more agent.</text><text x="380" y="418" text-anchor="middle" font-size="13" fill="#7d8590">No router rewrite. Specialists beat generalists as scope grows.</text></svg>