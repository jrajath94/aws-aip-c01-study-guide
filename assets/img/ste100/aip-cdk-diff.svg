<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="CDK deployment flow: write constructs, synth to a CloudFormation template, review the diff, then deploy"><rect x="0" y="0" width="760" height="400" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">CDK to deployed stack: write, synth, diff, deploy</text><text x="24" y="58" font-size="13" fill="#7d8590">Synth turns code into a template. Diff is the review gate.</text><rect x="24" y="90" width="160" height="160" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="104" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">1. Write</text><text x="104" y="154" text-anchor="middle" font-size="12" fill="#7d8590">TS/Python CDK code</text><text x="104" y="182" text-anchor="middle" font-size="12" fill="#7d8590">constructs compose</text><text x="104" y="201" text-anchor="middle" font-size="12" fill="#7d8590">the stack</text><line x1="184" y1="170" x2="214" y2="170" stroke="#7d8590" stroke-width="2.2"/><polygon points="214,170 205.7,175.6 205.7,164.4" fill="#7d8590"/><rect x="214" y="90" width="160" height="160" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="294" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">2. Synth</text><text x="294" y="154" text-anchor="middle" font-size="12" fill="#7d8590">cdk synth</text><text x="294" y="182" text-anchor="middle" font-size="12" fill="#7d8590">code becomes a</text><text x="294" y="201" text-anchor="middle" font-size="12" fill="#7d8590">CloudFormation</text><text x="294" y="220" text-anchor="middle" font-size="12" fill="#7d8590">template</text><line x1="374" y1="170" x2="404" y2="170" stroke="#7d8590" stroke-width="2.2"/><polygon points="404,170 395.7,175.6 395.7,164.4" fill="#7d8590"/><rect x="404" y="90" width="160" height="160" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="484" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">3. Diff</text><text x="484" y="154" text-anchor="middle" font-size="12" fill="#7d8590">cdk diff</text><text x="484" y="182" text-anchor="middle" font-size="12" fill="#7d8590">REVIEW the changes</text><text x="484" y="201" text-anchor="middle" font-size="12" fill="#7d8590">before deploying</text><line x1="564" y1="170" x2="594" y2="170" stroke="#7d8590" stroke-width="2.2"/><polygon points="594,170 585.7,175.6 585.7,164.4" fill="#7d8590"/><rect x="594" y="90" width="160" height="160" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="674" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">4. Deploy</text><text x="674" y="154" text-anchor="middle" font-size="12" fill="#7d8590">cdk deploy</text><text x="674" y="182" text-anchor="middle" font-size="12" fill="#7d8590">CloudFormation</text><text x="674" y="201" text-anchor="middle" font-size="12" fill="#7d8590">applies the template</text><rect x="24" y="280" width="712" height="90" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="380" y="312" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Never skip the diff.</text><text x="380" y="338" text-anchor="middle" font-size="13" fill="#7d8590">The diff is the last chance to catch a destructive change before it deploys.</text></svg>