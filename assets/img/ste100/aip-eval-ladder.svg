<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1035 492" role="img" aria-label="Evaluation ladder: automatic evaluation first, then LLM as a judge, then human evaluation on samples only"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="1035" height="492" fill="#0a0a0a"/><text x="517.5" y="36" text-anchor="middle" font-size="20" font-weight="bold">The eval ladder: climb in cost order</text><text x="517.5" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Compare models cheaply at scale first. Humans judge flagged samples only.</text><rect x="40" y="120" width="290" height="240" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="185" y="158" text-anchor="middle" font-size="13" fill="#5a8f5a" font-weight="bold">Step 1</text><text x="185" y="186" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Automatic evaluation</text><text x="185" y="218" text-anchor="middle" font-size="12.5" fill="#a8a8a8">programmatic, deterministic</text><text x="185" y="256" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Needs labeled ground truth.</text><text x="185" y="300" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Cheapest: 1,000 prompts for a</text><text x="185" y="319" text-anchor="middle" font-size="12.5" fill="#a8a8a8">few dollars, in minutes.</text><path d="M330,240 L365,240" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="365" y="120" width="290" height="240" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="510" y="158" text-anchor="middle" font-size="13" fill="#d99a06" font-weight="bold">Step 2</text><text x="510" y="186" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">LLM-as-a-judge</text><text x="510" y="218" text-anchor="middle" font-size="12.5" fill="#a8a8a8">a separate model scores</text><text x="510" y="237" text-anchor="middle" font-size="12.5" fill="#a8a8a8">outputs</text><text x="510" y="256" text-anchor="middle" font-size="12.5" fill="#a8a8a8">No labels needed.</text><text x="510" y="300" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Scores correctness,</text><text x="510" y="319" text-anchor="middle" font-size="12.5" fill="#a8a8a8">faithfulness, style, and more.</text><path d="M655,240 L690,240" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="690" y="120" width="290" height="240" rx="8" fill="#141414" stroke="#c0554d" stroke-width="1.5"/><text x="835" y="158" text-anchor="middle" font-size="13" fill="#c0554d" font-weight="bold">Step 3</text><text x="835" y="186" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Human evaluation</text><text x="835" y="218" text-anchor="middle" font-size="12.5" fill="#a8a8a8">subjective judgment</text><text x="835" y="256" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Samples only. Never</text><text x="835" y="275" text-anchor="middle" font-size="12.5" fill="#a8a8a8">everything.</text><text x="835" y="300" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Last resort. Never under a</text><text x="835" y="319" text-anchor="middle" font-size="12.5" fill="#a8a8a8">budget on everything.</text><rect x="60" y="392" width="915" height="70" rx="8" fill="#141414" stroke="#8a8a8a" stroke-width="1.5"/><text x="517" y="420" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">RAG gets its own split: retrieval relevance + generation faithfulness.</text><text x="517" y="444" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Together they are the hallucination proof. A bigger model is not proof.</text></svg>