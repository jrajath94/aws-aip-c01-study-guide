<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 500" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Prompt lifecycle in operations: versions, variants, ARN deploys">
<title>Prompt lifecycle in operations: versions, variants, ARN deploys</title>
<desc>A pipeline left to right. Author the prompt with {{variable}} placeholders. Publish immutable versions: edit a draft, then publish; rollback means pointing at an older version. Create variants for A/B testing, such as formal versus friendly tone. Deploy by version ARN: the app calls the prompt by name and version. Monitor quality and iterate. A bottom note says there is no extra charge: you pay only for the model tokens the prompt consumes.</desc>
<defs><marker id="aip-plops-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="500" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">PROMPTS ARE CODE: VERSION, VARIANT, DEPLOY BY ARN</text>
<rect x="30" y="70" width="158" height="140" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="109.0" y="102" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">author</text>
<text x="109.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">{{variable}} placeholders</text>
<text x="109.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">draft freely</text>
<line x1="188" y1="140" x2="202" y2="140" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-plops-ah)"/>
<rect x="202" y="70" width="158" height="140" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="281.0" y="102" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">publish version</text>
<text x="281.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">immutable snapshot</text>
<text x="281.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">rollback = point older</text>
<line x1="360" y1="140" x2="374" y2="140" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-plops-ah)"/>
<rect x="374" y="70" width="158" height="140" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="453.0" y="102" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">variants</text>
<text x="453.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">formal vs friendly</text>
<text x="453.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">A/B test</text>
<line x1="532" y1="140" x2="546" y2="140" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-plops-ah)"/>
<rect x="546" y="70" width="158" height="140" rx="8" fill="#efeafd" stroke="#6a4fd6" stroke-width="1.5"/>
<text x="625.0" y="102" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">deploy by ARN</text>
<text x="625.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">app calls name + version</text>
<text x="625.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">no wording in code</text>
<line x1="704" y1="140" x2="718" y2="140" stroke="#6a4fd6" stroke-width="1.8" marker-end="url(#aip-plops-ah)"/>
<rect x="718" y="70" width="158" height="140" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="797.0" y="102" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">monitor, iterate</text>
<text x="797.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">track quality</text>
<text x="797.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">edit, republish</text>
<text x="30" y="252" font-size="13" fill="#111111" font-weight="bold">Who edits what:</text>
<text x="30" y="276" font-size="12.5" fill="#555555">Non-engineers edit prompts in the console. Engineers call them by name and version ARN.</text>
<text x="30" y="300" font-size="12.5" fill="#555555">Marketing can change tone weekly without an engineering deploy. Fifteen prompts across five features stop being fifteen redeploys.</text>
<text x="30" y="340" font-size="12.5" fill="#555555">Prompt Flows chains these prompts visually: nodes for prompts, agents, knowledge bases, Lambda functions, and conditions.</text>
<text x="30" y="380" font-size="13" fill="#111111">No extra charge anywhere: you pay only for the model tokens the prompt generates.</text>
</svg>