<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 390" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Mock to exam mapping: 75 questions in 180 minutes, real exam scaled 100 to 1000 with pass at 750, book when you score 80 percent timed">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">How the 75-question mock maps to the real exam</text>
<rect x="60" y="70" width="320" height="140" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="220" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">The mock</text>
<text x="220" y="118" text-anchor="middle" font-size="13" fill="#555555">75 questions</text>
<text x="220" y="140" text-anchor="middle" font-size="13" fill="#555555">180 minutes</text>
<text x="220" y="162" text-anchor="middle" font-size="13" fill="#555555">5 domains at real weights</text>
<rect x="415" y="70" width="320" height="140" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">The real exam</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">scaled scoring 100 to 1000</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">pass at 750</text>
<text x="575" y="162" text-anchor="middle" font-size="13" fill="#555555">compensatory: a strong domain</text>
<text x="575" y="184" text-anchor="middle" font-size="13" fill="#555555">can offset a weak one</text>
<rect x="770" y="70" width="320" height="140" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="930" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Your readiness rule</text>
<text x="930" y="118" text-anchor="middle" font-size="13" fill="#555555">80% or more (60 of 75)</text>
<text x="930" y="140" text-anchor="middle" font-size="13" fill="#555555">under timed conditions</text>
<text x="930" y="162" text-anchor="middle" font-size="13" fill="#555555">then book the exam</text>
<path d="M380,140 L413,140" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M735,140 L768,140" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="255" y="250" width="640" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="575" y="276" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Below 70%: revisit and re-attempt</text>
<text x="575" y="298" text-anchor="middle" font-size="13" fill="#555555">find the domains you missed most</text>
<text x="575" y="320" text-anchor="middle" font-size="13" fill="#555555">re-attempt their bank questions</text>
<text x="575" y="342" text-anchor="middle" font-size="13" fill="#555555">then take the mock again</text>
<path d="M575,210 L575,248" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
