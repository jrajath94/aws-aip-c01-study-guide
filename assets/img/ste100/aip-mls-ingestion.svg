<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Ingestion picker: DataSync and DMS for batches, Kinesis Data Streams and Firehose for streams, all landing in S3">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">INGESTION: BATCH VS STREAMING</text>

<rect x="60" y="60" width="290" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="205.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">BATCH</text>
<text x="205.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">files, DB dumps</text>

<text x="205" y="205" font-size="12" text-anchor="middle">DataSync (files)</text>
<text x="205" y="228" font-size="12" text-anchor="middle">DMS (databases)</text>
<rect x="370" y="60" width="290" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="515.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">STREAMING</text>
<text x="515.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">live events</text>

<text x="515" y="205" font-size="12" text-anchor="middle">Kinesis Data Streams</text>
<text x="515" y="228" font-size="12" text-anchor="middle">Firehose to S3, no code</text>
<line x1="205" y1="170" x2="205" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="515" y1="170" x2="515" y2="195" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="215" y="260" width="290" height="64" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="297.0" font-size="13" text-anchor="middle" font-weight="700">S3: raw lands here</text>

<text x="360" y="358" font-size="11.5" fill="#555555" text-anchor="middle">The deciding word: "files" = DataSync, "database" = DMS, "stream" = Kinesis</text>
</svg>