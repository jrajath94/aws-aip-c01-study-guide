<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1035 454" role="img" aria-label="Study plan: ten minutes on facts and traps, one hour on decision rules, one day drilling rapid-fire questions"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="1035" height="454" fill="#0a0a0a"/><text x="517.5" y="36" text-anchor="middle" font-size="20" font-weight="bold">How to use this volume: 10 minutes, 1 hour, 1 day</text><text x="517.5" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Read straight through once, then drill what you miss.</text><rect x="40" y="110" width="290" height="200" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="185" y="152" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">10 minutes</text><text x="185" y="196" text-anchor="middle" font-size="13" fill="#a8a8a8">Read the exam facts, the</text><text x="185" y="215" text-anchor="middle" font-size="13" fill="#a8a8a8">numbers sheet, and the top 50</text><text x="185" y="234" text-anchor="middle" font-size="13" fill="#a8a8a8">traps.</text><path d="M330,210 L365,210" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="365" y="110" width="290" height="200" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="510" y="152" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">1 hour</text><text x="510" y="196" text-anchor="middle" font-size="13" fill="#a8a8a8">Add the per-domain decision</text><text x="510" y="215" text-anchor="middle" font-size="13" fill="#a8a8a8">rules: the "if X, pick Y"</text><text x="510" y="234" text-anchor="middle" font-size="13" fill="#a8a8a8">lines.</text><path d="M655,210 L690,210" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="690" y="110" width="290" height="200" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="835" y="152" text-anchor="middle" font-size="17" fill="#ececec" font-weight="bold">1 day</text><text x="835" y="196" text-anchor="middle" font-size="13" fill="#a8a8a8">Drill all 58 rapid-fire</text><text x="835" y="215" text-anchor="middle" font-size="13" fill="#a8a8a8">questions. Re-read the rule</text><text x="835" y="234" text-anchor="middle" font-size="13" fill="#a8a8a8">behind every miss.</text><rect x="60" y="342" width="915" height="80" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="517" y="376" text-anchor="middle" font-size="15.5" fill="#ececec" font-weight="bold">Missed five or fewer total? Schedule the exam.</text><text x="517" y="402" text-anchor="middle" font-size="13" fill="#a8a8a8">Cold recall on every rapid-fire question means exam-ready.</text></svg>