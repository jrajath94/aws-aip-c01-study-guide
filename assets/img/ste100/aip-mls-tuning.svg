<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Hyperparameter search strategies: grid is exhaustive, random is cheap, Bayesian learns as it goes and is the SageMaker default; early stopping and warm start keep the bill low">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="330" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">TUNING: THREE SEARCH STRATEGIES</text>

<rect x="60" y="60" width="190" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="155.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">GRID</text>
<text x="155.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">exhaustive</text>

<text x="155" y="205" font-size="11.5" fill="#555555" text-anchor="middle">tries everything</text>
<rect x="265" y="60" width="190" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">RANDOM</text>
<text x="360.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">cheap</text>

<text x="360" y="205" font-size="11.5" fill="#555555" text-anchor="middle">often just as good</text>
<rect x="470" y="60" width="190" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="565.0" y="113.0" font-size="14" text-anchor="middle" font-weight="700">BAYESIAN</text>
<text x="565.0" y="131.0" font-size="11" fill="#555555" text-anchor="middle">SageMaker default</text>

<text x="565" y="205" font-size="11.5" fill="#555555" text-anchor="middle">learns from past trials</text>
<text x="360" y="255" font-size="12" text-anchor="middle" font-weight="700">Two bill-savers</text>
<text x="360" y="282" font-size="11.5" fill="#555555" text-anchor="middle">Early stopping kills losing trials. Warm start reuses a previous tuning job.</text>
<text x="360" y="307" font-size="11.5" fill="#555555" text-anchor="middle">Tune on validation metrics, never on the test set.</text>
</svg>