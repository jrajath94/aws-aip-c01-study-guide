<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 600" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Knowledge Base sync lifecycle: from documents to answers">
<title>Knowledge Base sync lifecycle: from documents to answers</title>
<desc>A pipeline left to right in two rows. Row 1: data sources, S3 buckets, web crawler, Confluence, SharePoint, Salesforce, flow into sync, with sync config of one-time, scheduled, or on demand. Row 2: chunk, then embed, then store vectors in the chosen vector store. A side note says sync picks up new, changed, and deleted documents automatically. Row 3: at query time, call Retrieve for chunks, or RetrieveAndGenerate for chunks plus a model answer with citations, through bedrock-agent-runtime. The service can also ground a Bedrock Agent.</desc>
<defs><marker id="aip-kbsync-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">KNOWLEDGE BASES: DOCUMENTS IN, GROUNDED ANSWERS OUT</text>
<rect x="30" y="70" width="280" height="110" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="170.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Data sources</text>
<text x="170.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">S3, web crawler, Confluence</text>
<text x="170.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">SharePoint, Salesforce</text>
<rect x="330" y="70" width="280" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Sync</text>
<text x="470.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">one-time, scheduled, on-demand</text>
<text x="470.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">picks up new, changed, deleted docs</text>
<rect x="630" y="70" width="280" height="110" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="770.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Chunk + embed</text>
<text x="770.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">chapter 10 chunking</text>
<text x="770.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">chapter 11 embeddings</text>
<line x1="310" y1="125" x2="330" y2="125" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-kbsync-ah)"/>
<line x1="610" y1="125" x2="630" y2="125" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-kbsync-ah)"/>
<rect x="180" y="230" width="580" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="470.0" y="262" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Vector store (chapter 12)</text>
<text x="470.0" y="284" text-anchor="middle" font-size="12.5" fill="#555555">OpenSearch Serverless, Aurora pgvector, Neptune, S3 Vectors</text>
<text x="470.0" y="303" text-anchor="middle" font-size="12.5" fill="#555555">the managed index behind every query</text>
<line x1="470" y1="180" x2="470" y2="230" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-kbsync-ah)"/>
<rect x="30" y="370" width="420" height="110" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="240.0" y="402" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Retrieve</text>
<text x="240.0" y="424" text-anchor="middle" font-size="12.5" fill="#555555">get the relevant chunks</text>
<text x="240.0" y="443" text-anchor="middle" font-size="12.5" fill="#555555">you build the prompt</text>
<rect x="490" y="370" width="420" height="110" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="700.0" y="402" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">RetrieveAndGenerate</text>
<text x="700.0" y="424" text-anchor="middle" font-size="12.5" fill="#555555">chunks + model answer + citations</text>
<text x="700.0" y="443" text-anchor="middle" font-size="12.5" fill="#555555">the default for private-docs Q and A</text>
<line x1="470" y1="320" x2="200" y2="370" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-kbsync-ah)"/>
<line x1="470" y1="320" x2="700" y2="370" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-kbsync-ah)"/>
<text x="30" y="375" font-size="1" fill="#555555"></text>
<text x="30" y="512" font-size="13" fill="#111111" font-weight="bold">Exam default: any private documents plus citations scenario picks Knowledge Bases.</text>
<text x="30" y="534" font-size="12" fill="#555555">Hand-rolled RAG is a distractor unless the scenario needs what the managed service cannot do, like a custom retrieval algorithm.</text>
<text x="30" y="556" font-size="12" fill="#555555">Attach the same knowledge base to a Bedrock Agent to ground the agent too.</text>
</svg>