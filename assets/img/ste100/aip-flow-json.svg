<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 420" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Bedrock Flows JSON: prompt, Lambda, knowledge base, and condition nodes wired in a fixed sequence"><rect x="0" y="0" width="824" height="420" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Bedrock Flows from JSON: four node types, fixed wiring</text><text x="24" y="58" font-size="13" fill="#7d8590">Prompt, Lambda, knowledge base, condition. Same steps every time.</text><rect x="24" y="90" width="160" height="170" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="104" y="128" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Prompt node</text><text x="104" y="152" text-anchor="middle" font-size="12" fill="#60a5fa">model call</text><text x="104" y="182" text-anchor="middle" font-size="12" fill="#7d8590">system + user prompt</text><text x="104" y="201" text-anchor="middle" font-size="12" fill="#7d8590">in, text out</text><line x1="184" y1="175" x2="220" y2="175" stroke="#7d8590" stroke-width="2.2"/><polygon points="220,175 211.7,180.6 211.7,169.4" fill="#7d8590"/><rect x="220" y="90" width="160" height="170" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="300" y="128" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Lambda node</text><text x="300" y="152" text-anchor="middle" font-size="12" fill="#22d3ee">code step</text><text x="300" y="182" text-anchor="middle" font-size="12" fill="#7d8590">deterministic logic:</text><text x="300" y="201" text-anchor="middle" font-size="12" fill="#7d8590">parse, validate,</text><text x="300" y="220" text-anchor="middle" font-size="12" fill="#7d8590">format</text><line x1="380" y1="175" x2="416" y2="175" stroke="#7d8590" stroke-width="2.2"/><polygon points="416,175 407.7,180.6 407.7,169.4" fill="#7d8590"/><rect x="416" y="90" width="160" height="170" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="496" y="128" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Knowledge base node</text><text x="496" y="152" text-anchor="middle" font-size="12" fill="#d99a06">retrieval</text><text x="496" y="182" text-anchor="middle" font-size="12" fill="#7d8590">Retrieve: nearest</text><text x="496" y="201" text-anchor="middle" font-size="12" fill="#7d8590">chunks for the query</text><line x1="576" y1="175" x2="612" y2="175" stroke="#7d8590" stroke-width="2.2"/><polygon points="612,175 603.7,180.6 603.7,169.4" fill="#7d8590"/><rect x="612" y="90" width="160" height="170" rx="8" fill="#101318" stroke="#c07a5a" stroke-width="1.6"/><text x="692" y="128" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Condition node</text><text x="692" y="152" text-anchor="middle" font-size="12" fill="#c07a5a">branch</text><text x="692" y="182" text-anchor="middle" font-size="12" fill="#7d8590">an expression picks</text><text x="692" y="201" text-anchor="middle" font-size="12" fill="#7d8590">the next node</text><rect x="24" y="290" width="712" height="100" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="322" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Nodes are wired in JSON: each node names its inputs and its next node.</text><text x="380" y="350" text-anchor="middle" font-size="13" fill="#7d8590">The flow runs the same steps every time. No model decides the order.</text></svg>