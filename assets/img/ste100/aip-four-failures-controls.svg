<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 504" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Four failures and the guardrail control that stops each one">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The four failures, and the control that answers each one</text>
<rect x="60" y="60" width="400" height="84" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="260" y="94" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Hallucination</text><text x="260" y="120" text-anchor="middle" font-size="13" fill="#111111">confident but false text</text><line x1="460" y1="102" x2="540" y2="102" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="60" width="400" height="84" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="740" y="107" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Contextual grounding checks</text><rect x="60" y="160" width="400" height="84" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="260" y="194" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Injection / jailbreak</text><text x="260" y="220" text-anchor="middle" font-size="13" fill="#111111">user text overrides rules</text><line x1="460" y1="202" x2="540" y2="202" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="160" width="400" height="84" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="740" y="207" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Prompt attack filter</text><rect x="60" y="260" width="400" height="84" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="260" y="294" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">PII leak</text><text x="260" y="320" text-anchor="middle" font-size="13" fill="#111111">SSN, card numbers in output</text><line x1="460" y1="302" x2="540" y2="302" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="260" width="400" height="84" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="740" y="307" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Sensitive information filters</text><rect x="60" y="360" width="400" height="84" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="260" y="394" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Harmful content</text><text x="260" y="420" text-anchor="middle" font-size="13" fill="#111111">hate, violence, misconduct</text><line x1="460" y1="402" x2="540" y2="402" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="540" y="360" width="400" height="84" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="740" y="407" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Content filters + denied topics</text><text x="500" y="480" text-anchor="middle" font-size="13" fill="#555555">One Guardrail object holds all four controls. Turn each on separately.</text></svg>
