<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="PII redaction flow: Comprehend detects PII entities in text, the pipeline redacts or masks them, Guardrails filter at the model boundary"><rect x="0" y="0" width="760" height="480" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The PII redaction flow: detect, redact, then store</text><text x="24" y="58" font-size="13" fill="#7d8590">Comprehend finds it. Masking removes it. Guardrails double-check at inference.</text><rect x="24" y="90" width="200" height="150" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="124" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">User text</text><text x="124" y="158" text-anchor="middle" font-size="12" fill="#7d8590">chat message,</text><text x="124" y="177" text-anchor="middle" font-size="12" fill="#7d8590">document, ticket</text><line x1="224" y1="165" x2="258" y2="165" stroke="#7d8590" stroke-width="2.2"/><polygon points="258,165 249.7,170.6 249.7,159.4" fill="#7d8590"/><rect x="258" y="90" width="220" height="150" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="368" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Comprehend</text><text x="368" y="158" text-anchor="middle" font-size="12" fill="#7d8590">detects PII entities:</text><text x="368" y="177" text-anchor="middle" font-size="12" fill="#7d8590">names, SSNs, account</text><text x="368" y="196" text-anchor="middle" font-size="12" fill="#7d8590">numbers</text><line x1="478" y1="165" x2="512" y2="165" stroke="#7d8590" stroke-width="2.2"/><polygon points="512,165 503.7,170.6 503.7,159.4" fill="#7d8590"/><rect x="512" y="90" width="224" height="150" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="624" y="128" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Redact or mask</text><text x="624" y="158" text-anchor="middle" font-size="12" fill="#7d8590">replace with [REDACTED]</text><text x="624" y="177" text-anchor="middle" font-size="12" fill="#7d8590">or token placeholders</text><line x1="380" y1="240" x2="380" y2="274" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,274 371.7,279.6 371.7,268.4" fill="#7d8590"/><rect x="180" y="274" width="400" height="130" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="380" y="306" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Store or send the clean text</text><text x="380" y="334" text-anchor="middle" font-size="12" fill="#7d8590">Guardrails sensitive-information filters</text><text x="380" y="353" text-anchor="middle" font-size="12" fill="#7d8590">stand at the model boundary as the last</text><text x="380" y="372" text-anchor="middle" font-size="12" fill="#7d8590">check.</text><text x="380" y="446" text-anchor="middle" font-size="13" fill="#7d8590">Redact before storage, not after the breach. Detection is Comprehend; enforcement is Guardrails.</text></svg>