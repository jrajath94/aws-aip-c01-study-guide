<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 310" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Four wrong-plane distractors: guardrails for extraction, knowledge base for APIs, CloudFormation for runtime config, encryption for isolation">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 6: real services doing the wrong job</text>
<rect x="40" y="80" width="255" height="150" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="167" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Guardrails offered</text>
<text x="167" y="128" text-anchor="middle" font-size="12" fill="#555555">for text extraction</text>
<text x="167" y="150" text-anchor="middle" font-size="12" fill="#555555"></text>
<text x="167" y="172" text-anchor="middle" font-size="12" fill="#555555">actually:</text>
<text x="167" y="194" text-anchor="middle" font-size="12" fill="#555555">filter content, not extract it</text>
<rect x="315" y="80" width="255" height="150" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="442" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Knowledge base offered</text>
<text x="442" y="128" text-anchor="middle" font-size="12" fill="#555555">for live API calls</text>
<text x="442" y="150" text-anchor="middle" font-size="12" fill="#555555"></text>
<text x="442" y="172" text-anchor="middle" font-size="12" fill="#555555">actually:</text>
<text x="442" y="194" text-anchor="middle" font-size="12" fill="#555555">serves documents, never calls APIs</text>
<rect x="590" y="80" width="255" height="150" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="717" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">CloudFormation offered</text>
<text x="717" y="128" text-anchor="middle" font-size="12" fill="#555555">for runtime config</text>
<text x="717" y="150" text-anchor="middle" font-size="12" fill="#555555"></text>
<text x="717" y="172" text-anchor="middle" font-size="12" fill="#555555">actually:</text>
<text x="717" y="194" text-anchor="middle" font-size="12" fill="#555555">a stack update is a deployment</text>
<rect x="865" y="80" width="255" height="150" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="992" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Encryption offered</text>
<text x="992" y="128" text-anchor="middle" font-size="12" fill="#555555">for network isolation</text>
<text x="992" y="150" text-anchor="middle" font-size="12" fill="#555555"></text>
<text x="992" y="172" text-anchor="middle" font-size="12" fill="#555555">actually:</text>
<text x="992" y="194" text-anchor="middle" font-size="12" fill="#555555">VPC endpoints isolate traffic</text>
<text x="575" y="280" text-anchor="middle" font-size="13" fill="#555555">Ask: is the service's actual job the job the stem needs? If not, eliminate it.</text>
</svg>
