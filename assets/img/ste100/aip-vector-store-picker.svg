<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 780" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Vector store picker: match the store to the scenario verb">
<title>Vector store picker: match the store to the scenario verb</title>
<desc>A decision flow. Start at the top diamond: already invested in an external store? Yes goes to Pinecone, MongoDB Atlas, or Redis via connectors. No continues: need relationships and multi-hop reasoning such as fraud rings? Yes goes to Neptune for GraphRAG. No continues: Postgres shop needing SQL plus similarity in one statement? Yes goes to Aurora with pgvector. No continues: prototype on a budget or small scale? Yes goes to S3 Vectors. Otherwise the default: OpenSearch Serverless, managed and AWS-native.</desc>
<defs><marker id="aip-vspick-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="780" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">WHICH VECTOR STORE? FOLLOW THE SCENARIO VERB</text>
<polygon points="430,55.0 660.0,105 430,155.0 200.0,105" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="430" y="110" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Invested in an external store?</text>
<rect x="700" y="160" width="220" height="100" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="810.0" y="192" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Pinecone / Mongo</text>
<text x="810.0" y="214" text-anchor="middle" font-size="12.5" fill="#555555">connect through connectors</text>
<text x="810.0" y="233" text-anchor="middle" font-size="12.5" fill="#555555">Redis too</text>
<line x1="660" y1="105" x2="700" y2="210" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-vspick-ah)"/>
<text x="680.0" y="149.5" text-anchor="middle" font-size="12" fill="#555555">YES</text>
<polygon points="430,235.0 660.0,285 430,335.0 200.0,285" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="430" y="290" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Relationships, multi-hop?</text>
<line x1="430" y1="155" x2="430" y2="235" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-vspick-ah)"/>
<text x="430.0" y="187.0" text-anchor="middle" font-size="12" fill="#555555">NO</text>
<text x="430" y="322" font-size="12" fill="#555555" text-anchor="middle">fraud rings, entity graphs</text>
<rect x="700" y="340" width="220" height="100" rx="8" fill="#efeafd" stroke="#6a4fd6" stroke-width="1.5"/>
<text x="810.0" y="372" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Neptune</text>
<text x="810.0" y="394" text-anchor="middle" font-size="12.5" fill="#555555">graph database</text>
<text x="810.0" y="413" text-anchor="middle" font-size="12.5" fill="#555555">powers GraphRAG</text>
<line x1="660" y1="285" x2="700" y2="390" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-vspick-ah)"/>
<text x="680.0" y="329.5" text-anchor="middle" font-size="12" fill="#555555">YES</text>
<polygon points="430,415.0 660.0,465 430,515.0 200.0,465" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="430" y="470" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Postgres shop?</text>
<line x1="430" y1="335" x2="430" y2="415" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-vspick-ah)"/>
<text x="430.0" y="367.0" text-anchor="middle" font-size="12" fill="#555555">NO</text>
<text x="430" y="502" font-size="12" fill="#555555" text-anchor="middle">SQL plus similarity in one statement</text>
<rect x="700" y="520" width="220" height="100" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="810.0" y="552" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Aurora pgvector</text>
<text x="810.0" y="574" text-anchor="middle" font-size="12.5" fill="#555555">tables and vectors</text>
<text x="810.0" y="593" text-anchor="middle" font-size="12.5" fill="#555555">in one database</text>
<line x1="660" y1="465" x2="700" y2="570" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-vspick-ah)"/>
<text x="680.0" y="509.5" text-anchor="middle" font-size="12" fill="#555555">YES</text>
<rect x="60" y="640" width="390" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="255.0" y="672" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Budget prototype / small scale</text>
<text x="255.0" y="694" text-anchor="middle" font-size="12.5" fill="#555555">S3 Vectors: low cost, S3-native</text>
<rect x="470" y="640" width="390" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="665.0" y="672" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Default</text>
<text x="665.0" y="694" text-anchor="middle" font-size="12.5" fill="#555555">OpenSearch Serverless: managed, scalable, AWS-native</text>
<text x="30" y="760" font-size="13" fill="#111111">Match the verb in the scenario to the branch. When none of the special cases apply, OpenSearch Serverless is the default.</text>
</svg>