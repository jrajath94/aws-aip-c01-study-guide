<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 488" role="img" aria-label="LoRA: frozen base model weights plus small trainable adapters per task, versioned in the SageMaker Model Registry"><style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="488" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">LORA: TRAIN THE DELTA, FREEZE THE BASE</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Low-Rank Adaptation trains small adapters instead of all weights.</text><rect x="24" y="90" width="700" height="90" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="374" y="122" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Base model weights: FROZEN</text><text x="374" y="148" text-anchor="middle" font-size="12.5" fill="#555555">Billions of parameters. Never retrained here.</text><path d="M200,180 L200,214" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><path d="M548,180 L548,214" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><rect x="24" y="214" width="330" height="130" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="189" y="248" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">LoRA adapter A</text><text x="189" y="276" text-anchor="middle" font-size="12" fill="#555555">Small trainable weight deltas</text><text x="189" y="294" text-anchor="middle" font-size="12" fill="#555555">for one task: support tone.</text><rect x="394" y="214" width="330" height="130" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="559" y="248" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">LoRA adapter B</text><text x="559" y="276" text-anchor="middle" font-size="12" fill="#555555">A different delta for a</text><text x="559" y="294" text-anchor="middle" font-size="12" fill="#555555">different task: classification.</text><rect x="24" y="364" width="700" height="90" rx="8" fill="#fdf3d8" stroke="#b07d10" stroke-width="1.5"/><text x="374" y="394" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">Versioned in the SageMaker Model Registry</text><text x="374" y="418" text-anchor="middle" font-size="12" fill="#555555">Swap adapters per task. Roll back by version. The base model never</text><text x="374" y="436" text-anchor="middle" font-size="12" fill="#555555">moves.</text></svg>