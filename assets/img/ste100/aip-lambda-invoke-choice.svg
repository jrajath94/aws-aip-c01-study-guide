<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 520" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Lambda invocation modes: sync, async, streaming">
<title>Lambda invocation modes: sync, async, streaming</title>
<desc>Three lanes. Synchronous RequestResponse: the caller waits for the result, for APIs where the user waits. Asynchronous Event: Lambda queues the event and returns immediately, for fire-and-forget work. Response streaming: tokens flow back as they are generated, for long answers a user reads live. A footer carries the ceiling: 15 minutes per Lambda. A pipeline that waits on humans or long chains belongs in Step Functions Standard, not in one Lambda.</desc>
<defs><marker id="aip-lambdachoice-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">LAMBDA: MATCH THE MODE TO THE WAIT PATTERN</text>
<rect x="60" y="70" width="820" height="100" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="470.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">SYNC (RequestResponse)</text>
<text x="470.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">caller waits for the result</text>
<text x="470.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">APIs where the user waits</text>
<rect x="60" y="188" width="820" height="100" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="220" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">ASYNC (Event)</text>
<text x="470.0" y="242" text-anchor="middle" font-size="12.5" fill="#555555">queued, returns immediately</text>
<text x="470.0" y="261" text-anchor="middle" font-size="12.5" fill="#555555">fire-and-forget work</text>
<rect x="60" y="306" width="820" height="100" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="470.0" y="338" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">RESPONSE STREAMING</text>
<text x="470.0" y="360" text-anchor="middle" font-size="12.5" fill="#555555">tokens flow back as generated</text>
<text x="470.0" y="379" text-anchor="middle" font-size="12.5" fill="#555555">long answers read live</text>
<rect x="60" y="430" width="820" height="60" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="470.0" y="462" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Ceiling: 15 minutes per Lambda</text>
<text x="470.0" y="484" text-anchor="middle" font-size="12.5" fill="#555555">human waits and long chains belong in Step Functions Standard</text>
</svg>