<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 340" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="LLM-as-judge scores answers against a fixed rubric">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">LLM-as-a-judge</text>
<rect x="40" y="130" width="260" height="100" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="170" y="172" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Candidate</text><text x="170" y="198" text-anchor="middle" font-size="13" fill="#111111">answer</text><line x1="300" y1="180" x2="350" y2="180" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="350" y="90" width="300" height="180" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="500" y="146" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Judge model</text><text x="500" y="172" text-anchor="middle" font-size="12" fill="#111111">rubric: 1-5</text><text x="500" y="198" text-anchor="middle" font-size="12" fill="#111111">criteria fixed</text><text x="500" y="224" text-anchor="middle" font-size="12" fill="#111111">blind to source</text><line x1="650" y1="180" x2="700" y2="180" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="700" y="130" width="260" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="830" y="172" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Score</text><text x="830" y="198" text-anchor="middle" font-size="13" fill="#111111">+ reason</text><text x="500" y="310" text-anchor="middle" font-size="13" fill="#555555">Watch judge bias: longer answers and first-listed answers score higher. Randomize order.</text></svg>
