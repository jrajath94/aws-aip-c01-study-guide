<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 440" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Agent loop: reason, act, observe, repeat until final answer">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="400" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Agent loop</text><rect x="280" y="96" width="240" height="88" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="400" y="130" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Reason</text><text x="400" y="156" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">FM decides next step</text><line x1="520" y1="140" x2="584" y2="140" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="552" y="132" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">plan</text><rect x="584" y="96" width="160" height="88" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="664" y="130" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Act</text><text x="664" y="156" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">call a tool</text><line x1="664" y1="184" x2="664" y2="224" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="664" y="196" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">run</text><rect x="584" y="224" width="160" height="88" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="664" y="258" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Observe</text><text x="664" y="284" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">tool result</text><line x1="584" y1="268" x2="520" y2="268" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="552" y="260" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">read</text><text x="400" y="380" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">The loop repeats until the agent reaches a final answer.</text><text x="400" y="408" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Session memory keeps context. Guardrails check every step.</text></svg>