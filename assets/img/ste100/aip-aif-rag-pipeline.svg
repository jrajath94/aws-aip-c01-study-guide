<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-label="The RAG pipeline: embed the question, similarity-search the vector store, retrieve top chunks, build an augmented prompt, generate a cited answer">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">RAG PIPELINE</text><rect x="24" y="56" width="124" height="96" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="86" y="92" font-size="11.5" fill="#222222" text-anchor="middle">embed the</text><text x="86" y="112" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">question</text><line x1="148" y1="104" x2="160" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="160" y="56" width="124" height="96" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="222" y="92" font-size="11.5" fill="#222222" text-anchor="middle">similarity-search</text><text x="222" y="112" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">the vector store</text><line x1="284" y1="104" x2="296" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="296" y="56" width="124" height="96" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="358" y="92" font-size="11.5" fill="#222222" text-anchor="middle">retrieve the</text><text x="358" y="112" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">top chunks</text><line x1="420" y1="104" x2="432" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="432" y="56" width="124" height="96" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="494" y="92" font-size="11.5" fill="#222222" text-anchor="middle">build an augmented</text><text x="494" y="112" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">prompt</text><line x1="556" y1="104" x2="568" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="568" y="56" width="124" height="96" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="630" y="92" font-size="11.5" fill="#222222" text-anchor="middle">generate a</text><text x="630" y="112" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="700">cited answer</text><text x="360" y="200" font-size="12" fill="#555555" text-anchor="middle">New knowledge without touching the weights. No retraining.</text></svg>