<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 310" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="RAG evaluation splits into retrieval quality and generation faithfulness">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">RAG evaluation: two halves</text>
<rect x="40" y="90" width="280" height="150" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="180" y="118" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">RETRIEVAL</text><text x="180" y="144" text-anchor="middle" font-size="12" fill="#111111">context precision:</text><text x="180" y="170" text-anchor="middle" font-size="12" fill="#111111">good chunks first?</text><text x="180" y="196" text-anchor="middle" font-size="12" fill="#111111">context recall:</text><text x="180" y="222" text-anchor="middle" font-size="12" fill="#111111">all facts found?</text><line x1="320" y1="165" x2="370" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="370" y="90" width="280" height="150" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="510" y="118" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">GENERATION</text><text x="510" y="144" text-anchor="middle" font-size="12" fill="#111111">faithfulness:</text><text x="510" y="170" text-anchor="middle" font-size="12" fill="#111111">claims in source?</text><text x="510" y="196" text-anchor="middle" font-size="12" fill="#111111">answer relevance:</text><text x="510" y="222" text-anchor="middle" font-size="12" fill="#111111">answers the ask?</text><line x1="650" y1="165" x2="700" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="700" y="120" width="260" height="90" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="830" y="157" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Fix the</text><text x="830" y="183" text-anchor="middle" font-size="13" fill="#111111">weak half</text><text x="500" y="280" text-anchor="middle" font-size="13" fill="#555555">Bad RAG answers come from bad retrieval more often than from a bad model. Test retrieval first.</text></svg>
