<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-label="Token pricing worked example: 2000 input tokens at 3 dollars per million plus 500 output tokens at 15 dollars per million equals 0.0135 dollars">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="290" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#b00020"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">TOKEN PRICING</text><rect x="24" y="56" width="330" height="120" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/><text x="189" y="88" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">INPUT</text><text x="189" y="112" font-size="13" fill="#222222" text-anchor="middle">2,000 tokens</text><text x="189" y="136" font-size="11.5" fill="#555555" text-anchor="middle">$3 per million</text><text x="189" y="160" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">cost = $0.006</text><rect x="366" y="56" width="330" height="120" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="531" y="88" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">OUTPUT</text><text x="531" y="112" font-size="13" fill="#222222" text-anchor="middle">500 tokens</text><text x="531" y="136" font-size="11.5" fill="#555555" text-anchor="middle">$15 per million</text><text x="531" y="160" font-size="12" fill="#222222" text-anchor="middle" font-weight="700">cost = $0.0075</text><rect x="24" y="200" width="672" height="60" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="360" y="224" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="700">total = $0.0135 per request</text><text x="360" y="248" font-size="11.5" fill="#555555" text-anchor="middle">the smaller output half costs MORE than the input half</text></svg>