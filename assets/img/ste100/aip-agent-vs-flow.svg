<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 500" role="img" aria-label="Agents versus Flows: dynamic step choice means Bedrock Agents, fixed sequence means Bedrock Flows"><style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="920" height="500" fill="#0a0a0a"/><text x="460.0" y="36" text-anchor="middle" font-size="20" font-weight="bold">Agents or Flows: one sentence decides</text><text x="460.0" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">The exam's decision line. Dynamic steps mean agents; fixed sequence means flows.</text><rect x="60" y="92" width="800" height="110" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="460" y="128" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Read the stem. Which line describes the steps?</text><text x="460" y="158" text-anchor="middle" font-size="13.5" fill="#a8a8a8">Dynamic step choice means agents. Fixed sequence means flows.</text><path d="M260,202 L180,250" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><path d="M660,202 L740,250" fill="none" stroke="#8a8a8a" stroke-width="2" marker-end="url(#ah)"/><rect x="60" y="250" width="360" height="210" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="240" y="284" text-anchor="middle" font-size="16" fill="#ececec" font-weight="bold">Bedrock Agents</text><text x="240" y="312" text-anchor="middle" font-size="13" fill="#a8a8a8">"reasons", "decides", "chooses tools"</text><text x="240" y="336" text-anchor="middle" font-size="13" fill="#a8a8a8">"multi-step tasks with tools"</text><text x="240" y="372" text-anchor="middle" font-size="13" fill="#a8a8a8">The model picks tools per order.</text><text x="240" y="400" text-anchor="middle" font-size="13" fill="#a8a8a8">Example: order assistant checks</text><text x="240" y="422" text-anchor="middle" font-size="13" fill="#a8a8a8">inventory, then shipping, then decides.</text><rect x="500" y="250" width="360" height="210" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="680" y="284" text-anchor="middle" font-size="16" fill="#ececec" font-weight="bold">Bedrock Flows</text><text x="680" y="312" text-anchor="middle" font-size="13" fill="#a8a8a8">"same steps every time"</text><text x="680" y="336" text-anchor="middle" font-size="13" fill="#a8a8a8">"fixed sequence", "analyst-built"</text><text x="680" y="372" text-anchor="middle" font-size="13" fill="#a8a8a8">Nodes run in a fixed order.</text><text x="680" y="400" text-anchor="middle" font-size="13" fill="#a8a8a8">Agents are overhead here: no</text><text x="680" y="422" text-anchor="middle" font-size="13" fill="#a8a8a8">decisions to make.</text></svg>