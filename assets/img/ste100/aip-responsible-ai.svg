<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 290" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Four responsible AI checks: fairness, transparency, safety, accountability">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Responsible AI: four checks</text>
<rect x="40" y="90" width="220" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="150" y="147" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Fairness</text><text x="150" y="173" text-anchor="middle" font-size="13" fill="#111111">test all groups</text><rect x="280" y="90" width="220" height="130" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="390" y="147" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Transparency</text><text x="390" y="173" text-anchor="middle" font-size="13" fill="#111111">model cards, docs</text><rect x="520" y="90" width="220" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="630" y="147" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Safety</text><text x="630" y="173" text-anchor="middle" font-size="13" fill="#111111">red-team the app</text><rect x="760" y="90" width="220" height="130" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="870" y="147" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Accountability</text><text x="870" y="173" text-anchor="middle" font-size="13" fill="#111111">human approves</text><text x="500" y="260" text-anchor="middle" font-size="13" fill="#555555">Responsible AI is four checks you run, not a paragraph you write.</text></svg>
