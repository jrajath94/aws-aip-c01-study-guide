<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 386" role="img" aria-label="SPICE import versus direct query: SPICE is fast but refreshes on a schedule, direct query is slower but fresh"><style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="386" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">SPICE IMPORT VERSUS DIRECT QUERY</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Speed versus freshness. The scenario names the winner.</text><rect x="24" y="80" width="340" height="230" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="194" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">SPICE import</text><text x="194" y="138" text-anchor="middle" font-size="12" fill="#555555">In-memory engine</text><text x="194" y="170" text-anchor="middle" font-size="12" fill="#555555">Import once, answer dashboard</text><text x="194" y="188" text-anchor="middle" font-size="12" fill="#555555">clicks from memory. Fast</text><text x="194" y="206" text-anchor="middle" font-size="12" fill="#555555">repeated queries.</text><text x="194" y="240" text-anchor="middle" font-size="12" fill="#555555">Refresh on a schedule: as</text><text x="194" y="258" text-anchor="middle" font-size="12" fill="#555555">frequent as every 15 minutes on</text><text x="194" y="276" text-anchor="middle" font-size="12" fill="#555555">Enterprise.</text><rect x="384" y="80" width="340" height="230" rx="8" fill="#e8eefc" stroke="#2b5cb8" stroke-width="1.5"/><text x="554" y="114" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Direct query</text><text x="554" y="138" text-anchor="middle" font-size="12" fill="#555555">Hit the source live</text><text x="554" y="170" text-anchor="middle" font-size="12" fill="#555555">Every dashboard click queries</text><text x="554" y="188" text-anchor="middle" font-size="12" fill="#555555">the source. Slower, but minutes</text><text x="554" y="206" text-anchor="middle" font-size="12" fill="#555555">fresh.</text><text x="554" y="240" text-anchor="middle" font-size="12" fill="#555555">"Near real-time dashboard" means</text><text x="554" y="258" text-anchor="middle" font-size="12" fill="#555555">direct query, not SPICE import.</text><text x="374" y="352" text-anchor="middle" font-size="12.5" fill="#555555">Stale refresh schedule is the classic bug: the dashboard looks confidently wrong.</text></svg>