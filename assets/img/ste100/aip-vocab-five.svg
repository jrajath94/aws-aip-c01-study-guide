<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 370" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Five precise terms: inference profile, prompt router, Provisioned Throughput, ApplyGuardrail, returnControl">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 4: five terms to know cold</text>
<rect x="40" y="70" width="340" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="210" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Inference profile</text>
<text x="210" y="118" text-anchor="middle" font-size="13" fill="#555555">availability across regions</text>
<rect x="410" y="70" width="340" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="580" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Prompt router</text>
<text x="580" y="118" text-anchor="middle" font-size="13" fill="#555555">cost by prompt complexity</text>
<rect x="780" y="70" width="340" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="950" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Provisioned Throughput</text>
<text x="950" y="118" text-anchor="middle" font-size="13" fill="#555555">reserved capacity, steady load</text>
<rect x="40" y="210" width="340" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="210" y="236" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">ApplyGuardrail</text>
<text x="210" y="258" text-anchor="middle" font-size="13" fill="#555555">the API that runs a guardrail</text>
<rect x="410" y="210" width="340" height="120" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="580" y="236" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">returnControl</text>
<text x="580" y="258" text-anchor="middle" font-size="13" fill="#555555">agent pauses for human approval</text>
</svg>
