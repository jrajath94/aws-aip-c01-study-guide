<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 360" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Scoring ruler: below 52 of 75 revisit domains, 52 to 60 is borderline, 60 or more means ready to book">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Scoring guide: where your mock score lands</text>
<rect x="100" y="90" width="950" height="46" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<rect x="765" y="90" width="95" height="46" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<rect x="860" y="90" width="190" height="46" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="100" y="165" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">0</text>
<text x="758" y="165" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">52 (70%)</text>
<text x="860" y="165" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">60 (80%)</text>
<text x="1050" y="165" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">75</text>
<text x="575" y="205" text-anchor="middle" font-size="13" fill="#555555">One point per question only if you picked every correct option and nothing else. No partial credit.</text>
<rect x="100" y="230" width="290" height="100" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="245" y="256" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Below 70% (under 52)</text>
<text x="245" y="278" text-anchor="middle" font-size="13" fill="#555555">revisit missed domains</text>
<text x="245" y="300" text-anchor="middle" font-size="13" fill="#555555">re-attempt bank questions</text>
<rect x="430" y="230" width="290" height="100" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="256" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">70 to 80%</text>
<text x="575" y="278" text-anchor="middle" font-size="13" fill="#555555">borderline: more timed</text>
<text x="575" y="300" text-anchor="middle" font-size="13" fill="#555555">practice before booking</text>
<rect x="760" y="230" width="290" height="100" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="905" y="256" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">80% or more (60+)</text>
<text x="905" y="278" text-anchor="middle" font-size="13" fill="#555555">ready: book the exam</text>
<text x="905" y="300" text-anchor="middle" font-size="13" fill="#555555">timed conditions met</text>
</svg>
