<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 480" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Evaluation ladder: programmatic metrics, LLM-as-a-judge, human evaluation">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="400" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Evaluation ladder</text><rect x="160" y="96" width="480" height="88" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="400" y="130" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Programmatic metrics</text><text x="400" y="156" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">exact match, fast, cheap</text><line x1="400" y1="184" x2="400" y2="216" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="400" y="192" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">climb</text><rect x="160" y="216" width="480" height="88" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="400" y="250" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">LLM-as-a-judge</text><text x="400" y="276" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">grades quality at scale</text><line x1="400" y1="304" x2="400" y2="336" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="400" y="312" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">climb</text><rect x="160" y="336" width="480" height="88" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="400" y="370" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Human evaluation</text><text x="400" y="396" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">subjective taste, samples</text><text x="400" y="464" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Climb only when the lower rung cannot measure it.</text></svg>