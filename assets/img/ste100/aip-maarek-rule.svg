<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 460" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Maarek rule of thumb tiebreakers in order: more managed, cheaper, simpler, AWS-native">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Maarek rule of thumb: when torn, prefer managed and simple</text>
<rect x="375" y="70" width="400" height="80" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Two options both work?</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">apply the tiebreakers in order</text>
<rect x="40" y="190" width="255" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="167" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. More managed?</text>
<text x="167" y="238" text-anchor="middle" font-size="13" fill="#555555">managed service beats custom build</text>
<path d="M575,150 L575,188" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M295,245 L313,245" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="315" y="190" width="255" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="442" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. Cheaper?</text>
<text x="442" y="238" text-anchor="middle" font-size="13" fill="#555555">cheaper wins at the same quality</text>
<path d="M575,150 L575,188" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M570,245 L588,245" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="590" y="190" width="255" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="717" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. Simpler?</text>
<text x="717" y="238" text-anchor="middle" font-size="13" fill="#555555">simpler architecture beats complex</text>
<path d="M575,150 L575,188" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M845,245 L863,245" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="865" y="190" width="255" height="110" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="992" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. AWS-native?</text>
<text x="992" y="238" text-anchor="middle" font-size="13" fill="#555555">AWS-native beats third-party</text>
<path d="M575,150 L575,188" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="325" y="340" width="500" height="112" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="366" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">The winner</text>
<text x="575" y="388" text-anchor="middle" font-size="13" fill="#555555">the option that survives every tiebreaker</text>
<text x="575" y="410" text-anchor="middle" font-size="13" fill="#555555">custom builds almost never win</text>
<text x="575" y="432" text-anchor="middle" font-size="13" fill="#555555">unless the stem demands something no managed service does</text>
<path d="M575,300 L575,338" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>
