<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 640" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="The holy trinity: agent, knowledge base, guardrails">
<title>The holy trinity: agent, knowledge base, guardrails</title>
<desc>A center box labeled the orchestrator, the agent. Three satellites. Left: the knowledge base gives retrieval-augmented generation, searching documents in a vector store such as OpenSearch Serverless, and the agent answers with citations. Right: action-group tools let the agent act, calling your APIs. Bottom: guardrails apply six controls on input AND output: content filters, denied topics, word filters, sensitive-information filters, contextual grounding checks, and automated reasoning checks. A footer states the failure each satellite prevents: tools without grounding hallucinate, grounding without safety leaks PII.</desc>
<defs><marker id="aip-trinity-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="640" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">THE HOLY TRINITY: ACTS, GROUNDS, STAYS SAFE</text>
<rect x="330" y="70" width="280" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">The orchestrator</text>
<text x="470.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">the Bedrock Agent</text>
<text x="470.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">plans, calls tools, answers</text>
<rect x="30" y="230" width="280" height="130" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="170.0" y="262" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Knowledge base</text>
<text x="170.0" y="284" text-anchor="middle" font-size="12.5" fill="#555555">retrieval over your documents</text>
<text x="170.0" y="303" text-anchor="middle" font-size="12.5" fill="#555555">answers carry citations</text>
<rect x="630" y="230" width="280" height="130" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="770.0" y="262" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Action groups</text>
<text x="770.0" y="284" text-anchor="middle" font-size="12.5" fill="#555555">tools the agent can call</text>
<text x="770.0" y="303" text-anchor="middle" font-size="12.5" fill="#555555">your APIs, with schemas</text>
<line x1="330" y1="125" x2="310" y2="265" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-trinity-ah)"/>
<line x1="610" y1="125" x2="630" y2="265" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-trinity-ah)"/>
<rect x="230" y="410" width="480" height="180" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="470.0" y="442" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Guardrails: input AND output</text>
<text x="470" y="470" font-size="12" fill="#555555" text-anchor="middle">content filters (toxicity)</text>
<text x="470" y="492" font-size="12" fill="#555555" text-anchor="middle">denied topics (plain-language bans)</text>
<text x="470" y="514" font-size="12" fill="#555555" text-anchor="middle">word filters (exact blocklists)</text>
<text x="470" y="536" font-size="12" fill="#555555" text-anchor="middle">sensitive-info filters (PII block or mask)</text>
<text x="470" y="558" font-size="12" fill="#555555" text-anchor="middle">contextual grounding + automated reasoning checks</text>
<line x1="470" y1="180" x2="470" y2="410" stroke="#555555" stroke-width="1.8" marker-end="url(#aip-trinity-ah)"/>
<text x="30" y="612" font-size="13" fill="#111111">Each satellite kills one failure: tools without grounding hallucinate facts. Grounding without safety leaks PII.</text>
</svg>