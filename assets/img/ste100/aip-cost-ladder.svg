<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 572" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Cost ladder from cutting tokens to provisioned throughput">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">The cost ladder: climb top-down</text>
<rect x="200" y="70" width="600" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="500" y="101" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Cut tokens — shorter prompts</text><rect x="200" y="136" width="600" height="52" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="500" y="167" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Prompt cache — reuse the prefix</text><rect x="200" y="202" width="600" height="52" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="500" y="233" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Semantic cache — answer repeats</text><rect x="200" y="268" width="600" height="52" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="500" y="299" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Right-size + cascade — small model first</text><rect x="200" y="334" width="600" height="52" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="500" y="365" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Fine-tune small — teach the small one</text><rect x="200" y="400" width="600" height="52" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="500" y="431" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Batch — 50% off, slow</text><rect x="200" y="466" width="600" height="52" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="497" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Provisioned — steady, big scale</text><text x="500" y="542" text-anchor="middle" font-size="13" fill="#555555">Climb the ladder top-down: cheapest wins first. Provisioned throughput is the last resort.</text></svg>
