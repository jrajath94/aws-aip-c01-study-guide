<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="API choice: Converse by default, InvokeModel for provider-only features">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="400" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">API choice</text><rect x="200" y="96" width="400" height="88" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="400" y="130" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Need provider-only feature?</text><line x1="320" y1="184" x2="224" y2="224" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="272" y="196" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">yes</text><line x1="480" y1="184" x2="576" y2="224" stroke="#1B2838" stroke-width="1.5" marker-end="url(#ah)"/><text x="528" y="196" text-anchor="middle" font-size="13" fill="#5C6B7A" font-weight="500">no</text><rect x="64" y="224" width="240" height="96" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="184" y="260" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">InvokeModel</text><text x="184" y="286" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">you serialize JSON</text><rect x="496" y="224" width="240" height="96" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="616" y="260" text-anchor="middle" font-size="16" fill="#1B2838" font-weight="600">Converse</text><text x="616" y="286" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">unified API</text><text x="400" y="380" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Default to Converse. Use InvokeModel only when Converse lacks the feature.</text></svg>