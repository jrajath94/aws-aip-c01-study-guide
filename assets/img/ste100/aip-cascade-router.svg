<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 385" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Cascade router sends easy questions to the small model and hard ones to the flagship">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Cascading with a router</text>
<rect x="400" y="60" width="200" height="80" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="500" y="105" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Router</text><line x1="500" y1="140" x2="500" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120" y="175" width="300" height="140" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="270" y="211" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Small model</text><text x="270" y="237" text-anchor="middle" font-size="12" fill="#111111">85% of traffic</text><text x="270" y="263" text-anchor="middle" font-size="12" fill="#111111">$0.25 / $1.25</text><text x="270" y="289" text-anchor="middle" font-size="12" fill="#111111">per 1M tokens</text><rect x="580" y="175" width="300" height="140" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="730" y="211" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Flagship model</text><text x="730" y="237" text-anchor="middle" font-size="12" fill="#111111">15% of traffic</text><text x="730" y="263" text-anchor="middle" font-size="12" fill="#111111">$3.00 / $15.00</text><text x="730" y="289" text-anchor="middle" font-size="12" fill="#111111">per 1M tokens</text><line x1="480" y1="175" x2="420" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="450" y="167" text-anchor="middle" font-size="12" fill="#555555">easy</text><line x1="520" y1="175" x2="580" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="550" y="167" text-anchor="middle" font-size="12" fill="#555555">hard</text><text x="500" y="355" text-anchor="middle" font-size="13" fill="#555555">Prove the small model matches quality first. The router is only as good as its test.</text></svg>
