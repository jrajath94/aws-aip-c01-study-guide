<svg xmlns="http://www.w3.org/2000/svg" width="720" height="490" viewBox="0 0 720 490" role="img" aria-label="Endpoint picker by latency: real-time for milliseconds always on, serverless for spiky pay-per-request, async for minutes-long queued jobs, batch transform for scheduled bulk scoring with no endpoint">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="490" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">THE ENDPOINT PICKER</text>

<rect x="60" y="60" width="600" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="91.0" font-size="13" text-anchor="middle" font-weight="700">How fast must the answer come back?</text>

<rect x="60" y="140" width="270" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="195.0" y="193.0" font-size="14" text-anchor="middle" font-weight="700">REAL-TIME</text>
<text x="195.0" y="211.0" font-size="11" fill="#555555" text-anchor="middle">ms, always on</text>

<text x="195" y="282" font-size="11" fill="#555555" text-anchor="middle">chatbots, fraud checks</text>
<text x="195" y="300" font-size="11" fill="#555555" text-anchor="middle">pay per hour, idle or not</text>
<rect x="390" y="140" width="270" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="525.0" y="193.0" font-size="14" text-anchor="middle" font-weight="700">SERVERLESS</text>
<text x="525.0" y="211.0" font-size="11" fill="#555555" text-anchor="middle">ms, scales to zero</text>

<text x="525" y="282" font-size="11" fill="#555555" text-anchor="middle">spiky traffic, pay per request</text>
<text x="525" y="300" font-size="11" fill="#555555" text-anchor="middle">cold starts threaten p99</text>
<rect x="60" y="320" width="270" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="195.0" y="373.0" font-size="14" text-anchor="middle" font-weight="700">ASYNC</text>
<text x="195.0" y="391.0" font-size="11" fill="#555555" text-anchor="middle">minutes, queued</text>

<text x="195" y="462" font-size="11" fill="#555555" text-anchor="middle">1 GB payloads, S3 + SNS out</text>
<rect x="390" y="320" width="270" height="110" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="525.0" y="373.0" font-size="14" text-anchor="middle" font-weight="700">BATCH TRANSFORM</text>
<text x="525.0" y="391.0" font-size="11" fill="#555555" text-anchor="middle">no endpoint</text>

<text x="525" y="462" font-size="11" fill="#555555" text-anchor="middle">cheapest for nightly scoring</text>
</svg>