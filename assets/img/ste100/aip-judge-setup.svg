<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 434" width="100%" style="max-width:780px" font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif" role="img" aria-label="LLM as a judge setup: sampled outputs plus a rubric prompt go to a separate judge model that returns scores"><rect x="0" y="0" width="760" height="434" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">LLM-as-a-judge on Bedrock: rubric in, scores out</text><text x="24" y="58" font-size="13" fill="#7d8590">A separate model scores outputs against your rubric. No labels required.</text><rect x="24" y="90" width="200" height="170" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="124" y="126" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Sampled outputs</text><text x="124" y="156" text-anchor="middle" font-size="12" fill="#7d8590">candidate answers to</text><text x="124" y="175" text-anchor="middle" font-size="12" fill="#7d8590">score</text><line x1="224" y1="175" x2="258" y2="175" stroke="#7d8590" stroke-width="2.2"/><polygon points="258,175 249.7,180.6 249.7,169.4" fill="#7d8590"/><rect x="258" y="90" width="240" height="170" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="378" y="126" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Judge prompt</text><text x="378" y="156" text-anchor="middle" font-size="12" fill="#7d8590">rubric: correctness,</text><text x="378" y="175" text-anchor="middle" font-size="12" fill="#7d8590">faithfulness, style,</text><text x="378" y="194" text-anchor="middle" font-size="12" fill="#7d8590">custom metrics</text><line x1="498" y1="175" x2="532" y2="175" stroke="#7d8590" stroke-width="2.2"/><polygon points="532,175 523.7,180.6 523.7,169.4" fill="#7d8590"/><rect x="532" y="90" width="204" height="170" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="634" y="126" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Judge model</text><text x="634" y="156" text-anchor="middle" font-size="12" fill="#7d8590">a separate Bedrock</text><text x="634" y="175" text-anchor="middle" font-size="12" fill="#7d8590">model scores each</text><text x="634" y="194" text-anchor="middle" font-size="12" fill="#7d8590">output</text><line x1="380" y1="260" x2="380" y2="294" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,294 371.7,299.6 371.7,288.4" fill="#7d8590"/><rect x="180" y="294" width="400" height="110" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="380" y="326" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Scores out</text><text x="380" y="354" text-anchor="middle" font-size="12" fill="#7d8590">No ground-truth labels needed. A judge call</text><text x="380" y="373" text-anchor="middle" font-size="12" fill="#7d8590">costs a judge call.</text></svg>