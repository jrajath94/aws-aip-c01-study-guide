<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 575" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Pattern 2 tiebreakers in order: managed over custom, cheaper, simpler, AWS-native">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 2: the tiebreakers, in order</text>
<rect x="375" y="70" width="400" height="80" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Two options both work</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">run the tiebreakers top to bottom</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">first difference wins</text>
<rect x="300" y="170" width="550" height="70" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="196" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. Managed over custom</text>
<text x="575" y="218" text-anchor="middle" font-size="13" fill="#555555">a Bedrock feature beats a hand-built one</text>
<rect x="300" y="260" width="550" height="70" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="286" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. Cheaper at same quality</text>
<text x="575" y="308" text-anchor="middle" font-size="13" fill="#555555">lower cost wins when quality ties</text>
<path d="M575,240 L575,260" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="350" width="550" height="70" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="376" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. Simpler over complex</text>
<text x="575" y="398" text-anchor="middle" font-size="13" fill="#555555">fewer moving parts wins</text>
<path d="M575,330 L575,350" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="300" y="440" width="550" height="70" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="466" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. AWS-native over third-party</text>
<text x="575" y="488" text-anchor="middle" font-size="13" fill="#555555">native integration wins</text>
<path d="M575,420 L575,440" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="575" y="545" text-anchor="middle" font-size="13" fill="#555555">Stop at the first tiebreaker that separates the options. Do not keep going.</text>
</svg>
