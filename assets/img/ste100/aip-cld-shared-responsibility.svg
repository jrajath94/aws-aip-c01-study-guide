<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Shared responsibility: the customer owns more on EC2, less on RDS, and only data and permissions on S3 and Bedrock">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="360" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">SHARED RESPONSIBILITY: THE LINE MOVES</text>

<text x="150" y="62" font-size="13" text-anchor="middle" font-weight="700">EC2</text>
<text x="360" y="62" font-size="13" text-anchor="middle" font-weight="700">RDS</text>
<text x="570" y="62" font-size="13" text-anchor="middle" font-weight="700">S3 / Bedrock</text>
<rect x="60" y="80" width="180" height="60" rx="6" fill="#e8f0fa" stroke="#2b6cb0"/><text x="150" y="115" font-size="11.5" text-anchor="middle">YOU: OS, apps, data</text>
<rect x="60" y="142" width="180" height="120" rx="6" fill="#f6f6f6" stroke="#3f3f3f"/><text x="150" y="205" font-size="11.5" text-anchor="middle">AWS: physical</text>
<rect x="270" y="80" width="180" height="45" rx="6" fill="#e8f0fa" stroke="#2b6cb0"/><text x="360" y="107" font-size="11.5" text-anchor="middle">YOU: data, logins</text>
<rect x="270" y="127" width="180" height="135" rx="6" fill="#f6f6f6" stroke="#3f3f3f"/><text x="360" y="197" font-size="11.5" text-anchor="middle">AWS: OS, DB engine</text>
<rect x="480" y="80" width="180" height="30" rx="6" fill="#e8f0fa" stroke="#2b6cb0"/><text x="570" y="100" font-size="11.5" text-anchor="middle">YOU: data, perms</text>
<rect x="480" y="112" width="180" height="150" rx="6" fill="#f6f6f6" stroke="#3f3f3f"/><text x="570" y="190" font-size="11.5" text-anchor="middle">AWS: everything else</text>
<rect x="60" y="290" width="14" height="14" fill="#e8f0fa" stroke="#2b6cb0"/><text x="82" y="302" font-size="11.5">customer (you)</text>
<rect x="200" y="290" width="14" height="14" fill="#f6f6f6" stroke="#3f3f3f"/><text x="222" y="302" font-size="11.5">AWS</text>
<text x="360" y="340" font-size="11.5" fill="#555555" text-anchor="middle">The line moves with the service. Your data and permissions are always yours.</text>
</svg>