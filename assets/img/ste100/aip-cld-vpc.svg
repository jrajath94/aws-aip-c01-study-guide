<svg xmlns="http://www.w3.org/2000/svg" width="720" height="505" viewBox="0 0 720 505" role="img" aria-label="A VPC with public subnets holding web servers and a NAT gateway, private subnets holding app servers and Lambda, an internet gateway, and a VPC endpoint to S3">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="505" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">VPC: THE PIECES AND HOW THEY CONNECT</text>

<rect x="40" y="55" width="640" height="375" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="60" y="85" font-size="13" font-weight="700">VPC: your private map (one region)</text>
<text x="360" y="115" font-size="12" text-anchor="middle" font-weight="700">internet gateway (two-way)</text>
<rect x="90" y="125" width="260" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="220.0" y="178.0" font-size="13" text-anchor="middle" font-weight="700">PUBLIC SUBNET (AZ a)</text>
<text x="220.0" y="196.0" font-size="11" fill="#555555" text-anchor="middle">EC2 web server</text>

<rect x="370" y="125" width="260" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="500.0" y="178.0" font-size="13" text-anchor="middle" font-weight="700">PUBLIC SUBNET (AZ b)</text>
<text x="500.0" y="196.0" font-size="11" fill="#555555" text-anchor="middle">NAT gateway</text>

<rect x="90" y="255" width="260" height="150" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="220.0" y="328.0" font-size="13" text-anchor="middle" font-weight="700">PRIVATE SUBNET (AZ a)</text>
<text x="220.0" y="346.0" font-size="11" fill="#555555" text-anchor="middle">app server + database</text>

<rect x="370" y="255" width="260" height="150" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="500.0" y="328.0" font-size="13" text-anchor="middle" font-weight="700">PRIVATE SUBNET (AZ b)</text>
<text x="500.0" y="346.0" font-size="11" fill="#555555" text-anchor="middle">Lambda (no public IP)</text>

<line x1="500" y1="235" x2="500" y2="255" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<text x="520" y="248" font-size="10.5" fill="#555555">out only</text>
<rect x="80" y="448" width="14" height="14" fill="#e8f0fa" stroke="#2b6cb0"/><text x="100" y="460" font-size="11">security group = instance firewall (stateful, allow-only)</text>
<rect x="80" y="470" width="14" height="14" fill="#fdf3e1" stroke="#c98a1b"/><text x="100" y="482" font-size="11">NACL = subnet firewall (stateless, can deny)</text>
<text x="470" y="460" font-size="11" fill="#555555">VPC endpoint to S3:</text>
<text x="470" y="478" font-size="11" fill="#555555">private road, no NAT</text>
</svg>