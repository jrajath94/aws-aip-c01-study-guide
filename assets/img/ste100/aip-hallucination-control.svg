<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 330" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Hallucination control: split answer into claims, verify each against the source">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Validating grounding</text>
<rect x="40" y="130" width="240" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="160" y="167" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Answer</text><text x="160" y="193" text-anchor="middle" font-size="13" fill="#111111">with claims</text><line x1="280" y1="175" x2="330" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="330" y="110" width="260" height="130" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="460" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Split into</text><text x="460" y="180" text-anchor="middle" font-size="12" fill="#111111">atomic claims</text><text x="460" y="206" text-anchor="middle" font-size="12" fill="#111111">one fact each</text><line x1="590" y1="175" x2="640" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="640" y="90" width="320" height="170" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="800" y="141" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Check each claim</text><text x="800" y="167" text-anchor="middle" font-size="12" fill="#111111">in the source?</text><text x="800" y="193" text-anchor="middle" font-size="12" fill="#111111">YES: keep + cite</text><text x="800" y="219" text-anchor="middle" font-size="12" fill="#111111">NO: drop or flag</text><text x="500" y="300" text-anchor="middle" font-size="13" fill="#555555">Faithfulness = supported claims / total claims. Quote the source line for each kept claim.</text></svg>
