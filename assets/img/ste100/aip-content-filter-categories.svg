ke="#999999" stroke-width="1.5"/><text x="750" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Physical</text><text x="750" y="132" text-anchor="middle" font-size="12" fill="#111111">strength:</text><text x="750" y="158" text-anchor="middle" font-size="12" fill="#111111">None / Low</text><text x="750" y="184" text-anchor="middle" font-size="12" fill="#111111">Medium / High</text><rect x="840" y="80" width="140" height="120" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="910" y="106" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Prompt attack</text><text x="910" y="132" text-anchor="middle" font-size="12" fill="#111111">strength:</text><text x="910" y="158" text-anchor="middle" font-size="12" fill="#111111">None / Low</text><text x="910" y="184" text-anchor="middle" font-size="12" fill="#111111">Medium / High</text><text x="500" y="240" text-anchor="middle" font-size="13" fill="#555555">Higher strength blocks more. Test with your own prompts; blocking too much hurts real answers.</text></svg>
