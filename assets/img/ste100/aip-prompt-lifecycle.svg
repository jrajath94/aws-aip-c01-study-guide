<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 560" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Prompt lifecycle: versions, variants, approval, audit">
<title>Prompt lifecycle: versions, variants, approval, audit</title>
<desc>A pipeline left to right. Draft the prompt with {{variable}} placeholders. Publish immutable versions; rollback means pointing at an older version. Create variants for A/B testing, such as formal versus friendly tone. Run the approval workflow before a version goes live. At runtime the app calls the prompt by name and version. A bottom band lists governance: CloudTrail logs every prompt management API call, CloudWatch Logs records access, S3 holds the template repository. A note says there is no extra charge: you pay only for the model tokens the prompt consumes.</desc>
<defs><marker id="aip-plife-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">PROMPTS ARE PRODUCTION ASSETS: VERSION EVERYTHING</text>
<rect x="30" y="70" width="200" height="130" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="130.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">draft</text>
<text x="130.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">{{variable}} placeholders</text>
<text x="130.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">edit freely</text>
<line x1="230" y1="135" x2="245" y2="135" stroke="#1f6fd6" stroke-width="1.8" marker-end="url(#aip-plife-ah)"/>
<rect x="245" y="70" width="200" height="130" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="345.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">publish version</text>
<text x="345.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">immutable snapshot</text>
<text x="345.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">rollback = point older</text>
<line x1="445" y1="135" x2="460" y2="135" stroke="#1e7e34" stroke-width="1.8" marker-end="url(#aip-plife-ah)"/>
<rect x="460" y="70" width="200" height="130" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="560.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">variants</text>
<text x="560.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">formal vs friendly tone</text>
<text x="560.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">A/B test them</text>
<line x1="660" y1="135" x2="675" y2="135" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-plife-ah)"/>
<rect x="675" y="70" width="200" height="130" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="775.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">approval</text>
<text x="775.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">workflow before live</text>
<text x="775.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">legal, brand sign-off</text>
<rect x="30" y="250" width="830" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="445.0" y="282" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">App calls prompt by name + version</text>
<text x="445.0" y="304" text-anchor="middle" font-size="12.5" fill="#555555">non-engineers edit wording in the console</text>
<text x="445.0" y="323" text-anchor="middle" font-size="12.5" fill="#555555">wording tweaks stop being code deploys</text>
<text x="30" y="372" font-size="13" fill="#111111" font-weight="bold">Governance band:</text>
<text x="30" y="394" font-size="12" fill="#555555">CloudTrail logs every prompt management API call for audit. CloudWatch Logs records access. S3 holds the template repository.</text>
<text x="30" y="424" font-size="12" fill="#555555">Prompt Flows chains these prompts visually: nodes for prompts, agents, knowledge bases, Lambda functions, and conditions,</text>
<text x="30" y="444" font-size="12" fill="#555555">with conditional branching and a test panel. No extra charge anywhere: you pay only for the model tokens consumed.</text>
<text x="30" y="486" font-size="13" fill="#111111">Failure mode it fixes: fifteen prompts across five features, marketing rewriting tone weekly, engineers redeploying every tweak.</text>
</svg>