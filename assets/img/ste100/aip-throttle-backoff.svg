<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 310" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Throttled requests retry with exponential backoff and jitter">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Throttling and retries</text>
<rect x="60" y="120" width="200" height="90" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="160" y="157" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">429</text><text x="160" y="183" text-anchor="middle" font-size="14" fill="#111111">throttled</text><line x1="260" y1="165" x2="320" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="320" y="90" width="360" height="150" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/><text x="500" y="131" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Backoff</text><text x="500" y="157" text-anchor="middle" font-size="12" fill="#111111">wait 1s, 2s, 4s...</text><text x="500" y="183" text-anchor="middle" font-size="12" fill="#111111">add jitter</text><text x="500" y="209" text-anchor="middle" font-size="12" fill="#111111">cap the retries</text><line x1="680" y1="165" x2="740" y2="165" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="740" y="120" width="200" height="90" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="840" y="157" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Retry</text><text x="840" y="183" text-anchor="middle" font-size="14" fill="#111111">succeeds</text><text x="500" y="280" text-anchor="middle" font-size="13" fill="#555555">Two quotas: requests per minute AND tokens per minute. Big prompts hit the token quota first.</text></svg>
