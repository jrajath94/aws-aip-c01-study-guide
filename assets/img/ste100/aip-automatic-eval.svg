<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 305" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Automatic evaluation compares model output to reference answers with metrics">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Automatic evaluation</text>
<rect x="40" y="130" width="220" height="90" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="150" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Dataset</text><text x="150" y="180" text-anchor="middle" font-size="12" fill="#111111">prompt +</text><text x="150" y="206" text-anchor="middle" font-size="12" fill="#111111">reference answer</text><line x1="260" y1="175" x2="310" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="310" y="130" width="220" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="420" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Model</text><text x="420" y="180" text-anchor="middle" font-size="12" fill="#111111">generates</text><text x="420" y="206" text-anchor="middle" font-size="12" fill="#111111">an answer</text><line x1="530" y1="175" x2="580" y2="175" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="580" y="120" width="340" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="750" y="154" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Metric compares</text><text x="750" y="180" text-anchor="middle" font-size="12" fill="#111111">exact match, F1,</text><text x="750" y="206" text-anchor="middle" font-size="12" fill="#111111">ROUGE, BERTScore</text><text x="500" y="275" text-anchor="middle" font-size="13" fill="#555555">Automatic eval is fast and repeatable. It needs reference answers, which cost effort to write.</text></svg>
