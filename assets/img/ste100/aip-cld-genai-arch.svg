<svg xmlns="http://www.w3.org/2000/svg" width="720" height="415" viewBox="0 0 720 415" role="img" aria-label="Secure GenAI architecture: user to CloudFront to API Gateway to Lambda in private subnets, reading versioned encrypted S3 documents and calling Bedrock through a VPC endpoint, with CloudTrail CloudWatch and Config auditing">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="415" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">SECURE GENAI ON AWS: THE FULL ASSEMBLY</text>

<rect x="30" y="60" width="110" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="85.0" y="95.0" font-size="12" text-anchor="middle" font-weight="700">User</text>

<line x1="140" y1="90" x2="170" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="170" y="60" width="120" height="60" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="230.0" y="88.0" font-size="12" text-anchor="middle" font-weight="700">CloudFront</text>
<text x="230.0" y="106.0" font-size="11" fill="#555555" text-anchor="middle">cache</text>

<line x1="290" y1="90" x2="320" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="320" y="60" width="140" height="60" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="390.0" y="88.0" font-size="12" text-anchor="middle" font-weight="700">API Gateway</text>
<text x="390.0" y="106.0" font-size="11" fill="#555555" text-anchor="middle">front door</text>

<line x1="460" y1="90" x2="490" y2="90" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="490" y="55" width="200" height="210" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="590.0" y="165.0" font-size="13" text-anchor="middle" font-weight="700">PRIVATE SUBNETS</text>

<rect x="520" y="100" width="140" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="590.0" y="124.0" font-size="12" text-anchor="middle" font-weight="700">Lambda</text>
<text x="590.0" y="142.0" font-size="11" fill="#555555" text-anchor="middle">no public IP</text>

<line x1="560" y1="152" x2="560" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="520" y="175" width="140" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="590.0" y="199.0" font-size="12" text-anchor="middle" font-weight="700">S3 bucket</text>
<text x="590.0" y="217.0" font-size="11" fill="#555555" text-anchor="middle">docs, versioned</text>

<rect x="520" y="227" width="140" height="28" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="590.0" y="246.0" font-size="11" text-anchor="middle" font-weight="700">KMS</text>

<line x1="520" y1="126" x2="470" y2="126" stroke="#1f7a6d" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ar)"/>
<rect x="300" y="150" width="140" height="60" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="370.0" y="178.0" font-size="12" text-anchor="middle" font-weight="700">VPC endpoint</text>
<text x="370.0" y="196.0" font-size="11" fill="#555555" text-anchor="middle">to Bedrock</text>

<line x1="370" y1="210" x2="520" y2="241" stroke="#1f7a6d" stroke-width="1.5" stroke-dasharray="5,4"/>
<rect x="30" y="290" width="660" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="323.0" font-size="13" text-anchor="middle" font-weight="700">AUDIT LAYER</text>
<text x="360.0" y="341.0" font-size="11" fill="#555555" text-anchor="middle">CloudTrail logs every call  -  CloudWatch surfaces errors  -  Config flags drift</text>

<text x="360" y="395" font-size="11.5" fill="#555555" text-anchor="middle">User never touches compute. Prompts never cross the public internet.</text>
</svg>