<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-label="Prep-tool picker: Glue for data engineers at scale, DataBrew for analysts with no code, Data Wrangler for notebook work">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="320" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">PREP TOOLS: THE PERSONA DECIDES</text>

<rect x="60" y="70" width="190" height="110" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="155.0" y="123.0" font-size="14" text-anchor="middle" font-weight="700">GLUE</text>
<text x="155.0" y="141.0" font-size="11" fill="#555555" text-anchor="middle">engineers</text>

<text x="155" y="215" font-size="11.5" fill="#555555" text-anchor="middle">scheduled, Spark-scale</text>
<rect x="265" y="70" width="190" height="110" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="360.0" y="123.0" font-size="14" text-anchor="middle" font-weight="700">DATABREW</text>
<text x="360.0" y="141.0" font-size="11" fill="#555555" text-anchor="middle">analysts</text>

<text x="360" y="215" font-size="11.5" fill="#555555" text-anchor="middle">visual, no code</text>
<rect x="470" y="70" width="190" height="110" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="565.0" y="123.0" font-size="14" text-anchor="middle" font-weight="700">DATA WRANGLER</text>
<text x="565.0" y="141.0" font-size="11" fill="#555555" text-anchor="middle">data scientists</text>

<text x="565" y="215" font-size="11.5" fill="#555555" text-anchor="middle">in Studio notebooks</text>
<text x="360" y="265" font-size="12" text-anchor="middle" font-weight="700">The persona decides the tool</text>
<text x="360" y="295" font-size="11.5" fill="#555555" text-anchor="middle">"scheduled, at scale" = Glue. "no code" = DataBrew. "in a notebook" = Data Wrangler.</text>
</svg>