<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="The MOST-correct trap: two defensible options, only one satisfies every constraint - cost, latency, compliance, scale">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="310" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">TRAP PATTERN</text><rect x="24" y="56" width="320" height="120" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="184" y="88" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >Option A</text><text x="184" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >defensible, but misses</text><text x="184" y="132" font-size="11.5" fill="#555555" text-anchor="middle" >one constraint</text><text x="184" y="154" font-size="11.5" fill="#b00020" text-anchor="middle" font-weight="700" >wrong answer</text><rect x="376" y="56" width="320" height="120" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="536" y="88" font-size="13" fill="#222222" text-anchor="middle" font-weight="700" >Option B</text><text x="536" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >defensible and satisfies</text><text x="536" y="132" font-size="11.5" fill="#555555" text-anchor="middle" >ALL constraints</text><text x="536" y="154" font-size="11.5" fill="#1f7a6d" text-anchor="middle" font-weight="700" >correct answer</text><rect x="24" y="206" width="672" height="44" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="360" y="234" font-size="12" fill="#222222" text-anchor="middle" >Constraints: cost · latency · compliance · scale</text><text x="360" y="282" font-size="12" fill="#555555" text-anchor="middle" >When stuck, prefer the managed Bedrock-native service over building it yourself.</text></svg>