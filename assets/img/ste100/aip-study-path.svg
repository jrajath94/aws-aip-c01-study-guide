<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 300" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Study path: domain banks easy to hard, then 52 bonus questions, then 8 field-research questions, then the 75-question timed mock">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Study path: easy to hard, then wider, then timed</text>
<rect x="30" y="80" width="250" height="150" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="155" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Domain banks</text>
<text x="155" y="128" text-anchor="middle" font-size="13" fill="#555555">climb easy to hard</text>
<text x="155" y="150" text-anchor="middle" font-size="13" fill="#555555">44 D1, 36 D2, 28 D3</text>
<text x="155" y="172" text-anchor="middle" font-size="13" fill="#555555">17 D4, 15 D5 questions</text>
<path d="M280,155 L310,155" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="310" y="80" width="250" height="150" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="435" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Bonus 52</text>
<text x="435" y="128" text-anchor="middle" font-size="13" fill="#555555">Q141-Q192</text>
<text x="435" y="150" text-anchor="middle" font-size="13" fill="#555555">harder distractors</text>
<text x="435" y="172" text-anchor="middle" font-size="13" fill="#555555">professional bar</text>
<path d="M560,155 L590,155" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="590" y="80" width="250" height="150" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="715" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Field research 8</text>
<text x="715" y="128" text-anchor="middle" font-size="13" fill="#555555">Q193-Q200</text>
<text x="715" y="150" text-anchor="middle" font-size="13" fill="#555555">passer-report patterns</text>
<text x="715" y="172" text-anchor="middle" font-size="13" fill="#555555">September 2026 traps</text>
<path d="M840,155 L870,155" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="870" y="80" width="250" height="150" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="995" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">75-question mock</text>
<text x="995" y="128" text-anchor="middle" font-size="13" fill="#555555">180 minutes, timed</text>
<text x="995" y="150" text-anchor="middle" font-size="13" fill="#555555">aim for 80% or more</text>
<text x="995" y="172" text-anchor="middle" font-size="13" fill="#555555">60 of 75 correct</text>
<text x="575" y="270" text-anchor="middle" font-size="13" fill="#555555">Do the domains easy to hard first. Take the mock under timed conditions last.</text>
</svg>
