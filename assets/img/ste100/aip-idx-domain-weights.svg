<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-label="Bar chart of AIP-C01 domain weights: D1 31, D2 26, D3 20, D4 12, D5 11 percent">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">DOMAIN WEIGHTS</text><text x="24" y="74" font-size="12" fill="#222222" text-anchor="start" >D1 · Foundation models, data, compliance</text><rect x="290" y="58" width="380" height="22" rx="5" fill="#2b6cb0" opacity="0.85"/><text x="680" y="75" font-size="12" fill="#222222" text-anchor="start" font-weight="700" >31%</text><text x="24" y="120" font-size="12" fill="#222222" text-anchor="start" >D2 · Implementation and integration</text><rect x="290" y="104" width="318" height="22" rx="5" fill="#2b6cb0" opacity="0.85"/><text x="618" y="121" font-size="12" fill="#222222" text-anchor="start" font-weight="700" >26%</text><text x="24" y="166" font-size="12" fill="#222222" text-anchor="start" >D3 · Safety, security, governance</text><rect x="290" y="150" width="245" height="22" rx="5" fill="#2b6cb0" opacity="0.85"/><text x="545" y="167" font-size="12" fill="#222222" text-anchor="start" font-weight="700" >20%</text><text x="24" y="212" font-size="12" fill="#222222" text-anchor="start" >D4 · Optimization</text><rect x="290" y="196" width="147" height="22" rx="5" fill="#2b6cb0" opacity="0.85"/><text x="447" y="213" font-size="12" fill="#222222" text-anchor="start" font-weight="700" >12%</text><text x="24" y="258" font-size="12" fill="#222222" text-anchor="start" >D5 · Testing and validation</text><rect x="290" y="242" width="134" height="22" rx="5" fill="#2b6cb0" opacity="0.85"/><text x="434" y="259" font-size="12" fill="#222222" text-anchor="start" font-weight="700" >11%</text><text x="360" y="312" font-size="12" fill="#555555" text-anchor="middle" >Study time follows the weights: D1 first, D5 last.</text></svg>