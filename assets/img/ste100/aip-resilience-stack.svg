<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 600" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Reliability stack: SDK, role, backoff, fallback">
<title>Reliability stack: SDK, role, backoff, fallback</title>
<desc>Four layers top to bottom. 1. Call through the AWS SDK: bedrock-runtime for inference (Converse, InvokeModel) and bedrock-agent-runtime for agents, with a scoped IAM role. 2. Retry with exponential backoff and jitter: on a throttle, wait 1s, then 2s, then 4s, each plus random jitter so a fleet of clients does not retry in lockstep. 3. Fallback: sustained throttles are solved with Provisioned Throughput, not more retries; route to a fallback model when the primary is sick. 4. Parse and validate structured output before trusting it.</desc>
<defs><marker id="aip-resil-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="600" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">THE LAST MILE: RELIABILITY BETWEEN YOUR APP AND BEDROCK</text>
<rect x="60" y="70" width="820" height="105" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="470.0" y="102" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. SDK + scoped IAM role</text>
<text x="470.0" y="124" text-anchor="middle" font-size="12.5" fill="#555555">bedrock-runtime: inference. bedrock-agent-runtime: agents.</text>
<text x="470.0" y="143" text-anchor="middle" font-size="12.5" fill="#555555">least-privilege role, no keys in code</text>
<rect x="60" y="190" width="820" height="105" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470.0" y="222" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. exponential backoff + jitter</text>
<text x="470.0" y="244" text-anchor="middle" font-size="12.5" fill="#555555">throttle -&gt; wait 1s, then 2s, then 4s + random jitter</text>
<text x="470.0" y="263" text-anchor="middle" font-size="12.5" fill="#555555">jitter stops a fleet retrying in lockstep</text>
<rect x="60" y="310" width="820" height="105" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="470.0" y="342" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. fallback, not endless retries</text>
<text x="470.0" y="364" text-anchor="middle" font-size="12.5" fill="#555555">sustained throttles -&gt; Provisioned Throughput</text>
<text x="470.0" y="383" text-anchor="middle" font-size="12.5" fill="#555555">route to a fallback model when the primary is sick</text>
<rect x="60" y="430" width="820" height="105" rx="8" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="470.0" y="462" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. parse and validate output</text>
<text x="470.0" y="484" text-anchor="middle" font-size="12.5" fill="#555555">structured output must be checked</text>
<text x="470.0" y="503" text-anchor="middle" font-size="12.5" fill="#555555">never trust model JSON blindly</text>
<text x="30" y="576" font-size="13" fill="#111111">Exam trap: never a tight retry loop. Backoff with jitter, then a structural fix.</text>
</svg>