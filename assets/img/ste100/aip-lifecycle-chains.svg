<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 455" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Lifecycle chains: agent configure prepare test, select model before customizing, scope before building">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Pattern 3: lifecycle order is fixed, any inversion is wrong</text>
<rect x="60" y="80" width="1030" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="106" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Agent lifecycle</text>
<text x="190" y="138" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">configure</text>
<path d="M295,130 L345,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="450" y="138" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">prepare</text>
<path d="M555,130 L605,130" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="710" y="138" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">test</text>
<rect x="60" y="190" width="1030" height="90" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="216" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Model customization</text>
<text x="190" y="248" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">select the model</text>
<path d="M295,240 L345,240" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="450" y="248" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">then customize it</text>
<rect x="60" y="300" width="1030" height="90" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="326" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Build order</text>
<text x="190" y="358" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">scope the problem</text>
<path d="M295,350 L345,350" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="450" y="358" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">then build</text>
<text x="575" y="425" text-anchor="middle" font-size="13" fill="#555555">Anchor the first step and the last step. An option that inverts this order dies on sight.</text>
</svg>
