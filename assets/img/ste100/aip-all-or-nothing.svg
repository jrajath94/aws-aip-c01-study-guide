<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 380" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Multiple-response scoring: all correct options and no incorrect ones earns one point, anything else earns zero, so never leave a question blank">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Multiple-response questions are all-or-nothing</text>
<rect x="60" y="70" width="320" height="130" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="220" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Pick every correct option</text>
<text x="220" y="118" text-anchor="middle" font-size="13" fill="#555555">two answers are each right</text>
<text x="220" y="140" text-anchor="middle" font-size="13" fill="#555555">on their own merits</text>
<text x="220" y="162" text-anchor="middle" font-size="13" fill="#555555">no pairing tricks</text>
<rect x="415" y="70" width="320" height="130" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Pick nothing incorrect</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">one wrong option picked</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">means zero points</text>
<text x="575" y="162" text-anchor="middle" font-size="13" fill="#555555">for the whole question</text>
<rect x="770" y="70" width="320" height="130" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="930" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">No partial credit</text>
<text x="930" y="118" text-anchor="middle" font-size="13" fill="#555555">all correct + none wrong</text>
<text x="930" y="140" text-anchor="middle" font-size="13" fill="#555555">= 1 point</text>
<text x="930" y="162" text-anchor="middle" font-size="13" fill="#555555">anything else = 0</text>
<path d="M380,135 L413,135" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M735,135 L768,135" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="255" y="240" width="640" height="110" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="575" y="266" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">No penalty for guessing: never leave a question blank</text>
<text x="575" y="288" text-anchor="middle" font-size="13" fill="#555555">an empty question is also zero points</text>
<text x="575" y="310" text-anchor="middle" font-size="13" fill="#555555">a guess can only help</text>
<text x="575" y="332" text-anchor="middle" font-size="13" fill="#555555">evaluate each option alone against the constraints</text>
</svg>
