<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Strands versus Bedrock Agents: Strands is the code-first open-source SDK, Bedrock Agents is the managed console experience"><rect x="0" y="0" width="760" height="396" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Strands or Bedrock Agents: who owns the loop</text><text x="24" y="58" font-size="13" fill="#7d8590">Same capability, different owner. Code-first versus managed.</text><rect x="24" y="90" width="344" height="230" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="196" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Strands Agents</text><text x="196" y="152" text-anchor="middle" font-size="12.5" fill="#7d8590">Code-first, open source</text><text x="196" y="186" text-anchor="middle" font-size="12.5" fill="#7d8590">Your repo, your retry logic,</text><text x="196" y="205" text-anchor="middle" font-size="12.5" fill="#7d8590">your deployment target: laptop,</text><text x="196" y="224" text-anchor="middle" font-size="12.5" fill="#7d8590">container, Lambda, AgentCore.</text><text x="196" y="256" text-anchor="middle" font-size="12.5" fill="#7d8590">Pick when the scenario stresses</text><text x="196" y="275" text-anchor="middle" font-size="12.5" fill="#7d8590">code control.</text><rect x="392" y="90" width="344" height="230" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="564" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Bedrock Agents</text><text x="564" y="152" text-anchor="middle" font-size="12.5" fill="#7d8590">Managed console experience</text><text x="564" y="186" text-anchor="middle" font-size="12.5" fill="#7d8590">Action groups, aliases,</text><text x="564" y="205" text-anchor="middle" font-size="12.5" fill="#7d8590">prepare-agent, tracing. AWS</text><text x="564" y="224" text-anchor="middle" font-size="12.5" fill="#7d8590">operates the loop.</text><text x="564" y="256" text-anchor="middle" font-size="12.5" fill="#7d8590">Pick when the scenario stresses</text><text x="564" y="275" text-anchor="middle" font-size="12.5" fill="#7d8590">managed operations.</text><text x="380" y="362" text-anchor="middle" font-size="13" fill="#7d8590">Both answer "the model takes actions through tools." The scenario picks the owner of the loop.</text></svg>