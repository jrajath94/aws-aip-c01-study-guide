<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 748 454" role="img" aria-label="CountTokens API: count tokens before the call to stay under the context window; shrink the input if it does not fit"><style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="748" height="454" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">COUNTTOKENS API: THE PROACTIVE TOKEN CHECK</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Count before the call. Metrics fire after the call runs.</text><rect x="24" y="80" width="700" height="120" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="374" y="118" text-anchor="middle" font-size="14" fill="#222222" font-weight="700">Before the call: CountTokens</text><text x="374" y="148" text-anchor="middle" font-size="12.5" fill="#555555">Count input tokens client-side. Compare against the model context window</text><text x="374" y="166" text-anchor="middle" font-size="12.5" fill="#555555">minus the expected output.</text><path d="M374,200 L374,232" fill="none" stroke="#555555" stroke-width="1.8" marker-end="url(#ar)"/><rect x="24" y="232" width="340" height="150" rx="8" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="1.5"/><text x="194" y="266" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">Fits: send it</text><text x="194" y="296" text-anchor="middle" font-size="12" fill="#555555">One call, no truncation, no</text><text x="194" y="314" text-anchor="middle" font-size="12" fill="#555555">wasted tokens.</text><rect x="384" y="232" width="340" height="150" rx="8" fill="#fdeeee" stroke="#a33b3b" stroke-width="1.5"/><text x="554" y="266" text-anchor="middle" font-size="13.5" fill="#222222" font-weight="700">Too big: shrink first</text><text x="554" y="296" text-anchor="middle" font-size="12" fill="#555555">Chunk, summarize, or pick a</text><text x="554" y="314" text-anchor="middle" font-size="12" fill="#555555">bigger context window before</text><text x="554" y="332" text-anchor="middle" font-size="12" fill="#555555">calling.</text><text x="374" y="420" text-anchor="middle" font-size="12.5" fill="#555555">"Proactively stay under limits" is always CountTokens before the call, never a metric after.</text></svg>