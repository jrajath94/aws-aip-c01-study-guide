<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Messaging decision: SQS queue for one-to-one pull, SNS topic for one-to-many push, EventBridge bus for filtered events">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="380" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">SQS VS SNS VS EVENTBRIDGE</text>

<rect x="60" y="60" width="600" height="56" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="86.0" font-size="13" text-anchor="middle" font-weight="700">How should the services talk?</text>
<text x="360.0" y="104.0" font-size="11" fill="#555555" text-anchor="middle">pick the shape of the traffic</text>

<rect x="60" y="140" width="180" height="120" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="150.0" y="198.0" font-size="14" text-anchor="middle" font-weight="700">SQS</text>
<text x="150.0" y="216.0" font-size="11" fill="#555555" text-anchor="middle">queue: pull</text>

<text x="150" y="292" font-size="11" fill="#555555" text-anchor="middle">one-to-one, buffered</text>
<text x="150" y="310" font-size="11" fill="#555555" text-anchor="middle">Standard or FIFO</text>
<rect x="270" y="140" width="180" height="120" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="360.0" y="198.0" font-size="14" text-anchor="middle" font-weight="700">SNS</text>
<text x="360.0" y="216.0" font-size="11" fill="#555555" text-anchor="middle">topic: push</text>

<text x="360" y="292" font-size="11" fill="#555555" text-anchor="middle">one-to-many fan-out</text>
<text x="360" y="310" font-size="11" fill="#555555" text-anchor="middle">email, SMS, Lambda</text>
<rect x="480" y="140" width="180" height="120" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="570.0" y="198.0" font-size="14" text-anchor="middle" font-weight="700">EVENTBRIDGE</text>
<text x="570.0" y="216.0" font-size="11" fill="#555555" text-anchor="middle">event bus: rules</text>

<text x="570" y="292" font-size="11" fill="#555555" text-anchor="middle">many-to-many, filtered</text>
<text x="570" y="310" font-size="11" fill="#555555" text-anchor="middle">schedules + SaaS events</text>
<line x1="360" y1="116" x2="150" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="360" y1="116" x2="360" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="360" y1="116" x2="570" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="360" y="355" font-size="11.5" fill="#555555" text-anchor="middle">If processing fails: message returns, then moves to a dead-letter queue (DLQ)</text>
</svg>