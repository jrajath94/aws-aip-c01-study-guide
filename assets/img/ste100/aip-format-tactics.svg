<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 320" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Attack plans: multiple choice eliminates violators, multiple response evaluates options alone, ordering anchors first and last, matching pairs the most distinctive first">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Tactics: one attack plan per question format</text>
<rect x="40" y="70" width="255" height="170" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="167" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Multiple choice</text>
<text x="167" y="118" text-anchor="middle" font-size="13" fill="#555555">extract constraints first</text>
<text x="167" y="140" text-anchor="middle" font-size="13" fill="#555555">eliminate any violator</text>
<text x="167" y="162" text-anchor="middle" font-size="13" fill="#555555">then tiebreak</text>
<rect x="315" y="70" width="255" height="170" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="442" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Multiple response</text>
<text x="442" y="118" text-anchor="middle" font-size="13" fill="#555555">evaluate each option alone</text>
<text x="442" y="140" text-anchor="middle" font-size="13" fill="#555555">correct answers stand alone</text>
<text x="442" y="162" text-anchor="middle" font-size="13" fill="#555555">never pair by sound</text>
<rect x="590" y="70" width="255" height="170" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="717" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Ordering</text>
<text x="717" y="118" text-anchor="middle" font-size="13" fill="#555555">anchor first and last steps</text>
<text x="717" y="140" text-anchor="middle" font-size="13" fill="#555555">fill the middle</text>
<text x="717" y="162" text-anchor="middle" font-size="13" fill="#555555">lifecycle decides ties</text>
<rect x="865" y="70" width="255" height="170" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="992" y="96" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Matching</text>
<text x="992" y="118" text-anchor="middle" font-size="13" fill="#555555">match the most distinctive</text>
<text x="992" y="140" text-anchor="middle" font-size="13" fill="#555555">pair first, shrink the field</text>
<text x="992" y="162" text-anchor="middle" font-size="13" fill="#555555">one precise mechanism each</text>
<text x="575" y="290" text-anchor="middle" font-size="13" fill="#555555">Same first move everywhere: constraints before options.</text>
</svg>
