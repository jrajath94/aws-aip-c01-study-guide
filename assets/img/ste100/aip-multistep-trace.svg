<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 486" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Multi-step task decomposition: the agent turns one request into search, compare, book, and email steps, each traced"><rect x="0" y="0" width="784" height="486" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Multi-step decomposition: one task becomes four tool calls</text><text x="24" y="58" font-size="13" fill="#7d8590">The model plans, the tools execute. The trace records it all.</text><rect x="24" y="86" width="712" height="80" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="380" y="116" text-anchor="middle" font-size="14" fill="#ececec" font-weight="bold">Task: "Book me the cheapest flight Friday and email the itinerary."</text><text x="380" y="142" text-anchor="middle" font-size="12.5" fill="#7d8590">One user sentence. The agent decomposes it into steps.</text><rect x="24" y="190" width="160" height="160" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="104" y="226" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Step 1</text><text x="104" y="254" text-anchor="middle" font-size="12" fill="#7d8590"></text><text x="104" y="273" text-anchor="middle" font-size="12" fill="#7d8590">search_flights(Friday)</text><text x="104" y="300" text-anchor="middle" font-size="11.5" fill="#7d8590">tool result: 3</text><text x="104" y="319" text-anchor="middle" font-size="11.5" fill="#7d8590">options</text><line x1="184" y1="270" x2="220" y2="270" stroke="#7d8590" stroke-width="2.2"/><polygon points="220,270 211.7,275.6 211.7,264.4" fill="#7d8590"/><rect x="220" y="190" width="160" height="160" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="300" y="226" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Step 2</text><text x="300" y="254" text-anchor="middle" font-size="12" fill="#7d8590">pick cheapest</text><text x="300" y="300" text-anchor="middle" font-size="11.5" fill="#7d8590">model reasoning:</text><text x="300" y="319" text-anchor="middle" font-size="11.5" fill="#7d8590">compare prices</text><line x1="380" y1="270" x2="416" y2="270" stroke="#7d8590" stroke-width="2.2"/><polygon points="416,270 407.7,275.6 407.7,264.4" fill="#7d8590"/><rect x="416" y="190" width="160" height="160" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="496" y="226" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Step 3</text><text x="496" y="254" text-anchor="middle" font-size="12" fill="#7d8590">book_flight(option)</text><text x="496" y="300" text-anchor="middle" font-size="11.5" fill="#7d8590">tool result:</text><text x="496" y="319" text-anchor="middle" font-size="11.5" fill="#7d8590">confirmation code</text><line x1="576" y1="270" x2="612" y2="270" stroke="#7d8590" stroke-width="2.2"/><polygon points="612,270 603.7,275.6 603.7,264.4" fill="#7d8590"/><rect x="612" y="190" width="160" height="160" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="692" y="226" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Step 4</text><text x="692" y="254" text-anchor="middle" font-size="12" fill="#7d8590"></text><text x="692" y="273" text-anchor="middle" font-size="12" fill="#7d8590">send_email(itinerary)</text><text x="692" y="300" text-anchor="middle" font-size="11.5" fill="#7d8590">tool result: sent</text><rect x="24" y="376" width="712" height="80" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="406" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">enableTrace shows every decision: which tool, what input, what came back.</text><text x="380" y="430" text-anchor="middle" font-size="12.5" fill="#7d8590">"Show why the agent did that" is always the trace.</text></svg>