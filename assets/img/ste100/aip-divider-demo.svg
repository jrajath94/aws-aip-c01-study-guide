<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 754 390" role="img" aria-label="Divider strings demo: paragraph dividers keep ideas whole, line dividers split some ideas, space dividers destroy meaning"><style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><rect width="754" height="390" fill="#ffffff"/><text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">DIVIDER STRINGS: HOW CHUNK BOUNDARIES ARE CHOSEN</text><text x="24" y="52" font-size="12.5" fill="#555555" text-anchor="start">Dividers are tried in order, broadest first. The wrong order splits ideas.</text><text x="194" y="100" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">A 4,000-character document</text><rect x="24" y="112" width="340" height="200" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="194" y="150" text-anchor="middle" font-size="12" fill="#555555">Dividers are tried in order: first</text><text x="194" y="168" text-anchor="middle" font-size="12" fill="#555555">"\n\n" (paragraphs), then "\n"</text><text x="194" y="186" text-anchor="middle" font-size="12" fill="#555555">(lines), then " " (words).</text><text x="194" y="210" text-anchor="middle" font-size="12" fill="#555555">The first divider that yields chunks</text><text x="194" y="228" text-anchor="middle" font-size="12" fill="#555555">under the size limit wins.</text><text x="550" y="100" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">What each divider produces</text><rect x="380" y="112" width="106" height="200" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/><text x="433" y="150" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">"\n\n"</text><text x="433" y="180" text-anchor="middle" font-size="12" fill="#555555">8 chunks of ~500</text><text x="433" y="198" text-anchor="middle" font-size="12" fill="#555555">chars. Ideas</text><text x="433" y="216" text-anchor="middle" font-size="12" fill="#555555">stay whole.</text><rect x="502" y="112" width="106" height="200" rx="8" fill="#fdf3d8" stroke="#b07d10" stroke-width="1.5"/><text x="555" y="150" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">"\n"</text><text x="555" y="180" text-anchor="middle" font-size="12" fill="#555555">22 chunks of</text><text x="555" y="198" text-anchor="middle" font-size="12" fill="#555555">~180 chars. Some</text><text x="555" y="216" text-anchor="middle" font-size="12" fill="#555555">ideas split.</text><rect x="624" y="112" width="106" height="200" rx="8" fill="#fdeeee" stroke="#a33b3b" stroke-width="1.5"/><text x="677" y="150" text-anchor="middle" font-size="13" fill="#222222" font-weight="700">" "</text><text x="677" y="180" text-anchor="middle" font-size="12" fill="#555555">700 fragments.</text><text x="677" y="198" text-anchor="middle" font-size="12" fill="#555555">Meaning</text><text x="677" y="216" text-anchor="middle" font-size="12" fill="#555555">destroyed.</text><text x="377" y="356" text-anchor="middle" font-size="12.5" fill="#555555">Exam trap: wrong divider order splits key facts across chunks, and retrieval silently degrades.</text></svg>