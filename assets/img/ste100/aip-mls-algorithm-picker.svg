<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Algorithm picker: XGBoost for tabular data, Random Cut Forest for anomalies, K-Means for unlabeled groups, DeepAR for forecasting, Factorization Machines for sparse clicks">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="260" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">THE ALGORITHM PICKER</text>

<rect x="60" y="60" width="600" height="52" rx="8" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
<text x="360.0" y="91.0" font-size="14" text-anchor="middle" font-weight="700">Tabular rows and columns? XGBoost is the default.</text>

<text x="120" y="150" font-size="12" text-anchor="middle">unusual traffic</text>
<text x="120" y="172" font-size="12" text-anchor="middle" font-weight="700">Random Cut Forest</text>
<text x="300" y="150" font-size="12" text-anchor="middle">no labels, groups</text>
<text x="300" y="172" font-size="12" text-anchor="middle" font-weight="700">K-Means</text>
<text x="480" y="150" font-size="12" text-anchor="middle">forecast demand</text>
<text x="480" y="172" font-size="12" text-anchor="middle" font-weight="700">DeepAR</text>
<text x="630" y="150" font-size="12" text-anchor="middle">sparse clicks</text>
<text x="630" y="172" font-size="12" text-anchor="middle" font-weight="700">Fact. Machines</text>
<line x1="120" y1="182" x2="120" y2="120" stroke="#ddd" stroke-width="0"/>
<text x="360" y="230" font-size="11.5" fill="#555555" text-anchor="middle">No built-in fits? Bring your own container: SageMaker runs any Docker image as a training job.</text>
</svg>