<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 490" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Inference profile routes the request to a region with capacity">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Cross-region routing</text>
<rect x="400" y="70" width="200" height="80" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="500" y="115" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Your app</text><line x1="500" y1="150" x2="500" y2="185" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="350" y="185" width="300" height="110" rx="8" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.5"/><text x="500" y="219" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">Inference profile</text><text x="500" y="245" text-anchor="middle" font-size="12" fill="#111111">picks a region</text><text x="500" y="271" text-anchor="middle" font-size="12" fill="#111111">with capacity</text><line x1="500" y1="295" x2="500" y2="330" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="120" y="330" width="200" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="220" y="367" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">us-east-1</text><text x="220" y="393" text-anchor="middle" font-size="12" fill="#111111">model copy</text><rect x="400" y="330" width="200" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="500" y="367" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">us-west-2</text><text x="500" y="393" text-anchor="middle" font-size="12" fill="#111111">model copy</text><rect x="680" y="330" width="200" height="90" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/><text x="780" y="367" text-anchor="middle" font-size="12" fill="#111111" font-weight="bold">eu-west-1</text><text x="780" y="393" text-anchor="middle" font-size="12" fill="#111111">model copy</text><text x="500" y="460" text-anchor="middle" font-size="13" fill="#555555">If one region throttles, the profile fails over. You pay the region price of where it runs.</text></svg>
