<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 475" role="img" style="background:#ffffff;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="192-question bank by domain: D1 60, D2 49, D3 39, D4 23, D5 21, plus 8 field-research questions and a 75-question mock">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">The 192-question bank follows the exam domain weights</text>
<text x="60" y="79" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">D1</text>
<text x="60" y="101" text-anchor="start" font-size="13" fill="#555555">60 questions, 31% of the exam</text>
<rect x="310" y="63" width="700" height="20" rx="6" fill="#eeeeee" stroke="#bbbbbb"/>
<rect x="310" y="63" width="700" height="20" rx="6" fill="#f0b429" stroke="#d99a06"/>
<text x="60" y="131" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">D2</text>
<text x="60" y="153" text-anchor="start" font-size="13" fill="#555555">49 questions, 26% of the exam</text>
<rect x="310" y="115" width="700" height="20" rx="6" fill="#eeeeee" stroke="#bbbbbb"/>
<rect x="310" y="115" width="571" height="20" rx="6" fill="#f0b429" stroke="#d99a06"/>
<text x="60" y="183" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">D3</text>
<text x="60" y="205" text-anchor="start" font-size="13" fill="#555555">39 questions, 20% of the exam</text>
<rect x="310" y="167" width="700" height="20" rx="6" fill="#eeeeee" stroke="#bbbbbb"/>
<rect x="310" y="167" width="455" height="20" rx="6" fill="#9e9e9e" stroke="#757575"/>
<text x="60" y="235" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">D4</text>
<text x="60" y="257" text-anchor="start" font-size="13" fill="#555555">23 questions, 12% of the exam</text>
<rect x="310" y="219" width="700" height="20" rx="6" fill="#eeeeee" stroke="#bbbbbb"/>
<rect x="310" y="219" width="268" height="20" rx="6" fill="#9e9e9e" stroke="#757575"/>
<text x="60" y="287" text-anchor="start" font-size="14" fill="#111111" font-weight="bold">D5</text>
<text x="60" y="309" text-anchor="start" font-size="13" fill="#555555">21 questions, 11% of the exam</text>
<rect x="310" y="271" width="700" height="20" rx="6" fill="#eeeeee" stroke="#bbbbbb"/>
<rect x="310" y="271" width="244" height="20" rx="6" fill="#9e9e9e" stroke="#757575"/>
<rect x="60" y="345" width="330" height="100" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="225" y="371" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">192 exam-style questions</text>
<text x="225" y="393" text-anchor="middle" font-size="13" fill="#555555">60 + 49 + 39 + 23 + 21</text>
<text x="225" y="415" text-anchor="middle" font-size="13" fill="#555555">140 exam-weighted</text>
<text x="225" y="437" text-anchor="middle" font-size="13" fill="#555555">+ 52 professional-bar bonus</text>
<rect x="410" y="345" width="330" height="100" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="575" y="371" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">+ 8 field-research questions</text>
<text x="575" y="393" text-anchor="middle" font-size="13" fill="#555555">September 2026</text>
<text x="575" y="415" text-anchor="middle" font-size="13" fill="#555555">passer-report trap patterns</text>
<text x="575" y="437" text-anchor="middle" font-size="13" fill="#555555">Q193-Q200</text>
<rect x="760" y="345" width="330" height="100" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="925" y="371" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">+ 75-question mock exam</text>
<text x="925" y="393" text-anchor="middle" font-size="13" fill="#555555">180 minutes, timed</text>
<text x="925" y="415" text-anchor="middle" font-size="13" fill="#555555">scaled 100-1000</text>
<text x="925" y="437" text-anchor="middle" font-size="13" fill="#555555">pass at 750</text>
