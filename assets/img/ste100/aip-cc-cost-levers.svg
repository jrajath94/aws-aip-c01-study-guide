<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 960 400" role="img" style="background:#F7F4EE;font-family:'Anthropic Sans',Inter,'Source Sans 3','IBM Plex Sans',sans-serif" aria-label="Cost levers: caching, batch, smaller model, provisioned throughput">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2838"/></marker></defs>
<text x="480" y="48" text-anchor="middle" font-size="30" fill="#1B2838" font-weight="600">Cost levers</text><rect x="32" y="120" width="208" height="104" rx="12" fill="#E7F1F8" stroke="#1E4D8C" stroke-width="1.5"/><text x="136" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Caching</text><text x="136" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">repeated prefix</text><rect x="272" y="120" width="208" height="104" rx="12" fill="#F4E6D4" stroke="#C46B2C" stroke-width="1.5"/><text x="376" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Batch</text><text x="376" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">50% cheaper</text><rect x="512" y="120" width="208" height="104" rx="12" fill="#FFFDF8" stroke="#1F7A72" stroke-width="1.5"/><text x="616" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Smaller model</text><text x="616" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">if quality holds</text><rect x="752" y="120" width="176" height="104" rx="12" fill="#E7F4EF" stroke="#1F7A72" stroke-width="1.5"/><text x="840" y="160" text-anchor="middle" font-size="14" fill="#1B2838" font-weight="600">Provisioned</text><text x="840" y="184" text-anchor="middle" font-size="14" fill="#5C6B7A" font-weight="500">steady baseline</text><text x="480" y="300" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Match the lever to the workload.</text><text x="480" y="328" text-anchor="middle" font-size="16" fill="#5C6B7A" font-weight="450">Spiky traffic never needs Provisioned Throughput.</text></svg>