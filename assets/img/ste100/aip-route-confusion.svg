<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1045 474" role="img" aria-label="Routing confusion set: inference profiles route for availability, prompt routers route for cost, Provisioned Throughput reserves capacity"><style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker></defs><rect x="0" y="0" width="1045" height="474" fill="#0a0a0a"/><text x="522.5" y="36" text-anchor="middle" font-size="20" font-weight="bold">The three-way confusion set: route, route, or reserve</text><text x="522.5" y="60" text-anchor="middle" font-size="13" fill="#a8a8a8">Profiles route by region, routers route by complexity, PT reserves capacity by the hour.</text><rect x="40" y="92" width="310" height="310" rx="8" fill="#141414" stroke="#5a8f5a" stroke-width="1.5"/><text x="195" y="126" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Inference profiles</text><text x="195" y="152" text-anchor="middle" font-size="13" fill="#5a8f5a">Route by REGION</text><text x="195" y="190" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Availability: fail over when a</text><text x="195" y="209" text-anchor="middle" font-size="12.5" fill="#a8a8a8">region is down.</text><text x="195" y="248" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Wants: regional failover and</text><text x="195" y="267" text-anchor="middle" font-size="12.5" fill="#a8a8a8">resilience.</text><text x="195" y="306" text-anchor="middle" font-size="12.5" fill="#c07a7a">Never: data-residency scenarios.</text><text x="195" y="325" text-anchor="middle" font-size="12.5" fill="#c07a7a">Routing moves data.</text><rect x="375" y="92" width="310" height="310" rx="8" fill="#141414" stroke="#d99a06" stroke-width="1.5"/><text x="530" y="126" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Prompt routers</text><text x="530" y="152" text-anchor="middle" font-size="13" fill="#d99a06">Route by COMPLEXITY</text><text x="530" y="190" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Cost: simple queries to cheap</text><text x="530" y="209" text-anchor="middle" font-size="12.5" fill="#a8a8a8">models, hard ones up.</text><text x="530" y="248" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Wants: 80 percent simple traffic</text><text x="530" y="267" text-anchor="middle" font-size="12.5" fill="#a8a8a8">on a flagship.</text><text x="530" y="306" text-anchor="middle" font-size="12.5" fill="#c07a7a">Never: availability problems.</text><text x="530" y="325" text-anchor="middle" font-size="12.5" fill="#c07a7a">Routers do not fail over.</text><rect x="710" y="92" width="310" height="310" rx="8" fill="#141414" stroke="#60a5fa" stroke-width="1.5"/><text x="865" y="126" text-anchor="middle" font-size="15" fill="#ececec" font-weight="bold">Provisioned Throughput</text><text x="865" y="152" text-anchor="middle" font-size="13" fill="#60a5fa">Reserve CAPACITY</text><text x="865" y="190" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Hourly commit: consistent latency,</text><text x="865" y="209" text-anchor="middle" font-size="12.5" fill="#a8a8a8">no throttling.</text><text x="865" y="248" text-anchor="middle" font-size="12.5" fill="#a8a8a8">Wants: throttled at peak on steady</text><text x="865" y="267" text-anchor="middle" font-size="12.5" fill="#a8a8a8">traffic.</text><text x="865" y="306" text-anchor="middle" font-size="12.5" fill="#c07a7a">Never: cost problems. Idle hours</text><text x="865" y="325" text-anchor="middle" font-size="12.5" fill="#c07a7a">still bill.</text><text x="522" y="444" text-anchor="middle" font-size="13.5" fill="#a8a8a8">The exam tests this pair directly and often. Router for cost, profile for availability, PT for capacity.</text></svg>