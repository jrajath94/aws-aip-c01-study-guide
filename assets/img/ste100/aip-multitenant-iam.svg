<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Multi-tenant agent isolation: each tenant role can read only its own knowledge base; Guardrails cannot do tenant isolation"><rect x="0" y="0" width="760" height="466" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Multi-tenant agents: IAM per knowledge base</text><text x="24" y="58" font-size="13" fill="#7d8590">One agent, many tenants. IAM filtering keeps each tenant in its own data.</text><rect x="24" y="86" width="712" height="80" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="380" y="116" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">One agent serves three tenants. Tenants must never reach each other's data.</text><text x="380" y="142" text-anchor="middle" font-size="12.5" fill="#7d8590">Guardrails cannot do this. IAM can.</text><line x1="200" y1="166" x2="200" y2="200" stroke="#7d8590" stroke-width="2.2"/><polygon points="200,200 191.7,205.6 191.7,194.4" fill="#7d8590"/><line x1="380" y1="166" x2="380" y2="200" stroke="#7d8590" stroke-width="2.2"/><polygon points="380,200 371.7,205.6 371.7,194.4" fill="#7d8590"/><line x1="560" y1="166" x2="560" y2="200" stroke="#7d8590" stroke-width="2.2"/><polygon points="560,200 551.7,205.6 551.7,194.4" fill="#7d8590"/><rect x="60" y="200" width="200" height="130" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="160" y="236" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Tenant A role</text><text x="160" y="264" text-anchor="middle" font-size="12" fill="#7d8590">can read KB-A only</text><rect x="280" y="200" width="200" height="130" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="380" y="236" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Tenant B role</text><text x="380" y="264" text-anchor="middle" font-size="12" fill="#7d8590">can read KB-B only</text><rect x="500" y="200" width="200" height="130" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="600" y="236" text-anchor="middle" font-size="13" fill="#ececec" font-weight="bold">Tenant C role</text><text x="600" y="264" text-anchor="middle" font-size="12" fill="#7d8590">can read KB-C only</text><rect x="24" y="356" width="712" height="80" rx="8" fill="#101318" stroke="#c0554d" stroke-width="1.6"/><text x="380" y="386" text-anchor="middle" font-size="13.5" fill="#ececec" font-weight="bold">Fabricated feature alert: "use Guardrails for tenant isolation" is always wrong.</text><text x="380" y="410" text-anchor="middle" font-size="12.5" fill="#7d8590">Tenant isolation is per-knowledge-base IAM filtering.</text></svg>