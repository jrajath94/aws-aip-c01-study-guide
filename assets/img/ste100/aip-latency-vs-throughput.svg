<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 460" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Latency is time to first token; throughput is tokens per second; streaming improves perceived speed">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Latency vs throughput</text>
<rect x="60" y="90" width="420" height="150" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="270" y="131" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">LATENCY</text><text x="270" y="157" text-anchor="middle" font-size="13" fill="#111111">time to FIRST token</text><text x="270" y="183" text-anchor="middle" font-size="13" fill="#111111">user waits this long</text><text x="270" y="209" text-anchor="middle" font-size="13" fill="#111111">streaming cuts it</text><rect x="520" y="90" width="420" height="150" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="730" y="131" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">THROUGHPUT</text><text x="730" y="157" text-anchor="middle" font-size="13" fill="#111111">tokens per SECOND</text><text x="730" y="183" text-anchor="middle" font-size="13" fill="#111111">total speed of job</text><text x="730" y="209" text-anchor="middle" font-size="13" fill="#111111">batch raises it</text><rect x="60" y="280" width="880" height="110" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/><text x="500" y="301" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Streaming</text><text x="500" y="327" text-anchor="middle" font-size="13" fill="#111111">shows tokens as they arrive</text><text x="500" y="353" text-anchor="middle" font-size="13" fill="#111111">same total time, feels 3x faster</text><text x="500" y="379" text-anchor="middle" font-size="13" fill="#111111">always stream for chat</text><text x="500" y="430" text-anchor="middle" font-size="13" fill="#555555">Latency is what the user feels. Throughput is what the meter measures.</text></svg>
