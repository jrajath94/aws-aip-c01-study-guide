<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" role="img" aria-label="Exam-day funnel: read for shape, read for the constraint, eliminate two, decide; flag at 2.5 minutes">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="270" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs><text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">EXAM FUNNEL</text><rect x="24" y="56" width="150" height="84" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="99" y="90" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700" >Read for shape</text><text x="99" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >skim the scenario</text><line x1="174" y1="98" x2="192" y2="98" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="192" y="56" width="150" height="84" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="267" y="90" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700" >Read again</text><text x="267" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >for the constraint</text><line x1="342" y1="98" x2="360" y2="98" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="360" y="56" width="150" height="84" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="435" y="90" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700" >Eliminate two</text><text x="435" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >fast</text><line x1="510" y1="98" x2="528" y2="98" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/><rect x="528" y="56" width="150" height="84" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/><text x="603" y="90" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700" >Decide</text><text x="603" y="112" font-size="11.5" fill="#555555" text-anchor="middle" >between last two</text><rect x="24" y="180" width="672" height="60" rx="8" fill=" #fdf3e1" stroke="#c98a1b" stroke-width="2"/><text x="360" y="204" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700" >Undecided at about 2.5 minutes?</text><text x="360" y="226" font-size="11.5" fill="#555555" text-anchor="middle" >Flag the question and move on. Do not count on review time.</text></svg>