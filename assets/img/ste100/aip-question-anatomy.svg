<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1150 460" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="How to study a question card: read the stem, pick an answer, reveal, read why it is correct and which trap it used">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="575" y="34" text-anchor="middle" font-size="16" fill="#111111" font-weight="bold">Anatomy of a question card: how to study each one</text>
<rect x="60" y="70" width="1030" height="90" rx="8" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="575" y="96" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">1. Stem: the scenario and the ask</text>
<text x="575" y="118" text-anchor="middle" font-size="13" fill="#555555">read first, find the 2 to 4 hard constraints</text>
<text x="575" y="140" text-anchor="middle" font-size="13" fill="#555555">cost, latency, no ML team, no redeploy, region lock</text>
<path d="M575,160 L575,195" fill="none" stroke="#666666" stroke-width="1.8"/><path d="M575,195 L310,178" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><path d="M575,195 L870,178" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="180" width="500" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="310" y="206" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">2. Options A to D</text>
<text x="310" y="228" text-anchor="middle" font-size="13" fill="#555555">pick your answer BEFORE you reveal</text>
<text x="310" y="250" text-anchor="middle" font-size="13" fill="#555555">each wrong option carries a note:</text>
<text x="310" y="272" text-anchor="middle" font-size="13" fill="#555555">why a smart person picks it</text>
<rect x="650" y="180" width="440" height="120" rx="8" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="870" y="206" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">3. Reveal answer</text>
<text x="870" y="228" text-anchor="middle" font-size="13" fill="#555555">click only after you commit</text>
<text x="870" y="250" text-anchor="middle" font-size="13" fill="#555555">multiple-response: every correct</text>
<text x="870" y="272" text-anchor="middle" font-size="13" fill="#555555">option and no incorrect ones</text>
<path d="M310,300 L310,320" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M870,300 L870,320" fill="none" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="60" y="320" width="500" height="110" rx="8" fill="#eef7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="310" y="346" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">4. Why the answer is correct</text>
<text x="310" y="368" text-anchor="middle" font-size="13" fill="#555555">one mechanism, stated plainly</text>
<text x="310" y="390" text-anchor="middle" font-size="13" fill="#555555">names the service and the reason</text>
<rect x="650" y="320" width="440" height="110" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/>
<text x="870" y="346" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">5. The trap AWS set</text>
<text x="870" y="368" text-anchor="middle" font-size="13" fill="#555555">names the master trap by number</text>
<text x="870" y="390" text-anchor="middle" font-size="13" fill="#555555">so you spot it on sight next time</text>
</svg>
