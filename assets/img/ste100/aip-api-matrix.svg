<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="API matrix: Converse for portable code, InvokeModel for embeddings and provider features, batch for async bulk, Provisioned Throughput for steady baselines, inference profiles for regional failover"><rect x="0" y="0" width="760" height="660" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">The API matrix: read the need, pick the row</text><text x="24" y="58" font-size="13" fill="#7d8590">Four ways to call a model, each with a different latency, payload, and cost profile.</text><rect x="24" y="86" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="114" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Same code for Claude, Llama, Titan</text><text x="189" y="134" text-anchor="middle" font-size="11.5" fill="#7d8590">with tool use and guardrails</text><rect x="370" y="86" width="366" height="62" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="553" y="124" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Converse / ConverseStream</text><rect x="24" y="160" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="188" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Embeddings</text><text x="189" y="208" text-anchor="middle" font-size="11.5" fill="#7d8590">Converse cannot do vectors</text><rect x="370" y="160" width="366" height="62" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="553" y="198" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">InvokeModel</text><rect x="24" y="234" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="262" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Provider-specific feature</text><text x="189" y="282" text-anchor="middle" font-size="11.5" fill="#7d8590">additionalModelRequestFields: the escape hatch</text><rect x="370" y="234" width="366" height="62" rx="8" fill="#101318" stroke="#22d3ee" stroke-width="1.6"/><text x="553" y="272" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">InvokeModel, or Converse with</text><rect x="24" y="308" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="336" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Real-time token streaming</text><text x="189" y="356" text-anchor="middle" font-size="11.5" fill="#7d8590">tokens as they generate</text><rect x="370" y="308" width="366" height="62" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="553" y="346" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">ConverseStream / InvokeModelWithResponseStream</text><rect x="24" y="382" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="410" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Async, hours OK, cheapest</text><text x="189" y="430" text-anchor="middle" font-size="11.5" fill="#7d8590">S3 in, S3 out</text><rect x="370" y="382" width="366" height="62" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="553" y="420" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Batch inference</text><rect x="24" y="456" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="484" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Steady baseline + latency SLA</text><text x="189" y="504" text-anchor="middle" font-size="11.5" fill="#7d8590">invoke the provisioned model ARN</text><rect x="370" y="456" width="366" height="62" rx="8" fill="#101318" stroke="#c07a5a" stroke-width="1.6"/><text x="553" y="494" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Provisioned Throughput</text><rect x="24" y="530" width="330" height="62" rx="8" fill="#101318" stroke="#8a8a8a" stroke-width="1.6"/><text x="189" y="558" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Model missing in my region</text><text x="189" y="578" text-anchor="middle" font-size="11.5" fill="#7d8590">us., eu., apac., global. prefixes</text><rect x="370" y="530" width="366" height="62" rx="8" fill="#101318" stroke="#5a8f5a" stroke-width="1.6"/><text x="553" y="568" text-anchor="middle" font-size="12.5" fill="#ececec" font-weight="bold">Cross-region inference profile</text><text x="380" y="630" text-anchor="middle" font-size="13" fill="#7d8590">The exam tests the decision, not the syntax. Read the need, pick the row.</text></svg>