<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" width="100%" style="max-width:780px" font-family="Charis SIL, Georgia, serif" role="img" aria-label="Safe rollout: shadow traffic sends copies of real requests invisibly to the new version, A and B testing splits real users across two aliases"><rect x="0" y="0" width="760" height="386" fill="#000000" rx="10"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker></defs><text x="24" y="34" font-size="19" font-weight="bold" fill="#ececec">Shadow traffic versus A/B: test without hurting users</text><text x="24" y="58" font-size="13" fill="#7d8590">Shadow is invisible. A/B is a controlled slice of real traffic.</text><rect x="24" y="90" width="344" height="220" rx="8" fill="#101318" stroke="#60a5fa" stroke-width="1.6"/><text x="196" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">Shadow traffic</text><text x="196" y="160" text-anchor="middle" font-size="12.5" fill="#7d8590">Copies of real requests go to the</text><text x="196" y="179" text-anchor="middle" font-size="12.5" fill="#7d8590">new version. Users never see its</text><text x="196" y="198" text-anchor="middle" font-size="12.5" fill="#7d8590">answers.</text><text x="196" y="236" text-anchor="middle" font-size="12.5" fill="#7d8590">Compare shadow scores against</text><text x="196" y="255" text-anchor="middle" font-size="12.5" fill="#7d8590">production. Zero user risk.</text><rect x="392" y="90" width="344" height="220" rx="8" fill="#101318" stroke="#d99a06" stroke-width="1.6"/><text x="564" y="126" text-anchor="middle" font-size="14.5" fill="#ececec" font-weight="bold">A/B with two aliases</text><text x="564" y="160" text-anchor="middle" font-size="12.5" fill="#7d8590">Real users are split: alias A</text><text x="564" y="179" text-anchor="middle" font-size="12.5" fill="#7d8590">serves most, alias B serves a</text><text x="564" y="198" text-anchor="middle" font-size="12.5" fill="#7d8590">slice.</text><text x="564" y="236" text-anchor="middle" font-size="12.5" fill="#7d8590">Measures real user impact. Small</text><text x="564" y="255" text-anchor="middle" font-size="12.5" fill="#7d8590">blast radius.</text><text x="380" y="352" text-anchor="middle" font-size="13" fill="#7d8590">Both catch regressions the CI/CD eval gate misses. Gate first, then shadow or A/B.</text></svg>