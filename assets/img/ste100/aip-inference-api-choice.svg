<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 940 560" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="InvokeModel vs Converse: the one-decision tree">
<title>InvokeModel vs Converse: the one-decision tree</title>
<desc>A decision tree. Start: do you need a provider-only feature such as embeddings or image generation? Yes goes left to InvokeModel, the raw API with provider-specific JSON bodies. No goes right to Converse, the unified API with one request shape, tool use, guardrails, and caching. A bottom lane adds: is a user waiting? Then use the streaming twin, ConverseStream or InvokeModelWithResponseStream. Is nobody waiting and the work is bulk? Then use batch inference: S3 in, S3 out, about half price.</desc>
<defs><marker id="aip-api-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="13" font-weight="bold" fill="#d99a06" letter-spacing="2">WHICH INFERENCE API? ONE QUESTION DECIDES</text>
<polygon points="470,55.0 750.0,110 470,165.0 190.0,110" fill="#fdf3d8" stroke="#d99a06" stroke-width="1.5"/>
<text x="470" y="115" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Provider-only feature?</text>
<text x="470" y="152" font-size="12" fill="#555555" text-anchor="middle">embeddings, image gen,</text>
<text x="470" y="168" font-size="12" fill="#555555" text-anchor="middle">exotic sampling controls</text>
<rect x="60" y="200" width="340" height="130" rx="8" fill="#e8f1fd" stroke="#1f6fd6" stroke-width="1.5"/>
<text x="230.0" y="232" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">InvokeModel</text>
<text x="230.0" y="254" text-anchor="middle" font-size="12.5" fill="#555555">raw API, provider-specific body</text>
<text x="230.0" y="273" text-anchor="middle" font-size="12.5" fill="#555555">Claude needs anthropic_version + max_tokens</text>
<rect x="540" y="200" width="340" height="130" rx="8" fill="#e6f4ea" stroke="#1e7e34" stroke-width="1.5"/>
<text x="710.0" y="232" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Converse</text>
<text x="710.0" y="254" text-anchor="middle" font-size="12.5" fill="#555555">one request shape, all providers</text>
<text x="710.0" y="273" text-anchor="middle" font-size="12.5" fill="#555555">tool use, guardrails, cachePoint built in</text>
<line x1="300" y1="130" x2="160" y2="200" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-api-ah)"/>
<text x="230.0" y="157.0" text-anchor="middle" font-size="12" fill="#555555">YES</text>
<line x1="640" y1="130" x2="780" y2="200" stroke="#d99a06" stroke-width="1.8" marker-end="url(#aip-api-ah)"/>
<text x="710.0" y="157.0" text-anchor="middle" font-size="12" fill="#555555">NO</text>
<rect x="60" y="380" width="400" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="260.0" y="412" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">User waiting? Stream it</text>
<text x="260.0" y="434" text-anchor="middle" font-size="12.5" fill="#555555">ConverseStream / InvokeModelWithResponseStream</text>
<text x="260.0" y="453" text-anchor="middle" font-size="12.5" fill="#555555">first token in ~300 ms feels fast</text>
<rect x="480" y="380" width="400" height="120" rx="8" fill="#f6f6f6" stroke="#999999" stroke-width="1.5"/>
<text x="680.0" y="412" text-anchor="middle" font-size="14" fill="#111111" font-weight="bold">Nobody waiting? Batch it</text>
<text x="680.0" y="434" text-anchor="middle" font-size="12.5" fill="#555555">JSONL prompts in S3, results back to S3</text>
<text x="680.0" y="453" text-anchor="middle" font-size="12.5" fill="#555555">hours of latency, roughly half the price</text>
<text x="30" y="530" font-size="13" fill="#111111">Rule: new code defaults to Converse. Reach for InvokeModel only when Converse cannot express the feature.</text>
</svg>