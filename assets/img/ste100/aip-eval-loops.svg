<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 410" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif" aria-label="Eval loop: golden dataset, regression check, canary, monitor, feed failures back">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs>
<text x="500" y="34" text-anchor="middle" font-size="17" fill="#111111" font-weight="bold">Eval loops</text>
<rect x="30" y="110" width="150" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="105" y="160" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Golden dataset</text><line x1="180" y1="155" x2="205" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="205" y="110" width="150" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="280" y="160" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Run eval</text><line x1="355" y1="155" x2="380" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="380" y="110" width="150" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="455" y="160" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Regression?</text><line x1="530" y1="155" x2="555" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="555" y="110" width="150" height="90" rx="8" fill="#e9f0fa" stroke="#2b5fa3" stroke-width="1.5"/><text x="630" y="160" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Canary</text><line x1="705" y1="155" x2="730" y2="155" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><rect x="730" y="110" width="150" height="90" rx="8" fill="#e7f4f1" stroke="#00897b" stroke-width="1.5"/><text x="805" y="160" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">Monitor</text><rect x="250" y="250" width="500" height="90" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="1.5"/><text x="500" y="287" text-anchor="middle" font-size="13" fill="#111111" font-weight="bold">FAIL: add the failing case</text><text x="500" y="313" text-anchor="middle" font-size="13" fill="#111111">to the golden dataset</text><line x1="500" y1="200" x2="500" y2="250" stroke="#666666" stroke-width="1.8" marker-end="url(#ah)"/><text x="500" y="380" text-anchor="middle" font-size="13" fill="#555555">The loop never ends: every production failure becomes a new golden test.</text></svg>
