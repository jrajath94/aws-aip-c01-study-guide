<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-label="Encoding decision by cardinality: one-hot for few values, ordinal for ordered values, embeddings or hashing for thousands of values; never leak future data">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="720" height="420" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" font-weight="700" letter-spacing="0.06em">ENCODING: CARDINALITY DECIDES</text>

<rect x="60" y="60" width="600" height="52" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="360.0" y="84.0" font-size="13" text-anchor="middle" font-weight="700">How many distinct values?</text>
<text x="360.0" y="102.0" font-size="11" fill="#555555" text-anchor="middle">cardinality decides</text>

<line x1="180" y1="112" x2="180" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="360" y1="112" x2="360" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="540" y1="112" x2="540" y2="140" stroke="#555" stroke-width="1.5" marker-end="url(#ar)"/>
<rect x="70" y="140" width="220" height="100" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="180.0" y="188.0" font-size="13" text-anchor="middle" font-weight="700">FEW (5 colors)</text>
<text x="180.0" y="206.0" font-size="11" fill="#555555" text-anchor="middle">one-hot</text>

<rect x="310" y="140" width="220" height="100" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="420.0" y="188.0" font-size="13" text-anchor="middle" font-weight="700">ORDERED (S, M, L)</text>
<text x="420.0" y="206.0" font-size="11" fill="#555555" text-anchor="middle">ordinal: 1, 2, 3</text>

<rect x="70" y="260" width="460" height="100" rx="8" fill="#fdecec" stroke="#b00020" stroke-width="1.5"/>
<text x="300" y="290" font-size="13" text-anchor="middle" font-weight="700">THOUSANDS (zip codes)</text>
<text x="300" y="313" font-size="11.5" fill="#555555" text-anchor="middle">one-hot on 12,000 values = 12,000 sparse columns</text>
<text x="300" y="336" font-size="11.5" fill="#555555" text-anchor="middle">use embeddings or the hashing trick</text>
<text x="360" y="395" font-size="11.5" fill="#b00020" text-anchor="middle">Deadliest trap: leakage. Build features only from data the model will have at prediction time.</text>
</svg>