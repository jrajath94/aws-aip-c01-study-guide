<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-label="A foundation model: your prompt text goes in, the model processes it, generated text comes out">
  <style>
    .box { fill: #f4f1ea; stroke: #d8d2c4; stroke-width: 1.5; rx: 10}
    .box-accent { fill: #fdf3dd; stroke: #f0b429; stroke-width: 2; rx: 10}
    .t { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif; font-size: 20px; fill: #2b2b2b}
    .sub { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif; font-size: 15px; fill: #6b6558}
    .arr { stroke: #2a9d8f; stroke-width: 3; fill: none}
  </style>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a9d8f"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="65" width="200" height="100" rx="10"/>
  <text class="t" x="120" y="108" text-anchor="middle">Your prompt</text>
  <text class="sub" x="120" y="136" text-anchor="middle">(text in)</text>
  <line class="arr" x1="228" y1="115" x2="292" y2="115" marker-end="url(#ah)"/>
  <rect class="box-accent" x="300" y="55" width="200" height="120" rx="10"/>
  <text class="t" x="400" y="103" text-anchor="middle">Foundation model</text>
  <text class="sub" x="400" y="131" text-anchor="middle">pre-trained once</text>
  <text class="sub" x="400" y="153" text-anchor="middle">on broad data</text>
  <line class="arr" x1="508" y1="115" x2="572" y2="115" marker-end="url(#ah)"/>
  <rect class="box" x="580" y="65" width="160" height="100" rx="10"/>
  <text class="t" x="660" y="108" text-anchor="middle">Answer</text>
  <text class="sub" x="660" y="136" text-anchor="middle">(text out)</text>
  <text class="sub" x="380" y="210" text-anchor="middle">One base model serves many tasks. You never train it. You call it.</text>
</svg>
