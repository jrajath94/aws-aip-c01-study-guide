<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 460" role="img" aria-label="AgentCore five components">
<style>
.abg{fill:#0b0e14}
.ab{fill:#151b26;stroke:#2b3a4d;stroke-width:1.5}
.ac{fill:#12305e;stroke:#6aa6ff;stroke-width:2}
.at{fill:#e6edf3;font:700 17px sans-serif}
.as{fill:#8b94a3;font:400 13px sans-serif}
.ah{fill:#e6edf3;font:700 22px sans-serif}
.ae{stroke:#3d4c63;stroke-width:1.5}
.al{fill:#9fb3cc;font:400 12px sans-serif}
</style>
<rect class="abg" width="680" height="460" rx="8"/>
<text class="ah" x="32" y="44">AgentCore: five parts, one platform</text>
<text class="as" x="32" y="68">The lab deploys to Runtime; the other four are platform services your agent calls.</text>
<rect class="ac" x="240" y="180" width="200" height="100" rx="10"/>
<text class="at" x="340" y="216" text-anchor="middle">Runtime</text>
<text class="as" x="340" y="240" text-anchor="middle">your container, :8080</text>
<text class="as" x="340" y="260" text-anchor="middle">/invocations + /ping</text>
<rect class="ab" x="32" y="100" width="200" height="70" rx="8"/>
<text class="at" x="132" y="128" text-anchor="middle">Gateway</text>
<text class="as" x="132" y="150" text-anchor="middle">APIs as MCP tools</text>
<rect class="ab" x="448" y="100" width="200" height="70" rx="8"/>
<text class="at" x="548" y="128" text-anchor="middle">Memory</text>
<text class="as" x="548" y="150" text-anchor="middle">session + long-term</text>
<rect class="ab" x="32" y="320" width="200" height="70" rx="8"/>
<text class="at" x="132" y="348" text-anchor="middle">Identity</text>
<text class="as" x="132" y="370" text-anchor="middle">OAuth, credentials</text>
<rect class="ab" x="448" y="320" width="200" height="70" rx="8"/>
<text class="at" x="548" y="348" text-anchor="middle">Observability</text>
<text class="as" x="548" y="370" text-anchor="middle">OTEL traces</text>
<line class="ae" x1="200" y1="135" x2="240" y2="205"/><text class="al" x="196" y="168">tools</text>
<line class="ae" x1="480" y1="135" x2="440" y2="205"/><text class="al" x="478" y="168">context</text>
<line class="ae" x1="200" y1="355" x2="240" y2="255"/><text class="al" x="180" y="312">secrets</text>
<line class="ae" x1="480" y1="355" x2="440" y2="255"/><text class="al" x="478" y="312">traces</text>
<text class="as" x="32" y="428">Exam drill: name all five cold, and map each scenario verb to one box.</text>
</svg>
