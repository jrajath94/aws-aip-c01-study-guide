<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Cross-region inference profile: your app calls the profile endpoint, Bedrock routes across the AWS backbone to a region hosting the model">
  <style>
    .box { fill: #f4f1ea; stroke: #d8d2c4; stroke-width: 1.5; rx: 10; }
    .box-accent { fill: #fdf3dd; stroke: #f0b429; stroke-width: 2; rx: 10; }
    .t { font-family: "Charis SIL", Georgia, serif; font-size: 19px; fill: #2b2b2b; }
    .sub { font-family: "Charis SIL", Georgia, serif; font-size: 14px; fill: #6b6558; }
    .lbl { font-family: "Charis SIL", Georgia, serif; font-size: 14px; fill: #2a9d8f; }
    .arr { stroke: #2a9d8f; stroke-width: 2.5; fill: none; }
    .arr-back { stroke: #9a948a; stroke-width: 2; fill: none; stroke-dasharray: 7 5; }
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2a9d8f"/>
    </marker>
    <marker id="ah3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9a948a"/>
    </marker>
  </defs>
  <rect class="box" x="15" y="60" width="170" height="110" rx="10"/>
  <text class="t" x="100" y="103" text-anchor="middle">Your app</text>
  <text class="sub" x="100" y="129" text-anchor="middle">runs in eu-west-1</text>
  <text class="sub" x="100" y="150" text-anchor="middle">calls the profile ID</text>
  <line class="arr" x1="193" y1="95" x2="283" y2="95" marker-end="url(#ah2)"/>
  <text class="lbl" x="238" y="82" text-anchor="middle">eu.anthropic.claude-&#8230;</text>
  <rect class="box-accent" x="291" y="50" width="180" height="130" rx="10"/>
  <text class="t" x="381" y="95" text-anchor="middle">Inference profile</text>
  <text class="sub" x="381" y="121" text-anchor="middle">endpoint in your region</text>
  <text class="sub" x="381" y="143" text-anchor="middle">routes, does not host</text>
  <line class="arr" x1="479" y1="95" x2="569" y2="95" marker-end="url(#ah2)"/>
  <text class="lbl" x="524" y="82" text-anchor="middle">AWS backbone, encrypted</text>
  <rect class="box" x="577" y="60" width="168" height="110" rx="10"/>
  <text class="t" x="661" y="103" text-anchor="middle">The model</text>
  <text class="sub" x="661" y="129" text-anchor="middle">served in us-east-1</text>
  <text class="sub" x="661" y="150" text-anchor="middle">where it is available</text>
  <path class="arr-back" d="M 661 185 L 661 225 L 100 225 L 100 178" marker-end="url(#ah3)"/>
  <text class="sub" x="380" y="248" text-anchor="middle">response returns the same way</text>
  <text class="sub" x="380" y="276" text-anchor="middle">Availability and regional failover. It does not pick the cheapest model: that is the prompt router.</text>
</svg>
