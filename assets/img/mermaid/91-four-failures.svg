<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 920 400" role="img" aria-label="Four model failures and the guardrail controls that answer each">
<style>text{font-family:Verdana,Arial,sans-serif;fill:#ececec;}</style>
<rect x="0" y="0" width="920" height="400" fill="#0a0a0a"/>
<text x="460" y="34" text-anchor="middle" font-size="20" font-weight="bold">Four failures. One policy object answers all of them.</text>
<rect x="20" y="60" width="205" height="120" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="34" y="90" font-size="15" font-weight="bold">Hallucination</text>
<text x="34" y="114" font-size="13">Confident wrong facts</text>
<text x="34" y="134" font-size="13">not in the source.</text>
<text x="34" y="162" font-size="13">-&gt; Grounding checks</text>
<rect x="245" y="60" width="205" height="120" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="259" y="90" font-size="15" font-weight="bold">Injection / jailbreak</text>
<text x="259" y="114" font-size="13">Instructions from the</text>
<text x="259" y="134" font-size="13">wrong author.</text>
<text x="259" y="162" font-size="13">-&gt; Prompt attack filter</text>
<rect x="470" y="60" width="205" height="120" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="484" y="90" font-size="15" font-weight="bold">PII leak</text>
<text x="484" y="114" font-size="13">Personal data in prompts,</text>
<text x="484" y="134" font-size="13">answers, and logs.</text>
<text x="484" y="162" font-size="13">-&gt; Sensitive info filters</text>
<rect x="695" y="60" width="205" height="120" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="709" y="90" font-size="15" font-weight="bold">Harmful content</text>
<text x="709" y="114" font-size="13">Toxicity and banned</text>
<text x="709" y="134" font-size="13">subjects.</text>
<text x="709" y="162" font-size="13">-&gt; Content filters,</text>
<text x="709" y="180" font-size="13">denied topics</text>
<line x1="122" y1="180" x2="122" y2="232" stroke="#ececec" stroke-width="2"/>
<line x1="347" y1="180" x2="347" y2="232" stroke="#ececec" stroke-width="2"/>
<line x1="572" y1="180" x2="572" y2="232" stroke="#ececec" stroke-width="2"/>
<line x1="797" y1="180" x2="797" y2="232" stroke="#ececec" stroke-width="2"/>
<polygon points="122,239 114,227 130,227" fill="#ececec"/>
<polygon points="347,239 339,227 355,227" fill="#ececec"/>
<polygon points="572,239 564,227 580,227" fill="#ececec"/>
<polygon points="797,239 789,227 805,227" fill="#ececec"/>
<rect x="180" y="239" width="560" height="100" fill="none" stroke="#ececec" stroke-width="3"/>
<text x="460" y="275" text-anchor="middle" font-size="17" font-weight="bold">Bedrock Guardrail</text>
<text x="460" y="303" text-anchor="middle" font-size="13">One versioned policy object. Six policies.</text>
<text x="460" y="323" text-anchor="middle" font-size="13">Screens inputs and outputs of every model call.</text>
<text x="460" y="372" text-anchor="middle" font-size="13">Data security (IAM, KMS, PrivateLink) and governance wrap the whole picture: Chapters 9 to 11.</text>
</svg>
