<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 950" role="img" aria-labelledby="ladderTitle ladderDesc">
  <title id="ladderTitle">AIP-C01 study ladder: read order across the guide</title>
  <desc id="ladderDesc">Top to bottom: three prerequisite volumes, then domains D1 through D5 in exam weight order, then system design, labs, the question bank, question patterns, the crash course, and the gap appendix.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6cb2ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="950" fill="#0d0d0d"/>

  <!-- row template: rect 560x62 at x=20, title at x=40 baseline, desc below; arrow gap 16 -->
  <g font-family="Anthropic Sans, Inter, Source Sans 3, IBM Plex Sans, sans-serif">
    <rect x="20" y="10" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="36" font-size="15" font-weight="700" fill="#ececec">Step 0: Prereqs (only if rusty)</text>
    <text x="40" y="58" font-size="12.5" fill="#a8a8a8">AIF-C01 AI basics · AWS cloud foundations · ML Specialty essentials</text>

    <line x1="300" y1="72" x2="300" y2="84" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="88" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="114" font-size="15" font-weight="700" fill="#ececec">D1 · Foundation Models, Data &amp; Compliance</text>
    <text x="470" y="114" font-size="14" font-weight="700" fill="#f0b429">31%</text>
    <text x="40" y="136" font-size="12.5" fill="#a8a8a8">Picking models, calling Bedrock, RAG, custom models, compliance</text>

    <line x1="300" y1="150" x2="300" y2="162" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="166" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="192" font-size="15" font-weight="700" fill="#ececec">D2 · Implementation &amp; Integration</text>
    <text x="470" y="192" font-size="14" font-weight="700" fill="#f0b429">26%</text>
    <text x="40" y="214" font-size="12.5" fill="#a8a8a8">Agents, workflows, API front door, prompts as code</text>

    <line x1="300" y1="228" x2="300" y2="240" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="244" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="270" font-size="15" font-weight="700" fill="#ececec">D3 · AI Safety, Security &amp; Governance</text>
    <text x="470" y="270" font-size="14" font-weight="700" fill="#f0b429">20%</text>
    <text x="40" y="292" font-size="12.5" fill="#a8a8a8">Guardrails, IAM and org controls, logs, network isolation</text>

    <line x1="300" y1="306" x2="300" y2="318" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="322" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="348" font-size="15" font-weight="700" fill="#ececec">D4 · Operational Efficiency &amp; Optimization</text>
    <text x="470" y="348" font-size="14" font-weight="700" fill="#f0b429">12%</text>
    <text x="40" y="370" font-size="12.5" fill="#a8a8a8">Cost levers, caching, streaming, latency vs throughput</text>

    <line x1="300" y1="384" x2="300" y2="396" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="400" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="426" font-size="15" font-weight="700" fill="#ececec">D5 · Testing, Validation &amp; Troubleshooting</text>
    <text x="470" y="426" font-size="14" font-weight="700" fill="#f0b429">11%</text>
    <text x="40" y="448" font-size="12.5" fill="#a8a8a8">Evals, LLM-as-a-judge, debugging the delta</text>

    <line x1="300" y1="462" x2="300" y2="474" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="478" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="504" font-size="15" font-weight="700" fill="#ececec">System design guide</text>
    <text x="40" y="526" font-size="12.5" fill="#a8a8a8">Reference architectures that lock in scenario reasoning</text>

    <line x1="300" y1="540" x2="300" y2="552" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="556" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="582" font-size="15" font-weight="700" fill="#ececec">Hands-on labs</text>
    <text x="40" y="604" font-size="12.5" fill="#a8a8a8">Nine guided builds in a real AWS account</text>

    <line x1="300" y1="618" x2="300" y2="630" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="634" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="660" font-size="15" font-weight="700" fill="#ececec">Question bank + mock exam</text>
    <text x="40" y="682" font-size="12.5" fill="#a8a8a8">192 questions, then the 75-question mock under time pressure</text>

    <line x1="300" y1="696" x2="300" y2="708" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="712" width="560" height="62" rx="8" fill="#141414" stroke="#262626"/>
    <text x="40" y="738" font-size="15" font-weight="700" fill="#ececec">Question patterns + gap appendix</text>
    <text x="40" y="760" font-size="12.5" fill="#a8a8a8">How AWS asks; the 17 peripheral topics other volumes skip</text>

    <line x1="300" y1="774" x2="300" y2="786" stroke="#6cb2ff" stroke-width="2" marker-end="url(#arr)"/>

    <rect x="20" y="790" width="560" height="62" rx="8" fill="#1a1a1a" stroke="#f0b429"/>
    <text x="40" y="816" font-size="15" font-weight="700" fill="#f0b429">Final sprint: crash course</text>
    <text x="40" y="838" font-size="12.5" fill="#a8a8a8">The whole exam in one volume. Read when every volume is done</text>

    <text x="20" y="892" font-size="12" fill="#a8a8a8">Domains read in exam-weight order so the heaviest topics come first.</text>
    <text x="20" y="912" font-size="12" fill="#a8a8a8">Every step defines its own vocabulary: no page assumes you read the others.</text>
  </g>
</svg>
