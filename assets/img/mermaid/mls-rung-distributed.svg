<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 677 406" role="img" style="background:#ffffff;font-family:DejaVu Sans,Verdana,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666"/></marker></defs>
<rect x="42" y="-4" width="419" height="354" rx="10" fill="#fafafa" stroke="#707070" stroke-width="1"/>
<text x="56" y="16" font-size="13" font-weight="bold" fill="#333">Data parallel: the common case</text>
<rect x="334" y="-4" width="301" height="211" rx="10" fill="#fafafa" stroke="#707070" stroke-width="1"/>
<text x="348" y="16" font-size="13" font-weight="bold" fill="#333">Model parallel: the huge-model case</text>
<path d="M189,67 V110 H192 V150" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M192,210 V242 H339 V272" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M488,88 V120 H479 V150" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="60" y="30" width="259" height="37" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
<text x="189" y="57" text-anchor="middle" font-size="15" fill="#000">Each GPU holds the full model</text>
<rect x="72" y="152" width="240" height="58" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
<text x="192" y="179" text-anchor="middle" font-size="15" fill="#000">Each trains on a slice of the</text>
<text x="192" y="200" text-anchor="middle" font-size="15" fill="#000">data</text>
<rect x="234" y="274" width="210" height="58" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
<text x="339" y="301" text-anchor="middle" font-size="15" fill="#000">Gradients are averaged</text>
<text x="339" y="322" text-anchor="middle" font-size="15" fill="#000">together</text>
<rect x="359" y="30" width="259" height="58" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
<text x="488" y="57" text-anchor="middle" font-size="15" fill="#000">The model itself is split across</text>
<text x="488" y="78" text-anchor="middle" font-size="15" fill="#000">GPUs</text>
<rect x="352" y="152" width="253" height="37" rx="8" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
<text x="479" y="179" text-anchor="middle" font-size="15" fill="#000">One GPU cannot hold it alone</text>
</svg>