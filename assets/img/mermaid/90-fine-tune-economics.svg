<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 380" role="img" aria-label="Fine-tuning economics: train once, save on every call">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#ececec}</style>
<rect x="0" y="0" width="900" height="380" fill="#0a0a0a"/>
<text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold">Fine-tuning economics: train once, save on every call</text>
<rect x="40" y="60" width="380" height="110" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="60" y="92" font-size="16" font-weight="bold">Status quo: flagship model</text>
<text x="60" y="120" font-size="14">$0.006 per call (illustrative)</text>
<text x="60" y="146" font-size="14">50M calls/month = $300,000/month</text>
<line x1="230" y1="170" x2="230" y2="205" stroke="#ececec" stroke-width="2"/>
<polygon points="230,212 222,200 238,200" fill="#ececec"/>
<rect x="40" y="212" width="380" height="90" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="60" y="244" font-size="16" font-weight="bold">Fine-tune a small model</text>
<text x="60" y="270" font-size="14">5,000 labeled examples. One-time training cost.</text>
<line x1="420" y1="257" x2="470" y2="257" stroke="#ececec" stroke-width="2"/>
<polygon points="477,257 465,249 465,265" fill="#ececec"/>
<rect x="480" y="212" width="380" height="90" fill="none" stroke="#ececec" stroke-width="2"/>
<text x="500" y="244" font-size="16" font-weight="bold">Serve the small model</text>
<text x="500" y="270" font-size="14">$0.0005 per call. Same narrow task.</text>
<text x="60" y="340" font-size="13">Only pays off at high volume: the training cost plus the serving</text>
<text x="60" y="360" font-size="13">commit must be smaller than the flagship tokens you stop buying.</text>
</svg>
