<text x="471" y="57" text-anchor="middle" font-size="15" fill="#000">1% fraud, 99% normal: the</text>
<text x="471" y="78" text-anchor="middle" font-size="15" fill="#000">model learns to always say</text>
<text x="471" y="99" text-anchor="middle" font-size="15" fill="#000">normal</text>
