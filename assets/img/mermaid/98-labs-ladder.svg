<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 640 600" role="img" aria-label="Chapter climb map">
<style>
.lbg{fill:#0b0e14}
.lr{fill:#151b26;stroke:#2b3a4d;stroke-width:1.5}
.ln{fill:#6aa6ff;font:700 20px sans-serif}
.lt{fill:#e6edf3;font:400 17px sans-serif}
.ls{fill:#8b94a3;font:400 13px sans-serif}
.lh{fill:#e6edf3;font:700 22px sans-serif}
.la{stroke:#2b3a4d;stroke-width:2}
</style>
<rect class="lbg" width="640" height="600" rx="8"/>
<text class="lh" x="32" y="44">The chapter climb</text>
<text class="ls" x="32" y="68">Start at the bottom. Each rung names what it assumes.</text>
<g>
<rect class="lr" x="32" y="96" width="576" height="46" rx="8"/><text class="ln" x="52" y="125">9</text><text class="lt" x="86" y="125">CI/CD with eval gates</text><text class="ls" x="430" y="125">needs ch 2, 5, 7</text>
<rect class="lr" x="32" y="152" width="576" height="46" rx="8"/><text class="ln" x="52" y="181">8</text><text class="lt" x="86" y="181">CDK for GenAI infrastructure</text><text class="ls" x="430" y="181">needs ch 4, 7</text>
<rect class="lr" x="32" y="208" width="576" height="46" rx="8"/><text class="ln" x="52" y="237">7</text><text class="lt" x="86" y="237">Supporting labs: KMS, X-Ray, SQS</text><text class="ls" x="430" y="237">needs nothing</text>
<rect class="lr" x="32" y="264" width="576" height="46" rx="8"/><text class="ln" x="52" y="293">6</text><text class="lt" x="86" y="293">AgentCore Runtime deployment</text><text class="ls" x="430" y="293">needs ch 1, 5</text>
<rect class="lr" x="32" y="320" width="576" height="46" rx="8"/><text class="ln" x="52" y="349">5</text><text class="lt" x="86" y="349">Lambda as agent action</text><text class="ls" x="430" y="349">needs ch 4</text>
<rect class="lr" x="32" y="376" width="576" height="46" rx="8"/><text class="ln" x="52" y="405">4</text><text class="lt" x="86" y="405">Lambda as Bedrock front end</text><text class="ls" x="430" y="405">needs nothing</text>
<rect class="lr" x="32" y="432" width="576" height="46" rx="8"/><text class="ln" x="52" y="461">3</text><text class="lt" x="86" y="461">Multi-agent squad routing</text><text class="ls" x="430" y="461">needs ch 1</text>
<rect class="lr" x="32" y="488" width="576" height="46" rx="8"/><text class="ln" x="52" y="517">2</text><text class="lt" x="86" y="517">Bedrock Flows from JSON</text><text class="ls" x="430" y="517">needs nothing</text>
</g>
<line class="la" x1="320" y1="142" x2="320" y2="152"/>
<line class="la" x1="320" y1="198" x2="320" y2="208"/>
<line class="la" x1="320" y1="254" x2="320" y2="264"/>
<line class="la" x1="320" y1="310" x2="320" y2="320"/>
<line class="la" x1="320" y1="366" x2="320" y2="376"/>
<line class="la" x1="320" y1="422" x2="320" y2="432"/>
<line class="la" x1="320" y1="478" x2="320" y2="488"/>
<rect class="lr" x="32" y="544" width="576" height="40" rx="8" stroke-dasharray="5 4"/><text class="ln" x="52" y="570">1</text><text class="lt" x="86" y="570">Strands agent with custom tools</text><text class="ls" x="430" y="570">start here</text>
</svg>
