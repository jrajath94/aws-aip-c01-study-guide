<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="The four-step GenAI system design procedure">
  <style>
    .t { font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif}
    .title { font-size: 20px; font-weight: 700; fill: #1a1a1a}
    .lbl { font-size: 16px; font-weight: 700; fill: #1a1a1a}
    .body { font-size: 13.5px; fill: #333333}
    .sub { font-size: 12.5px; fill: #666666}
    .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2}
    .boxHot { fill: #fdf6e3; stroke: #b8860b; stroke-width: 2.5}
    .arrow { stroke: #1a1a1a; stroke-width: 2.5; fill: none; marker-end: url(#ah2)}
    .num { font-size: 15px; font-weight: 700; fill: #ffffff}
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="390" fill="#ffffff"/>
  <text x="30" y="38" class="t title">The design procedure: clarify, estimate, choose, verify</text>

  <!-- Step 1 -->
  <rect x="30" y="70" width="200" height="190" rx="12" class="box"/>
  <circle cx="62" cy="104" r="16" fill="#1a1a1a"/>
  <text x="62" y="110" text-anchor="middle" class="t num">1</text>
  <text x="88" y="110" class="t lbl">Clarify</text>
  <text x="50" y="142" class="t body">Functional: what must</text>
  <text x="50" y="162" class="t body">it do? Q and A, actions,</text>
  <text x="50" y="182" class="t body">streaming, approvals?</text>
  <text x="50" y="210" class="t body">Non-functional: latency,</text>
  <text x="50" y="230" class="t body">scale, cost, freshness,</text>
  <text x="50" y="250" class="t body">safety, availability.</text>

  <!-- Step 2 -->
  <rect x="270" y="70" width="200" height="190" rx="12" class="box"/>
  <circle cx="302" cy="104" r="16" fill="#1a1a1a"/>
  <text x="302" y="110" text-anchor="middle" class="t num">2</text>
  <text x="328" y="110" class="t lbl">Estimate</text>
  <text x="290" y="142" class="t body">Requests/day x tokens</text>
  <text x="290" y="162" class="t body">= tokens/day, then</text>
  <text x="290" y="182" class="t body">dollars per month.</text>
  <text x="290" y="210" class="t body">Check the slowest hop:</text>
  <text x="290" y="230" class="t body">its limit decides latency</text>
  <text x="290" y="250" class="t body">(chapter 2 teaches limits).</text>

  <!-- Step 3 -->
  <rect x="510" y="70" width="200" height="190" rx="12" class="boxHot"/>
  <circle cx="542" cy="104" r="16" fill="#b8860b"/>
  <text x="542" y="110" text-anchor="middle" class="t num">3</text>
  <text x="568" y="110" class="t lbl">Choose</text>
  <text x="530" y="142" class="t body">Walk from the cheapest</text>
  <text x="530" y="162" class="t body">approach upward. Stop at</text>
  <text x="530" y="182" class="t body">the first one satisfying</text>
  <text x="530" y="202" class="t body">every constraint.</text>
  <text x="530" y="230" class="t sub">prompt -&gt; RAG -&gt; agent</text>
  <text x="530" y="250" class="t sub">-&gt; fine-tune (ch. 9)</text>

  <!-- Step 4 -->
  <rect x="750" y="70" width="180" height="190" rx="12" class="box"/>
  <circle cx="782" cy="104" r="16" fill="#1a1a1a"/>
  <text x="806" y="110" class="t lbl">Verify</text>
  <text x="770" y="142" class="t body">Prove the choice with</text>
  <text x="770" y="162" class="t body">an eval loop before</text>
  <text x="770" y="182" class="t body">and after shipping</text>
  <text x="770" y="202" class="t body">(chapter 7).</text>
  <text x="770" y="230" class="t sub">Measured quality beats</text>
  <text x="770" y="250" class="t sub">confident guessing.</text>

  <line x1="230" y1="165" x2="266" y2="165" class="arrow"/>
  <line x1="470" y1="165" x2="506" y2="165" class="arrow"/>
  <line x1="710" y1="165" x2="746" y2="165" class="arrow"/>

  <text x="30" y="300" class="t body">Skipping clarification optimizes the wrong thing. Skipping estimation turns the design into a guess with a diagram.</text>
  <text x="30" y="326" class="t body">On the exam, every number in the scenario is a constraint: the token math picks the pricing</text>
  <text x="30" y="350" class="t body">lever, the latency limit picks sync vs streaming vs async, and the freshness line picks RAG</text>
  <text x="30" y="374" class="t body">vs fine-tuning. An option that ignores a stated number violates it.</text>
</svg>
