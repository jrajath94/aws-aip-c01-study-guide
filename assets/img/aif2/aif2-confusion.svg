<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" role="img" aria-label="Fourteen confusion pairs and the one line that separates each">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="560" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">CONFUSION PAIRS: THE TRAPS</text>
<rect x="24" y="48" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="70" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Bedrock vs SageMaker AI</text>
<text x="36" y="88" font-size="10.5" fill="#555555" text-anchor="start">Bedrock serves FMs you do not train; SageMaker</text>
<text x="36" y="102" font-size="10.5" fill="#555555" text-anchor="start">trains models you build</text>
<rect x="406" y="48" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="70" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">RAG vs fine-tuning</text>
<text x="418" y="88" font-size="10.5" fill="#555555" text-anchor="start">RAG adds facts at query time; fine-tuning bakes</text>
<text x="418" y="102" font-size="10.5" fill="#555555" text-anchor="start">behavior into weights</text>
<rect x="24" y="118" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="140" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Comprehend vs Kendra</text>
<text x="36" y="158" font-size="10.5" fill="#555555" text-anchor="start">Comprehend analyzes text; Kendra searches your</text>
<text x="36" y="172" font-size="10.5" fill="#555555" text-anchor="start">documents</text>
<rect x="406" y="118" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="140" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Lex vs Q</text>
<text x="418" y="158" font-size="10.5" fill="#555555" text-anchor="start">Lex builds chatbots; Q is the ready-made AI</text>
<text x="418" y="172" font-size="10.5" fill="#555555" text-anchor="start">assistant</text>
<rect x="24" y="188" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="210" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Transcribe vs Polly</text>
<text x="36" y="228" font-size="10.5" fill="#555555" text-anchor="start">Transcribe turns speech into text; Polly turns text</text>
<text x="36" y="242" font-size="10.5" fill="#555555" text-anchor="start">into speech</text>
<rect x="406" y="188" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="210" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Translate vs Comprehend</text>
<text x="418" y="228" font-size="10.5" fill="#555555" text-anchor="start">Translate changes languages; Comprehend extracts</text>
<text x="418" y="242" font-size="10.5" fill="#555555" text-anchor="start">meaning</text>
<rect x="24" y="258" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="280" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Rekognition vs Textract</text>
<text x="36" y="298" font-size="10.5" fill="#555555" text-anchor="start">Rekognition sees images and video; Textract reads</text>
<text x="36" y="312" font-size="10.5" fill="#555555" text-anchor="start">documents</text>
<rect x="406" y="258" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="280" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Temperature vs top-p</text>
<text x="418" y="298" font-size="10.5" fill="#555555" text-anchor="start">Temperature sets randomness; top-p trims which</text>
<text x="418" y="312" font-size="10.5" fill="#555555" text-anchor="start">tokens are candidates</text>
<rect x="24" y="328" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="350" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Batch vs asynchronous</text>
<text x="36" y="368" font-size="10.5" fill="#555555" text-anchor="start">Batch is many predictions on a schedule; async is</text>
<text x="36" y="382" font-size="10.5" fill="#555555" text-anchor="start">one large delayed payload</text>
<rect x="406" y="328" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="350" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Guardrails vs Clarify</text>
<text x="418" y="368" font-size="10.5" fill="#555555" text-anchor="start">Guardrails filter live traffic; Clarify analyzes for</text>
<text x="418" y="382" font-size="10.5" fill="#555555" text-anchor="start">bias</text>
<rect x="24" y="398" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="420" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Macie vs Config</text>
<text x="36" y="438" font-size="10.5" fill="#555555" text-anchor="start">Macie finds sensitive data in S3; Config checks</text>
<text x="36" y="452" font-size="10.5" fill="#555555" text-anchor="start">compliance rules</text>
<rect x="406" y="398" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="420" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">KMS vs Secrets Manager</text>
<text x="418" y="438" font-size="10.5" fill="#555555" text-anchor="start">KMS manages encryption keys; Secrets Manager stores</text>
<text x="418" y="452" font-size="10.5" fill="#555555" text-anchor="start">passwords and keys</text>
<rect x="24" y="468" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="490" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Pre-training vs fine-tuning</text>
<text x="36" y="508" font-size="10.5" fill="#555555" text-anchor="start">Pre-training builds base knowledge; fine-tuning</text>
<text x="36" y="522" font-size="10.5" fill="#555555" text-anchor="start">adapts behavior</text>
<rect x="406" y="468" width="370" height="60" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="490" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Accuracy vs precision vs recall</text>
<text x="418" y="508" font-size="10.5" fill="#555555" text-anchor="start">Accuracy is overall; precision is right positives;</text>
<text x="418" y="522" font-size="10.5" fill="#555555" text-anchor="start">recall is coverage</text>
</svg>