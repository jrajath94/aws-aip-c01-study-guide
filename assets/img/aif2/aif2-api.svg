<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="The Bedrock converse call: what you send and what comes back">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="720" height="260" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">ONE LOOK AT THE API: THE CONVERSE() CALL</text>
<rect x="24" y="52" width="320" height="120" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="184" y="78" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">You send</text>
<text x="40" y="102" font-size="11.5" fill="#222222" text-anchor="start">modelId: which foundation model</text>
<text x="40" y="124" font-size="11.5" fill="#222222" text-anchor="start">messages: the conversation</text>
<text x="40" y="146" font-size="11.5" fill="#222222" text-anchor="start">inferenceConfig: temp, max tokens</text>
<rect x="376" y="52" width="320" height="120" rx="8" fill="#e7f4f1" stroke="#1f7a6d" stroke-width="1.5"/>
<text x="536" y="78" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">You get back</text>
<text x="392" y="102" font-size="11.5" fill="#222222" text-anchor="start">output.message.content[0].text: the answer</text>
<text x="392" y="124" font-size="11.5" fill="#222222" text-anchor="start">stopReason: end_turn means done,</text>
<text x="392" y="146" font-size="11.5" fill="#222222" text-anchor="start">max_tokens means it hit the cap</text>
<line x1="344" y1="112" x2="376" y2="112" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<text x="360" y="210" font-size="12" fill="#555555" text-anchor="middle">client = boto3.client('bedrock-runtime'): your handle to the service</text>
<text x="360" y="232" font-size="12" fill="#555555" text-anchor="middle">Coding is out of scope; this is only so 'API call' means something concrete</text>
</svg>