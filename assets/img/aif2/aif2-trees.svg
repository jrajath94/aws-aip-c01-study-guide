<svg xmlns="http://www.w3.org/2000/svg" width="780" height="700" viewBox="0 0 780 700" role="img" aria-label="The five decision questions: customization, inference, service, responsible AI, governance">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="780" height="700" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">THE WHOLE EXAM ON ONE PAGE: FIVE WHICH-QUESTIONS</text>
<rect x="24" y="48" width="244" height="186" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="146.0" y="74" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Which customization?</text>
<text x="36" y="100" font-size="10.5" fill="#555555" text-anchor="start">same knowledge, better answers</text>
<text x="36" y="115" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">prompt engineering</text>
<line x1="36" y1="121" x2="256" y2="121" stroke="#ccc" stroke-width="1"/>
<text x="36" y="134" font-size="10.5" fill="#555555" text-anchor="start">new private or current facts</text>
<text x="36" y="149" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">RAG</text>
<line x1="36" y1="155" x2="256" y2="155" stroke="#ccc" stroke-width="1"/>
<text x="36" y="168" font-size="10.5" fill="#555555" text-anchor="start">new behavior, tone, style</text>
<text x="36" y="183" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">fine-tuning</text>
<line x1="36" y1="189" x2="256" y2="189" stroke="#ccc" stroke-width="1"/>
<text x="36" y="202" font-size="10.5" fill="#555555" text-anchor="start">new knowledge from scratch</text>
<text x="36" y="217" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">pre-training</text>
<rect x="276" y="48" width="236" height="186" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="394.0" y="74" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Which inference?</text>
<text x="288" y="100" font-size="10.5" fill="#555555" text-anchor="start">interactive and instant</text>
<text x="288" y="115" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">real-time</text>
<line x1="288" y1="121" x2="500" y2="121" stroke="#ccc" stroke-width="1"/>
<text x="288" y="134" font-size="10.5" fill="#555555" text-anchor="start">big single payloads, minutes OK</text>
<text x="288" y="149" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">asynchronous</text>
<line x1="288" y1="155" x2="500" y2="155" stroke="#ccc" stroke-width="1"/>
<text x="288" y="168" font-size="10.5" fill="#555555" text-anchor="start">scheduled bulk, cheapest</text>
<text x="288" y="183" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">batch</text>
<line x1="288" y1="189" x2="500" y2="189" stroke="#ccc" stroke-width="1"/>
<text x="288" y="202" font-size="10.5" fill="#555555" text-anchor="start">spiky traffic, pay per use</text>
<text x="288" y="217" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">serverless</text>
<rect x="520" y="48" width="236" height="288" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="638.0" y="74" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Which service?</text>
<text x="532" y="100" font-size="10.5" fill="#555555" text-anchor="start">train your own model</text>
<text x="532" y="115" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">SageMaker AI</text>
<line x1="532" y1="121" x2="744" y2="121" stroke="#ccc" stroke-width="1"/>
<text x="532" y="134" font-size="10.5" fill="#555555" text-anchor="start">use a foundation model via API</text>
<text x="532" y="149" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Bedrock</text>
<line x1="532" y1="155" x2="744" y2="155" stroke="#ccc" stroke-width="1"/>
<text x="532" y="168" font-size="10.5" fill="#555555" text-anchor="start">chatbot</text>
<text x="532" y="183" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Lex</text>
<line x1="532" y1="189" x2="744" y2="189" stroke="#ccc" stroke-width="1"/>
<text x="532" y="202" font-size="10.5" fill="#555555" text-anchor="start">search company docs</text>
<text x="532" y="217" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Kendra</text>
<line x1="532" y1="223" x2="744" y2="223" stroke="#ccc" stroke-width="1"/>
<text x="532" y="236" font-size="10.5" fill="#555555" text-anchor="start">read documents</text>
<text x="532" y="251" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Textract</text>
<line x1="532" y1="257" x2="744" y2="257" stroke="#ccc" stroke-width="1"/>
<text x="532" y="270" font-size="10.5" fill="#555555" text-anchor="start">speech to text</text>
<text x="532" y="285" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Transcribe</text>
<line x1="532" y1="291" x2="744" y2="291" stroke="#ccc" stroke-width="1"/>
<text x="532" y="304" font-size="10.5" fill="#555555" text-anchor="start">code assistant</text>
<text x="532" y="319" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Q Developer / Kiro</text>
<rect x="130" y="400" width="250" height="220" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="255.0" y="426" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Which responsible-AI tool?</text>
<text x="142" y="452" font-size="10.5" fill="#555555" text-anchor="start">detect bias</text>
<text x="142" y="467" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Clarify</text>
<line x1="142" y1="473" x2="368" y2="473" stroke="#ccc" stroke-width="1"/>
<text x="142" y="486" font-size="10.5" fill="#555555" text-anchor="start">filter content</text>
<text x="142" y="501" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Guardrails</text>
<line x1="142" y1="507" x2="368" y2="507" stroke="#ccc" stroke-width="1"/>
<text x="142" y="520" font-size="10.5" fill="#555555" text-anchor="start">document the model</text>
<text x="142" y="535" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Model Cards</text>
<line x1="142" y1="541" x2="368" y2="541" stroke="#ccc" stroke-width="1"/>
<text x="142" y="554" font-size="10.5" fill="#555555" text-anchor="start">human review</text>
<text x="142" y="569" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">A2I</text>
<line x1="142" y1="575" x2="368" y2="575" stroke="#ccc" stroke-width="1"/>
<text x="142" y="588" font-size="10.5" fill="#555555" text-anchor="start">watch production</text>
<text x="142" y="603" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Model Monitor</text>
<rect x="400" y="400" width="250" height="220" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="525.0" y="426" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="700">Which governance tool?</text>
<text x="412" y="452" font-size="10.5" fill="#555555" text-anchor="start">log API calls</text>
<text x="412" y="467" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">CloudTrail</text>
<line x1="412" y1="473" x2="638" y2="473" stroke="#ccc" stroke-width="1"/>
<text x="412" y="486" font-size="10.5" fill="#555555" text-anchor="start">check compliance rules</text>
<text x="412" y="501" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Config</text>
<line x1="412" y1="507" x2="638" y2="507" stroke="#ccc" stroke-width="1"/>
<text x="412" y="520" font-size="10.5" fill="#555555" text-anchor="start">gather audit evidence</text>
<text x="412" y="535" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Audit Manager</text>
<line x1="412" y1="541" x2="638" y2="541" stroke="#ccc" stroke-width="1"/>
<text x="412" y="554" font-size="10.5" fill="#555555" text-anchor="start">read AWS compliance reports</text>
<text x="412" y="569" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Artifact</text>
<line x1="412" y1="575" x2="638" y2="575" stroke="#ccc" stroke-width="1"/>
<text x="412" y="588" font-size="10.5" fill="#555555" text-anchor="start">best-practice checks</text>
<text x="412" y="603" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Trusted Advisor</text>
</svg>