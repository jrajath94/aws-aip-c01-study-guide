<svg xmlns="http://www.w3.org/2000/svg" width="640" height="230" viewBox="0 0 640 230" role="img" aria-label="How to use this volume: 30 minutes, 4 hours, 1 day">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="640" height="230" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">HOW TO USE THIS VOLUME</text>
<rect x="24" y="52" width="190" height="104" rx="8" fill="#fdf3e1" stroke="#c98a1b" stroke-width="1.5"/>
<text x="119.0" y="81.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">30 minutes</text>
<text x="119.0" y="98.5" font-size="11" fill="#222222" text-anchor="middle">exam in 30 seconds +</text>
<text x="119.0" y="113.5" font-size="11" fill="#222222" text-anchor="middle">three decision trees</text>
<text x="119.0" y="128.5" font-size="11" fill="#222222" text-anchor="middle">(picker, endpoint, drift)</text>
<line x1="214" y1="104" x2="230" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="230" y="52" width="190" height="104" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="325.0" y="89.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">4 hours</text>
<text x="325.0" y="106.0" font-size="11" fill="#222222" text-anchor="middle">one domain at a time,</text>
<text x="325.0" y="121.0" font-size="11" fill="#222222" text-anchor="middle">knowledge check each</text>
<line x1="420" y1="104" x2="436" y2="104" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<rect x="436" y="52" width="190" height="104" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="531.0" y="89.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">1 day</text>
<text x="531.0" y="106.0" font-size="11" fill="#222222" text-anchor="middle">all practice questions,</text>
<text x="531.0" y="121.0" font-size="11" fill="#222222" text-anchor="middle">re-read missed ladders</text>
<text x="320" y="194" font-size="12" fill="#555555" text-anchor="middle">Then the confusion pairs: they are where the exam actually bites</text>
</svg>