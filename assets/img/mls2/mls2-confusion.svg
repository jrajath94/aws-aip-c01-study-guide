<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" role="img" aria-label="Thirteen confusion pairs and the one line that separates each">
<style>text{font-family:"Anthropic Sans",Inter,"Source Sans 3","IBM Plex Sans",sans-serif;fill:#222222}</style>
<rect width="780" height="590" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="30" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">CONFUSION PAIRS: THE EXAM'S FAVORITE TRAPS</text>
<rect x="24" y="48" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="70" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Batch transform vs async inference</text>
<text x="36" y="88" font-size="10.5" fill="#555555" text-anchor="start">Batch scores a dataset with no endpoint; async</text>
<text x="36" y="102" font-size="10.5" fill="#555555" text-anchor="start">serves queued requests and notifies</text>
<rect x="406" y="48" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="70" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Ground Truth vs Clarify</text>
<text x="418" y="88" font-size="10.5" fill="#555555" text-anchor="start">Ground Truth labels data with humans; Clarify</text>
<text x="418" y="102" font-size="10.5" fill="#555555" text-anchor="start">audits bias and explains predictions</text>
<rect x="24" y="120" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="142" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Experiments vs Model Registry</text>
<text x="36" y="160" font-size="10.5" fill="#555555" text-anchor="start">Experiments tracks runs; the registry versions</text>
<text x="36" y="174" font-size="10.5" fill="#555555" text-anchor="start">models and gates promotion</text>
<rect x="406" y="120" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="142" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">DataBrew vs Data Wrangler</text>
<text x="418" y="160" font-size="10.5" fill="#555555" text-anchor="start">DataBrew is no-code for analysts; Data Wrangler</text>
<text x="418" y="174" font-size="10.5" fill="#555555" text-anchor="start">lives in Studio notebooks</text>
<rect x="24" y="192" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="214" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Spot vs on-demand training</text>
<text x="36" y="232" font-size="10.5" fill="#555555" text-anchor="start">Spot is up to 90% cheaper but interruptible;</text>
<text x="36" y="246" font-size="10.5" fill="#555555" text-anchor="start">checkpoints make it safe</text>
<rect x="406" y="192" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="214" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Data parallel vs model parallel</text>
<text x="418" y="232" font-size="10.5" fill="#555555" text-anchor="start">Split the data in the common case; split the model</text>
<text x="418" y="246" font-size="10.5" fill="#555555" text-anchor="start">when one GPU cannot hold it</text>
<rect x="24" y="264" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="286" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Real-time vs serverless endpoint</text>
<text x="36" y="304" font-size="10.5" fill="#555555" text-anchor="start">Real-time is always on; serverless scales to zero</text>
<text x="36" y="318" font-size="10.5" fill="#555555" text-anchor="start">with cold starts</text>
<rect x="406" y="264" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="286" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Multi-model vs multi-container</text>
<text x="418" y="304" font-size="10.5" fill="#555555" text-anchor="start">Multi-model shares one container; multi-container</text>
<text x="418" y="318" font-size="10.5" fill="#555555" text-anchor="start">mixes different containers</text>
<rect x="24" y="336" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="358" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Precision vs recall</text>
<text x="36" y="376" font-size="10.5" fill="#555555" text-anchor="start">Precision: alarms that were real; recall: real</text>
<text x="36" y="390" font-size="10.5" fill="#555555" text-anchor="start">cases caught</text>
<rect x="406" y="336" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="358" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Overfitting vs underfitting</text>
<text x="418" y="376" font-size="10.5" fill="#555555" text-anchor="start">Overfit: train low, validation high; underfit:</text>
<text x="418" y="390" font-size="10.5" fill="#555555" text-anchor="start">both high</text>
<rect x="24" y="408" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="430" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Warm vs cold start tuning</text>
<text x="36" y="448" font-size="10.5" fill="#555555" text-anchor="start">Warm start reuses a previous tuning job's results</text>
<rect x="406" y="408" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="418" y="430" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Data drift vs concept drift</text>
<text x="418" y="448" font-size="10.5" fill="#555555" text-anchor="start">Data drift: inputs changed; concept drift: meaning</text>
<text x="418" y="462" font-size="10.5" fill="#555555" text-anchor="start">changed, inputs did not</text>
<rect x="24" y="480" width="370" height="62" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="36" y="502" font-size="11.5" fill="#222222" text-anchor="start" font-weight="700">Validation vs test set</text>
<text x="36" y="520" font-size="10.5" fill="#555555" text-anchor="start">Validation tunes and picks; test judges once at</text>
<text x="36" y="534" font-size="10.5" fill="#555555" text-anchor="start">the end</text>
</svg>