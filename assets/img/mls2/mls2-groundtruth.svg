<svg xmlns="http://www.w3.org/2000/svg" width="680" height="270" viewBox="0 0 680 270" role="img" aria-label="Ground Truth active learning: humans label only the uncertain items">
<style>text{font-family:'Trebuchet MS', Verdana, sans-serif;fill:#222222;}</style>
<rect width="680" height="270" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/></marker><marker id="arW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ffffff"/></marker></defs>
<text x="24" y="28" font-size="11.5" fill="#555555" text-anchor="start" font-weight="700" letter-spacing="0.06em">LABEL 100,000 IMAGES CHEAPLY: THE ACTIVE-LEARNING LOOP</text>
<rect x="24" y="56" width="140" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="94.0" y="75.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Data</text>
<text x="94.0" y="92.0" font-size="12" fill="#222222" text-anchor="middle">your</text>
<text x="94.0" y="108.0" font-size="12" fill="#222222" text-anchor="middle">unlabeled pool</text>
<rect x="264" y="56" width="150" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="339.0" y="75.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Model guess</text>
<text x="339.0" y="92.0" font-size="12" fill="#222222" text-anchor="middle">auto-labels</text>
<text x="339.0" y="108.0" font-size="12" fill="#222222" text-anchor="middle">the easy ones</text>
<rect x="514" y="56" width="142" height="70" rx="8" fill="#f6f6f6" stroke="#3f3f3f" stroke-width="1.5"/>
<text x="585.0" y="75.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="700">Humans</text>
<text x="585.0" y="92.0" font-size="12" fill="#222222" text-anchor="middle">private, vendor,</text>
<text x="585.0" y="108.0" font-size="12" fill="#222222" text-anchor="middle">or public crowd</text>
<line x1="164" y1="91" x2="264" y2="91" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<line x1="414" y1="91" x2="514" y2="91" stroke="#555555" stroke-width="2" marker-end="url(#ar)"/>
<path d="M 585 126 C 339.5 126, 339.5 126, 94 126" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ar)" stroke-dasharray="5 4"/>
<text x="340" y="150" font-size="11.5" fill="#555555" text-anchor="middle">uncertain items go to humans; humans label only those</text>
<text x="340" y="172" font-size="11.5" fill="#555555" text-anchor="middle">retrained model gets smarter, sends fewer items next round</text>
<text x="340" y="216" font-size="12" fill="#555555" text-anchor="middle">The exam's answer to 'label at scale, cheaply': Ground Truth with active learning.</text>
<text x="340" y="238" font-size="12" fill="#555555" text-anchor="middle">Not a team of interns, not DataBrew, not manual review.</text>
</svg>